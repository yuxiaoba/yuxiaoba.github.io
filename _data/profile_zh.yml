short_bio: "<p>自 2024 年 7 月起，我在香港中文大学<a href=\"http://ariselab.cse.cuhk.edu.hk/\" target=\"_blank\" rel=\"noopener noreferrer\">ARISE 实验室</a>担任博士后研究员，合作导师为<a href=\"https://www.cse.cuhk.edu.hk/lyu/\" target=\"_blank\" rel=\"noopener noreferrer\">吕荣聪教授</a>。我在中山大学获得博士和硕士学位，师从<a href=\"http://www.dds-sysu.tech/Teachers\" target=\"_blank\" rel=\"noopener noreferrer\">陈鹏飞教授</a>，2022—2023 年，我通过 CCF–腾讯犀牛鸟精英人才计划在腾讯微信事业群担任研究实习生。</p>\n   <p>我本科就读于广州中医药大学医学信息工程专业。这所学校是新中国首批四所高等中医药院校之一。在这里，我既积累了中医知识，也打下了计算机基础。从关注人的健康，到研究软件系统的可靠性，“发现问题、理解原因”始终是一条贯穿其中的线索。</p>\n   <p>\U0001F603 热衷于为系统可靠性“开方”。如果你也对构建更稳健的软件感兴趣，欢迎联系！</p>"
