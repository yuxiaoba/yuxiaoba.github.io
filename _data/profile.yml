short_bio: >-
  Since July 2024, I have been a postdoctoral researcher at <a href="http://ariselab.cse.cuhk.edu.hk/">ARISE</a>, The Chinese University of Hong Kong, mentored by <a href="https://www.cse.cuhk.edu.hk/lyu/">Prof. Michael R. Lyu</a>. My journey in tech was forged at Sun Yat-sen University, where I earned my Ph.D. and M.Eng under the guidance of <a href="http://www.dds-sysu.tech/Teachers">Prof. Pengfei Chen</a>. From 2022 to 2023, I was a research intern at Tencent’s WeChat Group through the CCF–Tencent Rhino-Bird Elite Program.
  <br>
  <br>
  My path began not with code, but with traditional Chinese medicine. I started my academic career at Guangzhou University of Chinese Medicine, often called the "MIT of Traditional Chinese Medicine", with the dream of becoming a physician who diagnosed the "bugs" of human body. Today, I've channeled that diagnostic spirit from human systems to software systems, dedicating myself to identifying and healing the faults that affect software reliability and keeping our digital world healthy.
  <br>
  <br>
  😃 Passionate about prescribing solutions for system reliability. If you're interested in building more robust software, let's connect!

# I'm a postdoctoral researcher at <a href="http://ariselab.cse.cuhk.edu.hk/">ARISE</a> at The Chinese University of Hong Kong, where I work with <a href="https://www.cse.cuhk.edu.hk/lyu/">Prof. Michael R. Lyu</a> to help software systems live longer, healthier lives.
#  <br>
#  Before my Ph.D. and M.Eng at Sun Yat-sen University with <a href="http://www.dds-sysu.tech/Teachers">Prof. Pengfei Chen</a>, I had a slightly unconventional start: Guangzhou University of Chinese Medicine. That's right, I pivoted from healing people to healing systems. That experience taught me that whether it’s a human body or a block of code, a reliable system is a beautiful thing.
#  <br>
#  I've also been on the front lines, "taking the pulse" of massive systems as a Ph.D. researcher at WeChat with <a href="https://scholar.google.com/citations?user=jiPCz_cAAAAJ">Yuetang Deng</a>.
#  <br>
