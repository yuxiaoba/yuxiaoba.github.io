<figure id="research-areas" class="research-diagram rd-two-directions" data-research-diagram aria-label="{{ t.research_bidirectional_description }}">
  <p class="rd-definition">{{ t.research_sre_definition }}</p>
  <div class="rd-grid">
    <button type="button" class="rd-node rd-cloud" data-direction="cloud" data-caption="{{ t.ai4sre_method }}" aria-pressed="false" disabled>
      <span class="rd-heading"><span class="rd-number">01</span><span>AI4SRE</span></span>
      <span class="rd-subtitle">{{ t.ai4sre_title }}</span>
      <svg class="rd-sketch" viewBox="0 0 280 100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="16" y="21" width="60" height="58" rx="12" fill="currentColor"/>
        <text x="46" y="58" text-anchor="middle" fill="white" stroke="none" font-family="Lato, sans-serif" font-size="24" font-weight="700">AI</text>
        <path class="rd-signal" d="M82 50h30m-6-5 6 5-6 5m59 0h29m-6-5 6 5-6 5"/>
        <circle cx="137" cy="44" r="17" fill="currentColor" fill-opacity=".06"/><path d="m149 57 11 13m-32-25 6 6 12-13"/>
        <rect x="202" y="24" width="60" height="48" rx="6"/><path d="M219 83h26m-13-11v11m-22-34h9l6-10 8 20 7-12h13"/>
        <circle class="rd-pulse" cx="95" cy="50" r="3" fill="currentColor" stroke="none"/>
      </svg>
      <span class="rd-description">{{ t.ai4sre_description }}</span>
      <span class="rd-topics"><span><strong>{{ t.ai4sre_focus }}</strong><span>{{ t.ai4sre_method_short }}</span></span></span>
    </button>
    <button type="button" class="rd-node rd-ai" data-direction="ai" data-caption="{{ t.sre4ai_method }}" aria-pressed="false" disabled>
      <span class="rd-heading"><span class="rd-number">02</span><span>SRE4AI</span></span>
      <span class="rd-subtitle">{{ t.sre4ai_title }}</span>
      <svg class="rd-sketch rd-ai-sketch" viewBox="0 0 280 100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g stroke-opacity=".4"><path d="m20 27 27-9 27 20M20 27l27 23 27-12M20 73l27-23 27 12M20 73l27 9 27-20M47 18v64"/></g>
        <g fill="white"><circle cx="20" cy="27" r="4"/><circle cx="20" cy="73" r="4"/><circle cx="47" cy="18" r="4"/><circle cx="47" cy="50" r="5"/><circle cx="47" cy="82" r="4"/><circle cx="74" cy="38" r="4"/><circle cx="74" cy="62" r="4"/></g>
        <path class="rd-signal" d="M78 38h10v12h19M78 62h10V50m89 0h14V26h27m-27 24v24h27"/>
        <path d="M123 13v7m19-7v7m19-7v7m-38 60v7m19-7v7m19-7v7m-61-50h7m-7 26h7m70-26h7m-7 26h7"/>
        <rect x="107" y="20" width="70" height="60" rx="12" fill="currentColor"/>
        <text x="142" y="58" text-anchor="middle" fill="white" stroke="none" font-family="Lato, sans-serif" font-size="24" font-weight="700">AI</text>
        <path d="M224 10h34a6 6 0 0 1 6 6v19a6 6 0 0 1-6 6h-22l-12 7v-7a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6Z" fill="currentColor" fill-opacity=".06"/>
        <text x="241" y="30" text-anchor="middle" fill="currentColor" stroke="none" font-family="Lato, sans-serif" font-size="12" font-weight="700">LLM</text>
        <rect x="218" y="62" width="46" height="27" rx="8" fill="currentColor" fill-opacity=".06"/>
        <path d="M241 62v-6m-8 25h16m-35-10v9m54-9v9"/>
        <g fill="currentColor" stroke="none"><circle cx="241" cy="54" r="2"/><circle cx="232" cy="73" r="2"/><circle cx="250" cy="73" r="2"/><circle class="rd-pulse" cx="191" cy="50" r="3"/></g>
      </svg>
      <span class="rd-description">{{ t.sre4ai_description }}</span>
      <span class="rd-topics"><span><strong>{{ t.sre4ai_focus }}</strong><span>{{ t.sre4ai_method_short }}</span></span></span>
    </button>
  </div>
  <figcaption><span data-research-caption aria-live="polite">{{ t.research_bidirectional_caption }}</span><span class="rd-hint" hidden>{% if lang == 'zh' %}点击探索关联{% else %}Select to explore{% endif %}<span aria-hidden="true"> ↗</span></span></figcaption>
</figure>
