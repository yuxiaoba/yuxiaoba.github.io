<figure id="research-areas" class="research-diagram" data-research-diagram aria-label="{{ t.research_map_description }}">
  <div class="rd-grid">
    <button type="button" class="rd-node rd-cloud" data-direction="cloud" data-caption="{{ t.cloud_note }}" aria-pressed="false" disabled>
      <span class="rd-heading"><span class="rd-number">01</span><span>{% if lang == 'zh' %}云系统{% else %}Cloud Systems{% endif %}</span></span>
      <svg class="rd-sketch" viewBox="0 0 280 100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M25 62a14 14 0 0 1-1-28 22 22 0 0 1 42-5 17 17 0 0 1 2 33Z" fill="currentColor" fill-opacity=".06"/>
        <path class="rd-signal" d="M84 49h28m44 0h37"/>
        <rect x="112" y="21" width="44" height="58" rx="7" fill="currentColor" fill-opacity=".06"/>
        <path d="M130 35h15m-15 14h15m-15 14h15"/>
        <g fill="currentColor" stroke="none"><circle cx="122" cy="35" r="2"/><circle cx="122" cy="49" r="2"/><circle cx="122" cy="63" r="2"/><circle class="rd-pulse" cx="98" cy="49" r="3"/></g>
        <rect x="193" y="25" width="68" height="46" rx="6"/>
        <path d="M218 82h19m-9-11v11m-26-32h10l6-11 8 21 7-13 5 3h13"/>
      </svg>
      <span class="rd-topics"><span><strong>AIOps &amp; LLM4Ops</strong><span>{{ t.aiops_note }}</span></span><span><strong>{{ t.system_optimization }}</strong><span>{{ t.system_optimization_note }}</span></span></span>
    </button>
    <button type="button" class="rd-node rd-ai" data-direction="ai" data-caption="{{ t.ai_note }}" aria-pressed="false" disabled>
      <span class="rd-heading"><span class="rd-number">02</span><span>{% if lang == 'zh' %}AI 系统{% else %}AI Systems{% endif %}</span></span>
      <svg class="rd-sketch rd-ai-sketch" viewBox="0 0 280 100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g stroke-opacity=".4"><path d="m20 27 27-9 27 20M20 27l27 23 27-12M20 73l27-23 27 12M20 73l27 9 27-20M47 18v64"/></g>
        <g fill="white"><circle cx="20" cy="27" r="4"/><circle cx="20" cy="73" r="4"/><circle cx="47" cy="18" r="4"/><circle cx="47" cy="50" r="5"/><circle cx="47" cy="82" r="4"/><circle cx="74" cy="38" r="4"/><circle cx="74" cy="62" r="4"/></g>
        <path class="rd-signal" d="M78 38h10v12h19M78 62h10V50m89 0h14V26h27m-27 24v24h27"/>
        <path d="M123 13v7m19-7v7m19-7v7m-38 60v7m19-7v7m19-7v7m-61-50h7m-7 26h7m70-26h7m-7 26h7"/>
        <rect x="107" y="20" width="70" height="60" rx="12" fill="currentColor"/>
        <text x="142" y="58" text-anchor="middle" fill="white" stroke="none" font-family="Lato, sans-serif" font-size="24" font-weight="700">AI</text>
        <path d="M224 10h34a6 6 0 0 1 6 6v19a6 6 0 0 1-6 6h-22l-12 7v-7a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6Z" fill="currentColor" fill-opacity=".06"/>
        <text x="241" y="30" text-anchor="middle" fill="currentColor" stroke="none" font-family="Lato, sans-serif" font-size="12" font-weight="700">LLM</text>
        <rect x="218" y="62" width="46" height="27" rx="8" fill="currentColor" fill-opacity=".06"/>
        <path d="M241 62v-6m-8 25h16m-35-10v9m54-9v9"/>
        <g fill="currentColor" stroke="none"><circle cx="241" cy="54" r="2"/><circle cx="232" cy="73" r="2"/><circle cx="250" cy="73" r="2"/><circle class="rd-pulse" cx="191" cy="50" r="3"/></g>
      </svg>
      <span class="rd-topics"><span><strong>Ops4LLM</strong><span>{{ t.ops4llm_note }}</span></span><span><strong>AgentOps</strong><span>{{ t.agentops_note }}</span></span></span>
    </button>
    <svg class="rd-links" viewBox="0 0 720 52" preserveAspectRatio="none" fill="none" aria-hidden="true" focusable="false">
      <path data-link="cloud" d="M360 52C360 16 176 48 176 2m-5 6 5-6 5 6"/>
      <path data-link="ai" d="M360 52C360 16 544 48 544 2m-5 6 5-6 5 6"/>
    </svg>
    <button type="button" class="rd-node rd-chaos" data-direction="chaos" data-caption="{{ t.shared_research_method }}" aria-pressed="false" disabled>
      <span class="rd-heading"><span class="rd-number">03</span><span>{{ t.chaos_engineering }}</span><svg viewBox="0 0 72 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path class="rd-signal" d="M1 19h16l6-13 9 23 8-20 6 10h25"/></svg></span>
      <span class="rd-method-note">{{ t.chaos_engineering_note }}</span>
    </button>
  </div>
  <figcaption><span data-research-caption aria-live="polite">{{ t.research_image_caption }}</span><span class="rd-hint" hidden>{% if lang == 'zh' %}点击探索关联{% else %}Select to explore{% endif %}<span aria-hidden="true"> ↗</span></span></figcaption>
</figure>
