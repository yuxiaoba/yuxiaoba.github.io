<dialog class="life-viewer" aria-label="{{ t.photo_viewer }}">
<div class="life-viewer-toolbar"><span data-photo-count aria-live="polite"></span><button type="button" data-photo-close aria-label="{{ t.photo_close }}">×</button></div>
<img data-photo-image alt="">
<div class="life-viewer-controls"><button type="button" data-photo-previous aria-label="{{ t.photo_previous }}">←</button><p data-photo-caption aria-live="polite"></p><button type="button" data-photo-next aria-label="{{ t.photo_next }}">→</button></div>
</dialog>
