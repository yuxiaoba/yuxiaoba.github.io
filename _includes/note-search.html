<section class="note-search" data-note-search data-default-type="{{ include.type | default: '' }}" data-empty="{{ t.search_empty }}" data-no-results="{{ t.no_results }}" data-loading="{{ t.search_loading }}" data-error="{{ t.search_error }}" data-count="{{ t.result_count }}" data-base="{{ '/' | relative_url }}" data-active-label="{{ t.active_filters }}">
<form role="search"><label class="search-label"><span class="visually-hidden">{{ t.search_notes }}</span><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" name="q" placeholder="{{ t.query }}" autocomplete="off"></label>
<details class="search-refinements"><summary><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14M7 2v6M13 7v6M8 12v6"/></svg>{{ t.refine_search }}<span class="active-filter-count" data-active-filters hidden></span></summary><div class="search-controls"><label><span>{{ t.type_filter }}</span><select name="type"><option value="">{{ t.all_types }}</option><option value="paper">{{ t.paper_type }}</option><option value="tech">{{ t.tech_type }}</option></select></label><label><span>{{ t.tag_filter }}</span><select name="tag"><option value="">{{ t.all_tags }}</option></select></label><label><span>{{ t.year_filter }}</span><select name="year"><option value="">{{ t.all_years }}</option></select></label><label><span>{{ t.month_filter }}</span><select name="month"><option value="">{{ t.all_months }}</option></select></label><button type="button" data-search-clear>{{ t.clear }}</button></div></details></form>
<script type="application/json" data-note-tag-labels>{% capture tag_labels %}{ {% for topic in site.data.note_tags %}{{ topic.id | jsonify }}: {{ topic[lang] | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %} }{% endcapture %}{{ tag_labels }}</script>
<p class="search-status" role="status" aria-live="polite"></p><ol class="search-results"></ol>
</section>
