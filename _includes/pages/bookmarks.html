<section class="subpage notes-page" data-bookmark-shelf>
<div class="eyebrow">{{ t.notes_kicker }}</div><h1>{{ t.bookmarks }}</h1>
<p class="subpage-lead">{{ t.bookmarks_intro }}</p>
<p class="door-detail">{{ t.bookmarks_local }}</p>
<div class="bookmark-tools"><button type="button" data-bookmark-export>{{ t.bookmarks_export }}</button><button type="button" data-bookmark-import>{{ t.bookmarks_import }}</button><input type="file" accept="application/json,.json" data-bookmark-file hidden></div>
<noscript><p>{{ t.bookmarks_nojs }}</p></noscript>
<p class="bookmark-count" data-bookmark-count aria-live="polite"></p>
<ol class="saved-notes-list" data-bookmark-list></ol>
</section>
