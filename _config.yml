baseurl: ''
url: ''
markdown: kramdown
plugins:
- jekyll-email-protect
collections:
  publications:
    output: false
  news:
    output: false
  digest:
    output: true
    permalink: /digest/:path/
  kitchen:
    output: true
    permalink: /kitchen/:path/
  tech:
    output: true
    permalink: /tech/:path/
timezone: Asia/Shanghai
exclude:
- vendor
- node_modules
- .bundle
- .handoff
- .preview
- .incoming
- AGENTS.md
- README.md
- docs
- scripts
- Gemfile
- Gemfile.lock
- _site
- .sync-state
- package.json
- package-lock.json
- tests
- requirements-sync.txt
defaults:
- scope:
    path: ''
    type: digest
  values:
    layout: article
    published: false
    section: digest
- scope:
    path: _digest/en
    type: digest
  values:
    lang: en
- scope:
    path: _digest/zh
    type: digest
  values:
    lang: zh
- scope:
    path: ''
    type: kitchen
  values:
    layout: article
    published: false
    section: kitchen
- scope:
    path: _kitchen/en
    type: kitchen
  values:
    lang: en
- scope:
    path: _kitchen/zh
    type: kitchen
  values:
    lang: zh
- scope:
    path: ''
    type: tech
  values:
    layout: article
    published: false
    section: tech
- scope:
    path: _tech/zh
    type: tech
  values:
    lang: zh
- scope:
    path: _tech/en
    type: tech
  values:
    lang: en
destination: .preview/site
kramdown:
  math_engine: mathjax
