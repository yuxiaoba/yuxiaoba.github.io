<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="arch-zh-title arch-zh-desc">
  <title id="arch-zh-title">1Password 与 Mercor AI SRE Agent 只读调查架构图</title>
  <desc id="arch-zh-desc">展示告警触发后，OpenAI Codex 执行层在只读权限下关联四类只读数据源，于 4 分钟内、2 美元以下生成证据化首读报告并交由人工执行生产变更的架构，及 95% 准确率与 57% MTTR 降幅口径。</desc>
  <defs>
    <marker id="arrow-blue-zh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .t-sans { font-family: 'Lato', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>

  <rect x="36" y="22" width="164" height="24" rx="12" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="118" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8" class="t-sans">1PASSWORD × MERCOR</text>

  <text x="36" y="70" font-size="20" font-weight="700" fill="#0f172a" class="t-sans">AI SRE 只读调查架构：从告警触发到人工可验证“首读”</text>
  <text x="36" y="94" font-size="13" fill="#475569" class="t-sans">OpenAI Codex 执行层在只读凭证约束下关联四类工程遥测，4 分钟内产出归因，生产写操作留给人类工程师</text>

  <!-- Column 1: Triggers & Read-Only Evidence Plane -->
  <rect x="36" y="114" width="270" height="278" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="52" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">1. 触发入口与只读证据面</text>

  <rect x="52" y="154" width="238" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="174" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">触发入口</text>
  <text x="64" y="193" font-size="11.5" fill="#334155" class="t-sans">监控告警自动拉起 / 工程师手动上报</text>

  <rect x="52" y="214" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="236" font-size="12" fill="#334155" class="t-sans">监控工具与实时遥测（只读）</text>

  <rect x="52" y="256" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="278" font-size="12" fill="#334155" class="t-sans">近期代码部署与变更记录（只读）</text>

  <rect x="52" y="298" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="320" font-size="12" fill="#334155" class="t-sans">服务源码仓库与配置（只读）</text>

  <rect x="52" y="340" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="362" font-size="12" fill="#334155" class="t-sans">300+ 历史事故档案与处置轨迹</text>

  <!-- Arrow 1 -->
  <line x1="310" y1="253" x2="334" y2="253" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue-zh)"/>

  <!-- Column 2: Codex Execution Layer & Guardrails -->
  <rect x="338" y="114" width="284" height="278" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="354" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">2. Codex 执行层与安全护栏</text>

  <rect x="354" y="154" width="252" height="114" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="368" y="175" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">长程调查循环（OpenAI Codex）</text>
  <text x="368" y="197" font-size="11.5" fill="#334155" class="t-sans">• 检索告警窗口内的部署与代码改动</text>
  <text x="368" y="217" font-size="11.5" fill="#334155" class="t-sans">• 跨系统比对相似历史事故模式</text>
  <text x="368" y="237" font-size="11.5" fill="#334155" class="t-sans">• 汇总带出处的诊断证据与置信提示</text>
  <text x="368" y="257" font-size="11.5" fill="#475569" class="t-sans">• 遇高风险或复杂异常自动升级求助</text>

  <rect x="354" y="278" width="252" height="98" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="368" y="299" font-size="12.5" font-weight="700" fill="#1d4ed8" class="t-sans">权限边界（零生产写权限）</text>
  <text x="368" y="320" font-size="11.5" fill="#334155" class="t-sans">• 仅限已审批观测工具的只读凭证</text>
  <text x="368" y="340" font-size="11.5" fill="#334155" class="t-sans">• 显式禁止直接改写生产数据库</text>
  <text x="368" y="360" font-size="11.5" fill="#334155" class="t-sans">• 集成人工介入 Fail-safe 交接机制</text>

  <!-- Arrow 2 -->
  <line x1="626" y1="253" x2="650" y2="253" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue-zh)"/>

  <!-- Column 3: First Read & Human Action -->
  <rect x="654" y="114" width="270" height="278" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="670" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">3. 证据化首读与人工执行</text>

  <rect x="670" y="154" width="238" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="684" y="175" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">首读报告（First Read）四要素</text>
  <text x="684" y="197" font-size="11.5" fill="#334155" class="t-sans">1) 受影响服务与故障范围</text>
  <text x="684" y="216" font-size="11.5" fill="#334155" class="t-sans">2) 对应负责团队归属</text>
  <text x="684" y="235" font-size="11.5" fill="#334155" class="t-sans">3) 疑似根因及关联证据</text>
  <text x="684" y="254" font-size="11.5" fill="#334155" class="t-sans">4) 初始止损与修复步骤建议</text>
  <text x="684" y="279" font-size="11.5" font-weight="700" fill="#1d4ed8" class="t-sans">预算：不足 4 分钟 · 低于 2 美元</text>

  <rect x="670" y="304" width="238" height="72" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="684" y="325" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">值班工程师最终裁决与执行</text>
  <text x="684" y="345" font-size="11.5" fill="#334155" class="t-sans">人工核验首读证据后，再执行</text>
  <text x="684" y="363" font-size="11.5" fill="#334155" class="t-sans">版本回滚、配置切换或数据库修复</text>

  <!-- Bottom Metrics Strip -->
  <rect x="36" y="410" width="888" height="90" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>

  <text x="147" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8" class="t-sans">95%（78 次评测）</text>
  <text x="147" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">报告首读归因准确率</text>

  <line x1="258" y1="424" x2="258" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="369" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8" class="t-sans">-57% MTTR</text>
  <text x="369" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">中位修复时间降幅（自报）</text>

  <line x1="480" y1="424" x2="480" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="591" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" class="t-sans">不足 4 min / 低于 $2</text>
  <text x="591" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">单次首读调查延迟与成本</text>

  <line x1="702" y1="424" x2="702" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="813" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" class="t-sans">严格只读</text>
  <text x="813" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">写操作与生产改库完全隔离</text>

  <text x="36" y="522" font-size="11" fill="#475569" class="t-sans">出处：Tim Keary (Forbes, 2026-10-13) 与 Nancy Wang X 帖 (2026-10-13)；以上数字均属合作方自报口径，非第三方公开基准。</text>
</svg>
