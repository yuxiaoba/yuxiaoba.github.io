<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="eval-zh-title eval-zh-desc">
  <title id="eval-zh-title">时间冻结历史事故评测构造与证据边界审计</title>
  <desc id="eval-zh-desc">左侧展示基于 300 多起历史事故构造时间冻结评测集与 78 次评测运行的协同设计；右侧对照 Forbes 与 X 已披露事实与未公开的评测与对照协议细节。</desc>
  <defs>
    <marker id="arrow-down-zh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .t-sans { font-family: 'Lato', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>

  <rect x="36" y="22" width="230" height="24" rx="12" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="151" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8" class="t-sans">TIME-FROZEN EVAL &amp; AUDIT</text>

  <text x="36" y="70" font-size="20" font-weight="700" fill="#0f172a" class="t-sans">“冻结时间”历史事故评测构造，与公开数字的证据边界</text>
  <text x="36" y="94" font-size="13" fill="#475569" class="t-sans">300+ 历史事故难点在于还原无未来泄露的事故起点状态；95% 与 57% 仍需按自报边界审慎解读</text>

  <!-- Left Panel: Time-Frozen Eval Construction -->
  <rect x="36" y="114" width="432" height="382" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="54" y="142" font-size="14.5" font-weight="700" fill="#1d4ed8" class="t-sans">A. 为什么“冻结时间”是评测构建最难一步</text>

  <rect x="54" y="158" width="396" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="70" y="180" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">1) 事故起点状态快照（剔除事后修复信息）</text>
  <text x="70" y="202" font-size="11.5" fill="#334155" class="t-sans">从 300+ 历史事故中锁定告警爆发瞬间的代码版本、</text>
  <text x="70" y="222" font-size="11.5" fill="#334155" class="t-sans">部署历史、监控指标与系统日志，避免事后答案泄露</text>

  <line x1="252" y1="246" x2="252" y2="262" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-down-zh)"/>

  <rect x="54" y="266" width="396" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="288" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">2) 评测“考题”重放（报告 78 次评测运行）</text>
  <text x="70" y="310" font-size="11.5" fill="#334155" class="t-sans">让只读 Agent 在时间冻结环境中自主排障，核验其</text>
  <text x="70" y="330" font-size="11.5" fill="#334155" class="t-sans">受影响服务、责任团队、根因定位与初始修复步骤</text>

  <line x1="252" y1="354" x2="252" y2="370" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-down-zh)"/>

  <rect x="54" y="374" width="396" height="104" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="70" y="396" font-size="12.5" font-weight="700" fill="#1d4ed8" class="t-sans">3) 权限边界与评测体系的协同设计</text>
  <text x="70" y="418" font-size="11.5" fill="#334155" class="t-sans">• 只读沙箱使大规模历史事故重放可安全执行</text>
  <text x="70" y="438" font-size="11.5" fill="#334155" class="t-sans">• 首读归因准确率（95%）作为后续放权的量化前提</text>
  <text x="70" y="458" font-size="11.5" fill="#334155" class="t-sans">• 其余约 5% 与高风险场景由 Fail-safe 交回人工</text>

  <!-- Right Panel: Epistemic Audit -->
  <rect x="492" y="114" width="432" height="382" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="510" y="142" font-size="14.5" font-weight="700" fill="#1d4ed8" class="t-sans">B. 证据审计：已披露事实 vs. 未公开细节</text>

  <rect x="510" y="158" width="396" height="146" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="526" y="180" font-size="12.5" font-weight="700" fill="#1d4ed8" class="t-sans">已披露信息（Forbes / X，2026-10-13）</text>
  <text x="526" y="204" font-size="11.5" fill="#0f172a" class="t-sans">✓ 架构组合：OpenAI Codex 执行层 + 只读工具集合</text>
  <text x="526" y="225" font-size="11.5" fill="#0f172a" class="t-sans">✓ 评测资产：300+ 历史事故套件，78 次评测运行</text>
  <text x="526" y="246" font-size="11.5" fill="#0f172a" class="t-sans">✓ 自报效果：95% 准确率，中位 MTTR 降低 57%</text>
  <text x="526" y="267" font-size="11.5" fill="#0f172a" class="t-sans">✓ 首读代价：不足 4 分钟、低于 2 美元／次</text>
  <text x="526" y="288" font-size="11.5" fill="#0f172a" class="t-sans">✓ 写入约束：禁止直改生产库，保留人工终审</text>

  <rect x="510" y="318" width="396" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="526" y="340" font-size="12.5" font-weight="700" fill="#334155" class="t-sans">尚未公开的协议细节（限制外部泛化）</text>
  <text x="526" y="364" font-size="11.5" fill="#475569" class="t-sans">? 95% 评分细则：部分命中如何计分、是否双盲评判</text>
  <text x="526" y="385" font-size="11.5" fill="#475569" class="t-sans">? 样本映射：78 次运行与 300+ 历史事故池如何抽样</text>
  <text x="526" y="406" font-size="11.5" fill="#475569" class="t-sans">? 基线控制：57% MTTR 降幅的前后时间窗与混杂因素</text>
  <text x="526" y="427" font-size="11.5" fill="#475569" class="t-sans">? 失败谱系：未过 5% 的误判原因与漏报严重度分级</text>
  <text x="526" y="448" font-size="11.5" fill="#475569" class="t-sans">? 独立复现：属合作双方案例披露，缺第三方开源基准</text>

  <text x="36" y="520" font-size="11" fill="#475569" class="t-sans">判断准则：“时间冻结历史快照 + 只读首读”的工程范式可直接借鉴；具体 95% / 57% 指标仅适用于 1Password 内部生产背景。</text>
</svg>
