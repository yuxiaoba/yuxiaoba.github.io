<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="arch-en-title arch-en-desc">
  <title id="arch-en-title">1Password and Mercor Read-Only AI SRE Agent Architecture</title>
  <desc id="arch-en-desc">Workflow showing how monitoring alerts or engineer reports trigger an OpenAI Codex execution layer over four read-only engineering sources to deliver an evidence-backed first read in under 4 minutes and under $2 while humans retain all production write actions.</desc>
  <defs>
    <marker id="arrow-blue-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .t-sans { font-family: 'Lato', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>

  <rect x="36" y="22" width="164" height="24" rx="12" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
  <text x="118" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8" class="t-sans">1PASSWORD × MERCOR</text>

  <text x="36" y="70" font-size="20" font-weight="700" fill="#0f172a" class="t-sans">Read-Only AI SRE Architecture: Alert Trigger to Verified First Read</text>
  <text x="36" y="94" font-size="13" fill="#475569" class="t-sans">OpenAI Codex correlates four read-only evidence sources in under 4 minutes; humans retain all production write control</text>

  <!-- Column 1: Triggers & Read-Only Evidence Plane -->
  <rect x="36" y="114" width="270" height="278" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="52" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">1. Triggers &amp; Read-Only Sources</text>

  <rect x="52" y="154" width="238" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="174" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">Entry Triggers</text>
  <text x="64" y="193" font-size="11.5" fill="#334155" class="t-sans">Monitoring alert or engineer report</text>

  <rect x="52" y="214" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="236" font-size="11.5" fill="#334155" class="t-sans">Monitoring &amp; telemetry (read-only)</text>

  <rect x="52" y="256" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="278" font-size="11.5" fill="#334155" class="t-sans">Recent code deploys (read-only)</text>

  <rect x="52" y="298" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="320" font-size="11.5" fill="#334155" class="t-sans">Source code &amp; configs (read-only)</text>

  <rect x="52" y="340" width="238" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="362" font-size="11.5" fill="#334155" class="t-sans">300+ historical incident traces</text>

  <!-- Arrow 1 -->
  <line x1="310" y1="253" x2="334" y2="253" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue-en)"/>

  <!-- Column 2: Codex Execution Layer & Guardrails -->
  <rect x="338" y="114" width="284" height="278" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="354" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">2. Codex Layer &amp; Guardrails</text>

  <rect x="354" y="154" width="252" height="114" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="368" y="175" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">Long-Horizon Loop (OpenAI Codex)</text>
  <text x="368" y="197" font-size="11.5" fill="#334155" class="t-sans">• Correlate alerts with recent deploys</text>
  <text x="368" y="217" font-size="11.5" fill="#334155" class="t-sans">• Cross-check source &amp; past incidents</text>
  <text x="368" y="237" font-size="11.5" fill="#334155" class="t-sans">• Compile cited evidence for triage</text>
  <text x="368" y="257" font-size="11.5" fill="#475569" class="t-sans">• Escalate complex or risky scenarios</text>

  <rect x="354" y="278" width="252" height="98" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="368" y="299" font-size="12.5" font-weight="700" fill="#1d4ed8" class="t-sans">Hard Boundary (Zero Write Access)</text>
  <text x="368" y="320" font-size="11.5" fill="#334155" class="t-sans">• Read-only tokens on approved tools</text>
  <text x="368" y="340" font-size="11.5" fill="#334155" class="t-sans">• Blocked from production DB writes</text>
  <text x="368" y="360" font-size="11.5" fill="#334155" class="t-sans">• Human fail-safe handoffs built in</text>

  <!-- Arrow 2 -->
  <line x1="626" y1="253" x2="650" y2="253" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue-en)"/>

  <!-- Column 3: First Read & Human Action -->
  <rect x="654" y="114" width="270" height="278" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="670" y="140" font-size="14" font-weight="700" fill="#1d4ed8" class="t-sans">3. First Read &amp; Human Control</text>

  <rect x="670" y="154" width="238" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="684" y="175" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">Evidence-Backed "First Read"</text>
  <text x="684" y="197" font-size="11.5" fill="#334155" class="t-sans">1) Affected service &amp; blast radius</text>
  <text x="684" y="216" font-size="11.5" fill="#334155" class="t-sans">2) Responsible owning team</text>
  <text x="684" y="235" font-size="11.5" fill="#334155" class="t-sans">3) Likely root cause &amp; citations</text>
  <text x="684" y="254" font-size="11.5" fill="#334155" class="t-sans">4) Initial remediation steps</text>
  <text x="684" y="279" font-size="11.5" font-weight="700" fill="#1d4ed8" class="t-sans">Budget: under 4 min · under $2</text>

  <rect x="670" y="304" width="238" height="72" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <text x="684" y="325" font-size="12.5" font-weight="700" fill="#0f172a" class="t-sans">Human On-Call Final Action</text>
  <text x="684" y="345" font-size="11.5" fill="#334155" class="t-sans">Engineers verify evidence, then run</text>
  <text x="684" y="363" font-size="11.5" fill="#334155" class="t-sans">rollbacks, scaling, or DB changes</text>

  <!-- Bottom Metrics Strip -->
  <rect x="36" y="410" width="888" height="90" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>

  <text x="147" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8" class="t-sans">95% (78 runs)</text>
  <text x="147" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">Reported first-read accuracy</text>

  <line x1="258" y1="424" x2="258" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="369" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8" class="t-sans">-57% MTTR</text>
  <text x="369" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">Lower median remediation time</text>

  <line x1="480" y1="424" x2="480" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="591" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" class="t-sans">Under 4 min / $2</text>
  <text x="591" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">Per first-read investigation</text>

  <line x1="702" y1="424" x2="702" y2="486" stroke="#bfdbfe" stroke-width="1"/>

  <text x="813" y="446" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" class="t-sans">Read-Only</text>
  <text x="813" y="472" text-anchor="middle" font-size="12" fill="#334155" class="t-sans">No direct DB or prod writes</text>

  <text x="36" y="522" font-size="11" fill="#475569" class="t-sans">Source: Tim Keary (Forbes, 2026-10-13) &amp; Nancy Wang X post (2026-10-13); figures are joint self-reports, not an open benchmark.</text>
</svg>
