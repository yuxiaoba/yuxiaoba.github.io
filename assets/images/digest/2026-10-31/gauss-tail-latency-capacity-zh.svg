<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="GAUSS 容量决策机理与 v1 实证边界总览：拐点选点、流量切分与 SRPT、集成 vs 单条 Trace、以及 v1 证据审计" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Lato', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.6" font-weight="700" fill="#0f172a">GAUSS 容量决策机理与 v1 实证边界总览</text>
  <text x="24" y="53" font-size="10.2" fill="#475569">arXiv:2610.37989v1（§1、§3.2、§4.1–4.4）· 解析拐点、切分与 SRPT 机理示意（定性结构关系，非实测数值）</text>
  <line x1="24" y1="63" x2="936" y2="63" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A: Operating Point Knee & Headroom -->
  <rect x="20" y="72" width="452" height="208" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">A. 工作点拐点与可预留余量（§4.1，定性机理）</text>

  <!-- Plot axes -->
  <text x="36" y="114" font-size="8.8" font-weight="600" fill="#334155">TTFT 分布</text>
  <line x1="58" y1="118" x2="58" y2="236" stroke="#64748b" stroke-width="1.1"/>
  <line x1="58" y1="236" x2="314" y2="236" stroke="#64748b" stroke-width="1.1"/>

  <!-- SLO horizontal line -->
  <line x1="58" y1="176" x2="306" y2="176" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="64" y="171" font-size="8.4" font-weight="700" fill="#0f766e">SLO 目标</text>

  <!-- Operating point & asymptote -->
  <line x1="234" y1="122" x2="234" y2="236" stroke="#1d4ed8" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="296" y1="118" x2="296" y2="236" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="296" y="114" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b91c1c">λ* = μ</text>

  <!-- Headroom span -->
  <line x1="236" y1="132" x2="294" y2="132" stroke="#1d4ed8" stroke-width="1.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="265" y="126" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">余量</text>

  <!-- Mini legend inside plot top-left -->
  <line x1="68" y1="126" x2="84" y2="126" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="89" y="129.5" font-size="8.3" font-weight="700" fill="#1d4ed8">P95 / P99 尾部</text>
  <line x1="68" y1="141" x2="84" y2="141" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="89" y="144.5" font-size="8.3" font-weight="600" fill="#64748b">均值 / P50</text>

  <!-- Curves -->
  <path d="M 64 224 C 145 222, 212 219, 250 210 C 276 203, 288 182, 293 138" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M 64 212 C 145 208, 204 198, 234 176 C 258 158, 276 138, 286 118" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
  <circle cx="234" cy="176" r="4" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.2"/>

  <!-- X-axis labels -->
  <text x="58" y="248" font-size="8.2" fill="#64748b">0</text>
  <text x="234" y="248" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">拐点工作位</text>
  <text x="296" y="248" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b91c1c">ρ=1</text>
  <text x="184" y="266" text-anchor="middle" font-size="8.8" fill="#475569">到达率 λ（相对稳定上限 ρ = λ/μ）</text>

  <!-- Right callout in Panel A -->
  <rect x="328" y="108" width="134" height="162" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="336" y="124" font-size="9.1" font-weight="700" fill="#1e3a8a">拐点前选点逻辑</text>
  <text x="336" y="141" font-size="8.4" fill="#334155">• 保留高吞吐利用率</text>
  <text x="336" y="157" font-size="8.4" fill="#334155">• 尾延迟可控于 SLO</text>
  <text x="336" y="173" font-size="8.4" fill="#334155">• 距 λ* 间距即为余量</text>
  <line x1="336" y1="184" x2="454" y2="184" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="336" y="200" font-size="9.1" font-weight="700" fill="#92400e">单 Trace 回放局限</text>
  <text x="336" y="217" font-size="8.3" fill="#475569">• 无法解析求得 λ*=μ</text>
  <text x="336" y="233" font-size="8.3" fill="#475569">• 每个 λ 与混流组合</text>
  <text x="336" y="248" font-size="8.3" fill="#475569">  均须重录或重跑仿真</text>

  <!-- Panel B: HoL Segmentation & SRPT -->
  <rect x="488" y="72" width="452" height="208" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
