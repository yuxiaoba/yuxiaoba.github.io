<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="PhOSv1 实证表现四象限图：展示四类 GPU 上下文可去重性、23 模型睡眠显存压缩 98.1%、16 模型 4.12 秒唤醒延迟以及 10 模型 ShareGPT 端到端 TTFT 降低 87.0% 与 ≥97.3% 吞吐保留" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.5" font-weight="700" fill="#0f172a">PhOSv1 实证表现：98.1% 睡眠显存削减、4.12 秒唤醒与 87.0% TTFT 降幅</text>
  <text x="24" y="53" font-size="10.1" fill="#475569">整理自 arXiv:2610.39999v1（§2–§4, Fig. 3–5 &amp; Fig. 7–8）· 8×A800 服务器中单张 80 GB A800（CUDA 12.9, vLLM v0.19.1, NVML 不含权重）</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A: Context Anatomy -->
  <rect x="20" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">A. 四类 GPU 上下文资源分解与重建代价（§3, Fig. 4–5）</text>

  <rect x="32" y="106" width="84" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="74" y="119" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">CUDA ctx</text>
  <text x="124" y="119" font-size="9.0" fill="#0f172a">驱动主上下文 · 创建 ~430 ms · 同卡模型 100% 共享</text>

  <rect x="32" y="135" width="84" height="19" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="74" y="148" text-anchor="middle" font-size="8.6" font-weight="700" fill="#065f46">GPU Kernels</text>
  <text x="124" y="148" font-size="9.0" fill="#0f172a">算子二进制 · 17 模型间 59–99% 重叠（同族 0.99–1.00）</text>

  <rect x="32" y="164" width="84" height="19" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="74" y="177" text-anchor="middle" font-size="8.6" font-weight="700" fill="#92400e">GPU Buffers</text>
  <text x="124" y="177" font-size="9.0" fill="#0f172a">模型专属内区 · 睡眠占主机占位 · 唤醒重建仅 ~30 ms</text>

  <rect x="32" y="193" width="84" height="19" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="74" y="206" text-anchor="middle" font-size="8.6" font-weight="700" fill="#334155">Handles</text>
  <text x="124" y="206" font-size="9.0" fill="#0f172a">Streams / cuBLAS 句柄注册表 · 显存占比可忽略</text>

  <rect x="32" y="224" width="428" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="241" font-size="9.0" font-weight="700" fill="#1e3a8a">Fig. 4 单模型原生总上下文（不含权重，其中大片由 Buffers 构成）：</text>
  <text x="42" y="258" font-size="8.7" fill="#334155">Qwen3-8B 544 MiB · Qwen3.6-27B 1,272 · Qwen2.5-VL-7B 1,360 · gemma-4-26B-A4B 1,646</text>

  <!-- Panel B: Resident Memory & Throughput Impact -->
  <rect x="488" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="98" x2="940" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">B. 睡眠显存压缩（23 模型）与吞吐代价（Fig. 3 &amp; Fig. 7 左）</text>

  <text x="500" y="114" font-size="9.1" font-weight="700" fill="#0f172a">1. 缓存 23 个睡眠模型的 GPU 上下文占用（不含权重）：</text>
  <text x="598" y="135" text-anchor="end" font-size="8.9" fill="#334155">Vanilla Sleep</text>
  <rect x="606" y="124" width="224" height="14" rx="2.5" fill="#ef4444"/>
  <text x="836" y="134.5" font-size="9.0" font-weight="700" fill="#991b1b">25.67 GiB</text>

  <text x="598" y="156" text-anchor="end" font-size="8.9" font-weight="700" fill="#1d4ed8">PhOSv1</text>
  <rect x="606" y="145" width="5" height="14" rx="1.5" fill="#1d4ed8"/>
  <text x="617" y="155.5" font-size="9.0" font-weight="700" fill="#1d4ed8">0.49 GiB（-98.1%）</text>
  <text x="500" y="174" font-size="8.4" fill="#475569">注：24 模型原生睡眠占 ~27 GB（80 GB A800 显存的 34%）</text>

  <line x1="500" y1="183" x2="928" y2="183" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="199" font-size="9.1" font-weight="700" fill="#0f172a">2. 睡眠占用挤压 KV Cache 对吞吐的影响（Qwen3.6-27B）：</text>
  <text x="598" y="220" text-anchor="end" font-size="8.9" fill="#1d4ed8">0 GiB 占用</text>
  <rect x="606" y="209" width="224" height="14" rx="2.5" fill="#1d4ed8"/>
  <text x="836" y="219.5" font-size="9.0" font-weight="700" fill="#1e3a8a">747 tok/s</text>

  <text x="598" y="241" text-anchor="end" font-size="8.9" fill="#334155">16 GiB 占用</text>
  <rect x="606" y="230" width="102" height="14" rx="2.5" fill="#64748b"/>
  <text x="714" y="240.5" font-size="9.0" font-weight="700" fill="#991b1b">341 tok/s（-54%）</text>
  <text x="500" y="264" font-size="8.4" fill="#475569">可用 HBM 减少压缩 KV Cache 空间与上下文长度，加剧排队</text>

  <!-- Panel C: Startup Latency -->
  <rect x="20" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="316" x2="472" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="307.5" font-size="10.8" font-weight="700" fill="#1e3a8a">C. 16 模型唤醒 / 启动延迟均值对比（§4.2, Fig. 7 右）</text>
  <text x="32" y="332" font-size="8.6" fill="#475569">注：Cold Start 与 PhoenixOS 的权重加载已归一化去除存储 I/O 开销</text>

  <text x="142" y="355" text-anchor="end" font-size="9.1" font-weight="700" fill="#334155">Cold Start</text>
  <rect x="150" y="344" width="244" height="15" rx="2.5" fill="#64748b"/>
  <text x="400" y="355" font-size="9.0" font-weight="700" fill="#334155">24.41 s</text>

  <text x="142" y="381" text-anchor="end" font-size="9.1" font-weight="700" fill="#334155">Vanilla Sleep</text>
  <rect x="150" y="370" width="49" height="15" rx="2.5" fill="#d97706"/>
  <text x="205" y="381" font-size="9.0" font-weight="700" fill="#92400e">4.89 s</text>

  <text x="142" y="407" text-anchor="end" font-size="9.1" font-weight="700" fill="#1d4ed8">PhOSv1 + Sleep</text>
  <rect x="150" y="396" width="41" height="15" rx="2.5" fill="#1d4ed8"/>
  <text x="197" y="407" font-size="9.0" font-weight="700" fill="#1d4ed8">4.12 s（保持近零控制面延迟）</text>

  <rect x="32" y="424" width="428" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="441" font-size="8.9" font-weight="700" fill="#1e3a8a">• 连接 Context Service 平均仅增 72 ms；上下文已在守护进程就绪</text>
  <text x="42" y="458" font-size="8.6" fill="#334155">• PhoenixOS (C/R)：Fig. 1c 恢复需 0.57 s，但 CRIU 最差出现 10–20 s 尾延迟</text>
  <text x="42" y="474" font-size="8.6" fill="#475569">  且不支持 io_uring 等新引擎优化（Fig. 7 右有柱图，16 模型均值正文未单列）</text>

  <!-- Panel D: End-to-End Trace -->
  <rect x="488" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="316" x2="940" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="307.5" font-size="10.8" font-weight="700" fill="#1e3a8a">D. 10 模型 ShareGPT Trace 端到端对比（§4.1, Fig. 8）</text>
  <text x="500" y="331" font-size="8.5" fill="#475569">10 个 Qwen (0.6B–32B) · 10 min 泊松 0.3 req/min/模型 · 原生限 6 GB + LFU</text>

  <rect x="500" y="340" width="208" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="510" y="357" font-size="9.1" font-weight="700" fill="#1e3a8a">平均 E2E TTFT</text>
  <text x="510" y="378" font-size="12.2" font-weight="700" fill="#0f172a">146.82 s → 19.09 s</text>
  <text x="510" y="397" font-size="9.0" font-weight="700" fill="#1d4ed8">降低 87.0%（消除冷启动排队）</text>

  <rect x="720" y="340" width="208" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="730" y="357" font-size="9.1" font-weight="700" fill="#1e3a8a">p50 E2E TTFT</text>
  <text x="730" y="378" font-size="12.2" font-weight="700" fill="#0f172a">142.39 s → 14.65 s</text>
  <text x="730" y="397" font-size="8.9" fill="#334155">全部所需模型可常驻睡眠池</text>

  <rect x="500" y="416" width="208" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="433" font-size="9.1" font-weight="700" fill="#334155">完成同 Trace 服务窗口</text>
  <text x="510" y="454" font-size="12.2" font-weight="700" fill="#0f172a">728 s → 578 s</text>
  <text x="510" y="473" font-size="8.9" fill="#475569">活跃服务时长缩短 150 s</text>

  <rect x="720" y="416" width="208" height="68" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="730" y="433" font-size="9.1" font-weight="700" fill="#065f46">API Remoting 吞吐保留</text>
  <text x="730" y="454" font-size="12.2" font-weight="700" fill="#065f46">≥ 97.3%</text>
  <text x="730" y="473" font-size="8.9" fill="#065f46">相对原生 vLLM 开销 ≤ 2.7%</text>

  <text x="20" y="519" font-size="8.9" fill="#64748b">实证边界：所有数字测于 8 卡 A800 服务器中的单张 GPU；假定同一服务商引擎互信、单卡同刻单活执行，且暂不支持 CUDA Graph（§5）。</text>
</svg>
