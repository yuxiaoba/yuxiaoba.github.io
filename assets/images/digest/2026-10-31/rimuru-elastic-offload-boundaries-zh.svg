<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Rimuru 弹性卸载控制流、吞吐对比、消融收益与实证基线边界" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Lato', sans-serif;">
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.4" font-weight="700" fill="#0f172a">Rimuru 弹性边界调节流、并发消融与基线条件边界</text>
  <text x="24" y="51" font-size="10.0" fill="#475569">arXiv:2610.40305v1 (§2.3 Fig. 4, §6 Alg. 1, §8.2–§8.5 Fig. 9–13) · 滞回阈值控制、吞吐/TTFT 收益与真实评测约束</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Card A: Top-Left (Adjuster Control & Safe Sync) -->
  <rect x="20" y="70" width="452" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="70" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="88" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="96" x2="472" y2="96" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="87.5" font-size="10.6" font-weight="700" fill="#1e3a8a">A · 负载感知专家缓存调节器与 GPU 安全同步 (§6, Alg. 1)</text>

  <rect x="32" y="103" width="428" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="246" y="118.5" text-anchor="middle" font-size="8.4" font-weight="600" fill="#334155">调度完成后读取空闲专家页 F_b 与缺口 R_b · 依据离线热集排序 {H_l} 与路由概率 {p_l}</text>

  <!-- 3 branches -->
  <rect x="32" y="133" width="144" height="95" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.0"/>
  <text x="41" y="149" font-size="9.0" font-weight="700" fill="#991b1b">缩容 (R_b &gt; 0 或 F_b &lt; 2)</text>
  <text x="41" y="166" font-size="8.1" fill="#334155">• N = ⌈(R_b+1)/3⌉ 或 1</text>
  <text x="41" y="181" font-size="8.1" fill="#334155">• GreedyShrink 驱逐</text>
  <text x="41" y="196" font-size="8.1" fill="#334155">  最低 p_l(e) 尾部专家</text>
  <text x="41" y="211" font-size="8.1" font-weight="600" fill="#991b1b">• 严守下界 C_min (EOL)</text>

  <rect x="182" y="133" width="122" height="95" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="243" y="149" text-anchor="middle" font-size="9.0" font-weight="700" fill="#334155">滞回死区 (2 ≤ F_b ≤ 9)</text>
  <text x="243" y="169" text-anchor="middle" font-size="8.1" fill="#475569">不触发扩缩调整</text>
  <text x="243" y="186" text-anchor="middle" font-size="8.1" fill="#475569">预留 3 专家 (9 页)</text>
  <text x="243" y="203" text-anchor="middle" font-size="8.1" fill="#475569">抑制临界抖动与</text>
  <text x="243" y="217" text-anchor="middle" font-size="8.1" fill="#475569">反复驱逐重载</text>

  <rect x="310" y="133" width="150" height="95" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.0"/>
  <text x="319" y="149" font-size="9.0" font-weight="700" fill="#1e3a8a">扩容 (F_b &gt; 9)</text>
  <text x="319" y="166" font-size="8.1" fill="#334155">• N = min(5, ⌊(F_b−9)/3⌋)</text>
  <text x="319" y="181" font-size="8.1" fill="#334155">• GreedyExpand 加载</text>
  <text x="319" y="196" font-size="8.1" fill="#334155">  最高 p_l(e) 未缓存专家</text>
  <text x="319" y="211" font-size="8.1" font-weight="600" fill="#1d4ed8">• 单步上限 5 个控 I/O</text>

  <rect x="32" y="235" width="428" height="41" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.0"/>
  <text x="41" y="251" font-size="8.2" font-weight="700" fill="#065f46">GPU 安全同步 (§6.2)：扩容高优并入 l+1 预取并去重，等拷贝完成后再改页表；</text>
  <text x="41" y="267" font-size="8.2" fill="#065f46">缩容专家在当前前向步保持可见以提升复用，整步计算结束后才提交失效并归还物理页。</text>

  <!-- Card B: Top-Right (Case Study & Ablation) -->
  <rect x="488" y="70" width="452" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="70" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="88" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="96" x2="940" y2="96" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="87.5" font-size="10.6" font-weight="700" fill="#1e3a8a">B · 并发个案研究与渐进消融收益 (§2.3 Fig. 4, §8.3 Fig. 11)</text>

  <!-- Left half of B: Case study -->
  <rect x="500" y="104" width="214" height="172" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="510" y="121" font-size="8.9" font-weight="700" fill="#0f172a">Qwen1.5-MoE-14B (1×5090, 10 req/s)</text>
  <text x="510" y="136" font-size="8.0" fill="#475569">显存上限 0.9 · ShareGPT 请求流</text>

  <text x="510" y="156" font-size="8.3" font-weight="600" fill="#475569">vLLM (全驻留)</text>
  <rect x="510" y="161" width="40" height="10" rx="2" fill="#64748b"/>
  <text x="556" y="170" font-size="8.1" font-weight="600" fill="#334155">并发 34 · ~2,100 步</text>

  <text x="510" y="188" font-size="8.3" font-weight="600" fill="#b45309">Fate (固定边界卸载)</text>
  <rect x="510" y="193" width="87" height="10" rx="2" fill="#d97706"/>
  <text x="603" y="202" font-size="8.1" font-weight="600" fill="#92400e">并发 74 · ~1,300 步</text>

  <text x="510" y="220" font-size="8.3" font-weight="700" fill="#1d4ed8">Rimuru (弹性页池)</text>
  <rect x="510" y="225" width="106" height="10" rx="2" fill="#1d4ed8"/>
  <text x="622" y="234" font-size="8.1" font-weight="700" fill="#1d4ed8">并发 90 · ~1,000 步</text>

  <rect x="508" y="246" width="198" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="607" y="260.5" text-anchor="middle" font-size="8.1" font-weight="600" fill="#1e3a8a">弹性共享比固定卸载再降 ~30% 总步数</text>

  <!-- Right half of B: Ablation -->
  <rect x="722" y="104" width="206" height="172" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="732" y="121" font-size="8.9" font-weight="700" fill="#0f172a">2×5090 消融叠加 (相对 Fate)</text>
  <text x="732" y="136" font-size="8.0" fill="#475569">Qwen3.5-35B(卸载) 与 Qwen3-30B</text>

  <rect x="730" y="145" width="190" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="737" y="160.5" font-size="8.0" font-weight="700" fill="#475569">Base (Fate)</text>
  <text x="914" y="160.5" text-anchor="end" font-size="8.0" fill="#475569">1.00× 吞吐基准</text>

  <rect x="730" y="174" width="190" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="737" y="189.5" font-size="8.0" font-weight="700" fill="#334155">+UMM 共享池</text>
  <text x="914" y="189.5" text-anchor="end" font-size="7.9" fill="#64748b">~1.00× (需策略驱动)</text>

  <rect x="730" y="203" width="190" height="24" rx="3" fill="#eff6ff" stroke="#60a5fa" stroke-width="0.9"/>
  <text x="737" y="218.5" font-size="8.0" font-weight="700" fill="#1d4ed8">+CA 调节器</text>
  <text x="914" y="218.5" text-anchor="end" font-size="8.0" font-weight="700" fill="#1d4ed8">3.85× · -83.9% TTFT</text>

  <rect x="730" y="232" width="190" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/>
  <text x="737" y="247.5" font-size="8.0" font-weight="700" fill="#1e3a8a">+DF 离散算子</text>
  <text x="914" y="247.5" text-anchor="end" font-size="8.0" font-weight="700" fill="#1e3a8a">4.19× · -97.8% TTFT</text>

  <text x="732" y="269" font-size="7.9" fill="#475569">+DF 主要消减 prefill 全专家拷贝开销</text>

  <!-- Card C: Bottom-Left (End-to-End Ratios & Regimes) -->
  <rect x="20" y="296" width="452" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="296" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="314" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="322" x2="472" y2="322" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="313.5" font-size="10.6" font-weight="700" fill="#1e3a8a">C · 端到端吞吐倍率与对应硬件/基线条件 (§8.2, Fig. 9–10)</text>

  <text x="216" y="347" text-anchor="end" font-size="8.3" font-weight="600" fill="#0f172a">vs KT (2×4090D · 无AMX 用AVX2)</text>
  <rect x="224" y="337" width="152" height="12" rx="2" fill="#1e3a8a"/>
  <text x="382" y="347" font-size="8.7" font-weight="700" fill="#1e3a8a">19.03× 吞吐</text>

  <text x="216" y="375" text-anchor="end" font-size="8.3" font-weight="600" fill="#0f172a">vs llama.cpp (1×5090 单卡)</text>
  <rect x="224" y="365" width="102" height="12" rx="2" fill="#1d4ed8"/>
  <text x="332" y="375" font-size="8.4" font-weight="700" fill="#1d4ed8">12.7× (-90.5–99.7% TTFT)</text>

  <text x="216" y="403" text-anchor="end" font-size="8.3" font-weight="600" fill="#0f172a">vs Fate (固定专家缓存边界)</text>
  <rect x="224" y="393" width="91" height="12" rx="2" fill="#2563eb"/>
  <text x="321" y="403" font-size="8.4" font-weight="700" fill="#2563eb">11.34× 吞吐</text>

  <text x="216" y="431" text-anchor="end" font-size="8.3" font-weight="600" fill="#0f172a">vs SGLang/vLLM (紧VRAM 5090)</text>
  <rect x="224" y="421" width="23" height="12" rx="2" fill="#0284c7"/>
  <text x="253" y="431" font-size="8.4" font-weight="700" fill="#0369a1">1.1×–2.88× (-63–99% TTFT)</text>

  <text x="216" y="459" text-anchor="end" font-size="8.3" font-weight="600" fill="#0f172a">vs KT (1×5090 · Xeon AMX)</text>
  <rect x="224" y="449" width="19" height="12" rx="2" fill="#0f766e"/>
  <text x="249" y="459" font-size="8.4" font-weight="700" fill="#0f766e">≤2.30× (Qwen3.5; Qwen3 KT延迟低)</text>

  <rect x="32" y="471" width="428" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="246" y="484.5" text-anchor="middle" font-size="8.0" fill="#475569">卸载基线平均 TTFT 降 98.1% · vLLM 在 Qwen3.5-122B(8×5090) Triton GDN 自动调优期 OOM</text>

  <!-- Card D: Bottom-Right (Explicit Boundaries) -->
  <rect x="488" y="296" width="452" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="296" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="314" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="322" x2="940" y2="322" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="313.5" font-size="10.6" font-weight="700" fill="#1e3a8a">D · 四项实证边界与基线约束 (§8.1–§8.5)</text>

  <rect x="500" y="330" width="428" height="36" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="509" y="344" font-size="8.5" font-weight="700" fill="#b45309">1. 吞吐换 TPOT 权衡 (Fig. 10)：以高并发压低排队 TTFT (-63–99%)</text>
  <text x="509" y="359" font-size="7.9" fill="#78350f">但按需 PCIe 传输推高解码 TPOT (~200–250 ms vs 常驻 &lt;90 ms)，轻载约减半</text>

  <rect x="500" y="371" width="428" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="509" y="385" font-size="8.5" font-weight="700" fill="#991b1b">2. 19.03× 极值受限于无 AMX 基线 (§8.2)：非跨硬件普遍倍速</text>
  <text x="509" y="400" font-size="7.9" fill="#7f1d1d">4090D Xeon 8368Q 缺 AMX 使 KT 退回 AVX2；有 AMX 时 KT 在 Qwen3 延迟更低</text>

  <rect x="500" y="412" width="428" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="509" y="426" font-size="8.5" font-weight="700" fill="#1e3a8a">3. 手动 EOL 与静态离线热集 (§6, Fig. 13)：需匹配内存与路由</text>
  <text x="509" y="441" font-size="7.9" fill="#1e293b">EOL 过小退化为 Fate，过大突发恢复慢；{H_l, p_l} 不随线上流量漂移自更新</text>

  <rect x="500" y="453" width="428" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="509" y="467" font-size="8.5" font-weight="700" fill="#334155">4. CUDA Graph 关闭与范围局限 (§8.1–§8.2)：未测开图端到端对比</text>
  <text x="509" y="482" font-size="7.9" fill="#475569">全实验关 CUDA Graph、仅测 ShareGPT 与 Qwen3/3.5；继承 vLLM OOM 且无公开仓</text>

  <text x="20" y="521" font-size="8.8" fill="#64748b">注：Rimuru 在受限显存或无 AMX 环境下通过弹性扩缩 KV 与专家缓存边界赢得吞吐与排队 TTFT 优势；工程部署需按 PCIe 与目标 TPOT 校准 EOL。</text>
</svg>
