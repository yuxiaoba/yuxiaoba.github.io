  <text x="510" y="357" font-size="8.5" fill="#334155">L_pre(s,c), d(B,C), S(s,c), λ*=1/E[S], Lindley Wₖ₊₁ &amp; Algorithm 1</text>

  <rect x="500" y="374" width="428" height="46" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="510" y="390" font-size="9.4" font-weight="700" fill="#991b1b">2. Absent in v1 (Zero Numerical Calibration or Error Runs)</text>
  <text x="510" y="409" font-size="8.5" fill="#7f1d1d">No fitted (a..η), no named GPU benchmarks, no error vs. vLLM/Vidur</text>

  <rect x="500" y="426" width="428" height="62" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="510" y="442" font-size="9.4" font-weight="700" fill="#92400e">3. Modeling &amp; Closure Gaps Before Production Sizing</text>
  <text x="510" y="460" font-size="8.4" fill="#78350f">• Poisson understates bursts · FIFO lacks KV HBM eviction or P/D disagg.</text>
  <text x="510" y="477" font-size="8.4" fill="#78350f">• B-quadratic, d̄ &amp; chunk-TBT inflation equations omitted in v1 text</text>

  <text x="20" y="520" font-size="8.9" fill="#64748b">Note: Panels A–C depict qualitative analytical behavior from arXiv:2610.37989v1 §3–§4; v1 reports zero empirical data—independent calibration &amp; validation are required.</text>
