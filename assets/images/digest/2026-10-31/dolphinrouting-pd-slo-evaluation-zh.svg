    <text x="610" y="338" font-size="8.4" fill="#334155">离线聚簇用真实 L，线上改用 Clairvoyant 代理 L̂；</text>
    <text x="610" y="351" font-size="8.4" fill="#475569">未测 L̂ 误判误差消融、类别映射细节及漂移重训机制。</text>

