  <text x="30" y="199" font-size="8.8" font-weight="700" fill="#0f172a">1. Prefill CPU 争用放大 PCIe 延迟，AsyncIO 逆转 (PCIe 4.0×16, Table 1 &amp; 3)：</text>
  <text x="38" y="215" font-size="8.4" fill="#334155">DeepSeek 1.95→2.78ms (+43%)→AsyncIO 0.76ms · Mixtral 33.5→51.1ms→13.98ms</text>
  <text x="30" y="236" font-size="8.8" font-weight="700" fill="#0f172a">2. Decode 低并行无法掩蔽动态调度与缓存税 (Table 2, 单专家单 token)：</text>
  <text x="38" y="252" font-size="8.4" fill="#334155">Mixtral Intel CPU 算 2.88 vs 总耗时 4.25ms (+48%) · Qwen 3090 算 0.13 vs 0.24ms</text>
  <text x="38" y="268" font-size="8.2" fill="#1d4ed8" font-weight="600">→ 任何动态轮询开销直接暴露于 Decode 关键路径，必须靠静态图消除</text>

