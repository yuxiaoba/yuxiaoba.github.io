<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="PDScope phase-aware architecture diagram: offline profiling, PhasePer predictor, AdaptSched cross-layer scheduler, static graph, and zero-copy AsyncIO engine" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'Noto Sans', 'DejaVu Sans', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="33" font-size="16.2" font-weight="700" fill="#0f172a">PDScope Phase-Aware Architecture: PhasePer, AdaptSched &amp; Zero-Copy Pipeline</text>
  <text x="22" y="52" font-size="9.8" fill="#475569">arXiv:2610.39216v1 (§4, Figs. 6–8, Alg. 1) · Decoupling Prefill (compute-bound, aggressive load) &amp; Decode (I/O-bound, conservative transfer)</text>
  <line x1="22" y1="61" x2="938" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: Stage 1 Offline Profiling -->
  <rect x="20" y="70" width="256" height="420" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="70" width="256" height="26" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="88" width="256" height="8" fill="#1e3a8a"/>
  <text x="30" y="87" font-size="10.2" font-weight="700" fill="#ffffff">Stage 1 · Offline Profiling (&lt;30 min)</text>

  <rect x="28" y="104" width="240" height="110" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="111" width="52" height="17" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="62" y="123" text-anchor="middle" font-size="8.8" font-weight="700" fill="#334155">TRACE</text>
  <text x="95" y="123.5" font-size="10.1" font-weight="700" fill="#0f172a">Phase-Split Trace Capture</text>
  <text x="36" y="144" font-size="9.0" fill="#334155">• 128 ShareGPT batches (4096 in, 512 out)</text>
  <text x="36" y="162" font-size="9.0" fill="#334155">• Isolate (a, w_i, e_i) traces per phase</text>
  <text x="36" y="180" font-size="9.0" fill="#334155">• Cosine inflection splits layer groups:</text>
  <text x="36" y="198" font-size="8.9" fill="#475569">  Input / Middle / Output groups (§3.1)</text>

  <line x1="148" y1="214" x2="148" y2="227" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="28" y="229" width="240" height="116" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="36" y="236" width="52" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="62" y="248" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">COST</text>
  <text x="95" y="248.5" font-size="10.1" font-weight="700" fill="#1e3a8a">Hardware Cost Table</text>
  <text x="36" y="269" font-size="9.0" fill="#1e293b">• Maps token count → CPU time t_c(·)</text>
  <text x="36" y="287" font-size="9.0" fill="#1e293b">• Calibrates GPU t_g &amp; attention t_attn</text>
  <text x="36" y="305" font-size="9.0" fill="#1e293b">• Profiles PCIe setup α &amp; transfer t_io</text>
  <text x="36" y="323" font-size="8.9" fill="#334155">• Adapts across A100/3090/V100 nodes</text>

  <line x1="148" y1="345" x2="148" y2="358" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="28" y="360" width="240" height="118" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="36" y="367" width="52" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="62" y="379" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">CACHE</text>
  <text x="95" y="379.5" font-size="10.1" font-weight="700" fill="#1e3a8a">Static Hot-Expert Table</text>
  <text x="36" y="400" font-size="9.0" fill="#1e293b">• Preloads hot experts in 5.8–8.7GB VRAM</text>
  <text x="36" y="418" font-size="9.0" fill="#1e293b">• Amortizes cold-start I/O on hot hits</text>
  <text x="36" y="436" font-size="8.9" fill="#334155">• Tight-VRAM fallback (disable, §5.4):</text>
  <text x="36" y="454" font-size="8.9" font-weight="700" fill="#1d4ed8">  -1.8% prefill / -8.2% decode avg loss</text>

  <!-- Connectors Col 1 -> Col 2 -->
  <line x1="276" y1="158" x2="294" y2="158" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <line x1="276" y1="288" x2="294" y2="355" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Column 2 Top: Stage 2 PhasePer -->
  <rect x="296" y="70" width="346" height="172" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="296" y="70" width="346" height="26" rx="9" fill="#1d4ed8"/>
  <rect x="296" y="88" width="346" height="8" fill="#1d4ed8"/>
  <text x="306" y="87" font-size="10.2" font-weight="700" fill="#ffffff">Stage 2 · PhasePer Activation Ranking Predictor (§4.2)</text>

  <rect x="304" y="102" width="162" height="82" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="312" y="117" font-size="9.1" font-weight="700" fill="#1e3a8a">Input/Output: Shallow Net</text>
  <text x="312" y="135" font-size="7.9" fill="#0f172a">P: L_expert(1/f_i) + λL_focal</text>
  <text x="312" y="151" font-size="7.9" fill="#0f172a">D: L_focal only (1 tok/step)</text>
  <text x="312" y="169" font-size="7.9" fill="#475569">Avoids overfitting skew &amp; noise</text>

  <rect x="472" y="102" width="162" height="82" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="480" y="117" font-size="9.1" font-weight="700" fill="#1e3a8a">Middle: Deep + Gated ResNet</text>
  <text x="480" y="135" font-size="8.2" fill="#0f172a">Residual block gated by hidden a</text>
  <text x="480" y="151" font-size="8.2" fill="#0f172a">Standard BCE for both phases</text>
  <text x="480" y="169" font-size="8.1" fill="#475569">Exploits high inter-layer similarity</text>

  <rect x="304" y="190" width="330" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="312" y="206" font-size="8.5" fill="#0f172a">Online FT: 16-tok error &gt;25% triggers 2.1ms update (128P+32D)</text>
  <text x="312" y="223" font-size="8.4" font-weight="700" fill="#1d4ed8">Interval &gt;500P / &gt;1000D steps · Top-6(±2) 90–100% · 0.12–0.48ms</text>

  <!-- Arrow PhasePer -> AdaptSched -->
  <line x1="469" y1="242" x2="469" y2="254" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Column 2 Bottom: Stage 3 AdaptSched -->
  <rect x="296" y="256" width="346" height="234" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="296" y="256" width="346" height="26" rx="9" fill="#1e3a8a"/>
  <rect x="296" y="274" width="346" height="8" fill="#1e3a8a"/>
  <text x="306" y="273" font-size="10.2" font-weight="700" fill="#ffffff">Stage 3 · AdaptSched Cross-Layer Scheduler (Alg. 1)</text>

  <rect x="304" y="288" width="330" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="312" y="302.5" font-size="8.3" fill="#334155">Premises: Token-ascending sort · Monotonic load · Serial I/O (avoids congestion)</text>

  <!-- Prefill Sub-panel -->
  <rect x="304" y="316" width="162" height="166" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="312" y="332" font-size="9.3" font-weight="700" fill="#1e3a8a">Prefill · Aggressive (3-Step)</text>
  <text x="312" y="350" font-size="8.3" font-weight="700" fill="#0f172a">1. Global queue E_all</text>
  <text x="312" y="365" font-size="8.1" fill="#334155">   Compare T_all^G &lt; T_all^C</text>
  <text x="312" y="384" font-size="8.3" font-weight="700" fill="#0f172a">2. Local re-eval (error guard)</text>
  <text x="312" y="399" font-size="8.1" fill="#334155">   True E_cur sets L_on (≤1 RTT)</text>
  <text x="312" y="418" font-size="8.3" font-weight="700" fill="#0f172a">3. Confidence prefetch L_pre</text>
  <text x="312" y="433" font-size="8.1" fill="#334155">   T_gap+t_attn budget; ξ&gt;0 edge</text>
  <rect x="311" y="447" width="148" height="26" rx="4" fill="#dbeafe"/>
  <text x="385" y="463.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">Ends underfetch; keeps GPU full</text>

  <!-- Decode Sub-panel -->
  <rect x="472" y="316" width="162" height="166" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="480" y="332" font-size="9.3" font-weight="700" fill="#92400e">Decode · Conservative (4-Mode)</text>
  <text x="480" y="349" font-size="7.6" font-weight="600" fill="#78350f">n_c=argmin max((k-n_c)t_g, n_c t_c)</text>
  <text x="480" y="368" font-size="8.2" fill="#0f172a">• Mode a (Load): Eq.(5) min lat.</text>
  <text x="480" y="387" font-size="8.2" fill="#0f172a">• Mode b (Prefetch): Eq.(6) guard</text>
  <text x="480" y="406" font-size="8.2" fill="#0f172a">• Mode c (Unload): zero I/O cost</text>
  <text x="480" y="425" font-size="8.2" fill="#0f172a">• Mode d (Cross-layer): batching</text>
  <rect x="479" y="447" width="148" height="26" rx="4" fill="#fef3c7"/>
  <text x="553" y="463.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b45309">Ends I/O bubbles; Mode d batches</text>

  <!-- Connectors Col 2 -> Col 3 -->
  <line x1="642" y1="156" x2="656" y2="156" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <line x1="642" y1="382" x2="656" y2="382" stroke="#0f766e" stroke-width="1.7" marker-end="url(#arr-teal)"/>

  <!-- Column 3: Stage 4 Static Graph & Zero-Copy Engine -->
  <rect x="658" y="70" width="282" height="420" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="658" y="70" width="282" height="26" rx="9" fill="#0f766e"/>
  <rect x="658" y="88" width="282" height="8" fill="#0f766e"/>
  <text x="668" y="87" font-size="10.2" font-weight="700" fill="#ffffff">Stage 4 · Static Graph &amp; Zero-Copy AsyncIO</text>

  <rect x="666" y="104" width="266" height="174" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.1"/>
  <rect x="674" y="111" width="76" height="17" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="0.8"/>
  <text x="712" y="123" text-anchor="middle" font-size="8.6" font-weight="700" fill="#065f46">STATIC GRAPH</text>
  <text x="756" y="123.5" font-size="9.8" font-weight="700" fill="#065f46">Two-Phase Compilation (§4.4.1)</text>

  <text x="674" y="146" font-size="8.7" font-weight="700" fill="#065f46">1. Pre-compile (during layer l-1)</text>
  <text x="674" y="162" font-size="8.4" fill="#334155">   Draft graph for confident hot/cold experts</text>
  <text x="674" y="182" font-size="8.7" font-weight="700" fill="#065f46">2. Recompile (once layer l Gate resolves)</text>
  <text x="674" y="198" font-size="8.4" fill="#334155">   Overwrite draft using true routing (exact)</text>
  <text x="674" y="218" font-size="8.7" font-weight="700" fill="#065f46">3. Micro-execution &amp; overlap (§5.6)</text>
  <text x="674" y="234" font-size="8.4" fill="#334155">   CPU LLC prefetch + batched GPU kernel launch</text>
  <text x="674" y="254" font-size="8.4" font-weight="700" fill="#0f766e">   8.1ms Sort hidden in 12 GPU + 4 CPU experts</text>

  <line x1="799" y1="278" x2="799" y2="291" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <rect x="666" y="293" width="266" height="185" rx="7" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="674" y="300" width="76" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="712" y="312" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">ZERO-COPY</text>
  <text x="756" y="312.5" font-size="9.8" font-weight="700" fill="#1e3a8a">AsyncIO Pipelined Engine (§4.4.2)</text>

  <text x="674" y="335" font-size="8.6" fill="#0f172a">• Pre-registers two GPU expert buffer pools:</text>
  <rect x="676" y="344" width="118" height="35" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="735" y="358" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">Ping-Pong Buffer</text>
  <text x="735" y="372" text-anchor="middle" font-size="7.9" fill="#334155">Layer l on-demand load</text>

  <rect x="804" y="344" width="118" height="35" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.9"/>
  <text x="863" y="358" text-anchor="middle" font-size="8.3" font-weight="700" fill="#0f766e">Prefetch Buffers</text>
  <text x="863" y="372" text-anchor="middle" font-size="7.9" fill="#334155">Layer l+1 conflict-free</text>

  <text x="674" y="398" font-size="8.6" fill="#0f172a">• 3 independent CUDA streams copy matrices:</text>
  <text x="674" y="414" font-size="8.3" font-weight="600" fill="#1d4ed8">  gate_proj / up_proj / down_proj (Pinned Mem)</text>

  <rect x="676" y="427" width="246" height="41" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="684" y="443" font-size="8.5" font-weight="700" fill="#065f46">Achieves 66%–80% PCIe BW utilization (Table 3)</text>
  <text x="684" y="459" font-size="8.2" fill="#334155">DeepSeek 2.78→0.76ms · Mixtral 51.1→13.98ms</text>

  <!-- Legend & Footnote -->
  <rect x="20" y="501" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="510" font-size="8.9" fill="#334155">Blue: Offline profile / Prefill aggressive</text>
  <rect x="248" y="501" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="265" y="510" font-size="8.9" fill="#334155">Amber: Decode conservative I/O &amp; guards</text>
  <rect x="488" y="501" width="12" height="10" rx="2" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="505" y="510" font-size="8.9" fill="#334155">Teal: Static-graph recompile &amp; AsyncIO</text>
  <text x="20" y="527" font-size="8.8" fill="#64748b">Note: Multi-batch (§5.3, §8.6) uses chunk=256 phase-consolidated batching (Decode Mode d); distributed P/D overlap is unsupported (§6).</text>
</svg>