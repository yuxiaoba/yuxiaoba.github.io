  <text x="32" y="87.5" font-size="10.4" font-weight="700" fill="#1e3a8a">A. Seesaw Root Cause: Phase Bottleneck Flip &amp; Runtime Tax (Fig. 3, Tables 1–2)</text>

  <rect x="30" y="103" width="10" height="8" rx="1.5" fill="#1d4ed8"/>
  <text x="44" y="110.5" font-size="8.2" fill="#334155">CPU Compute</text>
  <rect x="116" y="103" width="10" height="8" rx="1.5" fill="#d97706"/>
  <text x="130" y="110.5" font-size="8.2" fill="#334155">PCIe Transfer</text>
  <rect x="204" y="103" width="10" height="8" rx="1.5" fill="#0f766e"/>
  <text x="218" y="110.5" font-size="8.2" fill="#334155">GPU Compute</text>
  <text x="292" y="110.5" font-size="8.0" fill="#64748b">(HybriMoE Mixtral @ A100 share)</text>

  <text x="30" y="128" font-size="8.6" font-weight="700" fill="#0f172a">Prefill (1024t)</text>
  <rect x="132" y="118" width="159" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="292" y="118" width="144" height="12" rx="2" fill="#d97706"/>
  <rect x="437" y="118" width="19" height="12" rx="2" fill="#0f766e"/>
  <text x="132" y="143" font-size="8.0" fill="#334155">CPU 2,557ms (49.5%) · PCIe 2,321ms (44.9%) · GPU 292ms (5.6%)</text>

  <text x="30" y="160" font-size="8.6" font-weight="700" fill="#0f172a">Decode (1 tok)</text>
  <rect x="132" y="150" width="257" height="12" rx="2" fill="#d97706"/>
  <rect x="390" y="150" width="47" height="12" rx="2" fill="#1d4ed8"/>
  <rect x="438" y="150" width="18" height="12" rx="2" fill="#0f766e"/>
  <text x="132" y="175" font-size="8.0" fill="#b45309" font-weight="600">PCIe 1,449ms (79.5% bottleneck) · CPU 264ms (14.5%) · GPU 109ms (6.0%)</text>

  <line x1="30" y1="184" x2="462" y2="184" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="199" font-size="8.6" font-weight="700" fill="#0f172a">1. Prefill CPU contention inflates PCIe; AsyncIO reverses it (4.0×16, Tables 1 &amp; 3):</text>
  <text x="38" y="215" font-size="8.2" fill="#334155">DeepSeek 1.95→2.78ms (+43%)→AsyncIO 0.76ms · Mixtral 33.5→51.1ms→13.98ms</text>
  <text x="30" y="236" font-size="8.6" font-weight="700" fill="#0f172a">2. Low decode parallelism exposes runtime overhead (Table 2, 1 expert / 1 tok):</text>
  <text x="38" y="252" font-size="8.2" fill="#334155">Mixtral Intel CPU 2.88 vs 4.25ms runtime (+48%) · Qwen RTX 3090 0.13 vs 0.24ms</text>
  <text x="38" y="268" font-size="8.1" fill="#1d4ed8" font-weight="600">→ Dynamic polling hits critical path; static graphs eliminate per-expert checks</text>

