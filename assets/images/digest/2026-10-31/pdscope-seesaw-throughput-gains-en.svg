<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="PDScope empirical evidence chart: breaking the prefill-decode seesaw, 291B multi-batch scaling, and incremental ablation gains" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'Noto Sans', 'DejaVu Sans', sans-serif;">
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="33" font-size="16.2" font-weight="700" fill="#0f172a">Empirical Evidence: Breaking the Seesaw, 291B Scaling &amp; Ablations (§5)</text>
  <text x="22" y="52" font-size="9.8" fill="#475569">From arXiv:2610.39216v1 (§2.2 Fig. 3, §3.3 Tables 1–2, §5.2–5.5 Figs. 9–13 &amp; Table 5) · 24 GB VRAM cap, 10-run averages</text>
  <line x1="22" y1="61" x2="938" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A: Top-Left -->
  <rect x="20" y="70" width="452" height="208" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
