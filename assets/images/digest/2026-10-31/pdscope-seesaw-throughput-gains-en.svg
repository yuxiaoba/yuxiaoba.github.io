  <text x="20" y="518" font-size="8.7" fill="#64748b">Note: Prefill (2.5–10.3×) and Decode (2.1–6.1×) are peak phase-isolated ratios across distinct baselines and cannot be multiplied; request latency depends on L_in/L_out, PCIe &amp; CPU.</text>
