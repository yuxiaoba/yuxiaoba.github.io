  <text x="32" y="307.5" font-size="10.4" font-weight="700" fill="#1e3a8a">C. 291B DeepSeek-V4-Flash Scaling: Single vs. Multi-Batch (§5.3)</text>

  <text x="30" y="332" font-size="8.3" fill="#475569">A100 (24GB VRAM + 512GB DRAM) · INT8 291B · Multi-batch uses chunk=256 prefill</text>

  <rect x="30" y="341" width="212" height="104" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="40" y="357" font-size="9.1" font-weight="700" fill="#1e3a8a">Single-Batch (bs = 1)</text>
  <text x="40" y="375" font-size="8.4" font-weight="700" fill="#1d4ed8">Prefill Speedup:</text>
  <text x="40" y="390" font-size="8.2" fill="#0f172a">vs Fate 2.82× · Fiddler 3.06×</text>
  <text x="40" y="405" font-size="8.2" fill="#0f172a">vs HybriMoE 2.69× · APEX 5.03×</text>
  <text x="40" y="423" font-size="8.4" font-weight="700" fill="#0f766e">Decode Speedup:</text>
  <text x="40" y="438" font-size="8.2" fill="#0f172a">1.35× / 1.90× / 1.26× / 1.97×</text>

  <rect x="250" y="341" width="212" height="104" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="260" y="357" font-size="9.1" font-weight="700" fill="#1e3a8a">Multi-Batch (bs = 32, chunk = 256)</text>
  <text x="260" y="375" font-size="8.4" font-weight="700" fill="#1d4ed8">Prefill Speedup:</text>
  <text x="260" y="390" font-size="8.2" fill="#0f172a">vs Fate 2.42× · Fiddler 2.61×</text>
  <text x="260" y="405" font-size="8.2" fill="#0f172a">vs HybriMoE 2.35× · APEX 5.37×</text>
  <text x="260" y="423" font-size="8.4" font-weight="700" fill="#0f766e">Decode Speedup (Mode d):</text>
  <text x="260" y="438" font-size="8.2" fill="#0f172a">3.16× / 3.17× / 3.14× / 5.65×</text>

  <rect x="30" y="452" width="432" height="36" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="38" y="466" font-size="8.1" fill="#78350f">• KTransformers lacks 291B support; MoE-APEX exceeds 512GB DRAM so pinned I/O is disabled</text>
  <text x="38" y="481" font-size="8.1" fill="#78350f">• bs=16→32 adds just +5.2% (2k) / +0.7% (4k) prefill on PDScope (bs=16 saturates node)</text>

