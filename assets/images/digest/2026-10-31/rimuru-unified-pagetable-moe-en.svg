  <text x="350" y="320" font-size="8.7" font-weight="700" fill="#1d4ed8">On-Demand Split</text>
  <text x="350" y="336" font-size="8.0" fill="#334155">• No direct L1→L3</text>
  <text x="350" y="351" font-size="8.0" fill="#334155">• Reuse L3/L2 first</text>
  <text x="350" y="366" font-size="8.0" fill="#334155">• Pin req to 1 L2</text>

  <rect x="342" y="378" width="112" height="68" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="0.9"/>
  <text x="350" y="394" font-size="8.7" font-weight="700" fill="#0f766e">Reverse Merge</text>
  <text x="350" y="410" font-size="8.0" fill="#334155">• All sub-pages free</text>
  <text x="350" y="425" font-size="8.0" fill="#334155">  restores parent L2</text>
  <text x="350" y="440" font-size="8.0" fill="#334155">• No stranded space</text>

  <text x="40" y="466" font-size="8.2" fill="#475569">If P_s divides P_e (P_h = P_e), SSM allocates as expert sub-pages; fragment ≤ 1 L3 tail.</text>

