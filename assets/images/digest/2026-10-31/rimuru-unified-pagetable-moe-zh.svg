  <text x="350" y="320" font-size="8.8" font-weight="700" fill="#1d4ed8">按需分裂约束</text>
  <text x="350" y="336" font-size="8.1" fill="#334155">• 禁 L1 直接拆 L3</text>
  <text x="350" y="351" font-size="8.1" fill="#334155">• 先复用空闲 L3/L2</text>
  <text x="350" y="366" font-size="8.1" fill="#334155">• 同请求集中同 L2</text>

  <rect x="342" y="378" width="112" height="68" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="0.9"/>
  <text x="350" y="394" font-size="8.8" font-weight="700" fill="#0f766e">全释放逆向合并</text>
  <text x="350" y="410" font-size="8.1" fill="#334155">• 子页全空才合回</text>
  <text x="350" y="425" font-size="8.1" fill="#334155">• 无跨类型死锁余量</text>
  <text x="350" y="440" font-size="8.1" fill="#334155">• 碎片仅限 L3 尾页</text>

  <text x="40" y="466" font-size="8.4" fill="#475569">若 P_s 整除 P_e，则 P_h = P_e 且 SSM 作专家子页调度；碎片仅限 L3 尾页。</text>

