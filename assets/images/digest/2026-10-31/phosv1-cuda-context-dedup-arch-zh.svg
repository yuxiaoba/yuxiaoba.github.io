<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="PhOSv1 GPU 上下文去重架构图：对比原生 vLLM Sleep 每模型私有 GPU 上下文导致的线性显存税，以及 PhOSv1 通过集中式 Daemon 与 LD_PRELOAD API 远程转发实现 CUDA 上下文共享、Kernel 去重和 GPU Buffer 延迟重建" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.5" font-weight="700" fill="#0f172a">PhOSv1 架构：集中式 CUDA 上下文去重与按需缓冲区重建</text>
  <text x="24" y="53" font-size="10.2" fill="#475569">整理自 arXiv:2610.39999v1（§2–§3, Fig. 2 &amp; Fig. 6）· 10,825 行 Rust 实现，经 LD_PRELOAD 透明接入 vLLM v0.19.1</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Column: Vanilla Sleep Baseline -->
  <rect x="20" y="72" width="304" height="418" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="72" width="304" height="28" rx="9" fill="#334155"/>
  <rect x="20" y="92" width="304" height="8" fill="#334155"/>
  <text x="32" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">对照：原生 vLLM Sleep（每模型私有上下文）</text>

  <!-- Sleeping Process A -->
  <rect x="30" y="109" width="284" height="72" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="116" width="68" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="72" y="128.5" text-anchor="middle" font-size="9.0" font-weight="700" fill="#334155">休眠进程 A</text>
  <text x="114" y="129" font-size="10.4" font-weight="700" fill="#0f172a">vLLM（Qwen 2.5）</text>
  <text x="38" y="150" font-size="9.1" fill="#334155">主机内存：CPU 上下文 (~2.9 GB) + 模型权重</text>
  <rect x="38" y="158" width="268" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="46" y="170.5" font-size="8.8" font-weight="600" fill="#991b1b">私有 GPU：CUDA ctx + Kernels + Buffers</text>

  <!-- Sleeping Process B -->
  <rect x="30" y="189" width="284" height="72" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="196" width="68" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="72" y="208.5" text-anchor="middle" font-size="9.0" font-weight="700" fill="#334155">休眠进程 B</text>
  <text x="114" y="209" font-size="10.4" font-weight="700" fill="#0f172a">vLLM（Qwen 3.5）</text>
  <text x="38" y="230" font-size="9.1" fill="#334155">主机内存：独立进程 CPU 状态 + 权重副本</text>
  <rect x="38" y="238" width="268" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="46" y="250.5" font-size="8.8" font-weight="600" fill="#991b1b">私有 GPU：重复 Driver ctx + 59–99% 重叠核</text>

  <!-- Sleeping Process N -->
  <rect x="30" y="269" width="284" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="172" y="286.5" text-anchor="middle" font-size="9.3" font-weight="700" fill="#475569">… 第 3 至第 24 个预热休眠引擎（线性复制）</text>
  <text x="172" y="302" text-anchor="middle" font-size="8.8" fill="#991b1b">各自锁死独立 GPU 上下文（不含权重）</text>

  <line x1="92" y1="311" x2="92" y2="328" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="172" y1="311" x2="172" y2="328" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="252" y1="311" x2="252" y2="328" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Baseline HBM impact -->
  <rect x="30" y="331" width="284" height="148" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.1"/>
  <text x="40" y="349" font-size="10.2" font-weight="700" fill="#991b1b">80 GB HBM：线性显存税挤压 KV Cache</text>
  <rect x="40" y="360" width="90" height="22" rx="3" fill="#ef4444"/>
  <text x="85" y="374.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">~27 GB (34%)</text>
  <rect x="132" y="360" width="84" height="22" rx="3" fill="#94a3b8"/>
  <text x="174" y="374.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">活跃模型权重</text>
  <rect x="218" y="360" width="86" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="261" y="374.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e3a8a">受挤压 KV</text>

  <text x="40" y="401" font-size="9.0" fill="#334155">• 23 个模型睡眠占用 25.67 GiB（24 个 ~27 GB）</text>
  <text x="40" y="420" font-size="9.0" font-weight="700" fill="#991b1b">• 占用达 16 GiB 时吞吐骤降 54%</text>
  <text x="40" y="437" font-size="8.8" fill="#475569">  （Qwen3.6-27B：747 → 341 tokens/s）</text>
  <text x="40" y="458" font-size="8.8" fill="#475569">• 若限 6 GB 睡眠缓存预算，未命中即触发冷启动</text>
  <text x="40" y="472" font-size="8.8" fill="#475569">  （平均 24.41 s）并导致请求长期排队</text>

  <!-- Right Column: PhOSv1 Architecture -->
  <rect x="340" y="72" width="600" height="418" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="340" y="72" width="600" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="340" y="92" width="600" height="8" fill="#1d4ed8"/>
  <text x="352" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">PhOSv1：集中式 Context Service + LD_PRELOAD 透明 API 远程转发</text>

  <!-- Row 1: vLLM processes -->
  <rect x="352" y="109" width="184" height="86" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="362" y="126" font-size="9.8" font-weight="700" fill="#0f172a">vLLM 进程 A（Qwen 2.5）</text>
  <text x="362" y="143" font-size="8.7" fill="#334155">• 已暂停（cgroup freezer）</text>
  <text x="362" y="159" font-size="8.7" fill="#334155">• 权重与 Buffer 存于主机内存</text>
  <rect x="362" y="168" width="164" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="444" y="180.5" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1d4ed8">LD_PRELOAD 拦截 CUDA API</text>

  <rect x="548" y="109" width="184" height="86" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="558" y="126" font-size="9.8" font-weight="700" fill="#0f172a">vLLM 进程 B（Qwen 3.5）</text>
  <text x="558" y="143" font-size="8.7" fill="#334155">• 睡眠期无私有 GPU 占用</text>
  <text x="558" y="159" font-size="8.7" fill="#334155">• 不改动引擎源码即可透明接入</text>
  <rect x="558" y="168" width="164" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="640" y="180.5" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1d4ed8">LD_PRELOAD 拦截 CUDA API</text>

  <rect x="744" y="109" width="184" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="754" y="126" font-size="9.8" font-weight="700" fill="#1e3a8a">vLLM 进程 C（唤醒服务中）</text>
  <text x="754" y="143" font-size="8.7" fill="#1e293b">• 每张卡同时至多唤醒 1 个模型</text>
  <text x="754" y="159" font-size="8.7" fill="#1e293b">• 连接守护进程平均仅 72 ms</text>
  <rect x="754" y="168" width="164" height="19" rx="4" fill="#1d4ed8"/>
  <text x="836" y="180.5" text-anchor="middle" font-size="8.4" font-weight="700" fill="#ffffff">批处理/同步优化转发 Kernel</text>

  <!-- Arrows to Context Service -->
  <line x1="444" y1="195" x2="444" y2="215" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="195" x2="640" y2="215" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="836" y1="195" x2="836" y2="215" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Row 2: Central Context Service Daemon -->
  <rect x="352" y="218" width="576" height="154" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="364" y="236" font-size="10.2" font-weight="700" fill="#1e3a8a">每台服务器后台 Context Service Daemon（按每块物理 GPU 独立托管上下文）</text>

  <!-- Sub-card 1: CUDA Context -->
  <rect x="362" y="245" width="178" height="118" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="370" y="252" width="66" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="403" y="263.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">100% 共享</text>
  <text x="442" y="264" font-size="9.6" font-weight="700" fill="#1e3a8a">CUDA 上下文</text>
  <text x="370" y="286" font-size="8.6" fill="#1e293b">• 同卡全部模型复用单一</text>
  <text x="370" y="302" font-size="8.6" fill="#1e293b">  Driver Primary Context</text>
  <text x="370" y="320" font-size="8.6" fill="#334155">• 省去每模型 ~430 ms 构建</text>
  <text x="370" y="336" font-size="8.6" fill="#334155">• 多卡间独立上下文不阻塞</text>
  <text x="370" y="352" font-size="8.4" font-weight="600" fill="#1d4ed8">• 无需改 NVIDIA 闭源驱动</text>

  <!-- Sub-card 2: Kernel Deduplication -->
  <rect x="551" y="245" width="178" height="118" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="559" y="252" width="72" height="17" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="595" y="263.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065f46">重叠 59–99%</text>
  <text x="637" y="264" font-size="9.6" font-weight="700" fill="#065f46">Kernel 去重表</text>
  <text x="559" y="286" font-size="8.6" fill="#1e293b">• 编码 CUDA API 语义查表</text>
  <text x="559" y="302" font-size="8.6" fill="#1e293b">  （如 cuModuleLoadData）</text>
  <text x="559" y="320" font-size="8.6" fill="#334155">• 命中已加载算子核即跳过</text>
  <text x="559" y="336" font-size="8.6" fill="#334155">  （FlashInfer / cuBLAS）</text>
  <text x="559" y="352" font-size="8.4" font-weight="600" fill="#0f766e">• 独立记录模型专属定制核</text>

  <!-- Sub-card 3: Lazy GPU Buffers + LFU -->
  <rect x="740" y="245" width="178" height="118" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="748" y="252" width="70" height="17" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="783" y="263.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">按需 ~30 ms</text>
  <text x="824" y="264" font-size="9.6" font-weight="700" fill="#92400e">Buffer 延迟建</text>
  <text x="748" y="286" font-size="8.6" fill="#1e293b">• 睡眠期仅留虚拟占位符</text>
  <text x="748" y="302" font-size="8.6" fill="#1e293b">  数据内容存主机 DRAM</text>
  <text x="748" y="320" font-size="8.6" fill="#334155">• 唤醒调用核前按需恢复</text>
  <text x="748" y="336" font-size="8.6" fill="#334155">  （释放大块非共享占存）</text>
  <text x="748" y="352" font-size="8.4" font-weight="600" fill="#b45309">• 超睡眠缓存上限 LFU 驱逐</text>

  <!-- Arrow to Physical GPU -->
  <line x1="640" y1="372" x2="640" y2="390" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Row 3: Physical GPU HBM -->
  <rect x="352" y="393" width="576" height="86" rx="7" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="364" y="410" font-size="10.0" font-weight="700" fill="#0f172a">物理 GPU HBM（80 GB A800）· PhOSv1 共享上下文后显存分布</text>

  <rect x="364" y="418" width="112" height="27" rx="3" fill="#1d4ed8"/>
  <text x="420" y="434.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">0.49 GiB (-98.1%)</text>
  <rect x="479" y="418" width="136" height="27" rx="3" fill="#94a3b8"/>
  <text x="547" y="434.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">活跃模型权重（单活）</text>
  <rect x="618" y="418" width="298" height="27" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="767" y="434.5" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1e3a8a">充裕 KV Cache（均值 TTFT -87.0% · 吞吐 ≥97.3%）</text>

  <text x="364" y="466" font-size="8.9" fill="#334155">实测效果：23 模型睡眠总上下文 25.67 GiB → 0.49 GiB；10 模型 Trace 全部保持睡眠，消除冷启动与队列堵塞</text>

  <!-- Legend & Scope Boundary -->
  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="511" font-size="9.0" fill="#334155">蓝框：PhOSv1 去重共享路径</text>
  <rect x="184" y="502" width="12" height="10" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="201" y="511" font-size="9.0" fill="#334155">红框：原生线性 GPU 上下文税</text>
  <rect x="358" y="502" width="12" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="375" y="511" font-size="9.0" fill="#334155">琥珀：不可去重 Buffer 延迟重建与 LFU</text>
  <text x="20" y="527" font-size="8.9" fill="#64748b">范围边界：假定同服务商下共享模型互信（不跨不可信租户隔离）；每卡单活执行；暂不支持 CUDA Graph（§5）；评测基于单张 A800。</text>
</svg>
