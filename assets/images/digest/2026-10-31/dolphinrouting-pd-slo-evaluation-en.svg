    <text x="610" y="392" font-size="8.3" fill="#475569">raw ms and per-method max req/s omitted outside Hybrid sweeps.</text>

    <rect x="498" y="405" width="432" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="505" y="413" width="96" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="553" y="426" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Dynamo Baseline</text>
    <text x="610" y="420" font-size="8.3" fill="#334155">Tests only Dynamo's length+ratio rule (thresholds unprinted);</text>
    <text x="610" y="433" font-size="8.3" fill="#475569">§4.4 explicitly omits Dynamo's load-based policies.</text>

    <rect x="498" y="446" width="432" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="505" y="454" width="96" height="19" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
