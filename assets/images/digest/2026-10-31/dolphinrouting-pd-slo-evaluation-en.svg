    <text x="610" y="338" font-size="8.3" fill="#334155">Offline clusters use true L; online uses Clairvoyant proxy L̂;</text>
    <text x="610" y="351" font-size="8.3" fill="#475569">no L̂-error ablation, class-cutoff spec, or drift loop tested.</text>

    <rect x="498" y="364" width="432" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="505" y="372" width="96" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
