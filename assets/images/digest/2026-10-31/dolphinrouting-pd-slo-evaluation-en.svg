    <text x="610" y="461" font-size="8.3" fill="#334155">Each table binds to a fixed P/D ratio (P3D1 or P2D2);</text>
    <text x="610" y="474" font-size="8.3" fill="#475569">evaluated solely on Qwen3.8-72B with no open-source repo.</text>

    <text x="20" y="518" font-size="8.7" fill="#64748b">Note: All figures average 3 runs; b_TTFT / b_TPOT are Naive P90 at 0.1 req/s, with SLO bounds B_TTFT = 10·b_TTFT and B_TPOT = 5·b_TPOT.</text>
