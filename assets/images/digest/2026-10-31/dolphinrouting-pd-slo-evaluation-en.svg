    <rect x="498" y="323" width="432" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <rect x="505" y="331" width="96" height="19" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
