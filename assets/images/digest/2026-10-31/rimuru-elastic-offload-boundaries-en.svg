<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Rimuru elastic adjuster control loop, throughput gains, ablation breakdown, and empirical baseline boundaries" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'Noto Sans', 'DejaVu Sans', sans-serif;">
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.4" font-weight="700" fill="#0f172a">Rimuru Elastic Adjuster Loop, Throughput–Latency Tradeoff &amp; Baseline Boundaries</text>
  <text x="24" y="51" font-size="10.0" fill="#475569">arXiv:2610.40305v1 (§2.3 Fig. 4, §6 Alg. 1, §8.2–§8.5 Fig. 9–13) · Hysteresis Control, Concurrency Gains &amp; Audit Caveats</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Card A: Top-Left (Adjuster Control & Safe Sync) -->
  <rect x="20" y="70" width="452" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="70" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="88" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="96" x2="472" y2="96" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="87.5" font-size="10.4" font-weight="700" fill="#1e3a8a">A · Workload-Aware Cache Adjuster &amp; Safe GPU Sync (§6, Alg. 1)</text>

  <rect x="32" y="103" width="428" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="246" y="118.5" text-anchor="middle" font-size="8.2" font-weight="600" fill="#334155">Post-scheduler reads F_b (free expert blocks) &amp; R_b (shortage) · Offline hotset {H_l, p_l}</text>

  <!-- 3 branches -->
  <rect x="32" y="133" width="144" height="95" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.0"/>
  <text x="40" y="149" font-size="8.6" font-weight="700" fill="#991b1b">Shrink (R_b &gt; 0 or F_b &lt; 2)</text>
  <text x="40" y="166" font-size="7.9" fill="#334155">• N = ⌈(R_b+1)/3⌉ or 1</text>
  <text x="40" y="181" font-size="7.9" fill="#334155">• GreedyShrink evicts</text>
  <text x="40" y="196" font-size="7.9" fill="#334155">  lowest p_l(e) tail experts</text>
  <text x="40" y="211" font-size="7.9" font-weight="600" fill="#991b1b">• Floor set by C_min (EOL)</text>

  <rect x="182" y="133" width="122" height="95" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
  <text x="243" y="149" text-anchor="middle" font-size="8.6" font-weight="700" fill="#334155">Deadband (2 ≤ F_b ≤ 9)</text>
  <text x="243" y="169" text-anchor="middle" font-size="7.9" fill="#475569">No cache delta emitted</text>
  <text x="243" y="186" text-anchor="middle" font-size="7.9" fill="#475569">Reserves 3 experts (9 blks)</text>
  <text x="243" y="203" text-anchor="middle" font-size="7.9" fill="#475569">Dampens boundary jitter</text>
  <text x="243" y="217" text-anchor="middle" font-size="7.9" fill="#475569">&amp; eviction-reload churn</text>

  <rect x="310" y="133" width="150" height="95" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.0"/>
  <text x="319" y="149" font-size="8.6" font-weight="700" fill="#1e3a8a">Expand (F_b &gt; 9)</text>
  <text x="319" y="166" font-size="7.9" fill="#334155">• N = min(5, ⌊(F_b−9)/3⌋)</text>
  <text x="319" y="181" font-size="7.9" fill="#334155">• GreedyExpand picks</text>
  <text x="319" y="196" font-size="7.9" fill="#334155">  highest p_l(e) next prefix</text>
  <text x="319" y="211" font-size="7.9" font-weight="600" fill="#1d4ed8">• Cap 5/step bounds I/O</text>

  <rect x="32" y="235" width="428" height="41" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.0"/>
  <text x="41" y="251" font-size="7.9" font-weight="700" fill="#065f46">GPU Sync (§6.2): Expand merges w/ l+1 prefetch (deduped, priority), waits for HtoD copy event</text>
  <text x="41" y="267" font-size="7.9" fill="#065f46">before updating page table; Shrink stays visible through ongoing pass, then invalidates &amp; frees.</text>

  <!-- Card B: Top-Right (Case Study & Ablation) -->
  <rect x="488" y="70" width="452" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="70" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="88" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="96" x2="940" y2="96" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="87.5" font-size="10.4" font-weight="700" fill="#1e3a8a">B · Concurrency Case Study &amp; Ablation Stack (§2.3 Fig. 4, §8.3 Fig. 11)</text>

  <!-- Left half of B: Case study -->
  <rect x="500" y="104" width="214" height="172" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="510" y="121" font-size="8.7" font-weight="700" fill="#0f172a">Qwen1.5-MoE-14B (1×5090, 10 req/s)</text>
  <text x="510" y="136" font-size="7.9" fill="#475569">0.9 VRAM cap · ShareGPT stream</text>

  <text x="510" y="156" font-size="8.1" font-weight="600" fill="#475569">vLLM (all weights resident)</text>
  <rect x="510" y="161" width="40" height="10" rx="2" fill="#64748b"/>
  <text x="556" y="170" font-size="7.9" font-weight="600" fill="#334155">34 peak · ~2,100 steps</text>

  <text x="510" y="188" font-size="8.1" font-weight="600" fill="#b45309">Fate (fixed cache wall)</text>
  <rect x="510" y="193" width="87" height="10" rx="2" fill="#d97706"/>
  <text x="603" y="202" font-size="7.9" font-weight="600" fill="#92400e">74 peak · ~1,300 steps</text>

  <text x="510" y="220" font-size="8.1" font-weight="700" fill="#1d4ed8">Rimuru (elastic pool)</text>
  <rect x="510" y="225" width="106" height="10" rx="2" fill="#1d4ed8"/>
  <text x="622" y="234" font-size="7.9" font-weight="700" fill="#1d4ed8">90 peak · ~1,000 steps</text>

  <rect x="508" y="246" width="198" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="607" y="260.5" text-anchor="middle" font-size="7.9" font-weight="600" fill="#1e3a8a">Elastic pool cuts ~30% more steps vs fixed</text>

  <!-- Right half of B: Ablation -->
  <rect x="722" y="104" width="206" height="172" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="732" y="121" font-size="8.7" font-weight="700" fill="#0f172a">2×5090 Ablation (vs. Fate Base)</text>
  <text x="732" y="136" font-size="7.9" fill="#475569">Qwen3.5-35B (offload) &amp; Qwen3-30B</text>

  <rect x="730" y="145" width="190" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="737" y="160.5" font-size="7.9" font-weight="700" fill="#475569">Base (Fate)</text>
  <text x="914" y="160.5" text-anchor="end" font-size="7.9" fill="#475569">1.00× throughput</text>

  <rect x="730" y="174" width="190" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="737" y="189.5" font-size="7.9" font-weight="700" fill="#334155">+UMM Pool</text>
  <text x="914" y="189.5" text-anchor="end" font-size="7.8" fill="#64748b">~1.00× (needs policy)</text>

  <rect x="730" y="203" width="190" height="24" rx="3" fill="#eff6ff" stroke="#60a5fa" stroke-width="0.9"/>
  <text x="737" y="218.5" font-size="7.9" font-weight="700" fill="#1d4ed8">+CA Adjuster</text>
  <text x="914" y="218.5" text-anchor="end" font-size="7.9" font-weight="700" fill="#1d4ed8">3.85× · -83.9% TTFT</text>

  <rect x="730" y="232" width="190" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/>
  <text x="737" y="247.5" font-size="7.9" font-weight="700" fill="#1e3a8a">+DF FusedMoE</text>
  <text x="914" y="247.5" text-anchor="end" font-size="7.9" font-weight="700" fill="#1e3a8a">4.19× · -97.8% TTFT</text>

  <text x="732" y="269" font-size="7.8" fill="#475569">+DF removes prefill DtoD staging copies</text>

  <!-- Card C: Bottom-Left (End-to-End Ratios & Regimes) -->
  <rect x="20" y="296" width="452" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="296" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="314" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="322" x2="472" y2="322" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="313.5" font-size="10.4" font-weight="700" fill="#1e3a8a">C · End-to-End Throughput Ratios &amp; Baseline Regimes (§8.2, Fig. 9–10)</text>

  <text x="216" y="347" text-anchor="end" font-size="8.2" font-weight="600" fill="#0f172a">vs. KT (2×4090D, AVX2 no-AMX)</text>
  <rect x="224" y="337" width="152" height="12" rx="2" fill="#1e3a8a"/>
  <text x="382" y="347" font-size="8.6" font-weight="700" fill="#1e3a8a">19.03× TP</text>

  <text x="216" y="375" text-anchor="end" font-size="8.2" font-weight="600" fill="#0f172a">vs. llama.cpp (1×5090, 1-GPU)</text>
  <rect x="224" y="365" width="102" height="12" rx="2" fill="#1d4ed8"/>
  <text x="332" y="375" font-size="8.3" font-weight="700" fill="#1d4ed8">12.7× (-90.5–99.7% TTFT)</text>

  <text x="216" y="403" text-anchor="end" font-size="8.2" font-weight="600" fill="#0f172a">vs. Fate (fixed cache boundary)</text>
  <rect x="224" y="393" width="91" height="12" rx="2" fill="#2563eb"/>
  <text x="321" y="403" font-size="8.3" font-weight="700" fill="#2563eb">11.34× TP</text>

  <text x="216" y="431" text-anchor="end" font-size="8.2" font-weight="600" fill="#0f172a">vs. SGLang/vLLM (tight 5090)</text>
  <rect x="224" y="421" width="23" height="12" rx="2" fill="#0284c7"/>
  <text x="253" y="431" font-size="8.3" font-weight="700" fill="#0369a1">1.1×–2.88× (-63–99% TTFT)</text>

  <text x="216" y="459" text-anchor="end" font-size="8.2" font-weight="600" fill="#0f172a">vs. KT (1×5090, Xeon AMX)</text>
  <rect x="224" y="449" width="19" height="12" rx="2" fill="#0f766e"/>
  <text x="249" y="459" font-size="8.3" font-weight="700" fill="#0f766e">≤2.30× (Qwen3.5; KT lower lat Qwen3)</text>

  <rect x="32" y="471" width="428" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="246" y="484.5" text-anchor="middle" font-size="7.8" fill="#475569">-98.1% avg TTFT across offload baselines · vLLM hit Triton GDN autotune OOM on Qwen3.5-122B (8×5090)</text>

  <!-- Card D: Bottom-Right (Explicit Boundaries) -->
  <rect x="488" y="296" width="452" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="296" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="314" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="322" x2="940" y2="322" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="313.5" font-size="10.4" font-weight="700" fill="#1e3a8a">D · Four Empirical Boundaries &amp; Engineering Caveats (§8.1–§8.5)</text>

  <rect x="500" y="330" width="428" height="36" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="509" y="344" font-size="8.4" font-weight="700" fill="#b45309">1. Throughput-for-TPOT Tradeoff (Fig. 10): cuts queueing TTFT (-63–99%)</text>
  <text x="509" y="359" font-size="7.8" fill="#78350f">yet PCIe loading lifts decode TPOT (~200–250 ms vs &lt;90 ms resident; halves at low load)</text>

  <rect x="500" y="371" width="428" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="509" y="385" font-size="8.4" font-weight="700" fill="#991b1b">2. 19.03× Peak Reflects Non-AMX CPU Baseline (§8.2): not universal</text>
  <text x="509" y="400" font-size="7.8" fill="#7f1d1d">4090D Xeon 8368Q lacks AMX (KT uses AVX2); w/ AMX on 5090, KT beats lat on Qwen3</text>

  <rect x="500" y="412" width="428" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="509" y="426" font-size="8.4" font-weight="700" fill="#1e3a8a">3. Manual EOL &amp; Static Offline Hotset (§6, Fig. 13): per-deploy tuning</text>
  <text x="509" y="441" font-size="7.8" fill="#1e293b">Low EOL degenerates to Fate; high EOL slows burst reload; {H_l,p_l} ignores online drift</text>

  <rect x="500" y="453" width="428" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="509" y="467" font-size="8.4" font-weight="700" fill="#334155">4. CUDA Graph Off &amp; Scope Limits (§8.1–§8.2): unmeasured w/ Graph on</text>
  <text x="509" y="482" font-size="7.8" fill="#475569">All §8 tests turn CUDA Graph off; ShareGPT + Qwen3/3.5 only; inherits vLLM OOM; no repo</text>

  <text x="20" y="521" font-size="8.6" fill="#64748b">Note: Under tight VRAM or non-AMX CPUs, elastic KV/expert boundary adjustment boosts concurrency &amp; cuts queueing TTFT; calibrate EOL to PCIe &amp; TPOT targets.</text>
</svg>
