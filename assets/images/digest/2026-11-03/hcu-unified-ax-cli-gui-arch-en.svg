<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Hybrid Computer Use unified 3-channel interface, composable AX, and cross-channel action guards diagram" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#f8fafc" rx="12"/>
  <rect x="12" y="12" width="936" height="516" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2" rx="10"/>

  <text x="28" y="38" font-size="16.2" font-weight="700" fill="#0f172a">Hybrid Computer Use (HCU): 3-Channel Interface, Composable AX &amp; Guards</text>
  <text x="28" y="56" font-size="10.2" fill="#475569">arXiv:2610.41432v1 · Model-directed routing (no extra planner/subagents) · Shared Go MCP server + native OS backends</text>
  <line x1="28" y1="65" x2="932" y2="65" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Column A -->
  <rect x="24" y="74" width="292" height="420" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="36" y="94" font-size="11.6" font-weight="700" fill="#1d4ed8">A. Agent Context &amp; 3 Channels</text>

  <rect x="34" y="104" width="272" height="76" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="42" y="112" width="68" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="76" y="123.8" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Model-Led</text>
  <text x="116" y="124.2" font-size="10.5" font-weight="700" fill="#0f172a">General Agent + HCU Skill</text>
  <text x="42" y="145" font-size="8.9" fill="#334155">• Runs inside native harness (no retraining)</text>
  <text x="42" y="163" font-size="8.9" fill="#1d4ed8">• Skill cuts malformed args 17.4% → 1.4%</text>

  <line x1="39" y1="180" x2="39" y2="437" stroke="#64748b" stroke-width="1.3"/>
  <line x1="39" y1="231" x2="46" y2="231" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <line x1="39" y1="332" x2="46" y2="332" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <line x1="39" y1="437" x2="46" y2="437" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr-sky)"/>

  <rect x="48" y="190" width="258" height="82" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="56" y="197" width="76" height="17" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="94" y="208.8" text-anchor="middle" font-size="8.8" font-weight="700" fill="#334155">Programmatic</text>
  <text x="138" y="209.2" font-size="10.3" font-weight="700" fill="#0f172a">Code / CLI / File Tools</text>
  <text x="56" y="229" font-size="8.8" fill="#334155">• Stays in harness; edits unopened files</text>
  <text x="56" y="246" font-size="8.8" fill="#334155">• Clean app launch: setsid -f / open -a</text>
  <text x="56" y="263" font-size="8.5" fill="#475569">• Avoids scripted UI input to keep refs fresh</text>

  <rect x="48" y="280" width="258" height="104" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <rect x="56" y="287" width="76" height="17" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="94" y="298.8" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Semantic AX</text>
  <text x="138" y="299.2" font-size="10.3" font-weight="700" fill="#1d4ed8">MCP AX Tool (Core)</text>
  <text x="56" y="319" font-size="8.8" fill="#0f172a">• apps / observe / find / act (wN, rN)</text>
  <text x="56" y="336" font-size="8.8" fill="#0f172a">• Compact view trims 12.6%–44.1% tok</text>
  <text x="56" y="353" font-size="8.8" fill="#0f172a">• 64-step batch + wait/settle + AX diff</text>
  <text x="56" y="370" font-size="8.6" font-weight="600" fill="#1d4ed8">• Obsidian: stock XML 30.5K → 1,237 tok</text>

  <rect x="48" y="392" width="258" height="90" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.1"/>
  <rect x="56" y="399" width="76" height="17" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="94" y="410.8" text-anchor="middle" font-size="8.8" font-weight="700" fill="#0369a1">Visual GUI</text>
  <text x="138" y="411.2" font-size="10.3" font-weight="700" fill="#0369a1">MCP GUI Tool (Fallback)</text>
  <text x="56" y="431" font-size="8.8" fill="#334155">• screenshot / zoom / 64-step pixel batch</text>
  <text x="56" y="448" font-size="8.8" fill="#334155">• Handles canvases, drags &amp; unexposed UI</text>
  <text x="56" y="465" font-size="8.5" fill="#475569">• Complementary: GUI frame → AX action</text>

  <!-- Column B -->
  <rect x="326" y="74" width="342" height="420" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="338" y="94" font-size="11.6" font-weight="700" fill="#1d4ed8">B. Composable AX Pipeline &amp; Guards</text>

  <rect x="336" y="104" width="322" height="154" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="346" y="121" font-size="10.2" font-weight="700" fill="#0f172a">1. Single-Call Loop: Bind Refs → Batch Act → AX Diff</text>

  <rect x="344" y="130" width="94" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="391" y="145" text-anchor="middle" font-size="9.0" font-weight="700" fill="#1d4ed8">Bind + Prune</text>
  <text x="391" y="162" text-anchor="middle" font-size="8.2" fill="#334155">Bind aN/wN/rN</text>
  <text x="391" y="176" text-anchor="middle" font-size="8.2" fill="#334155">before pruning</text>
  <text x="391" y="191" text-anchor="middle" font-size="8.0" fill="#475569">find scans full tree</text>

  <line x1="438" y1="168" x2="448" y2="168" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="450" y="130" width="94" height="76" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="497" y="145" text-anchor="middle" font-size="9.0" font-weight="700" fill="#1d4ed8">Batch + Wait</text>
  <text x="497" y="162" text-anchor="middle" font-size="8.2" fill="#0f172a">Ordered in window</text>
  <text x="497" y="176" text-anchor="middle" font-size="8.2" fill="#0f172a">wait / settle</text>
  <text x="497" y="191" text-anchor="middle" font-size="8.0" fill="#1d4ed8">Stop on 1st failure</text>

  <line x1="544" y1="168" x2="554" y2="168" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="556" y="130" width="94" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="603" y="145" text-anchor="middle" font-size="9.0" font-weight="700" fill="#1d4ed8">Diff + Evidence</text>
  <text x="603" y="162" text-anchor="middle" font-size="8.2" fill="#334155">effect / windows</text>
  <text x="603" y="176" text-anchor="middle" font-size="8.2" fill="#334155">AX diff vs. last</text>
  <text x="603" y="191" text-anchor="middle" font-size="8.0" fill="#475569">87% omit observe</text>

  <rect x="344" y="214" width="306" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="352" y="229" font-size="8.4" fill="#0f172a">JSON prefix: reports input_emitted &amp; retry_same_request</text>
  <text x="352" y="243" font-size="8.2" fill="#475569">Separates non-delivery (stale_ref) vs. effect_unknown vs. timeout</text>

  <rect x="336" y="268" width="322" height="214" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="346" y="285" font-size="10.2" font-weight="700" fill="#1e3a8a">2. Cross-Channel Action Guards (Alg. 1 · Anti-Stale)</text>

  <rect x="344" y="294" width="306" height="84" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="352" y="301" width="90" height="17" rx="4" fill="#1d4ed8"/>
  <text x="397" y="312.8" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">AX Target Guard</text>
  <text x="448" y="313.2" font-size="9.4" font-weight="700" fill="#0f172a">Resolve LiveTarget(a.ref) Pre-Input</text>
  <text x="352" y="334" font-size="8.6" fill="#0f172a">• Verify live identity t ≠ ⊥ &amp; CanExecute(a, t)</text>
  <text x="352" y="351" font-size="8.6" fill="#0f172a">• Missing/replaced → reject stale_ref (no name guess)</text>
  <text x="352" y="368" font-size="8.3" fill="#1d4ed8">• Re-checked per step inside every AX action batch</text>

  <rect x="344" y="386" width="306" height="88" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <rect x="352" y="393" width="90" height="17" rx="4" fill="#b45309"/>
  <text x="397" y="404.8" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">GUI Layout Guard</text>
  <text x="448" y="405.2" font-size="9.4" font-weight="700" fill="#78350f">Verify LiveLayout() == Frame Lease</text>
  <text x="352" y="426" font-size="8.6" fill="#78350f">• Check bounds, top-level windows, z-order &amp; focus</text>
  <text x="352" y="443" font-size="8.6" fill="#78350f">• Mismatch → gui_frame_stale (0 sent) + fresh shot</text>
  <text x="352" y="460" font-size="8.3" font-weight="700" fill="#991b1b">• Uncertain prep state → Stop automation (no replay)</text>

  <line x1="306" y1="332" x2="334" y2="332" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="306" y1="437" x2="334" y2="437" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arr-sky)"/>

  <!-- Column C -->
  <rect x="678" y="74" width="258" height="420" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="690" y="94" font-size="11.6" font-weight="700" fill="#1d4ed8">C. Shared Go State &amp; Backends</text>

  <rect x="688" y="104" width="238" height="156" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="698" y="121" font-size="10.0" font-weight="700" fill="#1e3a8a">State Invalidation Ledger (Fig. 17)</text>

  <rect x="696" y="129" width="222" height="54" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="704" y="143" font-size="8.7" font-weight="700" fill="#991b1b">Invalidate on GUI mutation:</text>
  <text x="704" y="158" font-size="8.3" fill="#7f1d1d">• Working AX snapshots &amp; hidden cache</text>
  <text x="704" y="172" font-size="8.3" fill="#7f1d1d">• Active find continuation cursors</text>

  <rect x="696" y="189" width="222" height="62" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="0.9"/>
  <text x="704" y="203" font-size="8.7" font-weight="700" fill="#166534">Retain across turns:</text>
  <text x="704" y="218" font-size="8.3" fill="#14532d">• aN/wN/rN ref registries &amp; tree ledger</text>
  <text x="704" y="233" font-size="8.3" fill="#14532d">• Diff snapshots; refresh GUI layout lease</text>

  <rect x="688" y="270" width="238" height="116" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="698" y="287" font-size="10.0" font-weight="700" fill="#1e3a8a">Platform Providers (1 per build)</text>
  <rect x="696" y="297" width="222" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="704" y="312.5" font-size="8.5" fill="#0f172a">Linux: AT-SPI + X11 (auto session bus)</text>
  <rect x="696" y="325" width="222" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="704" y="340.5" font-size="8.5" fill="#0f172a">macOS: AXUIElement + ScreenCaptureKit</text>
  <rect x="696" y="353" width="222" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="704" y="368.5" font-size="8.5" fill="#0f172a">Windows: UIA3 + Win32 native API</text>

  <line x1="807" y1="386" x2="807" y2="396" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="688" y="398" width="238" height="84" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="698" y="416" font-size="10.2" font-weight="700" fill="#1e3a8a">Single Shared Desktop &amp; Apps</text>
  <text x="698" y="435" font-size="8.7" fill="#0f172a">• Code, AX &amp; GUI share live desktop state</text>
  <text x="698" y="452" font-size="8.7" fill="#0f172a">• LibreOffice, GIMP, Chrome, VS Code</text>
  <text x="698" y="469" font-size="8.4" font-weight="600" fill="#1d4ed8">• Eval runner kept strictly external</text>

  <line x1="658" y1="180" x2="686" y2="180" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="658" y1="336" x2="686" y2="336" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <text x="24" y="514" font-size="9.1" fill="#475569">Note: Evaluated build (main/ablations) caps batches at 32 with assert_ax; Released build (App. A/E/F) unifies wait/settle, caps at 64, and prefixes JSON evidence.</text>
</svg>
