  <text x="363" y="124.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">证明 Agent</text>
  <text x="404" y="125" font-size="10.0" font-weight="700" fill="#0f172a">Codex / Claude Code 等 + 两项 Skill</text>
  <text x="330" y="145" font-size="8.6" fill="#334155">• 发现归纳不变量、构造抽象、拆解步进与活性引理</text>
  <text x="330" y="164" font-size="8.5" fill="#1e3a8a">• tlaps-proof-hints：桥接引理打通 I!Pos 与 Pos 符号</text>
  <text x="330" y="183" font-size="8.5" fill="#1e3a8a">• inv-validation：三步法检 Init / 步进保持 / 蕴含</text>

  <line x1="398" y1="200" x2="398" y2="211" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="561" y1="200" x2="561" y2="211" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="322" y="212" width="153" height="114" rx="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
  <text x="331" y="230" font-size="9.6" font-weight="700" fill="#0369a1">模型检查快速证伪</text>
  <text x="331" y="248" font-size="8.4" fill="#0f172a">• TLC（显式有限状态）</text>
  <text x="331" y="266" font-size="8.4" fill="#0f172a">• Apalache（SMT 归纳）</text>
  <text x="331" y="284" font-size="8.4" fill="#334155">• 提取反例轨迹补缺项</text>
  <text x="331" y="302" font-size="8.3" fill="#475569">• 不可作为证明步骤依据</text>

  <rect x="485" y="212" width="153" height="114" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="494" y="230" font-size="9.6" font-weight="700" fill="#1e3a8a">语义分析与证明库</text>
  <text x="494" y="248" font-size="8.4" fill="#0f172a">• SANY --sany-only</text>
  <text x="494" y="266" font-size="8.4" fill="#334155">  秒级反馈语法与作用域</text>
  <text x="494" y="284" font-size="8.4" fill="#0f172a">• 锁定 TLAPS Library</text>
  <text x="494" y="302" font-size="8.3" fill="#334155">  及 CommunityModules</text>

