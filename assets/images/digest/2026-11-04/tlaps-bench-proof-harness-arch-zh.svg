  <rect x="433" y="366" width="94" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480" y="381" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Isabelle/TLA+</text>
  <text x="480" y="395" text-anchor="middle" font-size="7.9" fill="#334155">Isa 集合高阶</text>

  <rect x="534" y="366" width="94" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="581" y="381" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">LS4 (时序)</text>
  <text x="581" y="395" text-anchor="middle" font-size="7.9" fill="#334155">PTL 命题时序</text>

  <text x="332" y="421" font-size="8.6" fill="#334155">• 严格模式把缺失/省略步判为错误，禁用 OMITTED</text>
  <text x="332" y="440" font-size="8.6" fill="#334155">• 60 分钟模块验证上限；2M 累计输出令牌上限</text>
  <text x="332" y="459" font-size="8.6" fill="#334155">• 支持限额中断续跑，保留已完成证明单元与缓存</text>
  <text x="332" y="477" font-size="8.3" font-weight="600" fill="#1d4ed8">↺ 失败单元诊断与耗时反馈回流驱动下一轮修复</text>

