  <rect x="20" y="90" width="276" height="8" fill="#1e3a8a"/>
  <text x="32" y="88.5" font-size="10.8" font-weight="700" fill="#ffffff">1. 任务构建与三模块划分（§4.2）</text>

  <rect x="30" y="106" width="256" height="96" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="124" font-size="10.2" font-weight="700" fill="#1e3a8a">真实系统规格与规范化重写</text>
  <text x="40" y="144" font-size="8.7" fill="#334155">• 95 规格 265 目标（12 规格 70 活跃题）</text>
  <text x="40" y="163" font-size="8.7" fill="#334155">• .cfg 配置显式化；Ivy 转写 TLA+（Fig. 5）</text>
  <text x="40" y="182" font-size="8.7" fill="#334155">• 剥离原证明；修复 35/46 处规格缺陷</text>

  <line x1="158" y1="202" x2="158" y2="213" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="214" width="256" height="162" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="40" y="232" font-size="10.2" font-weight="700" fill="#1e3a8a">SANY 依赖闭包裁剪 → 三模块（Fig. 6）</text>

  <rect x="38" y="242" width="240" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="248" width="44" height="16" rx="4" fill="#dbeafe"/>
