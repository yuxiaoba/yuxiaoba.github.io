  <text x="324" y="88.5" font-size="10.8" font-weight="700" fill="#ffffff">2. TILAPIA 容器内迭代证明闭环（§3.1）</text>

  <rect x="322" y="106" width="316" height="94" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
