  <text x="742" y="238" font-size="9.8" font-weight="700" fill="#0f172a">全依赖追踪（Dependency）</text>
  <rect x="683" y="249" width="238" height="21" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="690" y="262.5" font-size="8.0" font-weight="600" fill="#92400e">拦截：引用 OMITTED 引理 NextInv (Fig. 4b)</text>
  <text x="683" y="287" font-size="8.4" fill="#334155">• SANY 提取目标与辅助引理引用构成有向图</text>
  <text x="683" y="305" font-size="8.4" fill="#334155">• 自身证毕且传递依赖全非省略/环引用方计分</text>

