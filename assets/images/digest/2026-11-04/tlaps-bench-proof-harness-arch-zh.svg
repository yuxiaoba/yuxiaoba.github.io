  <text x="742" y="350" font-size="9.8" font-weight="700" fill="#0f172a">洁净室重判（Clean-Room）</text>
  <rect x="683" y="361" width="238" height="21" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="690" y="374.5" font-size="8.0" font-weight="600" fill="#991b1b">拦截：本地伪造 tlapm 返回 PASS (Fig. 4c)</text>
  <text x="683" y="399" font-size="8.5" fill="#334155">• 丢弃工作区脚本与包装器，重建全新容器</text>
  <text x="683" y="417" font-size="8.5" fill="#334155">• 仅携单份 Task.tla 配合未改二进制独立重验</text>

