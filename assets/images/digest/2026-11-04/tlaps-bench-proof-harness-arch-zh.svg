  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="32" font-size="16.5" font-weight="700" fill="#0f172a">TLAPS-Bench 与 TILAPIA：三模块隔离与防作弊证明闭环</text>
  <text x="24" y="50" font-size="10.1" fill="#475569">依据 arXiv:2611.02849v1（§3–§4, Fig. 1, 4–6, App. E）：只读固定规格与定理，工具辅助迭代，洁净室依赖图终审</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: Task Packaging -->
  <rect x="20" y="70" width="276" height="426" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
