  <text x="44" y="274" font-size="8.3" fill="#475569">状态变量、Init、Next、Spec 与 ASSUME</text>

  <rect x="38" y="286" width="240" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="292" width="44" height="16" rx="4" fill="#dbeafe"/>
  <text x="66" y="303.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">只读</text>
  <text x="94" y="303.5" font-size="9.0" font-weight="700" fill="#0f172a">Defs.tla</text>
  <text x="44" y="318" font-size="8.3" fill="#475569">目标性质谓词及传递依赖定义</text>

  <rect x="38" y="330" width="240" height="38" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="44" y="336" width="52" height="16" rx="4" fill="#1d4ed8"/>
  <text x="70" y="347.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">限域可写</text>
  <text x="102" y="347.5" font-size="9.0" font-weight="700" fill="#1e3a8a">Task.tla（仅提交此文件）</text>
  <text x="44" y="362" font-size="8.3" fill="#334155">开放 HELPERS 与 PROOF 区块，固定定理</text>

  <line x1="158" y1="376" x2="158" y2="387" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="388" width="256" height="98" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="406" font-size="10.2" font-weight="700" fill="#0f172a">工作区隔离边界（§3）</text>
  <text x="40" y="426" font-size="8.7" fill="#334155">• 独立 8 vCPU Docker；无历史会话记忆</text>
  <text x="40" y="445" font-size="8.7" fill="#334155">• 断网仅通 LLM API，禁用内置网页检索</text>
  <text x="40" y="464" font-size="8.7" fill="#334155">• 临时 scratch/ 与验证包装器不带入终审</text>

  <line x1="296" y1="265" x2="311" y2="265" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

