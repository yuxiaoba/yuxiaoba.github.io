<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="IntentOS architecture diagram showing dual-path isyscall execution, hierarchical micro-syscalls, LLMSidecar, and kernel safety guarantees" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.2" font-weight="700" fill="#0f172a">IntentOS: Dual-Path isyscall Execution, Tool Hierarchy &amp; Kernel Safety</text>
  <text x="24" y="51" font-size="9.8" fill="#475569">Based on arXiv:2611.00002v1 (§3–§5, Fig. 5, Figs. 7–8, Table 3): Decoupling intent planning &amp; caching from kernel-enforced safety</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: User Space -->
  <rect x="20" y="70" width="224" height="398" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="70" width="224" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="90" width="224" height="8" fill="#1e3a8a"/>
  <text x="31" y="88.5" font-size="10.2" font-weight="700" fill="#ffffff">1. User Entry &amp; Decoupled Args</text>

  <rect x="29" y="106" width="206" height="84" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="38" y="123" font-size="9.8" font-weight="700" fill="#1e3a8a">Three isyscall Interfaces (§5.1)</text>
  <text x="38" y="140" font-size="8.4" fill="#0f172a">• isyscall_rt: runtime plan + cache</text>
  <text x="38" y="157" font-size="8.4" fill="#334155">• isyscall_dev: run pre-built plan</text>
  <text x="38" y="174" font-size="8.4" fill="#475569">• isyscall_dry_run: compile only</text>

  <line x1="132" y1="190" x2="132" y2="204" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="29" y="206" width="206" height="114" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="223" font-size="9.8" font-weight="700" fill="#1e3a8a">Args-Decoupled Call (Figs. 6–7)</text>
  <text x="38" y="241" font-size="8.3" fill="#334155">• intent: prompt + arg placeholders</text>
  <text x="38" y="258" font-size="8.3" fill="#334155">• args_list (u64[]): uniform 8B slots</text>
  <text x="38" y="275" font-size="8.3" fill="#1d4ed8" font-weight="600">• Reuse cached plan ID on new args</text>
  <text x="38" y="292" font-size="8.3" fill="#334155">• Copies cross-proc state into kernel</text>
  <text x="38" y="309" font-size="8.3" fill="#475569">• ret_from_fork triggers child hook</text>

  <line x1="132" y1="320" x2="132" y2="334" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="29" y="336" width="206" height="123" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="38" y="353" font-size="9.8" font-weight="700" fill="#1d4ed8">Executable Plan List (Fig. 7)</text>
  <rect x="37" y="364" width="56" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="65" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#0f172a">Func</text>
  <text x="65" y="392" text-anchor="middle" font-size="7.8" fill="#475569">arg1, arg3</text>
  <line x1="93" y1="382" x2="103" y2="382" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="105" y="364" width="56" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="133" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1e3a8a">Ctrl</text>
  <text x="133" y="392" text-anchor="middle" font-size="7.8" fill="#1e3a8a">if / loop</text>
  <line x1="161" y1="382" x2="171" y2="382" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="173" y="364" width="54" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#0f172a">Func</text>
  <text x="200" y="392" text-anchor="middle" font-size="7.8" fill="#475569">idx 5</text>
  <text x="38" y="420" font-size="8.2" fill="#334155">• Appends return vals to args_list</text>
  <text x="38" y="437" font-size="8.2" fill="#334155">• Step failure triggers full rollback</text>
  <text x="38" y="452" font-size="7.9" fill="#475569">(Kernel interprets linked nodes directly)</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="244" y1="148" x2="268" y2="148" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="256" cy="133" r="8" fill="#1d4ed8"/>
  <text x="256" y="136.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">1</text>

  <!-- Column 2: Kernel Execution Plane -->
  <rect x="270" y="70" width="416" height="398" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="270" y="70" width="416" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="270" y="90" width="416" height="8" fill="#1d4ed8"/>
  <text x="282" y="88.5" font-size="10.2" font-weight="700" fill="#ffffff">2. Kernel Execution Plane (Fast Cache + 4 Safety Invariants)</text>

  <!-- Fast Path Cache -->
  <rect x="279" y="106" width="194" height="90" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <rect x="287" y="113" width="60" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="317" y="124.2" text-anchor="middle" font-size="8.0" font-weight="700" fill="#166534">Fast Path</text>
  <text x="352" y="125" font-size="9.3" font-weight="700" fill="#1e3a8a">Intent Plan Cache</text>
  <text x="287" y="144" font-size="8.3" fill="#0f172a">• Hit executes list, 0 LLM calls</text>
  <text x="287" y="161" font-size="8.3" fill="#1d4ed8" font-weight="600">• Framework cost ≤ 6.714% (Fig. 14)</text>
  <text x="287" y="178" font-size="8.3" fill="#475569">• Tracks traces &amp; hot intent metrics</text>

  <!-- Static Verifier -->
  <rect x="483" y="106" width="194" height="90" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="491" y="113" width="60" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="521" y="124.2" text-anchor="middle" font-size="8.0" font-weight="700" fill="#1d4ed8">Admission</text>
  <text x="556" y="125" font-size="9.3" font-weight="700" fill="#0f172a">Static Loop Verifier</text>
  <text x="491" y="144" font-size="8.3" fill="#334155">• Isolates loop-ctrl from tool args</text>
  <text x="491" y="161" font-size="8.3" fill="#334155">• Verifies bounded loop termination</text>
  <text x="491" y="178" font-size="8.3" fill="#475569">• Only verified plans enter cache</text>

  <!-- Safe Micro-Syscall Guarantees -->
  <rect x="279" y="204" width="398" height="114" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.1"/>
  <text x="289" y="220" font-size="9.6" font-weight="700" fill="#0f172a">Safe Micro-Syscall Guarantees (§4.3 · Independent of LLM Correctness)</text>

  <rect x="287" y="228" width="187" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="294" y="242" font-size="8.6" font-weight="700" fill="#1d4ed8">1. Pre-Exec 6-Class Arg Checks</text>
  <text x="294" y="258" font-size="7.8" fill="#334155">UPtr · Exist · Len/OVF · Perm · RLimit · Flags</text>

  <rect x="482" y="228" width="187" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="489" y="242" font-size="8.6" font-weight="700" fill="#1d4ed8">2. Indirect Access via Handles</text>
  <text x="489" y="258" font-size="7.8" fill="#334155">Keeps objects in kernel; tracks lifetimes</text>

  <rect x="287" y="273" width="187" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="294" y="287" font-size="8.6" font-weight="700" fill="#1d4ed8">3. Cross-Tool Lock Reentrancy</text>
  <text x="294" y="302" font-size="7.8" fill="#334155">Must release global locks before return</text>

  <rect x="482" y="273" width="187" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="489" y="287" font-size="8.6" font-weight="700" fill="#1d4ed8">4. All-or-Nothing Rollback</text>
  <text x="489" y="302" font-size="7.8" fill="#334155">Frees handles &amp; reverts error-tool state</text>

  <!-- Hierarchical Tools & Fork+Exec -->
  <rect x="279" y="326" width="398" height="133" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="289" y="343" font-size="9.6" font-weight="700" fill="#1e3a8a">Hierarchical Toolset &amp; Evolved Fork+Exec Plan (Table 3, Fig. 8)</text>

  <rect x="288" y="351" width="380" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="296" y="365.5" font-size="8.2" font-weight="600" fill="#1e3a8a">Layer 1 Syscall Wrappers (Process / Mem / VFS) → Stage-1 baseline accuracy</text>

  <line x1="478" y1="373" x2="478" y2="383" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="288" y="385" width="380" height="66" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="296" y="400" font-size="8.4" font-weight="700" fill="#1d4ed8">Layer 2..n Micro-Syscalls (12 Fork+Exec Tools → skips copy_mm &amp; parent wait)</text>

  <rect x="295" y="408" width="52" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="321" y="420" text-anchor="middle" font-size="7.8" font-weight="600" fill="#0f172a">init_ctx</text>
  <line x1="347" y1="417" x2="354" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="356" y="408" width="84" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="398" y="420" text-anchor="middle" font-size="7.6" font-weight="600" fill="#0f172a">copy_proc(share)</text>
  <line x1="440" y1="417" x2="447" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="449" y="408" width="84" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="491" y="420" text-anchor="middle" font-size="7.6" font-weight="600" fill="#0f172a">wake(no wait)</text>
  <line x1="533" y1="417" x2="540" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="542" y="408" width="118" height="18" rx="3" fill="#1d4ed8"/>
  <text x="601" y="420" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">run_exec_kargs (child)</text>

  <text x="296" y="442" font-size="7.9" fill="#334155">Shares mm_struct (saves 78.89% copy_mm); kernel-side exec skips 70.281% vfork wait</text>

  <!-- Arrows Col 2 <-> Col 3 -->
  <line x1="686" y1="136" x2="714" y2="136" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-slate)"/>
  <circle cx="701" cy="121" r="8" fill="#475569"/>
  <text x="701" y="124.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">2</text>

  <line x1="716" y1="172" x2="688" y2="172" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="701" cy="187" r="8" fill="#1d4ed8"/>
  <text x="701" y="190.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">3</text>

  <line x1="686" y1="276" x2="714" y2="276" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <line x1="716" y1="306" x2="688" y2="306" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <circle cx="701" cy="291" r="8" fill="#1e3a8a"/>
  <text x="701" y="294.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">4</text>

  <!-- Column 3: LLMSidecar Cognitive Plane -->
  <rect x="716" y="70" width="224" height="398" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="716" y="70" width="224" height="28" rx="8" fill="#0f172a"/>
  <rect x="716" y="90" width="224" height="8" fill="#0f172a"/>
  <text x="727" y="88.5" font-size="10.2" font-weight="700" fill="#ffffff">3. LLMSidecar Cognitive Plane</text>

  <rect x="725" y="106" width="206" height="108" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="733" y="113" width="94" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="780" y="124.2" text-anchor="middle" font-size="7.9" font-weight="700" fill="#92400e">② Slow Path (Miss)</text>
  <text x="733" y="144" font-size="9.3" font-weight="700" fill="#0f172a">Schema-Guided Plan Gen</text>
  <text x="733" y="162" font-size="8.2" fill="#334155">• Privileged channel on cache miss</text>
  <text x="733" y="179" font-size="8.2" fill="#334155">• External planner; 0 exec privilege</text>
  <text x="733" y="196" font-size="8.2" fill="#92400e" font-weight="600">• ③ Cold path: 26.5–56.3 s (Table 4)</text>

  <rect x="725" y="222" width="206" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="733" y="229" width="102" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="784" y="240.2" text-anchor="middle" font-size="7.9" font-weight="700" fill="#1d4ed8">④ Async Evolve (§4.2)</text>
  <text x="733" y="260" font-size="9.3" font-weight="700" fill="#1e3a8a">Multi-Stage &amp; Deferred Load</text>
  <text x="733" y="278" font-size="8.2" fill="#0f172a">• Consumes hot traces &amp; metrics</text>
  <text x="733" y="295" font-size="8.2" fill="#334155">• Tool search narrows sub-tools</text>
  <text x="733" y="312" font-size="8.2" fill="#334155">• Inherits 4 parent context fields</text>
  <text x="733" y="329" font-size="8.2" fill="#1d4ed8" font-weight="600">• Cuts prompt bloat &amp; errors</text>

  <rect x="725" y="360" width="206" height="99" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="733" y="367" width="104" height="16" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="785" y="378.2" text-anchor="middle" font-size="7.9" font-weight="700" fill="#991b1b">Sessions &amp; Patching</text>
  <text x="733" y="398" font-size="9.2" font-weight="700" fill="#0f172a">Session Clone &amp; Rollback</text>
  <text x="733" y="416" font-size="8.1" fill="#334155">• Clones isolated child session</text>
  <text x="733" y="433" font-size="8.1" fill="#334155">• Parent polls child sub-plans</text>
  <text x="733" y="450" font-size="8.1" fill="#475569">• Offline dev patching on bad plans</text>

  <!-- Bottom Boundary Banner -->
  <rect x="20" y="478" width="920" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="31" y="495" font-size="8.7" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">Safety-vs-Correctness Isolation:</tspan> LLMSidecar sits outside kernel execution TCB; apps interact only via isyscall. Kernel safety relies on 6 arg checks, handles, lock release, and bounded loops.</text>
  <text x="31" y="512" font-size="8.4" fill="#475569">Flow: ① Submit intent + u64[] args → ② Cache miss routes to Sidecar → ③ Loop-verified plan enters cache → ④ Async evolution swaps Layer-1 wrappers for micro-syscalls.</text>
</svg>
