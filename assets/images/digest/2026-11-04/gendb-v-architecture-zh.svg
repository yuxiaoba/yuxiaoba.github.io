<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Lato', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="17.0" font-weight="700" fill="#0f172a" text-anchor="start">GenDB-V：确定性目标构造、联合搜索与三层隔离验证</text>
  <text x="24" y="53" font-size="10.3" font-weight="400" fill="#475569" text-anchor="start">依据 arXiv:2611.02779v1（§2–§5）：将规范定义与验证链置于 Agent 控制之外，仅信任 SQLSpec 翻译与 Verus / Z3 / rustc</text>
  <line x1="24" y1="63" x2="936" y2="63" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="73" width="266" height="405" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="73" width="266" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="93" width="266" height="8" fill="#1e3a8a"/>
  <text x="32" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="start">1. 确定性目标构造（只读边界）</text>
  <rect x="29" y="110" width="248" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="39" y="128" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">输入解析与类型化 AST</text>
  <text x="39" y="146" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• SQL 模板 / 子集查询 · Schema Σ · 约束</text>
  <text x="39" y="163" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• SQLGlot 按 PG 18 规则解析与定型</text>
  <text x="39" y="180" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• 确定性 1 对 1 映射为 SQLSpec 算子树 Q</text>
  <line x1="153" y1="196" x2="153" y2="212" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <rect x="29" y="214" width="248" height="118" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="39" y="232" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">SQLSpec 数学语义（Verus 库）</text>
  <text x="39" y="250" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• 建模 NULL、三值逻辑、重复行与 SqlError</text>
  <text x="39" y="267" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• 允许结果集 ⟦Q⟧(D) 兼容行序与平局排列</text>
  <text x="39" y="284" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• 硬件定宽溢出允许显式返回 Capacity</text>
  <text x="39" y="301" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• 附带已验证 Rust 参考解释器（v0 基线）</text>
  <text x="39" y="318" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">• 显式拒绝：窗口函数、递归查询</text>
  <line x1="153" y1="332" x2="153" y2="348" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <rect x="29" y="350" width="248" height="118" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="39" y="368" font-size="10.3" font-weight="700" fill="#1d4ed8" text-anchor="start">固定合成目标（Eq. 2–5，不可修改）</text>
  <text x="39" y="387" font-size="9.1" font-weight="400" fill="#0f172a" text-anchor="start" font-family="'Noto Sans Mono CJK SC', ui-monospace, SFMono-Regular, Menlo, monospace">构建：Valid_Σ(D) ⇒ Rep(B(D), D)</text>
  <text x="39" y="405" font-size="9.1" font-weight="400" fill="#0f172a" text-anchor="start" font-family="'Noto Sans Mono CJK SC', ui-monospace, SFMono-Regular, Menlo, monospace">无损：Rep(S,D1)∧Rep(S,D2) ⇒ D1=D2</text>
  <text x="39" y="423" font-size="9.1" font-weight="400" fill="#0f172a" text-anchor="start" font-family="'Noto Sans Mono CJK SC', ui-monospace, SFMono-Regular, Menlo, monospace">模板：∀p∈P, Allowed(D, Q_T(p), E_T)</text>
  <text x="39" y="441" font-size="9.1" font-weight="400" fill="#0f172a" text-anchor="start" font-family="'Noto Sans Mono CJK SC', ui-monospace, SFMono-Regular, Menlo, monospace">引擎：∀Q∈Q_Σ, Allowed(D, Q, E(S,Q))</text>
  <text x="39" y="458" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">不规定物理存储布局与执行算法</text>
  <line x1="287" y1="275" x2="307" y2="275" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arr-blue)"/>
  <rect x="309" y="73" width="312" height="405" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="309" y="73" width="312" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="309" y="93" width="312" height="8" fill="#1d4ed8"/>
  <text x="321" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="start">2. Agent 联合搜索（不受信任，先性能后证明）</text>
  <rect x="318" y="110" width="294" height="108" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="328" y="128" font-size="10.1" font-weight="700" fill="#1e3a8a" text-anchor="start">阶段 A：性能优先探索（--no-verify 模式）</text>
  <text x="328" y="146" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 存储–执行协同：排序、分块极值、字典、单表索引</text>
  <text x="328" y="163" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 策略门限：单份无损基表，禁物化连接与缓存结果</text>
  <text x="328" y="180" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 差分测试 + CPU/I/O 画像选优后再冻结设计</text>
  <text x="328" y="197" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">• 进入阶段 B 补齐证明（无完整证明不予提交）</text>
  <line x1="465" y1="218" x2="465" y2="234" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <rect x="318" y="236" width="294" height="232" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="328" y="254" font-size="10.1" font-weight="700" fill="#1e3a8a" text-anchor="start">阶段 B：三层模块化证明（拆解单步复杂度）</text>
  <rect x="326" y="263" width="278" height="58" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="334" y="280" font-size="9.6" font-weight="700" fill="#1d4ed8" text-anchor="start">Layer 1 · 存储读取契约 (Storage Readers)</text>
  <text x="334" y="297" font-size="9.0" font-weight="400" fill="#334155" text-anchor="start">requires Rep(S, D) → ensures 物理切片解码</text>
  <text x="334" y="312" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">逻辑表 D[t] 行列，并导出分块极值/排序等不变量</text>
  <rect x="326" y="327" width="278" height="66" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="334" y="344" font-size="9.6" font-weight="700" fill="#1d4ed8" text-anchor="start">Layer 2 · 物理循环契约与单步引理 (Loops)</text>
  <text x="334" y="361" font-size="9.0" font-weight="400" fill="#334155" text-anchor="start">invariant 关联扫描进度与前缀函数 C(v,k,row)</text>
  <text x="334" y="376" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">decreases 保证必停；step lemma 证单步保持</text>
  <rect x="326" y="399" width="278" height="62" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.0"/>
  <text x="334" y="416" font-size="9.6" font-weight="700" fill="#1d4ed8" text-anchor="start">Layer 3 · 归纳桥接引理 → SQLSpec</text>
  <text x="334" y="433" font-size="9.0" font-weight="400" fill="#0f172a" text-anchor="start">组合 L1+L2 证明物理计算等价 eval(D, ρ, q)</text>
  <text x="334" y="448" font-size="9.0" font-weight="400" fill="#334155" text-anchor="start">通用引擎按树高归纳；融合算子带运行时回退</text>
  <line x1="622" y1="315" x2="673" y2="315" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arr-blue)"/>
  <text x="648" y="305" font-size="8.4" font-weight="600" fill="#1d4ed8" text-anchor="middle">提交验证</text>
  <line x1="673" y1="175" x2="622" y2="175" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-slate)"/>
  <text x="648" y="154" font-size="8.4" font-weight="600" fill="#475569" text-anchor="middle">失败诊断</text>
  <text x="648" y="166" font-size="8.4" font-weight="600" fill="#475569" text-anchor="middle">迭代反馈</text>
  <rect x="675" y="73" width="265" height="405" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="675" y="73" width="265" height="28" rx="8" fill="#0f172a"/>
  <rect x="675" y="93" width="265" height="8" fill="#0f172a"/>
  <text x="687" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="start">3. 隔离验证与原生编译（只读）</text>
  <rect x="684" y="110" width="247" height="138" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="694" y="128" font-size="10.3" font-weight="700" fill="#1d4ed8" text-anchor="start">隔离 Verus + Z3 检查环境</text>
  <text x="694" y="147" font-size="9.1" font-weight="400" fill="#0f172a" text-anchor="start">• 固定入口先校验 p∈P、Q∈Q_Σ 与线程数</text>
  <text x="694" y="164" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 禁止 unsafe 指针与外部 FFI 库</text>
  <text x="694" y="181" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 禁用 assume / admit 等跳过证明注解</text>
  <text x="694" y="198" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• Verus 将代码/契约/引理转为逻辑 VC</text>
  <text x="694" y="215" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• Z3 SMT 全量校验目标 Eq. 2–5 成立</text>
  <text x="694" y="232" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">• 失败即拒收，并返回结构化报错迭代</text>
  <line x1="807" y1="248" x2="807" y2="264" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <rect x="684" y="266" width="247" height="98" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="694" y="284" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">单次验证并编译（--compile）</text>
  <text x="694" y="303" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 全程序验证通过后立即调用 rustc</text>
  <text x="694" y="320" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 编译器擦除全部 spec / proof 幽灵代码</text>
  <text x="694" y="337" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 生成原生共享库（.so）与已验证存储</text>
  <text x="694" y="354" font-size="9.1" font-weight="700" fill="#1d4ed8" text-anchor="start">• 查询执行期实现零证明检查开销</text>
  <line x1="807" y1="364" x2="807" y2="380" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>
  <rect x="684" y="382" width="247" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="694" y="400" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">运行期已验证保障</text>
  <text x="694" y="419" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 语义：声明域内全输入等价（Eq. 2–5）</text>
  <text x="694" y="436" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 安全：无内存损坏、越界、静默溢出</text>
  <text x="694" y="453" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• 并发与终止：只读共享 Fork-Join + 必停</text>
  <rect x="20" y="488" width="920" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="32" y="503" font-size="9.4" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">可信计算基（TCB）边界：</tspan>信任 SQLSpec、SQLGlot-to-SQLSpec 翻译器、Verus、Z3、rustc、OS/硬件及导入数据满足 Valid_Σ(D)；</text>
  <text x="32" y="517" font-size="9.0" font-weight="400" fill="#475569" text-anchor="start">Agent 生成的所有存储布局、执行代码、中间契约与证明均不被信任（必须通过独立隔离检查），终止性假设线程不饥饿与内存/栈充足。</text>
</svg>
