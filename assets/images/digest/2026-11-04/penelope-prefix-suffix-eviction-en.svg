<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Penelope Co-Design Architecture: Prefix-Safe Head-First Eviction, Same-Batch Phantom Recomputation, and Unified GPU-CPU Cache with Swap Buffer" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.2" font-weight="700" fill="#0f172a">Penelope Co-Design: Prefix-Safe Head-First Eviction, Phantom Recompute &amp; Unified Tiering</text>
  <text x="24" y="52" font-size="9.8" fill="#475569">From arXiv:2611.00391v1 (§2.2–§4, Fig. 1–3): protect shared prefixes and costly suffixes while preserving global head-first order across tiers</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1 -->
  <rect x="20" y="72" width="296" height="414" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="72" width="296" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="92" width="296" height="8" fill="#1e3a8a"/>
  <text x="32" y="90.5" font-size="10.4" font-weight="700" fill="#ffffff">1. Prefix-Safe Block-Level Eviction (§3.1)</text>

  <rect x="30" y="108" width="276" height="146" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="40" y="124" font-size="9.6" font-weight="700" fill="#1e3a8a">Trace Back from LRU Leaf to Eviction Start</text>
  <rect x="104" y="132" width="128" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="168" y="145.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e3a8a">Root · System Prompt / Tools</text>
  <line x1="168" y1="152" x2="168" y2="160" stroke="#1d4ed8" stroke-width="1.4"/>
  <rect x="98" y="160" width="140" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="168" y="173.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e3a8a">P · Multi-Child Fork (Safe)</text>
  <line x1="138" y1="180" x2="112" y2="193" stroke="#1d4ed8" stroke-width="1.4"/>
  <line x1="202" y1="180" x2="252" y2="193" stroke="#475569" stroke-width="1.2"/>
  <rect x="208" y="193" width="88" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="252" y="207.5" text-anchor="middle" font-size="8.4" fill="#334155">Sessions A / C</text>
  <rect x="38" y="193" width="160" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="118" y="207.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Start Node 1 · Private Head H</text>
  <line x1="118" y1="215" x2="118" y2="225" stroke="#475569" stroke-width="1.3"/>
  <rect x="38" y="225" width="160" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="118" y="239.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">LRU Leaf S · Retained Suffix</text>
  <path d="M 206 236 L 222 236 L 222 219 L 204 219" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="227" y="233" font-size="8.1" font-weight="700" fill="#dc2626">Trace back</text>
  <text x="227" y="245" font-size="7.9" fill="#475569">stops at P</text>

  <rect x="30" y="262" width="276" height="114" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="279" font-size="9.5" font-weight="700" fill="#0f172a">4 Stop Conditions + 64-Token Block Split</text>
  <text x="40" y="297" font-size="8.4" fill="#334155">1) Root parent  ·  2) Multi-child shared prefix</text>
  <text x="40" y="314" font-size="8.4" fill="#334155">3) Active refcount &gt; 0  ·  4) Missing parent KV</text>
  <text x="40" y="332" font-size="8.4" font-weight="600" fill="#1d4ed8">• Block release: split node, free only k leading blocks</text>
  <text x="40" y="349" font-size="8.4" fill="#334155">• LRU safety: split child inherits original timestamp</text>
  <text x="40" y="366" font-size="8.2" fill="#475569">• Unreferenced empty leaves prune upward when spent</text>

  <rect x="30" y="384" width="276" height="92" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="40" y="400" font-size="9.4" font-weight="700" fill="#1e3a8a">Position Cost Model (§2.2, Qwen3-8B H100)</text>
  <text x="40" y="417" font-size="8.4" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c(i) ≈ c_fixed + c_attn·(i+1), ratio = 23,552</text>
  <rect x="40" y="425" width="52" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="66" y="438.5" text-anchor="middle" font-size="8.1" font-weight="700" fill="#1e3a8a">P Keep</text>
  <rect x="94" y="425" width="66" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="127" y="438.5" text-anchor="middle" font-size="8.1" font-weight="700" fill="#991b1b">H Evict</text>
  <rect x="162" y="425" width="96" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="210" y="438.5" text-anchor="middle" font-size="8.1" font-weight="700" fill="#166534">S Keep (Costly)</text>
  <rect x="260" y="425" width="36" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.9"/>
  <text x="278" y="438.5" text-anchor="middle" font-size="8.1" font-weight="700" fill="#92400e">N</text>
  <text x="40" y="463" font-size="8.4" font-weight="600" fill="#1d4ed8">30% evict at 2K vs. tail: 1.14× (8K) → 2.93× (128K)</text>

  <line x1="316" y1="278" x2="330" y2="278" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Column 2 -->
  <rect x="332" y="72" width="308" height="414" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="332" y="72" width="308" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="332" y="92" width="308" height="8" fill="#1d4ed8"/>
  <text x="344" y="90.5" font-size="10.4" font-weight="700" fill="#ffffff">2. Gap Matching &amp; Phantom Recompute (§3.2)</text>

  <rect x="342" y="108" width="288" height="82" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="352" y="124" font-size="9.4" font-weight="700" fill="#1e3a8a">Returning Request: Match Past Gaps &amp; LPM Score</text>
  <rect x="352" y="132" width="60" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="382" y="147.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e3a8a">P Hit</text>
  <rect x="416" y="132" width="68" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="147.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">H Missing</text>
  <rect x="488" y="132" width="84" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="530" y="147.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">S Suffix Hit</text>
  <rect x="576" y="132" width="44" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="598" y="147.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">N New</text>
  <text x="352" y="176" font-size="8.3" fill="#334155">Retained tree links locate S across H; LPM counts P+S only</text>

  <line x1="486" y1="190" x2="486" y2="206" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="342" y="208" width="288" height="174" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="352" y="224" font-size="9.4" font-weight="700" fill="#1e3a8a">Same-Batch Phantom + Write-Before-Read Layers</text>

  <rect x="352" y="233" width="130" height="54" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="360" y="248" font-size="8.6" font-weight="700" fill="#991b1b">Phantom Request</text>
  <text x="360" y="263" font-size="8.1" fill="#334155">Prefill H at pos P+H</text>
  <text x="360" y="278" font-size="8.1" fill="#475569">0 output; keeps user cap</text>

  <rect x="490" y="233" width="130" height="54" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="498" y="248" font-size="8.6" font-weight="700" fill="#065f46">Real Request</text>
  <text x="498" y="263" font-size="8.1" fill="#334155">Run N at pos P+H+S+N</text>
  <text x="498" y="278" font-size="8.1" fill="#475569">Shares chunked budget</text>

  <rect x="352" y="295" width="268" height="78" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="362" y="311" font-size="8.9" font-weight="700" fill="#1e3a8a">Per-Layer Execution Flow (Single Forward Pass)</text>
  <text x="362" y="328" font-size="8.3" fill="#0f172a">1) QKV projection writes batch K/V first → fills H &amp; N</text>
  <text x="362" y="345" font-size="8.3" fill="#0f172a">2) Causal attention reads: Q_H→P+H; Q_N→P+H+S+N</text>
  <text x="362" y="362" font-size="8.2" font-weight="600" fill="#1d4ed8">3) Restored H stays cached for future turns (no 2-pass)</text>

  <rect x="342" y="390" width="288" height="86" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="407" font-size="9.4" font-weight="700" fill="#0f172a">Measured Overheads &amp; Determinism (§5.4)</text>
  <text x="352" y="425" font-size="8.3" fill="#334155">• Zero new GPU kernels; co-batch overhead &lt;1% (32–128K)</text>
  <text x="352" y="442" font-size="8.3" fill="#334155">• Cache-mgmt CPU time: 1.6% vs. 0.54% in SGLang</text>
  <text x="352" y="459" font-size="8.3" font-weight="600" fill="#1d4ed8">• 40K evict vs. 256K ref: bit-identical output &amp; logprobs</text>

  <line x1="640" y1="278" x2="654" y2="278" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Column 3 -->
  <rect x="656" y="72" width="284" height="414" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="656" y="72" width="284" height="28" rx="9" fill="#0f172a"/>
  <rect x="656" y="92" width="284" height="8" fill="#0f172a"/>
  <text x="668" y="90.5" font-size="10.4" font-weight="700" fill="#ffffff">3. Unified GPU–CPU &amp; Swap (§3.3)</text>

  <rect x="666" y="108" width="264" height="98" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="676" y="125" font-size="9.4" font-weight="700" fill="#1e3a8a">Exclusive Tiers = One Logical Eviction Order</text>
  <text x="676" y="143" font-size="8.3" fill="#334155">• Each segment lives in GPU or CPU only (exclusive)</text>
  <text x="676" y="160" font-size="8.3" fill="#334155">• Global victim chosen under unified LRU + head-first</text>
  <text x="676" y="177" font-size="8.3" fill="#334155">• CPU victim evicted first before GPU offload reuses it</text>
  <text x="676" y="194" font-size="8.3" fill="#1d4ed8">• Offloads marked CPU-resident at issue to keep order</text>

  <line x1="798" y1="206" x2="798" y2="220" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="666" y="222" width="264" height="178" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="676" y="239" font-size="9.4" font-weight="700" fill="#1e3a8a">Full-Tier Chunked Swap-Buffer Exchange</text>
  <text x="676" y="254" font-size="8.1" fill="#475569">1,024-tok CPU swap buffer B prevents order inversion</text>

  <rect x="676" y="263" width="244" height="39" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="684" y="279" font-size="8.4" font-weight="700" fill="#1d4ed8">1) Offload GPU [d,e,f] → free buffer B</text>
  <text x="684" y="294" font-size="8.0" fill="#475569">Async offload CUDA stream + completion event</text>

  <rect x="676" y="308" width="244" height="39" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.9"/>
  <text x="684" y="324" font-size="8.4" font-weight="700" fill="#065f46">2) Load CPU [a,b,c] → vacated GPU blocks</text>
  <text x="684" y="339" font-size="8.0" fill="#475569">Load waits for (1) event; compute waits for (2)</text>

  <rect x="676" y="353" width="244" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="684" y="369" font-size="8.4" font-weight="700" fill="#334155">3) Vacated CPU blocks rejoin swap buffer B</text>
  <text x="684" y="384" font-size="8.0" fill="#475569">Next offload waits for (2); zero extra evictions</text>

  <rect x="666" y="408" width="264" height="68" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="676" y="425" font-size="9.3" font-weight="700" fill="#0f172a">Tier Equivalence &amp; Negative Control (§5.4)</text>
  <text x="676" y="443" font-size="8.2" fill="#334155">• (128K+128K) matches 256K GPU pool (1,245 turns)</text>
  <text x="676" y="460" font-size="8.2" fill="#475569">• 602/763 full swaps; −256 tok control diverges</text>

  <rect x="20" y="496" width="920" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="514.5" font-size="8.8" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">Co-design invariant:</tspan> head-first position without 64-tok block splitting yields −6% TTFT (90–94% full-history loss); uncoordinated tiers break global eviction order.</text>
</svg>
