  <text x="605" y="391" font-size="8.1" fill="#475569">curation uncovered 46 source spec/theorem issues (35 fixed).</text>

  <rect x="494" y="406" width="436" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="501" y="415" width="96" height="20" rx="4" fill="#dbeafe"/>
