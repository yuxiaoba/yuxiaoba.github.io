  <text x="605" y="422" font-size="8.1" fill="#0f172a">Cahill SSI, MongoDB, Wildfire refinement, and Ivy NonStarvation</text>
  <text x="605" y="436" font-size="8.1" fill="#475569">fail 0% across all 12 configs (ordered histories &amp; fairness loops).</text>

  <rect x="494" y="451" width="436" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="501" y="460" width="96" height="20" rx="4" fill="#dbeafe"/>
  <text x="549" y="473.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">Abstraction Wins</text>
  <text x="605" y="467" font-size="8.1" fill="#0f172a">On ZooKeeper, Astra's claim abstraction solves 3 targets while</text>
  <text x="605" y="481" font-size="8.1" fill="#475569">Terra hits 2M cap at ~13k LOC; eval covers Codex GPTs only.</text>

