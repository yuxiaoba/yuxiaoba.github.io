  <text x="605" y="346" font-size="8.1" fill="#475569">success on all 265; 195 easier targets are retired (Table A1).</text>

  <rect x="494" y="361" width="436" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
