  <rect x="498" y="102" width="430" height="58" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="508" y="118" font-size="9.6" font-weight="700" fill="#1d4ed8">Fairway: Lower p99 in 10/11 (2–18%) · 1/11 tie · 0/11 starved</text>
  <text x="508" y="134" font-size="8.7" fill="#0f172a">• Up to 8.6× lower p99 vs. prior prefix-aware schedulers; worst wait ≤ 2.3× p99</text>
  <text x="508" y="150" font-size="8.7" fill="#334155">• SEC ρ=0.9: 3.82s (LPM 5.9s) · SEC ρ=1.1: 10.55s (−18% vs best, half LPM 22.2s)</text>

  <rect x="498" y="166" width="430" height="58" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
  <text x="508" y="182" font-size="9.5" font-weight="700" fill="#0f172a">k-LPM Dilemma (Table 4) &amp; Starving Baselines (max &gt; 3× p99)</text>
  <text x="508" y="198" font-size="8.6" fill="#334155">• k-LPM 4: +92% p99 on topic shift; k-LPM 8: +42%/+61% on SEC, +30% Mooncake</text>
  <text x="508" y="214" font-size="8.6" fill="#991b1b">• RAGCache starves 10/11 (max 16–365s; 11th p99=162s); PEEK 3/11; Preble +5–53%</text>

  <rect x="498" y="230" width="430" height="50" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.0"/>
  <text x="508" y="246" font-size="9.3" font-weight="700" fill="#92400e">Measured Median Tradeoff (§5.6, MuSiQue Shallow-Reuse Overload ρ=1.1)</text>
  <text x="508" y="261" font-size="8.5" fill="#78350f">When queues persist and partial hits save little, median rises to 3.0s (LPM 0.9s) for</text>
  <text x="508" y="274" font-size="8.5" fill="#78350f">lowest p99 (12.62s vs. 14.2s); removing relative wait raises MuSiQue p99 +37%</text>

