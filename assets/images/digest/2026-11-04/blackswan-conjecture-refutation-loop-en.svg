<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="start">BlackSwan: Pre-Execution Action Verification via Conjecture &amp; Refutation</text>
  <text x="24" y="53" font-size="10.0" font-weight="400" fill="#475569" text-anchor="start">From arXiv:2611.02950v1 (§3, Algorithm 1, Tables 4–5): Write-gated Expect–Suspect–Test; one confirmed suspicion withholds execution</text>
  <line x1="24" y1="63" x2="936" y2="63" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 1 -->
  <rect x="20" y="73" width="276" height="323" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="73" width="276" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="93" width="276" height="8" fill="#1e3a8a"/>
  <text x="32" y="91.5" font-size="10.6" font-weight="700" fill="#ffffff" text-anchor="start">1. Draft, Grounding &amp; Write Gate</text>

  <rect x="29" y="109" width="258" height="96" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="39" y="126" font-size="9.8" font-weight="700" fill="#1e3a8a" text-anchor="start">Code Action &amp; Word–Endpoint Table T</text>
  <text x="39" y="144" font-size="8.6" font-weight="400" fill="#334155" text-anchor="start">• Persistent REPL drafts one Python cell c</text>
  <text x="39" y="160" font-size="8.6" font-weight="400" fill="#334155" text-anchor="start">• Form rules: read docs first; isolate finish</text>
  <text x="39" y="176" font-size="8.6" font-weight="400" fill="#334155" text-anchor="start">• Table T (≤8/app): verbatim words → endpoint</text>
  <text x="39" y="192" font-size="8.4" font-weight="400" fill="#475569" text-anchor="start">• Logs broader general APIs to catch omissions</text>

  <line x1="158" y1="205" x2="158" y2="218" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="29" y="220" width="258" height="96" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="39" y="237" font-size="9.8" font-weight="700" fill="#1d4ed8" text-anchor="start">Pre-Execution Gate (Alg. 1 Line 5)</text>
  <rect x="37" y="247" width="115" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
  <text x="45" y="264" font-size="8.7" font-weight="700" fill="#166534" text-anchor="start">Read-Only Path</text>
  <text x="45" y="280" font-size="8.1" font-weight="400" fill="#166534" text-anchor="start">GET / doc lookups</text>
  <text x="45" y="295" font-size="8.1" font-weight="600" fill="#166534" text-anchor="start">/ login → run now</text>
  <rect x="162" y="247" width="117" height="58" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="170" y="264" font-size="8.7" font-weight="700" fill="#1e3a8a" text-anchor="start">Hold &amp; Verify</text>
  <text x="170" y="280" font-size="8.1" font-weight="400" fill="#1e3a8a" text-anchor="start">Any write / no-API</text>
  <text x="170" y="295" font-size="8.1" font-weight="600" fill="#1d4ed8" text-anchor="start">/ complete_task</text>

  <line x1="158" y1="316" x2="158" y2="329" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="29" y="331" width="258" height="55" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="39" y="348" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Static Analysis ANATOMY(c)</text>
  <text x="39" y="365" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">Lists eval-order variable bindings &amp; API calls</text>
  <text x="39" y="378" font-size="8.4" font-weight="400" fill="#475569" text-anchor="start">with all arguments (incl. unpassed defaults)</text>

  <line x1="297" y1="235" x2="316" y2="235" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arr-blue)"/>

  <!-- Column 2 -->
  <rect x="318" y="73" width="302" height="323" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <rect x="318" y="73" width="302" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="318" y="93" width="302" height="8" fill="#1d4ed8"/>
  <text x="330" y="91.5" font-size="10.6" font-weight="700" fill="#ffffff" text-anchor="start">2. Preregistered Conjecture: EXPECT + SUSPECT</text>

  <rect x="327" y="109" width="284" height="88" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="337" y="126" font-size="9.8" font-weight="700" fill="#1e3a8a" text-anchor="start">Stage 1 · EXPECT (Prompt 3, ≤500 chars)</text>
  <text x="337" y="144" font-size="8.6" font-weight="400" fill="#334155" text-anchor="start">• Predicts κt ~ π(·|ct-1, at) before any probing</text>
  <text x="337" y="160" font-size="8.6" font-weight="400" fill="#334155" text-anchor="start">• Strictly action-local: only what cell c achieves</text>
  <text x="337" y="176" font-size="8.6" font-weight="400" fill="#475569" text-anchor="start">• Bars “all / each / only” unless c establishes it</text>

  <line x1="469" y1="197" x2="469" y2="210" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="327" y="212" width="284" height="174" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="337" y="229" font-size="9.8" font-weight="700" fill="#1d4ed8" text-anchor="start">Stage 2 · SUSPECT (Prompt 4–5, ≤5 doubts)</text>
  <rect x="336" y="237" width="266" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="344" y="251.5" font-size="8.2" font-weight="700" fill="#92400e" text-anchor="start">Preregistered: fixed before reads to block bias</text>
  <text x="337" y="274" font-size="8.5" font-weight="600" fill="#0f172a" text-anchor="start">Anchored (si, zi) pairs across 5 falsifier kinds (Table 5):</text>
  <text x="337" y="292" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">1. Wrong object: mismatched entity or stale ID</text>
  <text x="337" y="309" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">2. Incomplete set: named records left uncovered</text>
  <text x="337" y="326" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">3. Wrong value: bad argument, unit, or endpoint</text>
  <text x="337" y="343" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">4. Hidden state: cart/account/prior cell interferes</text>
  <text x="337" y="360" font-size="8.4" font-weight="400" fill="#334155" text-anchor="start">5. Task's words: omitted clause or closer API in T</text>
  <text x="337" y="377" font-size="8.1" font-weight="400" fill="#475569" text-anchor="start">At finish: Prompt 5 audits uncalled writes vs T (≤2/task)</text>

  <line x1="621" y1="235" x2="640" y2="235" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arr-blue)"/>

  <!-- Column 3 -->
  <rect x="642" y="73" width="298" height="323" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="642" y="73" width="298" height="28" rx="8" fill="#0f172a"/>
  <rect x="642" y="93" width="298" height="8" fill="#0f172a"/>
  <text x="654" y="91.5" font-size="10.6" font-weight="700" fill="#ffffff" text-anchor="start">3. Read-Only Probing &amp; Asymmetric Gate</text>

  <rect x="651" y="109" width="280" height="114" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="661" y="126" font-size="9.8" font-weight="700" fill="#1e3a8a" text-anchor="start">Stage 3 · TEST (Prompt 6–7, ≤50 probes)</text>
  <text x="661" y="144" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• Unexecuted write at + St appended to history</text>
  <text x="661" y="160" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• Probes use only prior obs, GET, docs, or login</text>
  <text x="661" y="176" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• Extra writes refused; self-write probes → defer</text>
  <text x="661" y="192" font-size="8.5" font-weight="600" fill="#1d4ed8" text-anchor="start">• Burden on execution: seek refuting black swans</text>
  <text x="661" y="209" font-size="8.2" font-weight="400" fill="#475569" text-anchor="start">• Every si needs ≤400-char observational grounds</text>

  <line x1="791" y1="223" x2="791" y2="236" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="651" y="238" width="280" height="148" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="661" y="255" font-size="9.8" font-weight="700" fill="#1d4ed8" text-anchor="start">Verdict vt(si) &amp; Release Rule (Eq. 4a–4b)</text>

  <rect x="660" y="264" width="262" height="44" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1.0"/>
  <text x="669" y="281" font-size="8.7" font-weight="700" fill="#991b1b" text-anchor="start">confirmed (any si = true) → Withhold at</text>
  <text x="669" y="297" font-size="8.1" font-weight="400" fill="#7f1d1d" text-anchor="start">Pass vt as context &amp; redraft a't (max 3 retries/step)</text>

  <rect x="660" y="314" width="262" height="44" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1.0"/>
  <text x="669" y="331" font-size="8.7" font-weight="700" fill="#166534" text-anchor="start">dismissed / deferred (all si) → Execute at</text>
  <text x="669" y="347" font-size="8.1" font-weight="400" fill="#14532d" text-anchor="start">deferred reserved for runtime-dependent checks only</text>

  <text x="661" y="376" font-size="8.1" font-weight="400" fill="#475569" text-anchor="start">Note (Alg. 1 L13): 4th draft executes even if blocked</text>

  <!-- Bottom Strip -->
  <rect x="20" y="406" width="920" height="116" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="406" width="920" height="24" rx="8" fill="#eff6ff"/>
  <rect x="20" y="422" width="920" height="8" fill="#eff6ff"/>
  <text x="32" y="422" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="start">Qualitative Contrast (Appendix F Tables 9–10, Qwen3.5-27B Thinking Off): Why Confirmation-First Misses Faults</text>
  <line x1="480" y1="434" x2="480" y2="515" stroke="#cbd5e1" stroke-width="1.0"/>

  <!-- Case 1 -->
  <text x="32" y="447" font-size="9.0" font-weight="700" fill="#0f172a" text-anchor="start">Case A · Disable Canceled Meeting Alarms (c1091c7_1)</text>
  <text x="32" y="464" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start">• Shared prefix: Gmail query "cancel meeting" → disables 744 &amp; 745</text>
  <text x="32" y="481" font-size="8.2" font-weight="400" fill="#991b1b" text-anchor="start">• ACCORD (confirm): re-queries "cancel", sees 2 matches handled →</text>
  <text x="39" y="495" font-size="8.2" font-weight="400" fill="#991b1b" text-anchor="start">APPROVE! Misses Stephen's "Skip this time?" / "Cannot make it." (743 ✗)</text>
  <text x="32" y="511" font-size="8.2" font-weight="600" fill="#166534" text-anchor="start">• BlackSwan (refute): probes alternate phrasings → finds 743 &amp; fixes ✓</text>

  <!-- Case 2 -->
  <text x="492" y="447" font-size="9.0" font-weight="700" fill="#0f172a" text-anchor="start">Case B · Crescent Wrench Return Check (3650990_3)</text>
  <text x="492" y="464" font-size="8.2" font-weight="400" fill="#334155" text-anchor="start">• Shared prefix: checks 33 returns by product_name → drafts "no"</text>
  <text x="492" y="481" font-size="8.2" font-weight="400" fill="#991b1b" text-anchor="start">• ACCORD (confirm): sees "Craftsman 8-Inch Adjustable Wrench", notes</text>
  <text x="499" y="495" font-size="8.2" font-weight="400" fill="#991b1b" text-anchor="start">name lacks "crescent wrench" → APPROVE "no" (GT: yes ✗)</text>
  <text x="492" y="511" font-size="8.2" font-weight="600" fill="#166534" text-anchor="start">• BlackSwan (refute): searches catalog → sees product_type match → yes ✓</text>
</svg>