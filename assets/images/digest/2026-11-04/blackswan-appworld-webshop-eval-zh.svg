  <text x="524" y="423" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• 成本换精度：统一单价达 ReAct 1.5–9.4×（27B Challenge $0.447 vs $0.047）</text>
  <text x="524" y="440" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• 关思考折衷：27B 生成 token 从 22.9k 降至 7.3k（-68%），TGC 仍保 81.5%</text>
  <text x="524" y="457" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• 非安全保证：未证伪 ≠ 证明安全；Alg. 1 第 13 行在连拦 3 次后第 4 稿仍会放行</text>
  <text x="524" y="474" font-size="8.5" font-weight="400" fill="#334155" text-anchor="start">• 歧义空转风险：指令真有多种合理解释时会重复触发同类怀疑，需升级给用户澄清</text>
  <text x="524" y="491" font-size="8.4" font-weight="400" fill="#475569" text-anchor="start">• 评测环境边界：全在受控沙盒内运行；跨模型列仅单次运行且基线示例数不同</text>
