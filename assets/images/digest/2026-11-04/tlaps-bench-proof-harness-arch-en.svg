  <rect x="20" y="90" width="276" height="8" fill="#1e3a8a"/>
  <text x="32" y="88.5" font-size="10.8" font-weight="700" fill="#ffffff">1. Task Construction &amp; 3-Module Split (§4.2)</text>

  <rect x="30" y="106" width="256" height="96" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="124" font-size="10.2" font-weight="700" fill="#1e3a8a">Real-World Specs &amp; Rewrites</text>
  <text x="40" y="144" font-size="8.6" fill="#334155">• 95 specs, 265 targets (12 / 70 active eval)</text>
  <text x="40" y="163" font-size="8.6" fill="#334155">• .cfg constants → ASSUME; Ivy → TLA+ (Fig. 5)</text>
  <text x="40" y="182" font-size="8.6" fill="#334155">• Strip prior proofs; 35/46 spec bugs fixed</text>

  <line x1="158" y1="202" x2="158" y2="213" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="214" width="256" height="162" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="40" y="232" font-size="10.2" font-weight="700" fill="#1e3a8a">SANY Transitive Closure Split (Fig. 6)</text>

