  <rect x="683" y="361" width="238" height="21" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="690" y="374.5" font-size="8.0" font-weight="600" fill="#991b1b">Blocked: fake /opt/tlapm/bin/tlapm (Fig. 4c)</text>
  <text x="683" y="399" font-size="8.3" fill="#334155">• Drops local scripts/wrappers in fresh container</text>
  <text x="683" y="417" font-size="8.3" fill="#334155">• Grades only Task.tla with unmodified binaries</text>

