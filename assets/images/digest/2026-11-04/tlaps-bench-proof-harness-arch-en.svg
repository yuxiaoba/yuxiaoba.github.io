  <text x="683" y="305" font-size="8.3" fill="#334155">• Target passes iff all transitive lemmas pass</text>

  <rect x="674" y="330" width="256" height="104" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="683" y="338" width="52" height="17" rx="4" fill="#dbeafe"/>
