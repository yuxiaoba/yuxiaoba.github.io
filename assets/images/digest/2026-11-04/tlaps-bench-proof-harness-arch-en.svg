  <text x="742" y="238" font-size="9.8" font-weight="700" fill="#0f172a">Dependency Tracking</text>
  <rect x="683" y="249" width="238" height="21" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="690" y="262.5" font-size="8.0" font-weight="600" fill="#92400e">Blocked: PROOF OMITTED NextInv (Fig. 4b)</text>
