  <text x="683" y="193" font-size="8.3" fill="#334155">• Bans ASSUME, AXIOM, CONSTANT, VARIABLE, WITH</text>

  <rect x="674" y="218" width="256" height="104" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
