  <text x="44" y="274" font-size="8.2" fill="#475569">Variables, Init, Next, Spec &amp; ASSUMEs</text>

  <rect x="38" y="286" width="240" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="292" width="54" height="16" rx="4" fill="#dbeafe"/>
  <text x="71" y="303.5" text-anchor="middle" font-size="8.0" font-weight="700" fill="#1d4ed8">Read-Only</text>
  <text x="104" y="303.5" font-size="9.0" font-weight="700" fill="#0f172a">Defs.tla</text>
  <text x="44" y="318" font-size="8.2" fill="#475569">Target predicates &amp; transitive dependencies</text>

  <rect x="38" y="330" width="240" height="38" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
