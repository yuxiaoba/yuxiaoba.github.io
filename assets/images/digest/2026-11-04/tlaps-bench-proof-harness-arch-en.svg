  <text x="44" y="362" font-size="8.2" fill="#334155">HELPERS &amp; PROOF blocks open; theorems locked</text>

  <line x1="158" y1="376" x2="158" y2="387" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="388" width="256" height="98" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="406" font-size="10.2" font-weight="700" fill="#0f172a">Workspace Isolation (§3)</text>
  <text x="40" y="426" font-size="8.6" fill="#334155">• Fresh 8-vCPU Docker; no cross-run memory</text>
  <text x="40" y="445" font-size="8.6" fill="#334155">• Network restricted to LLM APIs (no search)</text>
  <text x="40" y="464" font-size="8.6" fill="#334155">• Local scratch/ &amp; wrappers excluded at grade</text>

  <line x1="296" y1="265" x2="311" y2="265" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Column 2: TILAPIA Agent Loop -->
  <rect x="312" y="70" width="336" height="426" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="312" y="70" width="336" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="312" y="90" width="336" height="8" fill="#1d4ed8"/>
  <text x="324" y="88.5" font-size="10.8" font-weight="700" fill="#ffffff">2. TILAPIA In-Container Proof Loop (§3.1)</text>

  <rect x="322" y="106" width="316" height="94" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="330" y="113" width="66" height="17" rx="4" fill="#1d4ed8"/>
  <text x="363" y="124.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">AI Agent</text>
  <text x="404" y="125" font-size="10.0" font-weight="700" fill="#0f172a">Codex / Claude Code + 2 Guided Skills</text>
  <text x="330" y="145" font-size="8.5" fill="#334155">• Discovers inductive invariants, abstractions &amp; lemmas</text>
  <text x="330" y="164" font-size="8.4" fill="#1e3a8a">• tlaps-proof-hints: bridge I!Pos(n) = Pos(n) mismatch</text>
  <text x="330" y="183" font-size="8.4" fill="#1e3a8a">• inv-validation: 3 checks (Init / IndStep / Safety)</text>

  <line x1="398" y1="200" x2="398" y2="211" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="561" y1="200" x2="561" y2="211" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="322" y="212" width="153" height="114" rx="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
  <text x="331" y="230" font-size="9.5" font-weight="700" fill="#0369a1">Fast Falsification</text>
  <text x="331" y="248" font-size="8.3" fill="#0f172a">• TLC (explicit-state)</text>
  <text x="331" y="266" font-size="8.3" fill="#0f172a">• Apalache (SMT check)</text>
  <text x="331" y="284" font-size="8.3" fill="#334155">• Traces refine missing</text>
  <text x="331" y="302" font-size="8.2" fill="#475569">  states; never cites pass</text>

  <rect x="485" y="212" width="153" height="114" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1"/>
  <text x="494" y="230" font-size="9.5" font-weight="700" fill="#1e3a8a">Semantic &amp; Libraries</text>
  <text x="494" y="248" font-size="8.3" fill="#0f172a">• SANY --sany-only</text>
  <text x="494" y="266" font-size="8.3" fill="#334155">  fast syntax feedback</text>
  <text x="494" y="284" font-size="8.3" fill="#0f172a">• Pinned TLAPS Library</text>
  <text x="494" y="302" font-size="8.2" fill="#334155">  &amp; CommunityModules</text>

  <line x1="398" y1="326" x2="398" y2="337" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="561" y1="326" x2="561" y2="337" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="322" y="338" width="316" height="148" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="332" y="356" font-size="10.0" font-weight="700" fill="#1e3a8a">TLAPS Proof Checker (check_proof_bin)</text>

  <rect x="332" y="366" width="94" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="379" y="381" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Z3 (SMT)</text>
  <text x="379" y="395" text-anchor="middle" font-size="7.9" fill="#334155">SMTT("rN") ≤ r30</text>

  <rect x="433" y="366" width="94" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480" y="381" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Isabelle/TLA+</text>
  <text x="480" y="395" text-anchor="middle" font-size="7.9" fill="#334155">Isa sets/higher-order</text>

  <rect x="534" y="366" width="94" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="581" y="381" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">LS4 (Temporal)</text>
  <text x="581" y="395" text-anchor="middle" font-size="7.9" fill="#334155">PTL propositional</text>

  <text x="332" y="421" font-size="8.5" fill="#334155">• Strict mode rejects omitted steps; OMITTED banned</text>
  <text x="332" y="440" font-size="8.5" fill="#334155">• 60 min module timeout; 2M cumulative output token cap</text>
  <text x="332" y="459" font-size="8.5" fill="#334155">• Pause/resume retains verified units and solver cache</text>
  <text x="332" y="477" font-size="8.3" font-weight="600" fill="#1d4ed8">↺ Per-obligation status drives next decomposition step</text>

  <line x1="648" y1="265" x2="663" y2="265" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

