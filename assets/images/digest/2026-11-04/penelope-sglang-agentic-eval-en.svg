<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Penelope Empirical Evaluation Four-Panel Chart: GPU-Only vs Two-Tier Regimes, Position-Granularity Ablation, and Sensitivity to Schedulers, Concurrency, and Capacity Ratios" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.2" font-weight="700" fill="#0f172a">Penelope Empirical Evaluation: Separated Regimes, Ablations &amp; Sensitivity Limits</text>
  <text x="24" y="52" font-size="9.8" fill="#475569">From arXiv:2611.00391v1 (§5.2–§5.4, Tables 1–6, Figs. 4–6) · H100 &amp; A100 benchmarks on Qwen3-8B/32B (128K YaRN) &amp; 235B-A22B-FP8 (256K)</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A -->
  <rect x="20" y="72" width="452" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="10.4" font-weight="700" fill="#1e3a8a">A. GPU-Only Reductions vs. SGLang (H100 / A100, T1, T5, Fig. 4)</text>
  <text x="32" y="113" font-size="8.4" fill="#475569">Dark blue = Mean TTFT drop · Light blue = Mean JCT drop (CC / FI trace replay)</text>

  <text x="140" y="132" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">8B CC4 (H100)</text>
  <rect x="146" y="122" width="144.0" height="7" rx="2" fill="#1d4ed8"/>
  <text x="296" y="128.5" font-size="8.1" font-weight="700" fill="#1d4ed8">−60% (6.7→2.7s)</text>
  <rect x="146" y="131" width="88.8" height="7" rx="2" fill="#60a5fa"/>
  <text x="240" y="137.5" font-size="8.1" fill="#334155">−37% (77.5→48.8m)</text>

  <text x="140" y="156" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">8B CC8 (H100)</text>
  <rect x="146" y="146" width="98.4" height="7" rx="2" fill="#1d4ed8"/>
  <text x="250" y="152.5" font-size="8.1" font-weight="600" fill="#1d4ed8">−41% (20.7→12.3s)</text>
  <rect x="146" y="155" width="72.0" height="7" rx="2" fill="#60a5fa"/>
  <text x="224" y="161.5" font-size="8.1" fill="#334155">−30%</text>

  <text x="140" y="180" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">32B CC4 (H100)</text>
  <rect x="146" y="170" width="108.0" height="7" rx="2" fill="#1d4ed8"/>
  <text x="260" y="176.5" font-size="8.1" font-weight="600" fill="#1d4ed8">−45% (11.0→6.0s)</text>
  <rect x="146" y="179" width="74.4" height="7" rx="2" fill="#60a5fa"/>
  <text x="226" y="185.5" font-size="8.1" fill="#334155">−31%</text>

  <text x="140" y="204" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">235B CC4 (H100)</text>
  <rect x="146" y="194" width="103.2" height="7" rx="2" fill="#1d4ed8"/>
  <text x="255" y="200.5" font-size="8.1" font-weight="600" fill="#1d4ed8">−43% (17.0→9.8s)</text>
  <rect x="146" y="203" width="79.2" height="7" rx="2" fill="#60a5fa"/>
  <text x="231" y="209.5" font-size="8.1" fill="#334155">−33%</text>

  <text x="140" y="228" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">8B CC4 (A100)</text>
  <rect x="146" y="218" width="124.8" height="7" rx="2" fill="#1d4ed8"/>
  <text x="276" y="224.5" font-size="8.1" font-weight="600" fill="#1d4ed8">−52% (19.1→9.1s)</text>
  <rect x="146" y="227" width="100.8" height="7" rx="2" fill="#60a5fa"/>
  <text x="252" y="233.5" font-size="8.1" fill="#334155">−42% (180→104m)</text>

  <text x="140" y="252" text-anchor="end" font-size="8.7" font-weight="700" fill="#0f172a">8B FI N=4 (H100)</text>
  <rect x="146" y="242" width="76.8" height="7" rx="2" fill="#1d4ed8"/>
  <text x="228" y="248.5" font-size="8.1" font-weight="600" fill="#1d4ed8">−32% TTFT (FI N=3: −30%)</text>
  <rect x="146" y="251" width="5.0" height="7" rx="2" fill="#94a3b8"/>
  <text x="157" y="257.5" font-size="8.1" fill="#475569">−2% JCT (sessions dominated by tool waits)</text>

  <text x="32" y="270" font-size="8.0" fill="#475569">Also: 32B CC8 −36%/−27% · A100 CC8 −41%/−35% (tool waits 4–9% vs. 10–22% on H100)</text>

  <!-- Panel B -->
  <rect x="488" y="72" width="452" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="98" x2="940" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="89.5" font-size="10.4" font-weight="700" fill="#1e3a8a">B. Two-Tier GPU–CPU (vs. CPU-Aware LPM SGLang, Table 2)</text>
  <text x="500" y="113" font-size="8.4" fill="#475569">Baseline counts CPU prefixes (already −13–37% TTFT) &amp; holds +1,024 more usable tokens</text>

  <text x="614" y="136" text-anchor="end" font-size="8.6" font-weight="700" fill="#0f172a">8B N=4 (128/128K)</text>
  <rect x="620" y="125" width="136.8" height="7.5" rx="2" fill="#1d4ed8"/>
  <text x="762" y="132" font-size="8.1" font-weight="600" fill="#1d4ed8">−57% (10.4→4.5s)</text>
  <rect x="620" y="135" width="91.2" height="7.5" rx="2" fill="#60a5fa"/>
  <text x="717" y="142" font-size="8.1" fill="#334155">−38% (81→50m)</text>

  <text x="614" y="167" text-anchor="end" font-size="8.6" font-weight="700" fill="#0f172a">8B N=8 (128/128K)</text>
  <rect x="620" y="156" width="110.4" height="7.5" rx="2" fill="#1d4ed8"/>
  <text x="736" y="163" font-size="8.1" font-weight="600" fill="#1d4ed8">−46% (23.5→12.8s)</text>
  <rect x="620" y="166" width="86.4" height="7.5" rx="2" fill="#60a5fa"/>
  <text x="712" y="173" font-size="8.1" fill="#334155">−36% (124→79m)</text>

  <text x="614" y="198" text-anchor="end" font-size="8.6" font-weight="700" fill="#0f172a">32B N=4 (128/128K)</text>
  <rect x="620" y="187" width="156.0" height="7.5" rx="2" fill="#1d4ed8"/>
  <text x="782" y="194" font-size="8.1" font-weight="600" fill="#1d4ed8">−65% (11.0→3.9s)</text>
  <rect x="620" y="197" width="105.6" height="7.5" rx="2" fill="#60a5fa"/>
  <text x="731" y="204" font-size="8.1" fill="#334155">−44% (84→47m)</text>

  <text x="614" y="229" text-anchor="end" font-size="8.6" font-weight="700" fill="#0f172a">235B N=4 (256/256K)</text>
  <rect x="620" y="218" width="182.4" height="7.5" rx="2" fill="#1e3a8a"/>
  <text x="808" y="225" font-size="8.1" font-weight="700" fill="#1e3a8a">−76% (24.2→5.8s)</text>
  <rect x="620" y="228" width="144.0" height="7.5" rx="2" fill="#60a5fa"/>
  <text x="770" y="235" font-size="8.1" font-weight="600" fill="#334155">−60% (359→142m)</text>

  <rect x="500" y="246" width="428" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="508" y="260.5" font-size="8.0" font-weight="600" fill="#92400e">Control: 235B on 8B/32B trace &amp; 128/128K drops TTFT −76%→−49% (hit gap +43→+27 pt)</text>

  <!-- Panel C -->
  <rect x="20" y="288" width="452" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="288" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="306" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="314" x2="472" y2="314" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="305.5" font-size="10.4" font-weight="700" fill="#1e3a8a">C. Joint Ablation: Position × Granularity (8B CC4, T4 &amp; T6)</text>
  <text x="32" y="328" font-size="8.3" fill="#475569">Position alone fails under node release; block split + private-start eviction work jointly</text>

  <rect x="32" y="336" width="428" height="48" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="351" font-size="8.6" font-weight="700" fill="#334155">Node-Level Release (90–94% recompute from ≥90%-lost private histories)</text>
  <rect x="42" y="358" width="136" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="110" y="371.5" text-anchor="middle" font-size="7.9" fill="#334155">Last tail (SGL): 64.5% | 0%</text>
  <rect x="184" y="358" width="132" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="250" y="371.5" text-anchor="middle" font-size="7.9" fill="#334155">Last head: 69.0% | −12%</text>
  <rect x="322" y="358" width="128" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="386" y="371.5" text-anchor="middle" font-size="7.9" fill="#334155">Priv start: 66.7% | −6%</text>

  <rect x="32" y="390" width="428" height="76" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="42" y="405" font-size="8.6" font-weight="700" fill="#1e3a8a">Block-Level Release (≥90%-lost history share drops to 16–23%)</text>

  <text x="150" y="422.5" text-anchor="end" font-size="8.2" fill="#334155">Last-node tail</text>
  <rect x="156" y="414" width="90" height="10" rx="2" fill="#60a5fa"/>
  <text x="252" y="422.5" font-size="8.0" fill="#334155">−45% TTFT / −28% JCT (82.6% hit)</text>

  <text x="150" y="439.5" text-anchor="end" font-size="8.2" fill="#334155">Last-node head</text>
  <rect x="156" y="431" width="86" height="10" rx="2" fill="#93c5fd"/>
  <text x="248" y="439.5" font-size="8.0" fill="#334155">−43% TTFT / −26% JCT (81.5% hit)</text>

  <text x="150" y="456.5" text-anchor="end" font-size="8.2" font-weight="700" fill="#1e3a8a">Private-start (Penelope)</text>
  <rect x="156" y="448" width="126" height="10" rx="2" fill="#1d4ed8"/>
  <text x="288" y="456.5" font-size="8.0" font-weight="700" fill="#1d4ed8">−63% TTFT / −39% JCT (84.5% hit)</text>

  <text x="32" y="482" font-size="8.0" font-weight="600" fill="#1d4ed8">Table 6 (8B CC4): equal 83.6% hit, yet head-first TTFT 2.7s beats block-tail 3.8s (−29%)</text>

  <!-- Panel D -->
  <rect x="488" y="288" width="452" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="288" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="306" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="314" x2="940" y2="314" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="305.5" font-size="10.4" font-weight="700" fill="#1e3a8a">D. Sensitivity: Scheduler, Concurrency &amp; Tier Ratio (§5.3)</text>

  <rect x="500" y="321" width="428" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="510" y="337" font-size="8.8" font-weight="700" fill="#1e3a8a">1. Scheduler Coupling: LPM vs. FCFS (CC N=4, Table 3)</text>
  <line x1="510" y1="343" x2="918" y2="343" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="510" y="355" font-size="8.0" font-weight="700" fill="#475569">Model</text>
  <text x="568" y="355" font-size="8.0" font-weight="700" fill="#1d4ed8">LPM: ΔTTFT (Full-miss SGL→Pen)</text>
  <text x="752" y="355" font-size="8.0" font-weight="700" fill="#b45309">FCFS: ΔTTFT (Full-miss SGL→Pen)</text>

  <text x="510" y="371" font-size="8.1" font-weight="700" fill="#0f172a">8B</text>
  <text x="568" y="371" font-size="8.1" fill="#0f172a">−60%  (27.9% → 2.2%)</text>
  <text x="752" y="371" font-size="8.1" fill="#334155">−47%  (30.1% → 5.8%)</text>

  <text x="510" y="387" font-size="8.1" font-weight="700" fill="#0f172a">32B</text>
  <text x="568" y="387" font-size="8.1" fill="#0f172a">−45%  (45.0% → 8.6%)</text>
  <text x="752" y="387" font-size="8.1" fill="#92400e">−26%  (50.2% → 21.0%)</text>

  <text x="510" y="403" font-size="8.1" font-weight="700" fill="#0f172a">235B</text>
  <text x="568" y="403" font-size="8.1" fill="#0f172a">−43%  (28.8% → 3.9%)</text>
  <text x="752" y="403" font-size="8.1" fill="#92400e">−17%  (35.5% → 21.4%)</text>

  <rect x="500" y="417" width="428" height="69" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="510" y="432" font-size="8.8" font-weight="700" fill="#1e3a8a">2. Cache Pressure Sweet Spot (Concurrency Fig. 5 &amp; Ratio Fig. 6)</text>
  <text x="510" y="448" font-size="8.0" fill="#334155">• N=2 (8B 256K fits): 99.5% hit (&lt;3% diff); N=24 still −31%/−29% TTFT (8B/32B)</text>
  <text x="510" y="463" font-size="8.0" fill="#334155">• CPU/GPU (8B CC8 FCFS): 1:1 −10% → peaks at 3:1 (−35% TTFT / −28% JCT)</text>
  <text x="510" y="478" font-size="8.0" fill="#475569">• CPU/GPU 4:1: SGLang reaches 92% hit (vs. 94%), shrinking diff to −2% / −1%</text>

  <rect x="20" y="500" width="920" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="518.5" font-size="8.7" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">Scope boundary:</tspan> GPU-only maxima (−60%/−37% on 8B) and two-tier maxima (−76%/−60% on 235B) reflect distinct models/capacities under capped-GPU trace replay.</text>
</svg>
