  <text x="549" y="338.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">70 vs 265 分母</text>
  <text x="605" y="332" font-size="8.2" fill="#0f172a">44.3%（31/70）为 70 活跃题 pass@3，非 265 全集或单次；</text>
  <text x="605" y="346" font-size="8.2" fill="#475569">Table A1 其余 195 题多因前沿模型已可解而被退役。</text>

