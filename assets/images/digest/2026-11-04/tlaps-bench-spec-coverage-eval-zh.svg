  <text x="549" y="383.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">规格 vs 实现</text>
  <text x="605" y="377" font-size="8.2" fill="#0f172a">证明建立形式规格 Spec ⇒ P，不等同生产代码正确；</text>
  <text x="605" y="391" font-size="8.2" fill="#475569">建库期即在原规格发现 46 处模型/定理缺陷（35 已修）。</text>

  <rect x="494" y="406" width="436" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="501" y="415" width="96" height="20" rx="4" fill="#dbeafe"/>
  <text x="549" y="428.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">四大 0% 瓶颈</text>
  <text x="605" y="422" font-size="8.2" fill="#0f172a">Cahill SSI、MongoDB、Wildfire 精化及 Ivy TLB 活性全为 0%；</text>
  <text x="605" y="436" font-size="8.2" fill="#475569">共享多操作、排序历史精化与强公平进度证明仍卡壳。</text>

  <rect x="494" y="451" width="436" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
