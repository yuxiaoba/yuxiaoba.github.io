<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="IntentOS 双路径 isyscall 执行、分层微系统调用与内核安全隔离架构图" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.2" font-weight="700" fill="#0f172a">IntentOS：双路径 isyscall 执行、分层微系统调用与安全隔离架构</text>
  <text x="24" y="51" font-size="9.8" fill="#475569">依据 arXiv:2611.00002v1（§3–§5, Fig. 5, Fig. 7–8, Table 3）：将意图解析、计划缓存与内核级微系统调用安全边界完全解耦</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: User Space -->
  <rect x="20" y="70" width="224" height="398" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="70" width="224" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="90" width="224" height="8" fill="#1e3a8a"/>
  <text x="31" y="88.5" font-size="10.5" font-weight="700" fill="#ffffff">1. 用户态入口与参数解耦</text>

  <rect x="29" y="106" width="206" height="84" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="38" y="123" font-size="10.0" font-weight="700" fill="#1e3a8a">三类 isyscall 入口 (§5.1)</text>
  <text x="38" y="140" font-size="8.7" fill="#0f172a">• isyscall_rt：运行时意图+缓存</text>
  <text x="38" y="157" font-size="8.7" fill="#334155">• isyscall_dev：直跑预编计划</text>
  <text x="38" y="174" font-size="8.7" fill="#475569">• isyscall_dry_run：仅编译不执行</text>

  <line x1="132" y1="190" x2="132" y2="204" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="29" y="206" width="206" height="114" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="223" font-size="10.0" font-weight="700" fill="#1e3a8a">参数解耦载荷 (Fig. 6–7)</text>
  <text x="38" y="241" font-size="8.6" fill="#334155">• intent：描述语义与 arg 占位索引</text>
  <text x="38" y="258" font-size="8.6" fill="#334155">• args_list (u64[])：8B 统一实参槽</text>
  <text x="38" y="275" font-size="8.6" fill="#1d4ed8" font-weight="600">• 换参直接按 Plan ID 复用计划</text>
  <text x="38" y="292" font-size="8.6" fill="#334155">• 跨进程状态入口转交内核态保存</text>
  <text x="38" y="309" font-size="8.6" fill="#475569">• ret_from_fork 回调子进程重入</text>

  <line x1="132" y1="320" x2="132" y2="334" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="29" y="336" width="206" height="123" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="38" y="353" font-size="10.0" font-weight="700" fill="#1d4ed8">可执行节点链表 (Fig. 7)</text>
  <rect x="37" y="364" width="56" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="65" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#0f172a">Func</text>
  <text x="65" y="392" text-anchor="middle" font-size="7.8" fill="#475569">arg1, arg3</text>
  <line x1="93" y1="382" x2="103" y2="382" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="105" y="364" width="56" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="133" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1e3a8a">Ctrl</text>
  <text x="133" y="392" text-anchor="middle" font-size="7.8" fill="#1e3a8a">if / loop</text>
  <line x1="161" y1="382" x2="171" y2="382" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect x="173" y="364" width="54" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="379" text-anchor="middle" font-size="8.4" font-weight="700" fill="#0f172a">Func</text>
  <text x="200" y="392" text-anchor="middle" font-size="7.8" fill="#475569">idx 5</text>
  <text x="38" y="420" font-size="8.4" fill="#334155">• 返回值动态追加 args_list 供引用</text>
  <text x="38" y="437" font-size="8.4" fill="#334155">• 任一步失败立即回滚并报用户态</text>
  <text x="38" y="452" font-size="8.1" fill="#475569">（链表结构由内核执行器直接解释）</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="244" y1="148" x2="268" y2="148" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="256" cy="133" r="8" fill="#1d4ed8"/>
  <text x="256" y="136.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">1</text>

  <!-- Column 2: Kernel Execution Plane -->
  <rect x="270" y="70" width="416" height="398" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="270" y="70" width="416" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="270" y="90" width="416" height="8" fill="#1d4ed8"/>
  <text x="282" y="88.5" font-size="10.5" font-weight="700" fill="#ffffff">2. 内核执行平面（快路径缓存 + 4 重安全边界）</text>

  <!-- Fast Path Cache -->
  <rect x="279" y="106" width="194" height="90" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <rect x="287" y="113" width="64" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="319" y="124.2" text-anchor="middle" font-size="8.2" font-weight="700" fill="#166534">Fast Path</text>
  <text x="357" y="125" font-size="9.6" font-weight="700" fill="#1e3a8a">Intent Plan Cache</text>
  <text x="287" y="144" font-size="8.5" fill="#0f172a">• 命中直跑链表，0 LLM 推理</text>
  <text x="287" y="161" font-size="8.5" fill="#1d4ed8" font-weight="600">• 框架开销 ≤ 6.714% (Fig. 14)</text>
  <text x="287" y="178" font-size="8.5" fill="#475569">• 采集调用频次与热意图指标</text>

  <!-- Static Verifier -->
  <rect x="483" y="106" width="194" height="90" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="491" y="113" width="54" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="518" y="124.2" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">静态准入</text>
  <text x="551" y="125" font-size="9.6" font-weight="700" fill="#0f172a">有界循环校验 (§4.4)</text>
  <text x="491" y="144" font-size="8.5" fill="#334155">• loop-control 与工具参数分离</text>
  <text x="491" y="161" font-size="8.5" fill="#334155">• 校验初值/迭代必达终止条件</text>
  <text x="491" y="178" font-size="8.5" fill="#475569">• 通过静态检验方可写入缓存</text>

  <!-- Safe Micro-Syscall Guarantees -->
  <rect x="279" y="204" width="398" height="114" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.1"/>
  <text x="289" y="220" font-size="9.8" font-weight="700" fill="#0f172a">Safe Micro-Syscall 四重隔离保障（§4.3 · 安全性独立于 LLM 正确性）</text>

  <rect x="287" y="228" width="187" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="294" y="242" font-size="8.8" font-weight="700" fill="#1d4ed8">① 执行前 6 类参数校验</text>
  <text x="294" y="258" font-size="8.0" fill="#334155">UPtr · Exist · Len/OVF · Perm · RLimit · Flags</text>

  <rect x="482" y="228" width="187" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="489" y="242" font-size="8.8" font-weight="700" fill="#1d4ed8">② 对象句柄间接访问</text>
  <text x="489" y="258" font-size="8.0" fill="#334155">内核资源不裸露指针，句柄控生命周期</text>

  <rect x="287" y="273" width="187" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="294" y="287" font-size="8.8" font-weight="700" fill="#1d4ed8">③ 跨边界锁可重入</text>
  <text x="294" y="302" font-size="8.0" fill="#334155">工具返回前必释全局锁，防跨节点死锁</text>

  <rect x="482" y="273" width="187" height="38" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="489" y="287" font-size="8.8" font-weight="700" fill="#1d4ed8">④ 全有或全无错误回滚</text>
  <text x="489" y="302" font-size="8.0" fill="#334155">中途出错即回收资源并逆转局部状态</text>

  <!-- Hierarchical Tools & Fork+Exec -->
  <rect x="279" y="326" width="398" height="133" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="289" y="343" font-size="9.8" font-weight="700" fill="#1e3a8a">分层内核工具树与 Fork+Exec 组合演进 (Table 3, Fig. 8)</text>

  <rect x="288" y="351" width="380" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="296" y="365.5" font-size="8.4" font-weight="600" fill="#1e3a8a">Layer 1 传统 syscall 封装（进程 / 内存 / VFS）→ 首版计划优先用此层保正确性</text>

  <line x1="478" y1="373" x2="478" y2="383" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="288" y="385" width="380" height="66" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="296" y="400" font-size="8.6" font-weight="700" fill="#1d4ed8">Layer 2..n 微系统调用（以 Fork+Exec 12 个工具为例 → 消除 copy_mm 与同步等待）</text>

  <rect x="295" y="408" width="52" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="321" y="420" text-anchor="middle" font-size="7.8" font-weight="600" fill="#0f172a">init_ctx</text>
  <line x1="347" y1="417" x2="354" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="356" y="408" width="84" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="398" y="420" text-anchor="middle" font-size="7.6" font-weight="600" fill="#0f172a">copy_proc(share)</text>
  <line x1="440" y1="417" x2="447" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="449" y="408" width="84" height="18" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="491" y="420" text-anchor="middle" font-size="7.6" font-weight="600" fill="#0f172a">wake(no wait)</text>
  <line x1="533" y1="417" x2="540" y2="417" stroke="#1d4ed8" stroke-width="1.1" marker-end="url(#arr-blue)"/>

  <rect x="542" y="408" width="118" height="18" rx="3" fill="#1d4ed8"/>
  <text x="601" y="420" text-anchor="middle" font-size="7.6" font-weight="700" fill="#ffffff">run_exec_kargs (子)</text>

  <text x="296" y="442" font-size="8.0" fill="#334155">共享 mm_struct 免 78.89% copy_mm；子进程内核态消费 kargs 免 70.281% vfork 等待</text>

  <!-- Arrows Col 2 <-> Col 3 -->
  <line x1="686" y1="136" x2="714" y2="136" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-slate)"/>
  <circle cx="701" cy="121" r="8" fill="#475569"/>
  <text x="701" y="124.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">2</text>

  <line x1="716" y1="172" x2="688" y2="172" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <circle cx="701" cy="187" r="8" fill="#1d4ed8"/>
  <text x="701" y="190.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">3</text>

  <line x1="686" y1="276" x2="714" y2="276" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-slate)"/>
  <line x1="716" y1="306" x2="688" y2="306" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <circle cx="701" cy="291" r="8" fill="#1e3a8a"/>
  <text x="701" y="294.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">4</text>

  <!-- Column 3: LLMSidecar Cognitive Plane -->
  <rect x="716" y="70" width="224" height="398" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="716" y="70" width="224" height="28" rx="8" fill="#0f172a"/>
  <rect x="716" y="90" width="224" height="8" fill="#0f172a"/>
  <text x="727" y="88.5" font-size="10.5" font-weight="700" fill="#ffffff">3. LLMSidecar 认知平面</text>

  <rect x="725" y="106" width="206" height="108" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="733" y="113" width="94" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="780" y="124.2" text-anchor="middle" font-size="8.0" font-weight="700" fill="#92400e">② Slow Path 慢路径</text>
  <text x="733" y="144" font-size="9.5" font-weight="700" fill="#0f172a">按 Schema 合成执行计划</text>
  <text x="733" y="162" font-size="8.4" fill="#334155">• 缓存未命中经特权通道请求</text>
  <text x="733" y="179" font-size="8.4" fill="#334155">• 仅作决策器，无内核执行权限</text>
  <text x="733" y="196" font-size="8.4" fill="#92400e" font-weight="600">• ③ 未命中冷耗达 26.5–56.3 s</text>

  <rect x="725" y="222" width="206" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="733" y="229" width="96" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="781" y="240.2" text-anchor="middle" font-size="8.0" font-weight="700" fill="#1d4ed8">④ 异步自演进 (§4.2)</text>
  <text x="733" y="260" font-size="9.5" font-weight="700" fill="#1e3a8a">多阶段演进与延迟加载</text>
  <text x="733" y="278" font-size="8.4" fill="#0f172a">• 消费内核高频调用与运行时指标</text>
  <text x="733" y="295" font-size="8.4" fill="#334155">• 工具搜索按需展开子工具集</text>
  <text x="733" y="312" font-size="8.4" fill="#334155">• 继承父上下文 4 类关系描述</text>
  <text x="733" y="329" font-size="8.4" fill="#1d4ed8" font-weight="600">• 压缩决策空间，抑制模型幻觉</text>

  <rect x="725" y="360" width="206" height="99" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="733" y="367" width="84" height="16" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
  <text x="775" y="378.2" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">会话与离线兜底</text>
  <text x="733" y="398" font-size="9.4" font-weight="700" fill="#0f172a">多会话隔离与人工回滚</text>
  <text x="733" y="416" font-size="8.3" fill="#334155">• fork 时克隆独立子进程会话</text>
  <text x="733" y="433" font-size="8.3" fill="#334155">• 父会话收集子计划拼合整链</text>
  <text x="733" y="450" font-size="8.3" fill="#475569">• 严重幻觉支持离线审查打补丁</text>

  <!-- Bottom Boundary Banner -->
  <rect x="20" y="478" width="920" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="31" y="495" font-size="8.9" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">安全与性能解耦边界：</tspan>LLMSidecar 不在可信执行基内，普通用户仅能经 isyscall 交互；内核靠 6 类参数检查、句柄隔离、无跨界锁与有界循环检验保底安全，靠快路径缓存消除推理开销。</text>
  <text x="31" y="512" font-size="8.6" fill="#475569">流程标注：① 用户态提交意图与 u64[] 参数 → ② 缓存未命中经特权通道规划 → ③ 静态有界循环校验后入缓存 → ④ 后台基于内核轨迹异步将 Layer-1 演化为微系统调用。</text>
</svg>
