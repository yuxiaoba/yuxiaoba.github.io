<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Penelope 协同设计架构图：共享前缀保护与块级头部淘汰、同批幽灵重算、以及基于交换缓冲的统一双层缓存" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.5" font-weight="700" fill="#0f172a">Penelope 协同设计：共享前缀保护、头部淘汰、幽灵重算与统一双层缓存</text>
  <text x="24" y="52" font-size="10.0" fill="#475569">整理自 arXiv:2611.00391v1（§2.2–§4, Fig. 1–3）：保留共享前缀与重算昂贵的后缀，在单轮执行与双层交换中保持全局头部淘汰序</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column 1: Prefix-Preserving Head-First Eviction -->
  <rect x="20" y="72" width="296" height="414" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="72" width="296" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="92" width="296" height="8" fill="#1e3a8a"/>
  <text x="32" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">1. 共享前缀保护与块级头部淘汰 (§3.1)</text>

  <rect x="30" y="108" width="276" height="146" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="40" y="124" font-size="9.8" font-weight="700" fill="#1e3a8a">Radix Tree 从 LRU 叶回溯寻找淘汰起点</text>
  <rect x="108" y="132" width="120" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="168" y="145.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#1e3a8a">Root · 系统提示/工具</text>
  <line x1="168" y1="152" x2="168" y2="160" stroke="#1d4ed8" stroke-width="1.4"/>
  <rect x="100" y="160" width="136" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="168" y="173.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#1e3a8a">P · 多子共享分叉 (保护)</text>
  <line x1="138" y1="180" x2="112" y2="193" stroke="#1d4ed8" stroke-width="1.4"/>
  <line x1="202" y1="180" x2="252" y2="193" stroke="#475569" stroke-width="1.2"/>
  <rect x="210" y="193" width="86" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="253" y="207.5" text-anchor="middle" font-size="8.6" fill="#334155">其他会话 A / C</text>
  <rect x="38" y="193" width="160" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="118" y="207.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#991b1b">起点 Node 1 · 私有首段 H</text>
  <line x1="118" y1="215" x2="118" y2="225" stroke="#475569" stroke-width="1.3"/>
  <rect x="38" y="225" width="160" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.1"/>
  <text x="118" y="239.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#166534">LRU 叶 S · 保留私有后缀</text>
  <path d="M 206 236 L 222 236 L 222 219 L 204 219" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="228" y="233" font-size="8.2" font-weight="700" fill="#dc2626">反向回溯</text>
  <text x="228" y="245" font-size="8.0" fill="#475569">停于 P 下方</text>

  <rect x="30" y="262" width="276" height="114" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="279" font-size="9.7" font-weight="700" fill="#0f172a">4 项停止边界 + 64-token 块级切分</text>
  <text x="40" y="297" font-size="8.6" fill="#334155">① 父为 Root（历史起点） · ② 父有多子（共享边界）</text>
  <text x="40" y="314" font-size="8.6" fill="#334155">③ 父 refcount &gt; 0（在用） · ④ 父 KV 已缺失（旧洞）</text>
  <text x="40" y="332" font-size="8.6" font-weight="600" fill="#1d4ed8">• 块级释放：切分起点节点，仅删前部所需 k 块</text>
  <text x="40" y="349" font-size="8.6" fill="#334155">• LRU 保真：新子节点继承原访问时间，不扰乱淘汰序</text>
  <text x="40" y="366" font-size="8.4" fill="#475569">• 仅当分支再无可复用缓存且无引用时才向上剪枝</text>

  <rect x="30" y="384" width="276" height="92" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="40" y="400" font-size="9.5" font-weight="700" fill="#1e3a8a">位置代价模型 (§2.2, Qwen3-8B H100)</text>
  <text x="40" y="417" font-size="8.6" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c(i) ≈ c_fixed + c_attn·(i+1), 比值=23,552</text>
  <rect x="40" y="425" width="52" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="66" y="438.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1e3a8a">P 保留</text>
  <rect x="94" y="425" width="66" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.9" stroke-dasharray="3,2"/>
  <text x="127" y="438.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#991b1b">H 先淘汰</text>
  <rect x="162" y="425" width="96" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="210" y="438.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#166534">S 保留 (后部更贵)</text>
  <rect x="260" y="425" width="36" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.9"/>
  <text x="278" y="438.5" text-anchor="middle" font-size="8.3" font-weight="700" fill="#92400e">N 新</text>
  <text x="40" y="463" font-size="8.5" font-weight="600" fill="#1d4ed8">30% 淘汰 (2K vs 尾): 1.14×(8K) → 2.93×(128K)</text>

  <line x1="316" y1="278" x2="330" y2="278" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Column 2: Same-Batch Phantom Recomputation -->
  <rect x="332" y="72" width="308" height="414" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="332" y="72" width="308" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="332" y="92" width="308" height="8" fill="#1d4ed8"/>
  <text x="344" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">2. 缺口感知匹配与同批幽灵重算 (§3.2)</text>

  <rect x="342" y="108" width="288" height="82" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="352" y="124" font-size="9.7" font-weight="700" fill="#1e3a8a">返回请求匹配：跨过空洞定位后缀 + LPM 记账</text>
  <rect x="352" y="132" width="60" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="382" y="147.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1e3a8a">P 命中</text>
  <rect x="416" y="132" width="68" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="147.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#991b1b">H 缺失段</text>
  <rect x="488" y="132" width="84" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="530" y="147.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#166534">S 复用后缀</text>
  <rect x="576" y="132" width="44" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="598" y="147.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#92400e">N 新</text>
  <text x="352" y="176" font-size="8.5" fill="#334155">树边保留 token 索引穿越 H；LPM 优先级仅计入 P + S</text>

  <line x1="486" y1="190" x2="486" y2="206" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="342" y="208" width="288" height="174" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="352" y="224" font-size="9.7" font-weight="700" fill="#1e3a8a">同批幽灵请求（Phantom）与逐层先写后读</text>

  <rect x="352" y="233" width="130" height="54" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="360" y="248" font-size="8.8" font-weight="700" fill="#991b1b">Phantom 内部请求</text>
  <text x="360" y="263" font-size="8.3" fill="#334155">只算 H · 原位置 P+H</text>
  <text x="360" y="278" font-size="8.3" fill="#475569">零生成 · 不缩用户并发</text>

  <rect x="490" y="233" width="130" height="54" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="498" y="248" font-size="8.8" font-weight="700" fill="#065f46">Real 原始请求</text>
  <text x="498" y="263" font-size="8.3" fill="#334155">只算 N · 位置 P+H+S+N</text>
  <text x="498" y="278" font-size="8.3" fill="#475569">同 chunked 预算入批</text>

  <rect x="352" y="295" width="268" height="78" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="362" y="311" font-size="9.0" font-weight="700" fill="#1e3a8a">逐层前向内部执行顺序（单轮完成，无需两遍）</text>
  <text x="362" y="328" font-size="8.5" fill="#0f172a">① QKV 投影后先写入 K/V 块 → 即刻补齐 H 并写入 N</text>
  <text x="362" y="345" font-size="8.5" fill="#0f172a">② 同层随后因果注意读取：Q_H→P+H；Q_N→P+H+S+N</text>
  <text x="362" y="362" font-size="8.4" font-weight="600" fill="#1d4ed8">③ H 的 KV 留存供本轮与后续轮复用（兼容 chunked prefill）</text>

  <rect x="342" y="390" width="288" height="86" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="407" font-size="9.6" font-weight="700" fill="#0f172a">开销与确定性正确性检验 (§5.4)</text>
  <text x="352" y="425" font-size="8.5" fill="#334155">• 同批重算 vs 独立两请求总耗时差 &lt;1%（32K–128K）</text>
  <text x="352" y="442" font-size="8.5" fill="#334155">• 缓存管理 CPU 时间占 1.6%（基线 SGLang 为 0.54%）</text>
  <text x="352" y="459" font-size="8.5" font-weight="600" fill="#1d4ed8">• 40K 淘汰 vs 256K 无淘汰参考：输出与 logprob 逐位一致</text>

  <line x1="640" y1="278" x2="654" y2="278" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Column 3: Unified GPU-CPU Cache & Swap Buffer -->
  <rect x="656" y="72" width="284" height="414" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="656" y="72" width="284" height="28" rx="9" fill="#0f172a"/>
  <rect x="656" y="92" width="284" height="8" fill="#0f172a"/>
  <text x="668" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">3. 统一 GPU–CPU 与交换缓冲 (§3.3)</text>

  <rect x="666" y="108" width="264" height="98" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="676" y="125" font-size="9.6" font-weight="700" fill="#1e3a8a">互斥双层 = 单一逻辑淘汰序列</text>
  <text x="676" y="143" font-size="8.5" fill="#334155">• 每块 KV 仅驻留 GPU 或 CPU 一处（互斥）</text>
  <text x="676" y="160" font-size="8.5" fill="#334155">• 跨双层按全局 LRU + 头部优先选最终淘汰对象</text>
  <text x="676" y="177" font-size="8.5" fill="#334155">• 若受害者在 CPU：先删它再 offload GPU 块</text>
  <text x="676" y="194" font-size="8.5" fill="#1d4ed8">• 迁出发出即逻辑标为 CPU 驻留，维持全局序</text>

  <line x1="798" y1="206" x2="798" y2="220" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="666" y="222" width="264" height="178" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="676" y="239" font-size="9.6" font-weight="700" fill="#1e3a8a">双层皆满时分块交换缓冲协议</text>
  <text x="676" y="254" font-size="8.3" fill="#475569">预留 CPU Swap Buffer B (1,024 tok) 防额外淘汰</text>

  <rect x="676" y="263" width="244" height="39" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="684" y="279" font-size="8.6" font-weight="700" fill="#1d4ed8">① 异步迁出 GPU [d,e,f] → 缓冲块 B</text>
  <text x="684" y="294" font-size="8.1" fill="#475569">独立 Offload CUDA 流；迁出完成记录事件</text>

  <rect x="676" y="308" width="244" height="39" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.9"/>
  <text x="684" y="324" font-size="8.6" font-weight="700" fill="#065f46">② 载入 CPU [a,b,c] → 刚腾空 GPU 块</text>
  <text x="684" y="339" font-size="8.1" fill="#475569">Load 流等待①完成事件；计算等待②完成</text>

  <rect x="676" y="353" width="244" height="39" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="684" y="369" font-size="8.6" font-weight="700" fill="#334155">③ 原 CPU 块回流 B 供下一 chunk 复用</text>
  <text x="684" y="384" font-size="8.1" fill="#475569">下一轮迁出等待②完成事件，不触发多余驱逐</text>

  <rect x="666" y="408" width="264" height="68" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="676" y="425" font-size="9.4" font-weight="700" fill="#0f172a">物理无关等价性与负对照 (§5.4, A.4)</text>
  <text x="676" y="443" font-size="8.4" fill="#334155">• (128K+128K) 与 256K 单卡池命中/输出全等</text>
  <text x="676" y="460" font-size="8.4" fill="#475569">• 含 602/763 满交换；CPU −256 tok 即分化</text>

  <rect x="20" y="496" width="920" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="514.5" font-size="9.0" fill="#0f172a"><tspan font-weight="700" fill="#1e3a8a">协同设计边界：</tspan>仅反转淘汰起点而不按 64-token 块切分，整节点淘汰会让 90–94% 重算来自几乎全丢历史的请求（TTFT 仅降 6%）；双层独立决策会破坏全局序。</text>
</svg>
