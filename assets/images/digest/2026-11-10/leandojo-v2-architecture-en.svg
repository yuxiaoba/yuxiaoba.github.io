  <text x="24" y="520" font-size="9.4" font-weight="400" fill="#64748b" text-anchor="start">Diagram (arXiv:2611.09048v1) · Module symbols (DynamicDatabase, build_deps) verified in lean-dojo/LeanDojo-v2</text>
</svg>