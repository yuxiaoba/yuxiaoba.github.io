<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24.0" y="34.0" font-size="17.5" font-weight="700" fill="#0f172a" text-anchor="start">BOXBOX Runtime Kernel, Context Transfer, and Recovery Boundaries</text>
  <text x="24.0" y="53.0" font-size="10.6" font-weight="400" fill="#475569" text-anchor="start">From arXiv:2611.09218v1 (§4, Appendix C &amp; Table 12): on-demand pit stop, read-only project boundary, and four continuation outcomes</text>
  <line x1="24" y1="63" x2="936" y2="63" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24.0" y="73.0" width="252.0" height="427.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24.0" y="73.0" width="252.0" height="28.0" rx="8" fill="#1e3a8a"/>
  <rect x="24.0" y="93.0" width="252.0" height="8" fill="#1e3a8a"/>
  <text x="36.0" y="91.5" font-size="11.0" font-weight="700" fill="#ffffff" text-anchor="start">1. Task Loop &amp; Pit Stop (H_k, R_k)</text>
  <rect x="34.0" y="111.0" width="232.0" height="82.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="44.0" y="131.0" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Normal Interaction &amp; Eval Loop</text>
  <text x="44.0" y="150.0" font-size="9.6" font-weight="400" fill="#334155" text-anchor="start">a_k ~ p_{M,H_k}(· | τ_k), a_k ∈ A(H_k)</text>
  <text x="44.0" y="167.0" font-size="9.6" font-weight="400" fill="#334155" text-anchor="start">Execute_{H_k}(e_k, a_k) -&gt; (e_{k+1}, o_{k+1})</text>
  <text x="44.0" y="184.0" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">Append trace τ_{k+1} = τ_k ⊕ (a_k, o_{k+1})</text>
  <line x1="150" y1="193" x2="150" y2="213" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="34.0" y="215.0" width="232.0" height="108.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="44.0" y="235.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Trigger Tool: boxbox() ∈ A(H_k)</text>
  <text x="44.0" y="254.0" font-size="9.4" font-weight="400" fill="#1e293b" text-anchor="start">• Requires prior task step + 30-min cooldown</text>
  <text x="44.0" y="272.0" font-size="9.4" font-weight="400" fill="#1e293b" text-anchor="start">• Task agent allocates shared B=4h budget</text>
  <text x="44.0" y="290.0" font-size="9.4" font-weight="400" fill="#475569" text-anchor="start">• No pre-written patch needed to call pit stop</text>
  <text x="44.0" y="308.0" font-size="9.4" font-weight="400" fill="#475569" text-anchor="start">• Also auto-triggered on runtime fault</text>
  <line x1="150" y1="323" x2="150" y2="343" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="34.0" y="345.0" width="232.0" height="144.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="44.0" y="365.0" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Suspension &amp; State Scope (§C.3)</text>
  <text x="44.0" y="384.0" font-size="9.5" font-weight="600" fill="#0f172a" text-anchor="start">✓ Pauses task decision loop (p_{M,H}) only</text>
  <text x="44.0" y="402.0" font-size="9.4" font-weight="400" fill="#b45309" text-anchor="start">✗ Does NOT freeze container or OS jobs</text>
  <text x="44.0" y="421.0" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">• Export snapshot: τ, review log, reviewed marks</text>
  <text x="44.0" y="439.0" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">• Live terminal session &amp; workspace stay put</text>
  <text x="44.0" y="457.0" font-size="9.3" font-weight="400" fill="#475569" text-anchor="start">• Original snapshot kept intact for fallback</text>
  <text x="44.0" y="475.0" font-size="9.1" font-weight="400" fill="#475569" text-anchor="start">  (prevents corrupting live state on failure)</text>
  <rect x="304.0" y="73.0" width="330.0" height="208.0" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="304.0" y="73.0" width="330.0" height="28.0" rx="8" fill="#1d4ed8"/>
  <rect x="304.0" y="93.0" width="330.0" height="8" fill="#1d4ed8"/>
  <text x="316.0" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="start">2. Isolated Review Session (e_r, τ_r under H_k)</text>
  <rect x="314.0" y="110.0" width="310.0" height="48.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="324.0" y="128.0" font-size="10.0" font-weight="700" fill="#1e3a8a" text-anchor="start">Inputs &amp; Edit Boundary (§C.2)</text>
  <text x="324.0" y="146.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">Reads τ &amp; harness Git history; project code is strictly read-only</text>
  <rect x="314.0" y="165.0" width="310.0" height="56.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
  <text x="324.0" y="183.0" font-size="10.0" font-weight="700" fill="#0f172a" text-anchor="start">Default Self-Review Skill (App. D.3)</text>
  <text x="324.0" y="200.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">Treats agent claims as hypotheses; infers stage:</text>
  <text x="324.0" y="214.0" font-size="9.1" font-weight="400" fill="#475569" text-anchor="start">Early / Developing / Saturated → Retain / Feedback / Tool</text>
  <rect x="314.0" y="228.0" width="310.0" height="44.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.0"/>
  <text x="324.0" y="246.0" font-size="10.0" font-weight="700" fill="#1d4ed8" text-anchor="start">Full Editable Space H′ ∈ H → Git commit(H′)</text>
  <text x="324.0" y="263.0" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">Edits prompts, skills, tools, loop, recovery; governs future reviews</text>
  <line x1="469" y1="281" x2="469" y2="303" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="477.0" y="296.0" font-size="9.2" font-weight="600" fill="#1d4ed8" text-anchor="start">commit(H′) candidate</text>
  <rect x="304.0" y="305.0" width="330.0" height="195.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="304.0" y="305.0" width="330.0" height="28.0" rx="8" fill="#1e3a8a"/>
  <rect x="304.0" y="325.0" width="330.0" height="8" fill="#1e3a8a"/>
  <text x="316.0" y="323.5" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="start">3. Outer Kernel (K) Validation &amp; Hot Reload</text>
  <rect x="314.0" y="342.0" width="310.0" height="44.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="324.0" y="360.0" font-size="9.9" font-weight="700" fill="#1e3a8a" text-anchor="start">① Check Git commit &amp; load candidate R′</text>
  <text x="324.0" y="377.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">Verify task execution &amp; context-transfer interface (§C.4)</text>
  <rect x="314.0" y="394.0" width="310.0" height="44.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
  <text x="324.0" y="412.0" font-size="9.9" font-weight="700" fill="#1e3a8a" text-anchor="start">② Import state copy into R′ (keep original)</text>
  <text x="324.0" y="429.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">R_k holds terminal until R′ cleanly imports state copy</text>
  <rect x="314.0" y="446.0" width="310.0" height="44.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
  <text x="324.0" y="464.0" font-size="9.9" font-weight="700" fill="#0f172a" text-anchor="start">③ Transfer terminal handle &amp; guidance (§C.4)</text>
  <text x="324.0" y="481.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">Preserves reviewer usage notes and prompts resumed agent</text>
  <path d="M 276 260 L 290 260 L 290 155 L 302 155" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <path d="M 276 420 L 302 420" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="664.0" y="73.0" width="272.0" height="86.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="676.0" y="94.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Outcome A · No Harness Change</text>
  <text x="676.0" y="114.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">Resume current (H_k, R_k) with</text>
  <text x="676.0" y="132.0" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">preserved context &amp; same terminal;</text>
  <text x="676.0" y="148.0" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">may still attach focused feedback</text>
  <rect x="664.0" y="170.0" width="272.0" height="108.0" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="676.0" y="191.0" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="start">Outcome B · Update Activated (Provisional)</text>
  <text x="676.0" y="211.0" font-size="9.4" font-weight="400" fill="#1e293b" text-anchor="start">Switch (H, R) ← (H′, R′); keep terminal &amp; repo</text>
  <text x="676.0" y="229.0" font-size="9.4" font-weight="600" fill="#0f766e" text-anchor="start">• Marked provisional until next fault-free</text>
  <text x="676.0" y="246.0" font-size="9.4" font-weight="600" fill="#0f766e" text-anchor="start">  agent-requested boxbox() review boundary</text>
  <text x="676.0" y="265.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">• Confirmed checkpoint held by kernel</text>
  <rect x="664.0" y="289.0" width="272.0" height="90.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="676.0" y="310.0" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="start">Outcome C · Validation / Import Fails</text>
  <text x="676.0" y="330.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">Reject H′; retain or restore (H_k, R_k)</text>
  <text x="676.0" y="348.0" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">from untouched snapshot; terminal intact</text>
  <text x="676.0" y="366.0" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">Failed commit stays in Git for inspection</text>
  <rect x="664.0" y="390.0" width="272.0" height="110.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="676.0" y="411.0" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="start">Outcome D · Runtime Fault Recovery (§C.5)</text>
  <text x="676.0" y="431.0" font-size="9.4" font-weight="400" fill="#1e293b" text-anchor="start">If provisional, revert to last confirmed (H, R)</text>
  <text x="676.0" y="449.0" font-size="9.4" font-weight="600" fill="#b91c1c" text-anchor="start">⚠ Starts fresh terminal (shell-local state lost)</text>
  <text x="676.0" y="467.0" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">Keeps project files, Git &amp; fault logs;</text>
  <text x="676.0" y="485.0" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">auto-launches fault-recovery review</text>
  <path d="M 634 150 L 648 150 L 648 116 L 662 116" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <path d="M 634 388 L 650 388 L 650 224 L 662 224" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <path d="M 634 416 L 654 416 L 654 334 L 662 334" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <path d="M 634 456 L 662 456" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="24.0" y="521.0" font-size="9.6" font-weight="400" fill="#64748b" text-anchor="start">Diagram from arXiv:2611.09218v1 · Note: §6 states kernel validation and rollback are research safeguards, not a full security boundary</text>
</svg>