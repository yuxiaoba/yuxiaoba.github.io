  <text x="506" y="454" font-size="8.4" font-weight="700" fill="#1d4ed8">62 近零行 (0.047% 词表) → 32.3 ppm → 22.5% 命中批 → 19.8% 全批 inf 清零</text>

  <rect x="498" y="468" width="432" height="21" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="506" y="481.5" font-size="8.2" fill="#334155">豁免项：LoRA 冻结 E_in（0/9 溢出）· 在线 RL 采样经 E_out（0/16,384）；全参 RL 含模板标签仍触发</text>

  <text x="20" y="517" font-size="8.9" fill="#475569">注：前向激活全程保持有限（区别于 Mamba-2 #529）；仅当模型含非共享 E_in、零点归零门控且训练更新 E_in 时触发该静默停滞链。</text>
