  <text x="248" y="423" font-size="8.3" fill="#15803d">0.114 (42.6% · 99.9%)</text>
  <text x="364" y="423" font-size="8.3" fill="#334155">正常更新</text>

  <text x="36" y="441" font-size="8.3" fill="#334155">Falcon-H1 早期 (~10⁶)</text>
  <text x="166" y="441" font-size="8.3" fill="#334155">3.49e-2</text>
  <text x="248" y="441" font-size="8.3" fill="#b45309">2.42e-4 (0.55% · −335×)</text>
  <text x="364" y="441" font-size="8.3" fill="#334155">尺度不变自愈</text>

  <rect x="30" y="448" width="432" height="19" rx="3" fill="#fef2f2"/>
  <text x="36" y="461" font-size="8.3" font-weight="700" fill="#991b1b">Nemotron inf 步 (48)</text>
  <text x="166" y="461" font-size="8.3" font-weight="700" fill="#991b1b">0.245 (伪动量!)</text>
  <text x="248" y="461" font-size="8.3" font-weight="700" fill="#b91c1c">0.000 (0.0% · 0/35.6亿)</text>
  <text x="364" y="461" font-size="8.3" font-weight="700" fill="#991b1b">29行冻死6.58e-36</text>

  <text x="32" y="484" font-size="8.1" fill="#475569">注：仅把全局范数改 FP64 虽消 inf，但首次命中 α_eff~10⁻³¹ 低于 ε_Adam 仍使 18 步主干鲜批清零。</text>

