  <text x="602" y="141" text-anchor="middle" font-size="7.9" fill="#475569">第 0 层归一化</text>
  <line x1="644" y1="130" x2="658" y2="130" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="660" y="113" width="122" height="34" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.9"/>
  <text x="721" y="128" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e3a8a">Softmax Attn 读前文</text>
  <text x="721" y="141" text-anchor="middle" font-size="7.9" fill="#334155">聚合同列正常值向量 V_&lt;t</text>
  <line x1="782" y1="130" x2="796" y2="130" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="798" y="113" width="124" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="860" y="128" text-anchor="middle" font-size="8.6" font-weight="700" fill="#166534">h₁ 恢复 Θ(√d)</text>
  <text x="860" y="141" text-anchor="middle" font-size="8.0" font-weight="600" fill="#15803d">梯度保持 56–98 (安全)</text>

  <!-- Sub-row B: Gated / Hybrid -->
  <rect x="360" y="160" width="570" height="82" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.1"/>
  <rect x="368" y="168" width="102" height="19" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="419" y="181" text-anchor="middle" font-size="8.8" font-weight="700" fill="#991b1b">门控 / 混合 (K 层)</text>
  <text x="368" y="201" font-size="8.0" fill="#334155">• Mamba / DeltaNet:</text>
  <text x="374" y="213" font-size="7.9" fill="#475569">φ(h̃) = SiLU(Wz h̃) = 0</text>
  <text x="368" y="226" font-size="8.0" fill="#334155">• xLSTM (σ 门仍炸):</text>
  <text x="374" y="237" font-size="7.9" fill="#475569">线性查询 q_t = W_q h̃ = 0</text>

  <rect x="480" y="168" width="64" height="44" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="512" y="186" text-anchor="middle" font-size="8.6" font-weight="700" fill="#991b1b">e_t ≈ 0</text>
  <text x="512" y="201" text-anchor="middle" font-size="7.9" fill="#7f1d1d">r ≪ √(εd)</text>
  <line x1="544" y1="190" x2="558" y2="190" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr-red)"/>

  <rect x="560" y="168" width="104" height="44" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="612" y="184" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1e3a8a">Pre-RMSNorm</text>
  <text x="612" y="197" text-anchor="middle" font-size="7.9" fill="#1d4ed8">分母卡在 √ε</text>
  <text x="612" y="208" text-anchor="middle" font-size="7.8" font-weight="700" fill="#b91c1c">反向 ×316~1000/层</text>
  <line x1="664" y1="190" x2="678" y2="190" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr-red)"/>

  <rect x="680" y="168" width="118" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="739" y="184" text-anchor="middle" font-size="8.5" font-weight="700" fill="#92400e">φ(0)=0 抹除 s_{t-1}</text>
  <text x="739" y="197" text-anchor="middle" font-size="7.9" fill="#78350f">历史读出缩成 O(r)</text>
  <text x="739" y="208" text-anchor="middle" font-size="7.8" fill="#92400e">残差仍 ≪ √(εd)</text>
  <line x1="798" y1="190" x2="812" y2="190" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arr-red)"/>

  <rect x="814" y="168" width="108" height="66" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="868" y="183" text-anchor="middle" font-size="8.4" font-weight="700" fill="#991b1b">连乘 K 层增益</text>
  <text x="868" y="197" text-anchor="middle" font-size="8.0" font-weight="700" fill="#b91c1c">Nemotron-4B: 2.1e35</text>
  <text x="868" y="211" text-anchor="middle" font-size="8.0" fill="#7f1d1d">xLSTM-7B: 1.0e32</text>
  <text x="868" y="225" text-anchor="middle" font-size="7.9" fill="#7f1d1d">Falcon-H1: 4.8e6</text>

  <path d="M 739 212 L 739 228 L 612 228 L 612 214" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="676" y="238" text-anchor="middle" font-size="7.8" font-weight="600" fill="#991b1b">式(4): min(√(εd)/r, G_K) 逐层复利</text>

  <!-- Causal patching strip -->
  <rect x="360" y="248" width="570" height="30" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="370" y="266.5" font-size="8.7" font-weight="600" fill="#1e3a8a">因果门控干预（表 4 · Nemotron-4B）：仅切 L0 反向仍 1.74×10³¹ (inf)；直通仅开 L0 前向降至 6.71（降 34 数量级）</text>

  <!-- Panel 3: FP32 Clip Overflow & Post-AdamW Decomposition -->
  <rect x="20" y="298" width="452" height="198" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="298" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="316" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="324" x2="472" y2="324" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="315.5" font-size="10.8" font-weight="700" fill="#1e3a8a">3. FP32 全局范数溢出与 AdamW 参数更新拆解（§4.1，表 7）</text>

  <rect x="30" y="331" width="432" height="53" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="40" y="346" font-size="8.9" font-weight="700" fill="#991b1b">溢出阈值：|g_i| &gt; √FLT_MAX = 1.84 × 10¹⁹（PyTorch / HF / FSDP2）</text>
  <text x="40" y="361" font-size="8.5" fill="#7f1d1d">• g_i² → +∞ → G = inf → α_eff = 1.0/∞ = 0.0 → 全模型当前批梯度静默归零</text>
  <text x="40" y="376" font-size="8.2" fill="#991b1b">• 全程无 NaN、不抛异常（Megatron-Core 开 check_for_nan_in_grad 则报错中断）</text>

  <rect x="30" y="391" width="432" height="19" rx="3" fill="#eff6ff"/>
  <text x="36" y="404" font-size="8.4" font-weight="700" fill="#1e3a8a">模型与步态（表 7）</text>
  <text x="166" y="404" font-size="8.4" font-weight="700" fill="#1e3a8a">总步长 ‖∆θ‖₂</text>
  <text x="248" y="404" font-size="8.4" font-weight="700" fill="#1e3a8a">鲜批位移 ‖δθ_batch‖₂</text>
  <text x="364" y="404" font-size="8.4" font-weight="700" fill="#1e3a8a">命中近零行归宿</text>

  <text x="36" y="423" font-size="8.3" fill="#334155">Nemotron 正常步 (247)</text>
