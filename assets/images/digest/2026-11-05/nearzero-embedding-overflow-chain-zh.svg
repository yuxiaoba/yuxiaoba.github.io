  <text x="512" y="141" text-anchor="middle" font-size="7.9" fill="#475569">输入行近零</text>
  <line x1="544" y1="130" x2="558" y2="130" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

