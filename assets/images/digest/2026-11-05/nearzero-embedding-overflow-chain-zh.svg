      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.5" font-weight="700" fill="#0f172a">近零非共享词嵌入引发的梯度倍增与 FP32 静默清零链</text>
  <text x="24" y="52" font-size="10.0" fill="#475569">arXiv:2611.04449v1（§§2–4，图 1–5，表 1、表 4–7）· 291 仓库普查 → 门控归零与 Pre-RMSNorm 倍增 → 1.84×10¹⁹ 溢出清零</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel 1: Weight-Decay Origin & 291-Repo Census -->
  <rect x="20" y="72" width="318" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="318" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="318" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="338" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="30" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">1. 开源模型普查与非共享权重衰减成因</text>
  <text x="30" y="114" font-size="8.8" fill="#475569">291 仓库（280 独立词表）：可达近零行 ‖e_v‖₂ &lt; 10⁻⁶ 占比</text>

  <text x="112" y="135" text-anchor="end" font-size="8.8" fill="#334155">共享 Transf.</text>
  <rect x="118" y="127" width="3" height="10" rx="2" fill="#94a3b8"/>
  <text x="126" y="135.5" font-size="8.6" font-weight="600" fill="#334155">0% (0/80)</text>

  <text x="112" y="156" text-anchor="end" font-size="8.8" fill="#334155">共享门控</text>
  <rect x="118" y="148" width="3" height="10" rx="2" fill="#94a3b8"/>
  <text x="126" y="156.5" font-size="8.6" font-weight="600" fill="#334155">0% (0/21)</text>

  <text x="112" y="177" text-anchor="end" font-size="8.8" fill="#1e3a8a">非共享 Transf.</text>
  <rect x="118" y="169" width="55.6" height="10" rx="2" fill="#3b82f6"/>
  <text x="179" y="177.5" font-size="8.5" font-weight="600" fill="#1d4ed8">30.9% (47/152) · t&gt;0 安全</text>

  <text x="112" y="198" text-anchor="end" font-size="8.8" font-weight="700" fill="#991b1b">非共享门控</text>
  <rect x="118" y="190" width="94.7" height="10" rx="2" fill="#dc2626"/>
  <text x="218" y="198.5" font-size="8.6" font-weight="700" fill="#991b1b">52.6% (20/38) · 易停滞</text>

  <rect x="28" y="214" width="302" height="64" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="36" y="229" font-size="8.5" font-weight="700" fill="#0f172a">成因：E_in ≠ E_out 时，未见词元 E_in 梯度恒 0</text>
  <text x="36" y="244" font-size="8.4" fill="#334155">• AdamW 衰减 (1−ηλ)^T 将行范数缩至 10⁻⁶~10⁻³⁶</text>
  <text x="36" y="259" font-size="8.4" fill="#334155">• OLMoE 核验：251 近零行在 3.64 亿词 0 次出现</text>
  <text x="36" y="272" font-size="8.2" fill="#475569">• 92% (901/979) 对应 E_out 仍 ≥0.3× 中位数（不报错）</text>

  <!-- Panel 2: Transformer Recovery vs Gated Blowup -->
  <rect x="350" y="72" width="590" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="350" y="72" width="590" height="26" rx="8" fill="#eff6ff"/>
  <rect x="350" y="90" width="590" height="8" fill="#eff6ff"/>
  <line x1="350" y1="98" x2="940" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="362" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">2. 前向/反向信号对比：Transformer 单层恢复 vs 门控模型多层放大（t &gt; 0，r ≪ √(εd)）</text>

  <!-- Sub-row A: Transformer -->
  <rect x="360" y="106" width="570" height="48" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="368" y="114" width="102" height="19" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
