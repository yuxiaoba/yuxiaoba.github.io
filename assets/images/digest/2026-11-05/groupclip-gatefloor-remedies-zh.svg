<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="GroupClip 解耦词嵌入裁剪与 GateFloor 正门控偏置修复机制及实证结果对比" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.5" font-weight="700" fill="#0f172a">双端修复机制与实证对比：GroupClip（权重适配）与 GateFloor（从零预训练）</text>
  <text x="24" y="52" font-size="10.0" fill="#475569">arXiv:2611.04449v1（§5，图 6，表 2–3，附录 D–E）· 零步时/峰值显存开销，分别阻断「裁剪溢出」与「零点门控放大」</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A: GroupClip mechanism -->
  <rect x="20" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">A. GroupClip：三行解耦 E_in 裁剪（适配已发布检查点）</text>

  <rect x="30" y="106" width="210" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="40" y="122" font-size="9.2" font-weight="700" fill="#1e3a8a">主干参数 g_other (1–10)</text>
  <text x="40" y="139" font-size="8.4" fill="#334155">clip_grad_norm_(backbone, 1.0)</text>
  <text x="40" y="156" font-size="8.4" font-weight="700" fill="#1d4ed8">完全隔离 E_in · 保留 37.8% 鲜批</text>

  <rect x="250" y="106" width="212" height="68" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="260" y="122" font-size="9.2" font-weight="700" fill="#065f46">输入词嵌入 g_emb (10⁶–10³⁵)</text>
  <text x="260" y="139" font-size="8.4" fill="#334155">FP64 范数 或 inf-归一化后 FP32 裁剪</text>
  <text x="260" y="156" font-size="8.4" font-weight="700" fill="#15803d">首次命中即自愈：≤2.3e-10 → 0.010</text>

  <rect x="30" y="182" width="432" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="40" y="198" font-size="8.6" font-weight="700" fill="#0f172a">H100 开销实测（E36, Nemotron-4B）：步时 2.84s vs 2.88s · 峰值显存均 69.7 GB</text>
  <text x="40" y="214" font-size="8.3" fill="#475569">• 无拷贝重缩放版省去 3.1 GB 瞬时 FP64 缓存；注入 10³¹ 梯度相对误差 ≤ 2.3×10⁻⁷</text>

  <rect x="30" y="233" width="432" height="36" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="40" y="248" font-size="8.3" font-weight="700" fill="#991b1b">对照规则失败原因：Skip-on-Inf / ZClip 仍丢失 57 批且近零行不自愈；</text>
  <text x="40" y="262" font-size="8.3" fill="#7f1d1d">GradStabilizer 跳过 E_in 缩放，把 10³¹ 喂入 AdamW 致 v_t=∞ 永久冻死（52 步）</text>

  <!-- Panel B: Multilingual CPT & 10-Method Ablation -->
  <rect x="488" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="98" x2="940" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">B. 多语言持续预训练与 300 步十法消融（表 2 · 3 种子均值）</text>

  <rect x="498" y="105" width="212" height="56" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="506" y="120" font-size="8.8" font-weight="700" fill="#1e3a8a">Nemotron-4B Telugu（1,000 步）</text>
  <text x="506" y="135" font-size="8.2" fill="#991b1b">FP32 全局：198.3±9.9 停 · 13.44 PPL</text>
  <text x="506" y="150" font-size="8.2" font-weight="700" fill="#1d4ed8">GroupClip：0.0 停 · 13.04（800 步追平）</text>

  <rect x="718" y="105" width="212" height="56" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="726" y="120" font-size="8.8" font-weight="700" fill="#1e3a8a">Falcon-H1 Mongolian（1,000 步）</text>
  <text x="726" y="135" font-size="8.2" fill="#991b1b">FP32 全局：11.7±3.5 停 · 15.68 PPL</text>
  <text x="726" y="150" font-size="8.2" font-weight="700" fill="#1d4ed8">GroupClip：0.0 停 · 15.58（S100 −2.93）</text>

  <text x="500" y="177" font-size="8.7" font-weight="700" fill="#0f172a">Nemotron-4B Telugu 300 步消融（59.3±7.8 触发批，FLORES PPL ↓）：</text>

  <text x="614" y="195" text-anchor="end" font-size="8.3" fill="#475569">Skip-on-Inf</text>
  <rect x="620" y="187" width="130" height="9" rx="2" fill="#94a3b8"/>
  <text x="756" y="195" font-size="8.2" fill="#475569">16.63 · 57.0 停（不自愈）</text>

  <text x="614" y="212" text-anchor="end" font-size="8.3" fill="#991b1b">FP32 / ZClip</text>
  <rect x="620" y="204" width="122" height="9" rx="2" fill="#dc2626"/>
  <text x="748" y="212" font-size="8.2" fill="#991b1b">16.57 · 57.0 停（inf 归零）</text>

  <text x="614" y="229" text-anchor="end" font-size="8.3" fill="#92400e">GradStab / Freeze</text>
  <rect x="620" y="221" width="74" height="9" rx="2" fill="#d97706"/>
  <text x="700" y="229" font-size="8.2" fill="#92400e">16.16–16.23（冻死或禁更 E_in）</text>

  <text x="614" y="246" text-anchor="end" font-size="8.3" fill="#1e3a8a">FP64 Global Norm</text>
  <rect x="620" y="238" width="55" height="9" rx="2" fill="#3b82f6"/>
  <text x="681" y="246" font-size="8.2" fill="#1e3a8a">16.09 · 18.0 停（首命中卡主干）</text>

  <text x="614" y="263" text-anchor="end" font-size="8.4" font-weight="700" fill="#1d4ed8">GroupClip (FP64)</text>
  <rect x="620" y="255" width="35" height="9" rx="2" fill="#1d4ed8"/>
  <text x="661" y="263" font-size="8.3" font-weight="700" fill="#1d4ed8">15.95 · 0.0 停（追平 Oracle 15.94）</text>

  <!-- Panel C: GateFloor mechanism -->
  <rect x="20" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="316" x2="472" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="307.5" font-size="10.8" font-weight="700" fill="#1e3a8a">C. GateFloor：正门控偏置 g_δ(z) = SiLU(z) + δ（从零预训练）</text>

  <rect x="30" y="324" width="432" height="32" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="246" y="344" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">式(5): g_δ(z) = SiLU(z) + δ（推荐 δ = 0.1，零新增参数，并设 E_in weight_decay = 0）</text>

  <rect x="30" y="364" width="138" height="58" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="38" y="380" font-size="8.8" font-weight="700" fill="#991b1b">SiLU(z) 基线</text>
  <text x="38" y="395" font-size="8.2" fill="#7f1d1d">• z=0 处 g(0)=0 归零</text>
  <text x="38" y="410" font-size="8.2" fill="#7f1d1d">• 小初始化仍 1/r 倍增</text>

  <rect x="177" y="364" width="138" height="58" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="185" y="380" font-size="8.8" font-weight="700" fill="#92400e">Sigmoid 门控</text>
  <text x="185" y="395" font-size="8.2" fill="#78350f">• σ(0)=0.5 但上界 ≤1</text>
  <text x="185" y="410" font-size="8.2" fill="#78350f">• PPL 恶化 +0.18~+0.56</text>

  <rect x="324" y="364" width="138" height="58" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="332" y="380" font-size="8.8" font-weight="700" fill="#166534">GateFloor (推荐)</text>
  <text x="332" y="395" font-size="8.2" fill="#14532d">• g_δ(0)=δ&gt;0 保留线性端</text>
  <text x="332" y="410" font-size="8.2" fill="#14532d">• +b_conv≠0 保 t=0 非零</text>

  <rect x="30" y="430" width="432" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="40" y="446" font-size="8.6" font-weight="700" fill="#0f172a">Mamba-2 165M (seed 0) r=10⁻³⁰ 中段梯度随 δ 按 ∝ 1/δ 缩放（表 3）：</text>
  <text x="40" y="462" font-size="8.8" font-weight="700" fill="#1d4ed8">SiLU (5.6e28) → δ=0.01 (4.14) → δ=0.03 (1.51) → δ=0.1 (0.60) → δ=0.3 (0.29)</text>
  <text x="40" y="478" font-size="8.1" fill="#475569">注：SiLU(z)≥−0.278 在 z&lt;0 仍可负；阻断倍增只需保证 z=0 不动点为正且第 0 层 s_{t-1}/b_conv 非零</text>

  <!-- Panel D: FineWeb-Edu Table 3 & Scope -->
  <rect x="488" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="316" x2="940" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="307.5" font-size="10.8" font-weight="700" fill="#1e3a8a">D. FineWeb-Edu 从零预训练实测（表 3）与审校边界</text>

  <rect x="498" y="324" width="432" height="19" rx="3" fill="#eff6ff"/>
  <text x="504" y="337" font-size="8.3" font-weight="700" fill="#1e3a8a">模型 (Token 数)</text>
  <text x="626" y="337" font-size="8.3" font-weight="700" fill="#1e3a8a">门控方案</text>
  <text x="710" y="337" font-size="8.3" font-weight="700" fill="#1e3a8a">PPL ↓</text>
  <text x="756" y="337" font-size="8.3" font-weight="700" fill="#1e3a8a">Tok/s</text>
  <text x="804" y="337" font-size="8.3" font-weight="700" fill="#1e3a8a">Mid / Pos-0 (r=10⁻³⁰)</text>

  <text x="504" y="356" font-size="8.2" fill="#334155">165M Mamba-2 (1.05B)</text>
  <text x="626" y="356" font-size="8.2" fill="#334155">SiLU (2s)</text>
  <text x="710" y="356" font-size="8.2" fill="#334155">30.63</text>
  <text x="756" y="356" font-size="8.2" fill="#334155">115.7k</text>
  <text x="804" y="356" font-size="8.2" fill="#991b1b">2.8e28 / 3.6e28</text>

  <rect x="498" y="362" width="432" height="15" rx="2" fill="#eff6ff"/>
  <text x="504" y="373" font-size="8.2" font-weight="700" fill="#1d4ed8">165M Mamba-2 (1.05B)</text>
  <text x="626" y="373" font-size="8.2" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="373" font-size="8.2" font-weight="700" fill="#1d4ed8">30.78</text>
  <text x="756" y="373" font-size="8.2" font-weight="700" fill="#1d4ed8">114.2k</text>
  <text x="804" y="373" font-size="8.2" font-weight="700" fill="#15803d">0.52 / 0.73</text>

  <text x="504" y="389" font-size="8.2" fill="#334155">203M Hybrid 3:1 (1.05B)</text>
  <text x="626" y="389" font-size="8.2" fill="#334155">SiLU Base</text>
  <text x="710" y="389" font-size="8.2" fill="#334155">23.38</text>
  <text x="756" y="389" font-size="8.2" fill="#334155">130.6k</text>
  <text x="804" y="389" font-size="8.2" fill="#991b1b">1.3e5 / 2.0e29</text>

  <rect x="498" y="395" width="432" height="15" rx="2" fill="#eff6ff"/>
  <text x="504" y="406" font-size="8.2" font-weight="700" fill="#1d4ed8">203M Hybrid 3:1 (1.05B)</text>
  <text x="626" y="406" font-size="8.2" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="406" font-size="8.2" font-weight="700" fill="#1d4ed8">23.45</text>
  <text x="756" y="406" font-size="8.2" font-weight="700" fill="#1d4ed8">129.8k</text>
  <text x="804" y="406" font-size="8.2" font-weight="700" fill="#15803d">0.19 / 0.23</text>

  <text x="504" y="422" font-size="8.2" fill="#334155">370M Hybrid 3:1 (1.57B)</text>
  <text x="626" y="422" font-size="8.2" fill="#334155">SiLU Base</text>
  <text x="710" y="422" font-size="8.2" fill="#334155">22.45</text>
  <text x="756" y="422" font-size="8.2" fill="#334155">527.2k</text>
  <text x="804" y="422" font-size="8.2" fill="#991b1b">3.3e4 / 1.6e28</text>

  <rect x="498" y="428" width="432" height="15" rx="2" fill="#dbeafe"/>
  <text x="504" y="439" font-size="8.2" font-weight="700" fill="#1d4ed8">370M Hybrid 3:1 (1.57B)</text>
  <text x="626" y="439" font-size="8.2" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="439" font-size="8.2" font-weight="700" fill="#1d4ed8">22.28</text>
  <text x="756" y="439" font-size="8.2" font-weight="700" fill="#1d4ed8">542.8k</text>
  <text x="804" y="439" font-size="8.2" font-weight="700" fill="#15803d">0.16 / 0.13 (-28 OOM)</text>

  <rect x="498" y="447" width="432" height="41" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="506" y="462" font-size="8.3" font-weight="700" fill="#92400e">审校边界：从零预训练仅跑至 370M 参数（203M/370M 单种子；165M 双种子方差 0.15）</text>
  <text x="506" y="477" font-size="8.2" fill="#78350f">• t=0 依赖 conv1d 偏置 b_conv≠0；不直接解决 xLSTM 等无偏置线性 query (q=0) 问题</text>

  <text x="20" y="517" font-size="8.9" fill="#475569">来源：arXiv:2611.04449v1 §5、表 2–3 与附录 D–E；GroupClip 与 GateFloor 分别面向已发布权重的裁剪溢出与从零预训练的零点门控。</text>
</svg>
