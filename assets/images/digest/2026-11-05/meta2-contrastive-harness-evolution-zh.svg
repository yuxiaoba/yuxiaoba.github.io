<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Meta² 架构图：左侧展示离线三臂对比轨迹采样、五向终局对比与三阶段 Meta-Skill 蒸馏冻结流程；右侧展示在线加载冻结 Meta-Skill 与每题重置种子 Harness 后的检查点任务局部演化闭环" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.4" font-weight="700" fill="#0f172a">Meta² 架构：离线三臂对比蒸馏 Meta-Skill 与在线任务局部演化</text>
  <text x="24" y="53" font-size="10.1" fill="#475569">arXiv:2611.05139v1（§3, Fig. 2, Appendix B &amp; H）· 冻结策略模型与种子 Harness h(0)，将离线优化上移至可复用决策知识 ℳ</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Panel: Stage 1 Offline -->
  <rect x="18" y="72" width="460" height="422" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="18" y="72" width="460" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="18" y="92" width="460" height="8" fill="#1e3a8a"/>
  <text x="30" y="90.5" font-size="10.7" font-weight="700" fill="#ffffff">阶段一 · 离线预计算：三臂对比轨迹与批更新（仅训练期）</text>

  <!-- Step 1: 3-Arm Rollouts -->
  <rect x="28" y="108" width="440" height="124" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="38" y="125" font-size="10.0" font-weight="700" fill="#0f172a">1. 同任务三条件并行采样（TB 29 训练题 / DeepSWE 38 训练题）</text>

  <rect x="36" y="133" width="136" height="91" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="44" y="139" width="54" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.7"/>
  <text x="71" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#334155">条件 A</text>
  <text x="44" y="169" font-size="9.3" font-weight="700" fill="#0f172a">仅 Task Agent</text>
  <text x="44" y="186" font-size="8.5" fill="#334155">• 无演化器 / 未分段</text>
  <text x="44" y="201" font-size="8.5" fill="#334155">• 较简短工作提示词</text>
  <text x="44" y="216" font-size="8.4" fill="#475569">• 固定收集 1 次并复用</text>

  <rect x="180" y="133" width="136" height="91" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="188" y="139" width="54" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.7"/>
  <text x="215" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">条件 B</text>
  <text x="188" y="169" font-size="9.3" font-weight="700" fill="#1e3a8a">当前 ℳ(r-1) 演化</text>
  <text x="188" y="186" font-size="8.5" fill="#1e293b">• 读写检查点 + 通道</text>
  <text x="188" y="201" font-size="8.5" fill="#1e293b">• 不知晓隐藏验证器</text>
  <text x="188" y="216" font-size="8.4" fill="#1d4ed8">• 每批 r 重新采样收集</text>

  <rect x="324" y="133" width="136" height="91" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="332" y="139" width="54" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.7"/>
  <text x="359" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b45309">条件 C</text>
  <text x="332" y="169" font-size="9.3" font-weight="700" fill="#92400e">特权验证器演化</text>
  <text x="332" y="186" font-size="8.5" fill="#78350f">• 首点知晓验收与源码</text>
  <text x="332" y="201" font-size="8.5" fill="#78350f">• 严禁向 Agent 透传</text>
  <text x="332" y="216" font-size="8.4" fill="#b45309">• 经防泄漏审计后复用</text>

  <line x1="248" y1="232" x2="248" y2="244" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Step 2: 5 Contrast Directions -->
  <rect x="28" y="246" width="440" height="90" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="263" font-size="10.0" font-weight="700" fill="#0f172a">2. 五向终局对比 BUILDCONTRASTS（提供方向线索，非单步因果）</text>

  <rect x="36" y="271" width="138" height="57" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="44" y="286" font-size="9.0" font-weight="700" fill="#1d4ed8">act（支持演化干预）</text>
  <text x="44" y="302" font-size="8.4" fill="#0f172a">• A✗ → B✓（effective）</text>
  <text x="44" y="317" font-size="8.4" fill="#0f172a">• B✗ → C✓（informed）</text>

  <rect x="182" y="271" width="138" height="57" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="190" y="286" font-size="9.0" font-weight="700" fill="#b91c1c">avoid（规避特定干预）</text>
  <text x="190" y="302" font-size="8.4" fill="#7f1d1d">• A✓ → B✗（harmful）</text>
  <text x="190" y="317" font-size="8.4" fill="#7f1d1d">• B✓ → C✗（overreach）</text>

  <rect x="328" y="271" width="132" height="57" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="336" y="286" font-size="9.0" font-weight="700" fill="#b45309">hold（保持不变）</text>
  <text x="336" y="302" font-size="8.3" fill="#78350f">• A✓ + B✓（unnecessary）</text>
  <text x="336" y="317" font-size="8.3" fill="#78350f">• 识别可自愈报错模式</text>

  <line x1="248" y1="336" x2="248" y2="348" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Step 3: Reflect -> Aggregate -> Update -->
  <rect x="28" y="350" width="440" height="136" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="38" y="367" font-size="10.0" font-weight="700" fill="#1e3a8a">3. 三阶段 LLM 提炼与冻结 Meta-Skill ℳ（Eq. 4）</text>

  <rect x="36" y="375" width="130" height="69" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="390" font-size="9.1" font-weight="700" fill="#1d4ed8">REFLECT (f_ref)</text>
  <text x="44" y="405" font-size="8.2" fill="#334155">• 逐任务按可见证据归因</text>
  <text x="44" y="419" font-size="8.2" fill="#334155">• 严禁拷贝 C 的隐藏阈值</text>
  <text x="44" y="433" font-size="8.2" fill="#475569">• 标注条目 entry_credit</text>

  <line x1="166" y1="409" x2="178" y2="409" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="180" y="375" width="136" height="69" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="188" y="390" font-size="9.1" font-weight="700" fill="#1d4ed8">AGGREGATE (f_agg)</text>
  <text x="188" y="405" font-size="8.2" fill="#334155">• 硬约束：≥2 不同任务支持</text>
  <text x="188" y="419" font-size="8.2" fill="#334155">• 剥离路径/包名/领域名词</text>
  <text x="188" y="433" font-size="8.2" fill="#475569">• 保留 act/hold 对立分界</text>

  <line x1="316" y1="409" x2="328" y2="409" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="330" y="375" width="130" height="69" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="338" y="390" font-size="9.1" font-weight="700" fill="#1e3a8a">UPDATE → 冻结 ℳ</text>
  <text x="338" y="405" font-size="8.2" fill="#334155">• ADD / MERGE / REFINE</text>
  <text x="338" y="419" font-size="8.2" fill="#334155">• ≥2 次误导则 DELETE</text>
  <text x="338" y="433" font-size="8.2" fill="#1d4ed8">• 误触/溯源/泄漏审计后冻结</text>

  <rect x="36" y="450" width="424" height="29" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="44" y="462.5" font-size="8.2" fill="#1e3a8a">条目格式：ID/title · Type(act/hold/avoid) · Time(start/during/end) · When · Guidance · Why · ≤3 例</text>
  <text x="44" y="474.5" font-size="8.1" fill="#475569">学得规模：TB 2.1 共 14 条（9 act / 2 hold / 3 avoid）；DeepSWE 1.1 共 9 条（7 act / 2 hold）</text>

  <!-- Bridge Arrow Offline -> Online -->
  <path d="M 468 410 L 490 410 L 490 144 L 500 144" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Right Panel: Stage 2 Online -->
  <rect x="502" y="72" width="440" height="422" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="502" y="72" width="440" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="502" y="92" width="440" height="8" fill="#1d4ed8"/>
  <text x="514" y="90.5" font-size="10.7" font-weight="700" fill="#ffffff">阶段二 · 在线演化：冻结 ℳ + 任务局部编辑（无测试验证器）</text>

  <!-- Online Step 1: Init -->
  <rect x="512" y="108" width="420" height="68" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="520" y="115" width="76" height="17" rx="4" fill="#1d4ed8"/>
  <text x="558" y="126.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">每题重置</text>
  <text x="604" y="127" font-size="9.9" font-weight="700" fill="#1e3a8a">从共享种子 h(0) 与冻结 ℳ 启动新任务</text>
  <text x="520" y="147" font-size="8.7" fill="#0f172a">• 同基座模型分饰双角：Worker 执行任务，Evolver（读 ℳ）监督干预</text>
  <text x="520" y="164" font-size="8.7" fill="#334155">• 测试验证器源码与通过状态对 Worker 和 Evolver 全程不可见</text>

  <line x1="722" y1="176" x2="722" y2="188" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Online Step 2: Checkpoint Loop -->
  <rect x="512" y="190" width="420" height="176" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="522" y="207" font-size="10.0" font-weight="700" fill="#0f172a">2. 确定性检查点循环（步 1 触发，此后每 L=5 步 + 停机终检）</text>

  <rect x="520" y="214" width="198" height="94" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="528" y="230" font-size="9.2" font-weight="700" fill="#1e3a8a">累积证据 ℐ(k)（Eq. 2）</text>
  <text x="528" y="246" font-size="8.3" fill="#334155">• Δτ(k)：摘要与命令（截断 1500 字）</text>
  <text x="528" y="261" font-size="8.3" fill="#334155">• ω(k)：只读 /app 与磁盘完整日志</text>
  <text x="528" y="276" font-size="8.3" fill="#334155">• σ(k-1)：上轮加载 / 保留 / 回滚状态</text>
  <text x="528" y="291" font-size="8.3" fill="#475569">• 重复命令指纹（≥3 次）与通道余额</text>
  <text x="528" y="303" font-size="8.0" fill="#1d4ed8">• 停机追加：新建文件 / 监听端口 / 进程</text>

  <rect x="726" y="214" width="198" height="94" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="734" y="230" font-size="9.2" font-weight="700" fill="#1d4ed8">Evolver 决策 u(k)（Eq. 3）</text>
  <text x="734" y="246" font-size="8.3" fill="#0f172a">• KEEP：保持 h(k)=h(k-1) 继续执行</text>
  <text x="734" y="261" font-size="8.3" fill="#0f172a">• EVOLVE(δ(k))：经受限通道改写</text>
  <text x="734" y="276" font-size="8.3" fill="#0f172a">• 停机决策：KEEP 提交最终产物，</text>
  <text x="734" y="290" font-size="8.3" fill="#0f172a">  或 EVOLVE 发回续跑（≤2 次）</text>
  <text x="734" y="303" font-size="8.0" fill="#475569">• 必须引用匹配的 Meta-Skill 条目 ID</text>

  <rect x="520" y="314" width="404" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="528" y="329" font-size="8.3" font-weight="700" fill="#0f172a">8 类受限通道（加载失败自动回滚并立即重呼 Evolver）：</text>
  <text x="528" y="343" font-size="8.0" fill="#334155">notice（工作期≤2，仅下轮）· 持久 prompt（append/rewrite）· register_check(Py)</text>
  <text x="528" y="354" font-size="8.0" fill="#334155">register_probe(bash) · add_tool / add_skill / add_middleware · rollback（快照恢复）</text>

  <line x1="722" y1="366" x2="722" y2="378" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Online Step 3: Continuation & Isolation -->
  <rect x="512" y="380" width="420" height="106" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="397" font-size="10.0" font-weight="700" fill="#0f172a">3. 无重置延续执行与任务后隔离（§3.3）</text>
  <text x="522" y="414" font-size="8.5" fill="#334155">• 保留当前 E2B 沙箱状态与既有轨迹 τ≤tk，修改仅影响本轮余下步骤</text>
  <text x="522" y="430" font-size="8.5" fill="#334155">• 纯文本 reasoning 仅入日志；Worker 仅见通道消息（不回写更新 ℳ）</text>
  <text x="522" y="446" font-size="8.5" fill="#334155">• 运行结束立即丢弃所有 δ(k) 与监督对话，ℳ 保持冻结，下一题恢复 h(0)</text>
  <rect x="520" y="454" width="404" height="24" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="528" y="469.5" font-size="8.2" font-weight="600" fill="#92400e">消融：跨题保留编辑使 TB 81.00→78.33% (-2.67)，SWE 44.44→39.11% (-5.33)</text>

  <!-- Footer -->
  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="510.5" font-size="8.9" fill="#334155">蓝框：act 证据 / 演化与控制流</text>
  <rect x="195" y="502" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="212" y="510.5" font-size="8.9" fill="#334155">琥珀：条件 C 特权反馈 / hold / 隔离边界</text>
  <rect x="425" y="502" width="12" height="10" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="442" y="510.5" font-size="8.9" fill="#334155">红框：avoid 规避伤害类对比</text>
  <text x="20" y="527" font-size="8.7" fill="#64748b">边界注记：A/B/C 为独立采样运行，提供方向性经验而非单点反事实因果识别；A 与 B/C 在分段与中间件脚手架上亦存在未隔离差异（§F.1, Appendix H.3）。</text>
</svg>
