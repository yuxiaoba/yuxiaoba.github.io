<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Meta² architecture diagram: left panel shows offline 3-arm contrastive rollouts, 5 outcome directions, and 3-stage Meta-Skill distillation; right panel shows online frozen Meta-Skill deployment with per-task seed reset and reset-free checkpoint edits" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'Noto Sans', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="16.2" font-weight="700" fill="#0f172a">Meta² Architecture: Offline 3-Arm Meta-Skill Learning &amp; Task-Local Online Evolution</text>
  <text x="24" y="53" font-size="10.0" fill="#475569">arXiv:2611.05139v1 (§3, Fig. 2, Appendices B &amp; H) · Frozen backbone &amp; seed h(0); lifts offline optimization to reusable decision skill ℳ</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Panel: Stage 1 Offline -->
  <rect x="18" y="72" width="460" height="422" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="18" y="72" width="460" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="18" y="92" width="460" height="8" fill="#1e3a8a"/>
  <text x="30" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">Stage 1 · Offline Precomputation: 3-Arm Contrasts &amp; Batch Update (Train Only)</text>

  <!-- Step 1: 3-Arm Rollouts -->
  <rect x="28" y="108" width="440" height="124" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="38" y="125" font-size="9.9" font-weight="700" fill="#0f172a">1. Three-Condition Rollouts per Training Task (TB: 29 / DeepSWE: 38)</text>

  <rect x="36" y="133" width="136" height="91" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="44" y="139" width="54" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.7"/>
  <text x="71" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#334155">Arm A</text>
  <text x="44" y="169" font-size="9.2" font-weight="700" fill="#0f172a">Task Agent Alone</text>
  <text x="44" y="186" font-size="8.3" fill="#334155">• Unsegmented; no evolver</text>
  <text x="44" y="201" font-size="8.3" fill="#334155">• Simpler worker prompt</text>
  <text x="44" y="216" font-size="8.2" fill="#475569">• Collected once &amp; reused</text>

  <rect x="180" y="133" width="136" height="91" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="188" y="139" width="54" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.7"/>
  <text x="215" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Arm B</text>
  <text x="188" y="169" font-size="9.2" font-weight="700" fill="#1e3a8a">ℳ(r-1)-Guided</text>
  <text x="188" y="186" font-size="8.3" fill="#1e293b">• Checkpoints + channels</text>
  <text x="188" y="201" font-size="8.3" fill="#1e293b">• No verifier access</text>
  <text x="188" y="216" font-size="8.2" fill="#1d4ed8">• Re-sampled per batch r</text>

  <rect x="324" y="133" width="136" height="91" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="332" y="139" width="54" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.7"/>
  <text x="359" y="150" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b45309">Arm C</text>
  <text x="332" y="169" font-size="9.2" font-weight="700" fill="#92400e">Privileged Verifier</text>
  <text x="332" y="186" font-size="8.3" fill="#78350f">• Train acceptance criteria</text>
  <text x="332" y="201" font-size="8.3" fill="#78350f">• Leak to worker barred</text>
  <text x="332" y="216" font-size="8.2" fill="#b45309">• Audited before pairing</text>

  <line x1="248" y1="232" x2="248" y2="244" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Step 2: 5 Contrast Directions -->
  <rect x="28" y="246" width="440" height="90" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="263" font-size="9.9" font-weight="700" fill="#0f172a">2. Five Outcome Contrast Directions (Directional, Non-Causal)</text>

  <rect x="36" y="271" width="138" height="57" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="44" y="286" font-size="9.0" font-weight="700" fill="#1d4ed8">act (Support Edit)</text>
  <text x="44" y="302" font-size="8.3" fill="#0f172a">• A✗ → B✓ (effective)</text>
  <text x="44" y="317" font-size="8.3" fill="#0f172a">• B✗ → C✓ (informed)</text>

  <rect x="182" y="271" width="138" height="57" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="190" y="286" font-size="9.0" font-weight="700" fill="#b91c1c">avoid (Rule Out Edit)</text>
  <text x="190" y="302" font-size="8.3" fill="#7f1d1d">• A✓ → B✗ (harmful)</text>
  <text x="190" y="317" font-size="8.3" fill="#7f1d1d">• B✓ → C✗ (overreach)</text>

  <rect x="328" y="271" width="132" height="57" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="336" y="286" font-size="9.0" font-weight="700" fill="#b45309">hold (Leave Alone)</text>
  <text x="336" y="302" font-size="8.2" fill="#78350f">• A✓ + B✓ (unnecessary)</text>
  <text x="336" y="317" font-size="8.2" fill="#78350f">• Self-recovering errors</text>

  <line x1="248" y1="336" x2="248" y2="348" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Step 3: Reflect -> Aggregate -> Update -->
  <rect x="28" y="350" width="440" height="136" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="38" y="367" font-size="9.9" font-weight="700" fill="#1e3a8a">3. Three-Stage LLM Distillation &amp; Freeze ℳ (Eq. 4)</text>

  <rect x="36" y="375" width="130" height="69" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="390" font-size="9.0" font-weight="700" fill="#1d4ed8">REFLECT (f_ref)</text>
  <text x="44" y="405" font-size="8.1" fill="#334155">• Visible-evidence lessons</text>
  <text x="44" y="419" font-size="8.1" fill="#334155">• Hidden C thresholds barred</text>
  <text x="44" y="433" font-size="8.1" fill="#475569">• Scores entry_credit</text>

  <line x1="166" y1="409" x2="178" y2="409" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="180" y="375" width="136" height="69" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="188" y="390" font-size="9.0" font-weight="700" fill="#1d4ed8">AGGREGATE (f_agg)</text>
  <text x="188" y="405" font-size="8.1" fill="#334155">• Hard rule: ≥2 tasks</text>
  <text x="188" y="419" font-size="8.1" fill="#334155">• Strip paths &amp; nouns</text>
  <text x="188" y="433" font-size="8.1" fill="#475569">• Keep opposing bounds</text>

  <line x1="316" y1="409" x2="328" y2="409" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="330" y="375" width="130" height="69" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="338" y="390" font-size="9.0" font-weight="700" fill="#1e3a8a">UPDATE → Freeze ℳ</text>
  <text x="338" y="405" font-size="8.1" fill="#334155">• ADD / MERGE / REFINE</text>
  <text x="338" y="419" font-size="8.1" fill="#334155">• DELETE (≥2 misled)</text>
  <text x="338" y="433" font-size="8.1" fill="#1d4ed8">• Final audit &amp; freeze</text>

  <rect x="36" y="450" width="424" height="29" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="44" y="462.5" font-size="8.0" fill="#1e3a8a">Entry: ID/title · Type(act/hold/avoid) · Time(start/during/end) · When · Guidance · Why · ≤3 ex.</text>
  <text x="44" y="474.5" font-size="8.0" fill="#475569">Learned size: TB 2.1 = 14 entries (9 act, 2 hold, 3 avoid); DeepSWE 1.1 = 9 entries (7 act, 2 hold)</text>

  <!-- Bridge Arrow Offline -> Online -->
  <path d="M 468 410 L 490 410 L 490 144 L 500 144" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Right Panel: Stage 2 Online -->
  <rect x="502" y="72" width="440" height="422" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="502" y="72" width="440" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="502" y="92" width="440" height="8" fill="#1d4ed8"/>
  <text x="514" y="90.5" font-size="10.6" font-weight="700" fill="#ffffff">Stage 2 · Online Evolution: Frozen ℳ + Task-Local Edits (No Verifier)</text>

  <!-- Online Step 1: Init -->
  <rect x="512" y="108" width="420" height="68" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="520" y="115" width="76" height="17" rx="4" fill="#1d4ed8"/>
  <text x="558" y="126.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">Per-Task Reset</text>
  <text x="604" y="127" font-size="9.8" font-weight="700" fill="#1e3a8a">Reset to Seed Harness h(0) with Frozen ℳ</text>
  <text x="520" y="147" font-size="8.6" fill="#0f172a">• Same frozen LLM plays Worker (task) &amp; Evolver (supervises via ℳ)</text>
  <text x="520" y="164" font-size="8.6" fill="#334155">• Held-out verifier criteria &amp; outcomes are completely hidden</text>

  <line x1="722" y1="176" x2="722" y2="188" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Online Step 2: Checkpoint Loop -->
  <rect x="512" y="190" width="420" height="176" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="522" y="207" font-size="9.9" font-weight="700" fill="#0f172a">2. Checkpoint Loop (Step 1, Every L=5 Steps &amp; Terminal Stop)</text>

  <rect x="520" y="214" width="198" height="94" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="528" y="230" font-size="9.1" font-weight="700" fill="#1e3a8a">Accumulated Evidence ℐ(k)</text>
  <text x="528" y="246" font-size="8.2" fill="#334155">• Δτ(k): trace deltas (1,500-char cap)</text>
  <text x="528" y="261" font-size="8.2" fill="#334155">• ω(k): read-only /app &amp; stdout files</text>
  <text x="528" y="276" font-size="8.2" fill="#334155">• σ(k-1): loaded / retained / rolled back</text>
  <text x="528" y="291" font-size="8.2" fill="#475569">• Repeat-cmd fingerprints &amp; budgets</text>
  <text x="528" y="303" font-size="7.9" fill="#1d4ed8">• Terminal: modified files, ports, procs</text>

  <rect x="726" y="214" width="198" height="94" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="734" y="230" font-size="9.1" font-weight="700" fill="#1d4ed8">Binary Decision u(k) (Eq. 3)</text>
  <text x="734" y="246" font-size="8.2" fill="#0f172a">• KEEP: retain h(k) = h(k-1) &amp; run</text>
  <text x="734" y="261" font-size="8.2" fill="#0f172a">• EVOLVE(δ(k)): edit via channel</text>
  <text x="734" y="276" font-size="8.2" fill="#0f172a">• Terminal: KEEP accepts artifact;</text>
  <text x="734" y="290" font-size="8.2" fill="#0f172a">  EVOLVE sends back (≤2 times)</text>
  <text x="734" y="303" font-size="7.9" fill="#475569">• Evolver logs cited Meta-Skill IDs</text>

  <rect x="520" y="314" width="404" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="528" y="329" font-size="8.3" font-weight="700" fill="#0f172a">8 Bounded Channels (Failed load auto-rolls back &amp; re-prompts Evolver):</text>
  <text x="528" y="343" font-size="8.1" fill="#334155">notice (≤2 active turns) · append/rewrite_worker_prompt · register_check (Py)</text>
  <text x="528" y="354" font-size="8.1" fill="#334155">register_probe (bash) · add_tool / add_skill / add_middleware · rollback (snapshot)</text>

  <line x1="722" y1="366" x2="722" y2="378" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- Online Step 3: Continuation & Isolation -->
  <rect x="512" y="380" width="420" height="106" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="397" font-size="9.9" font-weight="700" fill="#0f172a">3. Reset-Free Continuation &amp; Post-Run Isolation (§3.3)</text>
  <text x="522" y="414" font-size="8.4" fill="#334155">• Preserves active E2B sandbox &amp; partial trace τ≤tk; δ(k) shapes same run only</text>
  <text x="522" y="430" font-size="8.4" fill="#334155">• Plain-text reasoning stays in logs; Worker sees channel messages only</text>
  <text x="522" y="446" font-size="8.4" fill="#334155">• Edits δ(k) &amp; chat history discarded on exit; ℳ stays frozen; next task resets to h(0)</text>
  <rect x="520" y="454" width="404" height="24" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="528" y="469.5" font-size="8.2" font-weight="600" fill="#92400e">Ablation: retaining edits drops TB 81.00→78.33% (-2.67), SWE 44.44→39.11% (-5.33)</text>

  <!-- Footer -->
  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="510.5" font-size="8.8" fill="#334155">Blue: act / Evolution &amp; control flow</text>
  <rect x="225" y="502" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="242" y="510.5" font-size="8.8" fill="#334155">Amber: Arm C verifier / hold / Isolation</text>
  <rect x="445" y="502" width="12" height="10" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="462" y="510.5" font-size="8.8" fill="#334155">Red: avoid contrasts</text>
  <text x="20" y="527" font-size="8.6" fill="#64748b">Caveat: Independent A/B/C samples give directional evidence, not checkpoint counterfactuals; Arm A differs in segmentation &amp; middleware scaffolding (§F.1, H.3).</text>
</svg>
