  <text x="24" y="33" font-size="16.5" font-weight="700" fill="#0f172a">GPU-NBDetect 检测架构、9 类判据与 4 库 186 函数实证结果</text>
  <text x="24" y="52" font-size="10.0" fill="#475569">arXiv:2611.05121v1（§5.3, Tables 4–6）· Intel Xeon E5-26 + 8× NVIDIA GTX 1080 Ti (CUDA 11.1) · 每函数 100 样本 × 3 独立周期</text>
  <line x1="24" y1="61" x2="936" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Top: Differential Pipeline -->
  <rect x="20" y="70" width="416" height="148" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="70" width="416" height="24" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="86" width="416" height="8" fill="#1e3a8a"/>
  <text x="32" y="86.5" font-size="10.2" font-weight="700" fill="#ffffff">A. 自动化变异与 CPU–GPU 差分模板流水线（§5.3）</text>

  <text x="30" y="112" font-size="8.8" fill="#0f172a">1. 支持精度范围：目前仅覆盖 float (FP32) 与 double (FP64) 数学 API</text>
  <text x="30" y="133" font-size="8.8" fill="#0f172a">2. 合法域防误报：在 CUDA Math 文档支持区间内随机采样，剔除已知异常输入</text>
  <text x="30" y="154" font-size="8.8" fill="#0f172a">3. 位级边界变异：8 个列举算子（bitflip_s/e/m、add/sub_e[1–32]、add/sub_m、random_bit）</text>
  <text x="30" y="175" font-size="8.8" fill="#0f172a">4. 动态代码模板：Python 生成 C (math.h) 与 CUDA 代码，经 subprocess 编译对比</text>
  <text x="30" y="196" font-size="8.8" font-weight="600" fill="#1d4ed8">5. 三周期一致性：每算子 100 样本跑 3 轮，排除未能稳定复现阈值的偶发告警</text>

  <!-- Left Bottom: 9 Oracles (Table 4) -->
