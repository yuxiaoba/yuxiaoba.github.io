<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="GPU-NBDetect 差分检测流水线、9 种表现判据与 4 库 186 算子实证检测结果及开发者确认口径" style="background:#ffffff;font-family:'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;">
