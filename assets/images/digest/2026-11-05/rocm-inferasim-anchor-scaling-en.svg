<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ROCm InferaSim architecture: kernel-defining vs transferable choices, reduce-measure-restore laws, and DES/agent search" style="background:#ffffff;font-family:'Lato', 'Noto Sans', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
