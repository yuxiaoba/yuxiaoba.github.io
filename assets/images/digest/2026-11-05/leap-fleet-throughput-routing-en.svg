  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.5" font-weight="700" fill="#0f172a">LEAP Production Fleet Throughput Prediction &amp; Hardware Routing Loop</text>
  <text x="24" y="51" font-size="10.2" fill="#475569">arXiv:2611.04057v1 (§2 &amp; Figs. 2–4, 6–7) · In-Launcher CPU Inference · 250k-Family History Snapshot · 13-Bin EM-GBDT Cascade</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="20" y="68" width="920" height="218" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="20" y="68" width="920" height="26" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="86" width="920" height="8" fill="#1e3a8a"/>
  <text x="32" y="85.5" font-size="10.6" font-weight="700" fill="#ffffff">Online Serving Hot Path (Linked Inside Job Launcher · Zero Network RPC, Zero Serving GPU, Zero Graph Cache)</text>

  <rect x="30" y="102" width="190" height="176" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="109" width="68" height="17" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="72" y="121" text-anchor="middle" font-size="8.8" font-weight="700" fill="#334155">Submit Time</text>
  <text x="112" y="121.5" font-size="10.2" font-weight="700" fill="#0f172a">73 Raw Inputs</text>
  <text x="38" y="142" font-size="8.9" fill="#334155">• Launch config &amp; scale args</text>
  <text x="38" y="159" font-size="8.5" fill="#475569">  (trainers, batch, reader ratio)</text>
  <text x="38" y="180" font-size="8.9" fill="#334155">• 44 model-arch summary vals</text>
  <text x="38" y="200" font-size="8.9" fill="#334155">• 12 numeric HW specs + vendor</text>
  <text x="38" y="220" font-size="8.9" fill="#334155">• Embedded snapshot (≤250k)</text>
  <text x="38" y="238" font-size="8.5" fill="#475569">  Normalized key; recency online</text>
  <text x="38" y="259" font-size="8.7" font-weight="600" fill="#1d4ed8">• Explicit cold-start fill (not 0)</text>

  <line x1="220" y1="190" x2="236" y2="190" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="238" y="102" width="216" height="176" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="246" y="109" width="64" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="278" y="121" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">Shared Code</text>
  <text x="316" y="121.5" font-size="10.2" font-weight="700" fill="#1e3a8a">Feature Importance</text>
  <text x="246" y="140" font-size="8.5" fill="#475569">56 num + 17 cat (Fig. 4; 18 zero-drop)</text>

  <text x="246" y="159" font-size="8.7" font-weight="600" fill="#0f172a">Job scale</text>
  <rect x="306" y="151" width="84" height="9" rx="2" fill="#1d4ed8"/>
  <text x="395" y="159" font-size="8.7" font-weight="700" fill="#1d4ed8">33.2%</text>

  <text x="246" y="179" font-size="8.7" font-weight="600" fill="#0f172a">Job history</text>
  <rect x="306" y="171" width="75" height="9" rx="2" fill="#2563eb"/>
  <text x="386" y="179" font-size="8.7" font-weight="700" fill="#1d4ed8">29.8%</text>

  <text x="246" y="199" font-size="8.7" fill="#334155">Model arch</text>
  <rect x="306" y="191" width="53" height="9" rx="2" fill="#3b82f6"/>
  <text x="364" y="199" font-size="8.7" fill="#334155">21.1%</text>

  <text x="246" y="219" font-size="8.7" fill="#334155">Config/pkg</text>
  <rect x="306" y="211" width="26" height="9" rx="2" fill="#60a5fa"/>
  <text x="337" y="219" font-size="8.7" fill="#334155">10.2%</text>

  <text x="246" y="239" font-size="8.7" fill="#475569">HW specs</text>
  <rect x="306" y="231" width="15" height="9" rx="2" fill="#93c5fd"/>
  <text x="326" y="239" font-size="8.4" fill="#475569">5.8% (colinear split)</text>

  <rect x="246" y="250" width="200" height="20" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="346" y="263.5" text-anchor="middle" font-size="8.3" font-weight="600" fill="#92400e">Skew note: serving omits some scale args (§6)</text>

  <line x1="454" y1="190" x2="470" y2="190" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="472" y="102" width="254" height="176" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="480" y="109" width="58" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="509" y="121" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">CPU Path</text>
  <text x="544" y="121.5" font-size="10.2" font-weight="700" fill="#1e3a8a">13-Bin EM-GBDT Cascade</text>

  <rect x="482" y="132" width="234" height="36" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="490" y="147" font-size="9.0" font-weight="700" fill="#0f172a">1. Bin classifier g(x) → P(bin k | x)</text>
  <text x="490" y="161" font-size="8.4" fill="#475569">Select top bin k̂ = argmax_k g_k(x) per HW type</text>

  <line x1="599" y1="168" x2="599" y2="177" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="482" y="179" width="234" height="46" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="490" y="194" font-size="9.0" font-weight="700" fill="#0f172a">2. 13 pinball experts f₁ … f₁₃ (Hist-GBDT)</text>
  <text x="490" y="208" font-size="8.4" fill="#334155">τ=0.5 pinball loss estimates median ln q</text>
  <text x="490" y="220" font-size="8.3" fill="#475569">Score feature row x using chosen expert f_k̂(x)</text>

  <line x1="599" y1="225" x2="599" y2="234" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>

  <rect x="482" y="236" width="234" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="490" y="251" font-size="9.1" font-weight="700" fill="#1e3a8a">3. Predicted QPS: q̂(x) = exp(f_k̂(x))</text>
  <text x="490" y="264" font-size="8.3" fill="#1e3a8a">7-decade range; intra-HW p95/p5 stays 42×–701×</text>

  <line x1="726" y1="190" x2="742" y2="190" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="744" y="102" width="186" height="176" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="752" y="109" width="60" height="17" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="0.8"/>
  <text x="782" y="121" text-anchor="middle" font-size="8.8" font-weight="700" fill="#065f46">Cost-Norm</text>
  <text x="818" y="121.5" font-size="10.2" font-weight="700" fill="#0f172a">Rank &amp; Schedule</text>
  <text x="752" y="142" font-size="8.8" fill="#334155">• Score = q̂ / job compute cost</text>
  <text x="752" y="161" font-size="8.8" fill="#334155">• Prune low-efficiency premium</text>
  <text x="752" y="180" font-size="8.8" fill="#334155">• Return soft preference list</text>
  <text x="752" y="198" font-size="8.4" fill="#475569">  (capacity governs placement)</text>
  <text x="752" y="217" font-size="8.7" fill="#334155">• Failure → empty list fallback</text>
  <rect x="752" y="229" width="170" height="41" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="760" y="245" font-size="8.5" font-weight="700" fill="#1e3a8a">Aug 6-day slice (~200k jobs):</text>
  <text x="760" y="261" font-size="8.4" fill="#1d4ed8">19.9% jobs / 30% GPU-h on #1</text>

  <rect x="92" y="292" width="242" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="213" y="304.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1e3a8a">Stable pointer flip: loads cascade + snapshot</text>
  <line x1="345" y1="316" x2="345" y2="288" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="580" y="292" width="246" height="18" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="0.8"/>
  <text x="703" y="304.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#065f46">Finished attempts log measured QPS to daily table</text>
  <line x1="837" y1="286" x2="837" y2="314" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <rect x="488" y="316" width="452" height="178" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="488" y="316" width="452" height="26" rx="9" fill="#1e3a8a"/>
  <rect x="488" y="334" width="452" height="8" fill="#1e3a8a"/>
  <text x="500" y="333.5" font-size="10.3" font-weight="700" fill="#ffffff">Offline Nightly 30-Day Sliding Retrain (~750,000 Attempts, §2.4)</text>

  <text x="500" y="362" font-size="9.0" fill="#0f172a">1. Daily partition: drop missing or q=0 only; <tspan font-weight="700">keep outliers, no target clipping</tspan></text>
  <text x="500" y="386" font-size="9.0" fill="#0f172a">2. Init 13 equal-freq ln q bins → ≤3 EM steps (stop &lt;2% move) + 1 final refit</text>
  <text x="500" y="408" font-size="8.7" fill="#334155">   Fits ≤52 Hist-GBDT experts (≤3k trees, 255 leaves, lr=0.03) + classifier g(x)</text>
  <text x="500" y="432" font-size="9.0" fill="#0f172a">3. Bundle ≤250,000 normalized family stats into versioned immutable artifact</text>
  <rect x="500" y="448" width="428" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="510" y="463" font-size="8.7" font-weight="600" fill="#1e3a8a">Ops hygiene: relative rolling window avoids table-retention expiry gaps;</text>
  <text x="510" y="477" font-size="8.4" fill="#475569">test jobs never touch prod pointer; reproducibility bounded by artifact retention.</text>

  <line x1="488" y1="405" x2="474" y2="405" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#arr-navy)"/>

  <rect x="20" y="316" width="452" height="178" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="20" y="316" width="452" height="26" rx="9" fill="#1d4ed8"/>
  <rect x="20" y="334" width="452" height="8" fill="#1d4ed8"/>
  <text x="32" y="333.5" font-size="10.3" font-weight="700" fill="#ffffff">Next-Day Holdout Eval, Safe Rollout &amp; 1H 2026 Fleet Impact (§3, §6)</text>

  <rect x="32" y="352" width="428" height="48" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="42" y="369" font-size="9.1" font-weight="700" fill="#1e3a8a">Unseen Next-Day Eval (OOT): 30-night median w20 = 77.0% (73.5–80.6%)</text>
  <text x="42" y="388" font-size="8.6" fill="#b45309" font-weight="600">⚠ Never eval inside training window (overstated w20 by &gt;20 pp internally, §6)</text>

  <rect x="32" y="407" width="428" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="423" font-size="8.8" fill="#0f172a">Per-model_type runtime switches allow safe incremental rollout &amp; rollback</text>
  <text x="42" y="437" font-size="8.4" fill="#475569">Dynamic per-launch wins: Model Type 1 splits top-1 share 16–31% across 4 HW</text>

  <rect x="32" y="450" width="428" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="42" y="465" font-size="8.9" font-weight="700" fill="#065f46">1H 2026: Ranked GPU-h 58% → 95% (77M GPU-h) · Est. ~3% compute savings</text>
  <text x="42" y="478" font-size="8.3" fill="#047857">Routable jobs represent ~half of fleet training cost; savings is an observational est.</text>

  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="511" font-size="8.9" fill="#334155">Blue: Serving hot path &amp; OOT eval</text>
  <rect x="208" y="502" width="12" height="10" rx="2" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="225" y="511" font-size="8.9" fill="#334155">Navy: Nightly 30-day retrain</text>
  <rect x="380" y="502" width="12" height="10" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="397" y="511" font-size="8.9" fill="#334155">Teal: Feedback &amp; savings</text>
  <rect x="536" y="502" width="12" height="10" rx="2" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="553" y="511" font-size="8.9" fill="#334155">Amber: Skew / leakage warnings</text>
  <text x="20" y="527" font-size="8.8" fill="#64748b">Note: Fleet executes ~25k attempts/day across ~660 model types &amp; &gt;20 HW types; bottom 560 tail models represent 22% of attempts.</text>
</svg>