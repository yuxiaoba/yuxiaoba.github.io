  <rect x="612" y="244" width="102.7" height="6.2" rx="1.5" fill="#0f766e"/>
  <text x="719" y="249.5" font-size="8.0" font-weight="600" fill="#0f766e">10.7% TPOT (ITL 13.8%)</text>

  <!-- Panel C: Mechanistic Ablations -->
  <rect x="20" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="316" x2="472" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="307.5" font-size="11.0" font-weight="700" fill="#1e3a8a">C. 关键机制消融：为什么不能用简单启发式（表 7, 12, 18, 附录 A.1）</text>

  <rect x="32" y="324" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="338" font-size="9.3" font-weight="700" fill="#0f172a">1. TP4 → TP8 Decode 迁移（DeepSeek-V4-Pro, b=1–64, 表 18）</text>
  <text x="42" y="353" font-size="8.8" fill="#475569">简单折半 44.1% · 减 Simulate 降幅 18.5% → <tspan font-weight="700" fill="#1d4ed8">Eq. 1 保留固定开销 f: 0.9%</tspan></text>

  <rect x="32" y="366" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="380" font-size="9.3" font-weight="700" fill="#0f172a">2. SGLang PP 1–8 流水线 TPOT 中位误差（3 模型, 表 7）</text>
  <text x="42" y="395" font-size="8.8" fill="#475569">串行累加模型 14.9%–26.1% → <tspan font-weight="700" fill="#1d4ed8">Eq. 4 含回传跳与宿主时间: 2.3%–9.2%</tspan></text>

  <rect x="32" y="408" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="422" font-size="9.3" font-weight="700" fill="#0f172a">3. 对比移植至 MI355X 的 Vidur（30 组 SGLang Llama-3.1-8B, 表 12）</text>
  <text x="42" y="437" font-size="8.8" fill="#475569">Vidur: TTFT 34% / TPOT 40% / 吞吐 40% → <tspan font-weight="700" fill="#1d4ed8">InferaSim: 14% / 7.2% / 7.4%</tspan></text>

  <rect x="32" y="450" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="464" font-size="9.3" font-weight="700" fill="#0f172a">4. Prefix Cache 淘汰与采集校验（附录 A.1, 附录 E）</text>
  <text x="42" y="479" font-size="8.7" fill="#475569">扁平 LRU 命中率坍塌至 0% → <tspan font-weight="700" fill="#1d4ed8">叶优先 LRU 90.6%</tspan>（实迹 ~92%）；关缓存防 prefill 失真</text>

  <!-- Panel D: Ranking, Shortlist & Caveats -->
  <rect x="488" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="316" x2="940" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="307.5" font-size="11.0" font-weight="700" fill="#1e3a8a">D. 排序保真、Top-5 候选短表与已知误差边界（表 11, 13, 15, 17）</text>

  <rect x="500" y="324" width="428" height="86" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="510" y="339" font-size="9.6" font-weight="700" fill="#1d4ed8">选型排序与短表命中（纯 CPU 预测筛选）</text>
  <text x="510" y="356" font-size="8.8" fill="#0f172a">• 42 组固定长度排序对：吞吐 93.4% / TPOT 85.4%（p90 遗憾仅 0.2%）</text>
  <text x="510" y="372" font-size="8.8" fill="#0f172a">• 25 张 Pareto 前沿（529 点）：83%（170/206）命中前沿，中位 0% 损失</text>
  <text x="510" y="388" font-size="8.8" fill="#0f172a">• 23 个可行 Agentic 槽位：Top-1 最优 14/23，12% 内 16/23（2 个越限）</text>
  <text x="510" y="404" font-size="8.8" font-weight="700" fill="#1e3a8a">• Top-5 短表：21/23 含实测最优、22/23 在 12% 以内、0 个槽位违约</text>

  <rect x="500" y="416" width="428" height="70" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="510" y="431" font-size="9.6" font-weight="700" fill="#b45309">高误差长尾与显式边界（短表仍须实机复核）</text>
  <text x="510" y="447" font-size="8.7" fill="#78350f">• DeepSeek-V4-Pro SGLang FP4 (n=4)：AgentX ITL 误差因子达 2.01（吞吐 1.35）</text>
  <text x="510" y="463" font-size="8.7" fill="#78350f">• 跨节点 TP8×PP2 (n=6)：吞吐中位误差 33.8% / TPOT 21.7%（表 8）</text>
  <text x="510" y="479" font-size="8.7" fill="#78350f">• TTFT 波动较大（AgentX 1.23×，分离式 16.9%）→ 规划器强制 ≤0.5× 阈值</text>

  <text x="20" y="518" font-size="8.9" fill="#64748b">注：全部实证限于 AMD Instinct MI355X；EAGLE-3 / DSpark / n-gram 与 6 项核融合尚未提供实测对照；超越 ≤4× 并发或 1 次 TP 倍增标为外推。</text>
</svg>
