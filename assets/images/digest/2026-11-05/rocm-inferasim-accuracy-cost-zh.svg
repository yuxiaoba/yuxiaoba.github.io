  <text x="606" y="137" text-anchor="end" font-size="8.9" font-weight="700" fill="#0f172a">固定长度 (172)</text>
  <rect x="612" y="126" width="84.5" height="6.2" rx="1.5" fill="#1d4ed8"/>
  <text x="701" y="131.5" font-size="8.0" font-weight="600" fill="#1d4ed8">8.8%</text>
