  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="34" font-size="16.8" font-weight="700" fill="#0f172a">MI355X 实证证据：试错算力节省、跨场景预测误差与核心消融对照</text>
  <text x="22" y="53" font-size="10.1" fill="#475569">整理自 arXiv:2611.04032v1（§5, 图 1, 表 2–3, 表 7–18）· 评测硬件：8× AMD Instinct MI355X（每卡 288GB HBM3E）+ Pollara NIC</text>
  <line x1="22" y1="62" x2="938" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A: GPU-Hours Savings -->
  <rect x="20" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="11.0" font-weight="700" fill="#1e3a8a">A. 采集锚点 vs 穷举试错算力消耗（§1, §5.11, 图 1a）</text>

  <rect x="32" y="106" width="428" height="44" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="42" y="121" font-size="9.8" font-weight="700" fill="#0f172a">226 组固定长度配置（671 次全量实测 vs 11 个锚点）</text>
  <rect x="356" y="110" width="96" height="15" rx="4" fill="#1d4ed8"/>
  <text x="404" y="120.5" text-anchor="middle" font-size="8.4" font-weight="700" fill="#ffffff">节省 22.4× GPU 时</text>
  <rect x="42" y="130" width="175" height="5.5" rx="2" fill="#94a3b8"/>
  <text x="224" y="136" font-size="8.7" fill="#475569">全量实测：204 GPU-h（单配置中位 3.4 min）</text>
  <rect x="42" y="139" width="8" height="5.5" rx="2" fill="#1d4ed8"/>
  <text x="56" y="145" font-size="8.8" font-weight="700" fill="#1d4ed8">11 锚点：9.1 GPU-h → 覆盖评分 172 组</text>

  <rect x="32" y="155" width="428" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="170" font-size="9.8" font-weight="700" fill="#0f172a">192 次代理搜索 · 56,328 个候选配置（§5.11, 附录 D.3）</text>
  <text x="42" y="188" font-size="8.8" fill="#334155">穷举估算：约 25,000 GPU-h  |  <tspan font-weight="700" fill="#1d4ed8">InferaSim：0 GPU-h（仅 3–8 CPU-h）</tspan></text>

  <rect x="32" y="202" width="428" height="40" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.9"/>
  <text x="42" y="217" font-size="9.8" font-weight="700" fill="#065f46">Simulate 零测量排序（287 组配置，仅同引擎内部比较）</text>
  <text x="42" y="234" font-size="8.8" fill="#0f766e">全测耗时：248 GPU-h  |  InferaSim：0 GPU-h（吞吐对排序 89.0%）</text>

  <rect x="32" y="248" width="428" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="246" y="262.5" text-anchor="middle" font-size="8.8" font-weight="600" fill="#334155">单次预测耗时（含 10×C DES 请求）：单核 CPU 0.17–0.48 秒 · 全研究共复用 75 个锚点</text>

