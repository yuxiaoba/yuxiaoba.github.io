  <text x="606" y="203" text-anchor="end" font-size="8.9" font-weight="700" fill="#0f172a">双节点流水线 (24)</text>
  <rect x="612" y="192" width="111.4" height="6.2" rx="1.5" fill="#1d4ed8"/>
