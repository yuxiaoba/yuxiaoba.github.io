  <text x="606" y="225" text-anchor="end" font-size="8.9" font-weight="700" fill="#0f172a">AgentX DCP (9)</text>
  <rect x="612" y="214" width="76.8" height="6.2" rx="1.5" fill="#1d4ed8"/>
