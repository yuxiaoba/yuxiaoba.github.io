  <text x="32" y="89.5" font-size="10.8" font-weight="700" fill="#1e3a8a">A. Anchor Harvest vs. Exhaustive Trial GPU-Hours (§1, §5.11, Fig. 1a)</text>

  <rect x="32" y="106" width="428" height="44" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="42" y="121" font-size="9.5" font-weight="700" fill="#0f172a">226 Fixed-Length Configs (671 runs vs. 11 anchors)</text>
  <rect x="356" y="110" width="96" height="15" rx="4" fill="#1d4ed8"/>
  <text x="404" y="120.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">22.4× Less GPU Time</text>
  <rect x="42" y="130" width="175" height="5.5" rx="2" fill="#94a3b8"/>
  <text x="224" y="136" font-size="8.4" fill="#475569">Measured all: 204 GPU-h (3.4 min median)</text>
  <rect x="42" y="139" width="8" height="5.5" rx="2" fill="#1d4ed8"/>
  <text x="56" y="145" font-size="8.5" font-weight="700" fill="#1d4ed8">11 Anchors: 9.1 GPU-h → scores 172 filtered configs</text>

  <rect x="32" y="155" width="428" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="170" font-size="9.5" font-weight="700" fill="#0f172a">192 Agent Searches · 56,328 Candidates (§5.11, App. D.3)</text>
  <text x="42" y="188" font-size="8.5" fill="#334155">Exhaustive est.: ~25,000 GPU-h  |  <tspan font-weight="700" fill="#1d4ed8">InferaSim: 0 GPU-h (3–8 CPU-hours)</tspan></text>

  <rect x="32" y="202" width="428" height="40" rx="5" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.9"/>
  <text x="42" y="217" font-size="9.5" font-weight="700" fill="#065f46">Simulate-Mode Ranking (287 configs, intra-engine only)</text>
  <text x="42" y="234" font-size="8.5" fill="#0f766e">Measured cost: 248 GPU-h  |  InferaSim: 0 GPU-h (89.0% tput pair acc.)</text>

  <rect x="32" y="248" width="428" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="246" y="262.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">1 CPU projection (w/ 10×C DES requests): 0.17–0.48 s · 75 cached anchors used across study</text>

