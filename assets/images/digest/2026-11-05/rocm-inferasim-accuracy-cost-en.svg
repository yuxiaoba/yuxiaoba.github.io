  <rect x="500" y="324" width="428" height="86" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="510" y="339" font-size="9.4" font-weight="700" fill="#1d4ed8">CPU-Only Selection &amp; Shortlist Fidelity</text>
  <text x="510" y="356" font-size="8.5" fill="#0f172a">• 42 choice sets: 93.4% Tput / 85.4% TPOT pairs (0.2% p90 Tput regret)</text>
  <text x="510" y="372" font-size="8.5" fill="#0f172a">• 25 Pareto charts (529 pts): 83% (170/206) frontier hit (0% p50 loss)</text>
  <text x="510" y="388" font-size="8.5" fill="#0f172a">• 23 feasible agentic slots: Top-1 best 14/23, ≤12% in 16/23 (2 miss)</text>
  <text x="510" y="404" font-size="8.5" font-weight="700" fill="#1e3a8a">• Top-5 shortlist: best 21/23, ≤12% in 22/23, 0 tier misses</text>

  <rect x="500" y="416" width="428" height="70" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="510" y="431" font-size="9.4" font-weight="700" fill="#b45309">Outliers &amp; Mandatory GPU Verification</text>
  <text x="510" y="447" font-size="8.4" fill="#78350f">• DeepSeek-V4-Pro SGLang FP4 (n=4): 2.01× ITL factor (1.35× Tput)</text>
  <text x="510" y="463" font-size="8.4" fill="#78350f">• Cross-node TP8×PP2 (n=6): 33.8% Tput / 21.7% TPOT error (Table 8)</text>
  <text x="510" y="479" font-size="8.4" fill="#78350f">• Noisy TTFT (1.23× agentic / 16.9% split) → Planner caps TTFT ≤0.5× tier</text>

  <text x="20" y="518" font-size="8.6" fill="#64748b">Note: Measurements cover AMD MI355X only; EAGLE-3/DSpark/n-gram &amp; 6 fusions are unmeasured predictions; anchor coverage limits: ≤4× conc. &amp; ≤1 TP doubling.</text>
