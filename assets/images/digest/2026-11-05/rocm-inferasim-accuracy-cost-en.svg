  <text x="22" y="53" font-size="10.0" fill="#475569">From arXiv:2611.04032v1 (§5, Fig. 1, Tables 2–3, 7–18) · Evaluated on 8× AMD Instinct MI355X nodes (288GB HBM3E/GPU) + Pollara NICs</text>
  <line x1="22" y1="62" x2="938" y2="62" stroke="#cbd5e1" stroke-width="1"/>

