  <line x1="20" y1="316" x2="472" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="307.5" font-size="10.8" font-weight="700" fill="#1e3a8a">C. Mechanistic Ablations: Why Simple Rules Fail (Tables 7, 12, 18)</text>

  <rect x="32" y="324" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="338" font-size="9.0" font-weight="700" fill="#0f172a">1. TP4 → TP8 Decode Transfer (DeepSeek-V4-Pro, b=1–64, Table 18)</text>
  <text x="42" y="353" font-size="8.5" fill="#475569">Naive halve 44.1% · Sim-drop 18.5% → <tspan font-weight="700" fill="#1d4ed8">Eq. 1 preserves floor f: 0.9%</tspan></text>

  <rect x="32" y="366" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="380" font-size="9.0" font-weight="700" fill="#0f172a">2. SGLang PP 1–8 Median TPOT Error (3 models, Table 7)</text>
  <text x="42" y="395" font-size="8.5" fill="#475569">Serial model 14.9%–26.1% → <tspan font-weight="700" fill="#1d4ed8">Eq. 4 (970µs hop + host H): 2.3%–9.2%</tspan></text>

  <rect x="32" y="408" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="422" font-size="9.0" font-weight="700" fill="#0f172a">3. vs. Vidur on 30 SGLang Llama-3.1-8B MI355X Runs (Table 12)</text>
  <text x="42" y="437" font-size="8.5" fill="#475569">Vidur: 34% TTFT / 40% TPOT / 40% Tput → <tspan font-weight="700" fill="#1d4ed8">InferaSim: 14% / 7.2% / 7.4%</tspan></text>

  <rect x="32" y="450" width="428" height="37" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="42" y="464" font-size="9.0" font-weight="700" fill="#0f172a">4. Prefix Eviction &amp; Harvest Hygiene (App. A.1 &amp; App. E)</text>
  <text x="42" y="479" font-size="8.4" fill="#475569">Flat LRU collapses to 0% hits → <tspan font-weight="700" fill="#1d4ed8">Leaf-first LRU 90.6%</tspan> (trace ~92%); cache OFF</text>

