  <text x="24" y="52" font-size="9.9" fill="#475569">arXiv:2611.04449v1 (§§2–4, Figs. 1–5, Tables 1 &amp; 4–7) · 291-Repo Census → Gate Zeroing + Pre-RMSNorm 10³⁰⁺ Blowup → FP32 Overflow</text>
