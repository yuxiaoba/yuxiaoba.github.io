  <text x="30" y="114" font-size="8.7" fill="#475569">291 HF repos (280 tables): reachable rows ‖e_v‖₂ &lt; 10⁻⁶</text>

  <text x="110" y="135" text-anchor="end" font-size="8.7" fill="#334155">Tied Transf.</text>
  <rect x="116" y="127" width="3" height="10" rx="2" fill="#94a3b8"/>
