  <text x="36" y="259" font-size="8.3" fill="#334155">• OLMoE check: 251/251 unseen in 364M-tok sample</text>
  <text x="36" y="272" font-size="8.1" fill="#475569">• 92% (901/979) keep E_out ≥0.3× median (silent!)</text>

