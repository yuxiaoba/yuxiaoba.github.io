  <text x="678" y="159" font-size="10.2" font-weight="700" fill="#ffffff">3. Manual Repairs (Table 7 · 397)</text>

  <rect x="674" y="176" width="258" height="102" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="682" y="183" width="76" height="17" rx="4" fill="#dcfce7" stroke="#34d399" stroke-width="0.7"/>
  <text x="720" y="194.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#047857">242 fixes</text>
  <text x="765" y="195" font-size="9.9" font-weight="700" fill="#065f46">Type &amp; Operator Repairs</text>
  <text x="682" y="216" font-size="8.6" fill="#1e293b">• Add/Change Data Type: 143 (84C / 59O)</text>
  <text x="682" y="234" font-size="8.6" fill="#1e293b">• Refactor Operator: 94 (39C / 55O)</text>
  <text x="682" y="252" font-size="8.6" fill="#047857">• Custom Kernel: 5 (1C / 4O · 7.0% OSS op)</text>
  <text x="682" y="269" font-size="8.0" fill="#475569">e.g., CuPy RawKernel / ReductionKernel</text>

  <rect x="674" y="284" width="258" height="100" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="682" y="291" width="76" height="17" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.7"/>
  <text x="720" y="302.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">97 fixes</text>
  <text x="765" y="303" font-size="9.9" font-weight="700" fill="#1e3a8a">Precision &amp; Cast Repairs</text>
  <text x="682" y="324" font-size="8.6" fill="#1e293b">• Change Precision: 38 (28C / 10O · 39.2%)</text>
  <text x="682" y="341" font-size="8.6" fill="#1e293b">• Upcast/Downcast: 32 (23C / 9O · 33.0%)</text>
  <text x="682" y="358" font-size="8.6" fill="#1e293b">• Arith. Checkers: 27 (17C / 10O · 27.8%)</text>
  <text x="682" y="375" font-size="8.0" fill="#475569">Manual width tuning rather than automated repair</text>

  <rect x="674" y="390" width="258" height="52" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="682" y="397" width="76" height="17" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.7"/>
  <text x="720" y="408.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b45309">47 fixes</text>
  <text x="765" y="409" font-size="9.9" font-weight="700" fill="#0f172a">NaN / INF Checkers</text>
  <text x="682" y="431" font-size="8.4" fill="#334155">31C / 16O · e.g., clamp near-zero FP16 values</text>

  <rect x="674" y="448" width="258" height="42" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <rect x="682" y="454" width="76" height="16" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.7"/>
  <text x="720" y="465" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">11 fixes</text>
  <text x="765" y="466" font-size="9.9" font-weight="700" fill="#0f172a">Mixed Prec. / GPU Switch</text>
  <text x="682" y="482" font-size="8.4" fill="#334155">6C / 5O · e.g., switch to FP32 or newer GPU</text>

