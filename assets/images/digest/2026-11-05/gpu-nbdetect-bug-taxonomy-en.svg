<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Taxonomy of 397 real-world GPU numerical bugs: corpus funnel and symptom to root cause to repair mapping" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
