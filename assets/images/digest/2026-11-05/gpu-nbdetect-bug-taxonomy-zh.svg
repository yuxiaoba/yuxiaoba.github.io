  <text x="765" y="303" font-size="10.0" font-weight="700" fill="#1e3a8a">精度调节与转换护栏</text>
  <text x="682" y="324" font-size="8.6" fill="#1e293b">• 调整数值精度 38（28C / 10O · 39.2%）</text>
