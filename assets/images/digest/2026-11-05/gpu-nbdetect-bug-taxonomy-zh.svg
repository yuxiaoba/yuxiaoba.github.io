  <text x="32" y="159" font-size="10.4" font-weight="700" fill="#ffffff">一、可观测症状（Table 3 · 397 例）</text>

  <rect x="28" y="176" width="258" height="104" rx="6" fill="#fff5f5" stroke="#fca5a5" stroke-width="1"/>
