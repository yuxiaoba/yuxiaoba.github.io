  <rect x="342" y="454" width="92" height="16" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.7"/>
  <text x="388" y="465" text-anchor="middle" font-size="8.6" font-weight="700" fill="#0369a1">3.8% · 15 例</text>
  <text x="442" y="466" font-size="10.0" font-weight="700" fill="#0f172a">设备代际差异</text>
  <text x="342" y="482" font-size="8.4" fill="#334155">闭源 7 / 开源 8 · 如 GTX 760 双精度慢于 CPU</text>

