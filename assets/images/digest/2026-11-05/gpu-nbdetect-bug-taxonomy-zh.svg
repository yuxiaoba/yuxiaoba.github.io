  <text x="342" y="216" font-size="8.9" font-weight="600" fill="#0f172a">• 数据类型缺陷 143（闭源 84 / 开源 59）</text>
  <text x="342" y="234" font-size="8.9" font-weight="600" fill="#0f172a">• 算子实现缺陷 94（闭源 37 / 开源 57）</text>
  <text x="342" y="252" font-size="8.3" fill="#334155">GPU 独有高发：闭源库类型支持与算子不透明</text>
  <text x="342" y="268" font-size="7.9" fill="#64748b">*Table 2 求和 237（共 397）；正文 Table 1 误写 239 (59.6%)</text>

  <rect x="334" y="284" width="292" height="100" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="342" y="291" width="96" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
