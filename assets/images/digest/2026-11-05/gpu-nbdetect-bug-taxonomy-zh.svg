  <text x="446" y="409" font-size="10.1" font-weight="700" fill="#0f172a">特殊值缺陷（NaN / INF）</text>
  <text x="342" y="431" font-size="8.5" fill="#334155">闭源 33 / 开源 15 · 无异常自检；仅支持小端序</text>

