  <text x="140" y="195" font-size="10.2" font-weight="700" fill="#0f172a">显式错误消息</text>
  <text x="36" y="212" font-size="8.5" fill="#475569">闭源 104 / 开源 77（多由显式检查触发）</text>
  <text x="36" y="230" font-size="8.7" fill="#1e293b">• 不支持数据类型 90（57C / 33O）</text>
  <text x="36" y="246" font-size="8.7" fill="#1e293b">• 不支持算子 37 · 溢出/下溢 36</text>
  <text x="36" y="262" font-size="8.7" fill="#1e293b">• 非法转换 11 · 未定义计算 7</text>

  <rect x="28" y="286" width="258" height="118" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="36" y="293" width="96" height="17" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.7"/>
