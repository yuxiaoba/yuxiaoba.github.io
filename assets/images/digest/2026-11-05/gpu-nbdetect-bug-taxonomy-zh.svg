  <text x="140" y="305" font-size="10.2" font-weight="700" fill="#0f172a">静默错误结果</text>
  <text x="36" y="322" font-size="8.5" fill="#475569">闭源 99 / 开源 80（需对比 CPU 或类型）</text>
  <text x="36" y="340" font-size="8.7" fill="#1e293b">• 跨精度区间差异 50（16C / 34O）</text>
  <text x="36" y="356" font-size="8.7" fill="#1e293b">• NaN 输出 43 · 精度量级差异 40</text>
  <text x="36" y="372" font-size="8.7" fill="#1e293b">• 跨数据类型差异 26 · 转换前后差异 20</text>
  <text x="36" y="392" font-size="8.2" fill="#92400e">GPU 缺硬件异常标志 → 错误静默传播</text>

  <rect x="28" y="410" width="258" height="80" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
