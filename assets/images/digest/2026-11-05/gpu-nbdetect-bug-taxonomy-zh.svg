  <text x="446" y="303" font-size="10.2" font-weight="700" fill="#1e3a8a">数值精度缺陷（三大子类）</text>
  <text x="342" y="324" font-size="8.7" fill="#1e293b">• 舍入/近似 34（25C / 9O）：无 80-bit 扩展模式</text>
  <text x="342" y="341" font-size="8.7" fill="#1e293b">• 类型转换 32（23C / 9O）：超界静默替默认值</text>
  <text x="342" y="358" font-size="8.7" fill="#1e293b">• 算术溢出/下溢 31（20C / 11O）：混合精度越界</text>
  <text x="342" y="375" font-size="8.0" fill="#475569">舍入（35.1%）与转换（33.0%）各占精度类约三分之一</text>

  <rect x="334" y="390" width="292" height="52" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="342" y="397" width="96" height="17" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.7"/>
