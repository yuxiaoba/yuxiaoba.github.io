<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="GroupClip decoupled embedding clipping and GateFloor positive gate offset mechanisms and empirical comparisons" style="background:#ffffff;font-family:'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.2" font-weight="700" fill="#0f172a">Targeted Mitigations: GroupClip (Released Checkpoints) vs. GateFloor (Pretraining)</text>
  <text x="24" y="52" font-size="9.9" fill="#475569">arXiv:2611.04449v1 (§5, Fig. 6, Tables 2–3, App. D–E) · Zero step-time/memory overhead, targeting clip overflow vs. zero-point gates</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Panel A -->
  <rect x="20" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="98" x2="472" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="89.5" font-size="10.6" font-weight="700" fill="#1e3a8a">A. GroupClip: 3-Line Decoupled E_in Clipping (Adaptation)</text>

  <rect x="30" y="106" width="210" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="40" y="122" font-size="9.1" font-weight="700" fill="#1e3a8a">Backbone Params g_other (1–10)</text>
  <text x="40" y="139" font-size="8.3" fill="#334155">clip_grad_norm_(backbone, 1.0)</text>
  <text x="40" y="156" font-size="8.3" font-weight="700" fill="#1d4ed8">Isolated from E_in · Keeps 37.8% fresh</text>

  <rect x="250" y="106" width="212" height="68" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="260" y="122" font-size="9.1" font-weight="700" fill="#065f46">Input Embeddings g_emb (10⁶–10³⁵)</text>
  <text x="260" y="139" font-size="8.3" fill="#334155">FP64 norm or inf-rescaled FP32 norm</text>
  <text x="260" y="156" font-size="8.3" font-weight="700" fill="#15803d">Heals in 1 hit: ≤2.3e-10 → 0.010</text>

  <rect x="30" y="182" width="432" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="40" y="198" font-size="8.5" font-weight="700" fill="#0f172a">H100 Overhead (E36, Nemotron-4B): 2.84s vs. 2.88s step · 69.7 GB peak RAM</text>
  <text x="40" y="214" font-size="8.2" fill="#475569">• Copy-free variant eliminates 3.1 GB FP64 buffer (max rel. diff ≤ 2.3×10⁻⁷ on 10³¹ spike)</text>

  <rect x="30" y="233" width="432" height="36" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="40" y="248" font-size="8.2" font-weight="700" fill="#991b1b">Why alternatives fail: Skip-on-Inf / ZClip drop 57 batches &amp; leave rows frozen;</text>
  <text x="40" y="262" font-size="8.2" fill="#7f1d1d">GradStabilizer skips E_in scaling → raw 10³¹ sets AdamW v_t=∞, freezing rows (52 steps)</text>

  <!-- Panel B -->
  <rect x="488" y="72" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="72" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="90" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="98" x2="940" y2="98" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="89.5" font-size="10.6" font-weight="700" fill="#1e3a8a">B. Multilingual CPT &amp; 300-Step Ablation (Table 2, 3 Seeds)</text>

  <rect x="498" y="105" width="212" height="56" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="506" y="120" font-size="8.6" font-weight="700" fill="#1e3a8a">Nemotron-4B Telugu (1,000 steps)</text>
  <text x="506" y="135" font-size="8.1" fill="#991b1b">FP32 Global: 198.3±9.9 stall · 13.44 PPL</text>
  <text x="506" y="150" font-size="8.1" font-weight="700" fill="#1d4ed8">GroupClip: 0.0 stall · 13.04 (hits at 800)</text>

  <rect x="718" y="105" width="212" height="56" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.9"/>
  <text x="726" y="120" font-size="8.6" font-weight="700" fill="#1e3a8a">Falcon-H1 Mongolian (1,000 steps)</text>
  <text x="726" y="135" font-size="8.1" fill="#991b1b">FP32 Global: 11.7±3.5 stall · 15.68 PPL</text>
  <text x="726" y="150" font-size="8.1" font-weight="700" fill="#1d4ed8">GroupClip: 0.0 stall · 15.58 (S100 −2.93)</text>

  <text x="500" y="177" font-size="8.6" font-weight="700" fill="#0f172a">Nemotron-4B Telugu 300-Step Ablation (59.3±7.8 hits, FLORES PPL ↓):</text>

  <text x="614" y="195" text-anchor="end" font-size="8.2" fill="#475569">Skip-on-Inf</text>
  <rect x="620" y="187" width="130" height="9" rx="2" fill="#94a3b8"/>
  <text x="756" y="195" font-size="8.1" fill="#475569">16.63 · 57.0 stalled (unhealed)</text>

  <text x="614" y="212" text-anchor="end" font-size="8.2" fill="#991b1b">FP32 / ZClip</text>
  <rect x="620" y="204" width="122" height="9" rx="2" fill="#dc2626"/>
  <text x="748" y="212" font-size="8.1" fill="#991b1b">16.57 · 57.0 stalled (inf)</text>

  <text x="614" y="229" text-anchor="end" font-size="8.2" fill="#92400e">GradStab / Freeze</text>
  <rect x="620" y="221" width="74" height="9" rx="2" fill="#d97706"/>
  <text x="700" y="229" font-size="8.1" fill="#92400e">16.16–16.23 (frozen / v_t=∞)</text>

  <text x="614" y="246" text-anchor="end" font-size="8.2" fill="#1e3a8a">FP64 Global Norm</text>
  <rect x="620" y="238" width="55" height="9" rx="2" fill="#3b82f6"/>
  <text x="681" y="246" font-size="8.1" fill="#1e3a8a">16.09 · 18.0 stalled (first hits)</text>

  <text x="614" y="263" text-anchor="end" font-size="8.3" font-weight="700" fill="#1d4ed8">GroupClip (FP64)</text>
  <rect x="620" y="255" width="35" height="9" rx="2" fill="#1d4ed8"/>
  <text x="661" y="263" font-size="8.2" font-weight="700" fill="#1d4ed8">15.95 · 0.0 stalled (ties Oracle 15.94)</text>

  <!-- Panel C -->
  <rect x="20" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="20" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="20" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="20" y1="316" x2="472" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="32" y="307.5" font-size="10.6" font-weight="700" fill="#1e3a8a">C. GateFloor: Positive Gate Offset g_δ(z) = SiLU(z) + δ (Pretraining)</text>

  <rect x="30" y="324" width="432" height="32" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="246" y="344" text-anchor="middle" font-size="9.3" font-weight="700" fill="#1e3a8a">Eq.(5): g_δ(z) = SiLU(z) + δ (δ = 0.1 default, 0 added params, + E_in weight_decay = 0)</text>

  <rect x="30" y="364" width="138" height="58" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="38" y="380" font-size="8.7" font-weight="700" fill="#991b1b">SiLU(z) Baseline</text>
  <text x="38" y="395" font-size="8.1" fill="#7f1d1d">• g(0)=0 zeros readout</text>
  <text x="38" y="410" font-size="8.1" fill="#7f1d1d">• Small init still 1/r blows</text>

  <rect x="177" y="364" width="138" height="58" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="185" y="380" font-size="8.7" font-weight="700" fill="#92400e">Sigmoid Gate</text>
  <text x="185" y="395" font-size="8.1" fill="#78350f">• σ(0)=0.5, capped at ≤1</text>
  <text x="185" y="410" font-size="8.1" fill="#78350f">• PPL worsens +0.18–0.56</text>

  <rect x="324" y="364" width="138" height="58" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="332" y="380" font-size="8.7" font-weight="700" fill="#166534">GateFloor (Ours)</text>
  <text x="332" y="395" font-size="8.1" fill="#14532d">• g_δ(0)=δ, unbounded z≫0</text>
  <text x="332" y="410" font-size="8.1" fill="#14532d">• +b_conv≠0 lifts t=0 too</text>

  <rect x="30" y="430" width="432" height="56" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="40" y="446" font-size="8.5" font-weight="700" fill="#0f172a">Mamba-2 165M (seed 0) mid-seq grad at r=10⁻³⁰ scales ∝ 1/δ (Table 3):</text>
  <text x="40" y="462" font-size="8.7" font-weight="700" fill="#1d4ed8">SiLU (5.6e28) → δ=0.01 (4.14) → δ=0.03 (1.51) → δ=0.1 (0.60) → δ=0.3 (0.29)</text>
  <text x="40" y="478" font-size="8.0" fill="#475569">Note: SiLU(z)≥−0.278 can go negative at z&lt;0; only z=0 fixed-point positivity + non-zero y₀ is needed</text>

  <!-- Panel D -->
  <rect x="488" y="290" width="452" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="488" y="290" width="452" height="26" rx="8" fill="#eff6ff"/>
  <rect x="488" y="308" width="452" height="8" fill="#eff6ff"/>
  <line x1="488" y1="316" x2="940" y2="316" stroke="#bfdbfe" stroke-width="1"/>
  <text x="500" y="307.5" font-size="10.6" font-weight="700" fill="#1e3a8a">D. FineWeb-Edu Pretraining (Table 3) &amp; Scope Boundaries</text>

  <rect x="498" y="324" width="432" height="19" rx="3" fill="#eff6ff"/>
  <text x="504" y="337" font-size="8.2" font-weight="700" fill="#1e3a8a">Model (Tokens)</text>
  <text x="626" y="337" font-size="8.2" font-weight="700" fill="#1e3a8a">Output Gate</text>
  <text x="710" y="337" font-size="8.2" font-weight="700" fill="#1e3a8a">PPL ↓</text>
  <text x="756" y="337" font-size="8.2" font-weight="700" fill="#1e3a8a">Tok/s</text>
  <text x="804" y="337" font-size="8.2" font-weight="700" fill="#1e3a8a">Mid / Pos-0 (r=10⁻³⁰)</text>

  <text x="504" y="356" font-size="8.1" fill="#334155">165M Mamba-2 (1.05B)</text>
  <text x="626" y="356" font-size="8.1" fill="#334155">SiLU (2s)</text>
  <text x="710" y="356" font-size="8.1" fill="#334155">30.63</text>
  <text x="756" y="356" font-size="8.1" fill="#334155">115.7k</text>
  <text x="804" y="356" font-size="8.1" fill="#991b1b">2.8e28 / 3.6e28</text>

  <rect x="498" y="362" width="432" height="15" rx="2" fill="#eff6ff"/>
  <text x="504" y="373" font-size="8.1" font-weight="700" fill="#1d4ed8">165M Mamba-2 (1.05B)</text>
  <text x="626" y="373" font-size="8.1" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="373" font-size="8.1" font-weight="700" fill="#1d4ed8">30.78</text>
  <text x="756" y="373" font-size="8.1" font-weight="700" fill="#1d4ed8">114.2k</text>
  <text x="804" y="373" font-size="8.1" font-weight="700" fill="#15803d">0.52 / 0.73</text>

  <text x="504" y="389" font-size="8.1" fill="#334155">203M Hybrid 3:1 (1.05B)</text>
  <text x="626" y="389" font-size="8.1" fill="#334155">SiLU Base</text>
  <text x="710" y="389" font-size="8.1" fill="#334155">23.38</text>
  <text x="756" y="389" font-size="8.1" fill="#334155">130.6k</text>
  <text x="804" y="389" font-size="8.1" fill="#991b1b">1.3e5 / 2.0e29</text>

  <rect x="498" y="395" width="432" height="15" rx="2" fill="#eff6ff"/>
  <text x="504" y="406" font-size="8.1" font-weight="700" fill="#1d4ed8">203M Hybrid 3:1 (1.05B)</text>
  <text x="626" y="406" font-size="8.1" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="406" font-size="8.1" font-weight="700" fill="#1d4ed8">23.45</text>
  <text x="756" y="406" font-size="8.1" font-weight="700" fill="#1d4ed8">129.8k</text>
  <text x="804" y="406" font-size="8.1" font-weight="700" fill="#15803d">0.19 / 0.23</text>

  <text x="504" y="422" font-size="8.1" fill="#334155">370M Hybrid 3:1 (1.57B)</text>
  <text x="626" y="422" font-size="8.1" fill="#334155">SiLU Base</text>
  <text x="710" y="422" font-size="8.1" fill="#334155">22.45</text>
  <text x="756" y="422" font-size="8.1" fill="#334155">527.2k</text>
  <text x="804" y="422" font-size="8.1" fill="#991b1b">3.3e4 / 1.6e28</text>

  <rect x="498" y="428" width="432" height="15" rx="2" fill="#dbeafe"/>
  <text x="504" y="439" font-size="8.1" font-weight="700" fill="#1d4ed8">370M Hybrid 3:1 (1.57B)</text>
  <text x="626" y="439" font-size="8.1" font-weight="700" fill="#1d4ed8">GateFloor 0.1</text>
  <text x="710" y="439" font-size="8.1" font-weight="700" fill="#1d4ed8">22.28</text>
  <text x="756" y="439" font-size="8.1" font-weight="700" fill="#1d4ed8">542.8k</text>
  <text x="804" y="439" font-size="8.1" font-weight="700" fill="#15803d">0.16 / 0.13 (-28 OOM)</text>

  <rect x="498" y="447" width="432" height="41" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="506" y="462" font-size="8.2" font-weight="700" fill="#92400e">Scope: Pretraining verified up to 370M (203M/370M 1 seed; 165M 2-seed spread 0.15)</text>
  <text x="506" y="477" font-size="8.1" fill="#78350f">• Pos-0 relies on conv1d bias b_conv ≠ 0; bias-free linear query (xLSTM q=0) needs query fix</text>

  <text x="20" y="517" font-size="8.8" fill="#475569">Source: arXiv:2611.04449v1 §5, Tables 2–3, App. D–E; GroupClip fixes clip overflow on released weights, GateFloor fixes pretraining gates.</text>
</svg>
