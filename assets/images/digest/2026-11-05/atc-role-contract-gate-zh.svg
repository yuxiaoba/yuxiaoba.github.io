<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ATC 消息边界控制闭环：角色契约评分与泄漏正则化纠偏机制" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="33" font-size="16.5" font-weight="700" fill="#0f172a">ATC 消息边界控制闭环：四维漂移评分与泄漏正则化纠偏</text>
  <text x="22" y="52" font-size="10.0" fill="#475569">arXiv:2611.04321v1（§3, Fig. 1, Alg. 1, A1）· 黑盒外部闸门：不读取生成器隐状态，先评分纠偏并复检再写入共享对话 cₜ</text>
  <line x1="22" y1="61" x2="938" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Column: Precomputation & Proposal -->
  <rect x="18" y="70" width="254" height="418" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="18" y="70" width="254" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="18" y="90" width="254" height="8" fill="#1e3a8a"/>
  <text x="30" y="88.5" font-size="10.6" font-weight="700" fill="#ffffff">离线预计算与候选消息生成</text>

  <rect x="28" y="106" width="234" height="130" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="36" y="113" width="54" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="63" y="125" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">预计算</text>
  <text x="96" y="125.5" font-size="10.2" font-weight="700" fill="#1e3a8a">角色子空间与契约（§3.1）</text>
  <text x="36" y="146" font-size="8.9" fill="#1e293b">• 角色基 Uᵢ ∈ R^(d×16)（说明+示例）</text>
  <text x="36" y="164" font-size="8.9" fill="#1e293b">• 角色投影 Pᵢ = Uᵢ(UᵢᵀUᵢ)†Uᵢᵀ</text>
  <text x="36" y="182" font-size="8.9" fill="#1e293b">• 禁用空间 Qᵢ = Vᵢ(VᵢᵀVᵢ)†Vᵢᵀ（他角并集）</text>
  <text x="36" y="200" font-size="8.9" fill="#1e293b">• 闭式算子 Rᵢ = (UᵢᵀUᵢ + λUᵢᵀQᵢUᵢ)†Uᵢᵀ</text>
  <text x="36" y="218" font-size="8.9" fill="#334155">• 逻辑契约 Cᵢ=(Oᵢ,Bᵢ) · 言语掩码 bᵢ</text>

  <line x1="145" y1="236" x2="145" y2="252" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="28" y="254" width="234" height="106" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="36" y="261" width="60" height="17" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="66" y="273" text-anchor="middle" font-size="8.8" font-weight="700" fill="#b45309">黑盒智能体</text>
  <text x="102" y="273.5" font-size="10.2" font-weight="700" fill="#92400e">Aᵢ 生成候选输出</text>
  <text x="36" y="293" font-size="8.9" fill="#334155">• 条件：局部历史 hᵢ,ₜ + 共享对话 cₜ</text>
  <text x="36" y="311" font-size="8.9" fill="#334155">• 产出 yᵢ,ₜ（语言流畅但可能越权）</text>
  <rect x="36" y="324" width="218" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="145" y="340.5" text-anchor="middle" font-size="8.6" font-weight="600" fill="#991b1b">漂移例：Verifier 越权给 Executor 派发任务</text>

  <line x1="145" y1="360" x2="145" y2="376" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="28" y="378" width="234" height="100" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="396" font-size="10.2" font-weight="700" fill="#0f172a">外部编码与契约特征映射</text>
  <text x="36" y="416" font-size="8.8" fill="#1e293b">• zᵢ,ₜ = f(yᵢ,ₜ, hᵢ,ₜ, cₜ)（bge-v1.5 编码）</text>
  <text x="36" y="434" font-size="8.8" fill="#1e293b">• ℓᵢ,ₜ = L(yᵢ,ₜ) ∈ [0,1]ᵐ（言语行为概率）</text>
  <text x="36" y="452" font-size="8.8" fill="#1e293b">• sᵢ,ₜ = S(yᵢ,ₜ, hᵢ,ₜ, cₜ)（符号谓词提取）</text>
  <text x="36" y="469" font-size="8.3" fill="#475569">仅观测消息文本与上下文，不触碰模型权重</text>

  <!-- Routing Arrow Left -> Center -->
  <path d="M 262 428 L 280 428 L 280 186 L 296 186" fill="none" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>

  <!-- Center Column: Drift Scoring & Closed-Form Target -->
  <rect x="288" y="70" width="352" height="418" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="288" y="70" width="352" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="288" y="90" width="352" height="8" fill="#1d4ed8"/>
  <text x="300" y="88.5" font-size="10.6" font-weight="700" fill="#ffffff">步骤 1–2 · 四维漂移能量评分与软正交目标</text>

  <rect x="298" y="106" width="332" height="192" rx="7" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="308" y="124" font-size="10.3" font-weight="700" fill="#1e3a8a">步骤 1 · 四维角色漂移能量 Eᵢ,ₜ（Eqs. 3–8）</text>

  <rect x="306" y="132" width="316" height="32" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.9"/>
  <rect x="312" y="139" width="46" height="18" rx="4" fill="#dbeafe"/>
  <text x="335" y="151.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#1d4ed8">D_out</text>
  <text x="364" y="151.5" font-size="8.7" font-weight="600" fill="#0f172a">∥(I−Pᵢ)zᵢ,ₜ∥₂² (α=1.00)</text>
  <text x="614" y="151.5" text-anchor="end" font-size="8.4" fill="#475569">偏离本角色 Sᵢ</text>

  <rect x="306" y="169" width="316" height="32" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="0.9"/>
  <rect x="312" y="176" width="46" height="18" rx="4" fill="#fee2e2"/>
  <text x="335" y="188.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#b91c1c">D_leak</text>
  <text x="364" y="188.5" font-size="8.7" font-weight="600" fill="#0f172a">∥Qᵢzᵢ,ₜ∥₂² (β=1.00)</text>
  <text x="614" y="188.5" text-anchor="end" font-size="8.4" fill="#475569">渗入他角 Fᵢ (r=0.76)</text>

  <rect x="306" y="206" width="316" height="32" rx="5" fill="#ffffff" stroke="#99f6e4" stroke-width="0.9"/>
  <rect x="312" y="213" width="46" height="18" rx="4" fill="#e0f2fe"/>
  <text x="335" y="225.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#0369a1">D_ling</text>
  <text x="364" y="225.5" font-size="8.7" font-weight="600" fill="#0f172a">∥(1−bᵢ)⊙ℓᵢ,ₜ∥₁ (γ=0.50)</text>
  <text x="614" y="225.5" text-anchor="end" font-size="8.4" fill="#475569">越权言语行为 (L)</text>

  <rect x="306" y="243" width="316" height="32" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <rect x="312" y="250" width="46" height="18" rx="4" fill="#fef3c7"/>
  <text x="335" y="262.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#b45309">D_logic</text>
  <text x="364" y="262.5" font-size="8.7" font-weight="600" fill="#0f172a">违禁Bᵢ+缺义务Oᵢ (δ=0.75)</text>
  <text x="614" y="262.5" text-anchor="end" font-size="8.4" fill="#475569">逻辑契约违约 (S)</text>

  <text x="308" y="290" font-size="8.5" font-weight="600" fill="#1e3a8a">Eᵢ,ₜ = αD_out + βD_leak + γD_ling + δD_logic · 先导：稳态 0.36 vs 漂移 1.47</text>

  <line x1="464" y1="298" x2="464" y2="314" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="298" y="316" width="332" height="162" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="308" y="334" font-size="10.3" font-weight="700" fill="#1e3a8a">步骤 2 · 泄漏正则化闭式目标 ẑᵢ,ₜ（Eqs. 9–10, 12）</text>
  <text x="308" y="352" font-size="8.8" fill="#0f172a">目标：min_{z'∈Sᵢ} ∥z' − zᵢ,ₜ∥₂² + λ∥Qᵢz'∥₂²（验证集定 λ = 0.50）</text>
  <text x="308" y="369" font-size="8.8" font-weight="600" fill="#1d4ed8">闭式解：ĉᵢ,ₜ = Rᵢ zᵢ,ₜ ，ẑᵢ,ₜ = Uᵢ ĉᵢ,ₜ（无需在线迭代优化）</text>

  <rect x="306" y="378" width="316" height="92" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.9"/>
  <!-- Mini geometry diagram -->
  <line x1="316" y1="448" x2="446" y2="448" stroke="#1d4ed8" stroke-width="2"/>
  <text x="314" y="463" font-size="8.3" font-weight="700" fill="#1d4ed8">Sᵢ</text>
  <line x1="324" y1="448" x2="404" y2="396" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="312" y="392" font-size="8.1" font-weight="700" fill="#475569">Fᵢ（他角/共享）</text>
  <circle cx="424" cy="404" r="4" fill="#b91c1c"/>
  <text x="431" y="407" font-size="8.4" font-weight="700" fill="#b91c1c">zᵢ,ₜ</text>
  <line x1="424" y1="408" x2="424" y2="446" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="424" cy="448" r="3.5" fill="#64748b"/>
  <text x="417" y="463" font-size="8.2" fill="#475569">Pᵢz</text>
  <path d="M 419 406 Q 388 418 374 443" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-blue)"/>
  <circle cx="370" cy="448" r="4.2" fill="#1d4ed8"/>
  <text x="362" y="463" font-size="8.5" font-weight="700" fill="#1d4ed8">ẑᵢ,ₜ</text>

  <line x1="454" y1="386" x2="454" y2="462" stroke="#e2e8f0" stroke-width="1"/>
  <text x="462" y="396" font-size="8.2" fill="#334155">• 纯投影 Pᵢz：71.3（未抑泄漏）</text>
  <text x="462" y="413" font-size="8.2" fill="#b45309">• 硬正交⊥Fᵢ：69.8（伤共享推理）</text>
  <text x="462" y="430" font-size="8.2" font-weight="700" fill="#1d4ed8">• 软正则 ẑᵢ,ₜ：76.4（抑泄漏保推理）</text>
  <text x="462" y="447" font-size="8.0" fill="#475569">• Eq. 12：向量目标必不劣于 Pᵢz</text>
  <text x="462" y="462" font-size="8.0" fill="#475569">• 仍需重生成后对文本复测 Êᵢ,ₜ</text>

  <!-- Routing Arrow Center -> Right -->
  <path d="M 630 397 L 648 397 L 648 154 L 664 154" fill="none" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr-blue)"/>

  <!-- Right Column: Gating, Regeneration, Re-Evaluation -->
  <rect x="656" y="70" width="286" height="418" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="656" y="70" width="286" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="656" y="90" width="286" height="8" fill="#1e3a8a"/>
  <text x="668" y="88.5" font-size="10.6" font-weight="700" fill="#ffffff">步骤 3–4 · 受约束重生成与准入复检</text>

  <rect x="666" y="106" width="266" height="96" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="676" y="124" font-size="10.1" font-weight="700" fill="#0f172a">门控开关（A4.3 成本–稳定权衡）</text>
  <text x="676" y="143" font-size="8.8" fill="#1d4ed8">• 全量 ATC：每轮均纠偏（100% → 76.4 / 93.5 RC）</text>
  <text x="676" y="161" font-size="8.8" fill="#334155">• ATC-Gated：仅当 Eᵢ,ₜ &gt; τ 触发重生成</text>
  <text x="676" y="179" font-size="8.6" fill="#475569">• τ=0.20 纠偏 72.6% 回合（保 75.6 / 92.1 RC）</text>
  <text x="676" y="195" font-size="8.6" fill="#475569">• τ=0.50 纠偏 24.7% 回合（32.4s → 29.7s）</text>

  <line x1="799" y1="202" x2="799" y2="218" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="666" y="220" width="266" height="112" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="674" y="227" width="68" height="17" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="708" y="239" text-anchor="middle" font-size="8.7" font-weight="700" fill="#b45309">步骤 3 · 算子 g</text>
  <text x="748" y="239.5" font-size="10.1" font-weight="700" fill="#92400e">受约束重生成（Eq. 11）</text>
  <text x="674" y="259" font-size="8.9" font-weight="600" fill="#0f172a">ŷᵢ,ₜ = g(yᵢ,ₜ, ẑᵢ,ₜ, rᵢ, Cᵢ, bᵢ, cₜ)</text>
  <text x="674" y="278" font-size="8.8" fill="#334155">• 黑盒路径：向同一或另一模型发约束修订请求</text>
  <text x="674" y="296" font-size="8.8" fill="#334155">• 开源路径：也可辅以解码约束或隐状态引导</text>
  <text x="674" y="314" font-size="8.8" fill="#475569">• 保留有效语义，消除越权规划或未经授权改写</text>

  <line x1="799" y1="332" x2="799" y2="348" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <rect x="666" y="350" width="266" height="128" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="674" y="357" width="68" height="17" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
  <text x="708" y="369" text-anchor="middle" font-size="8.7" font-weight="700" fill="#15803d">步骤 4 · 复检</text>
  <text x="748" y="369.5" font-size="10.1" font-weight="700" fill="#065f46">准入共享对话 cₜ</text>
  <text x="674" y="389" font-size="8.8" fill="#0f172a">1. 用同套 f, L, S 重算实际文本能量 Êᵢ,ₜ</text>
  <text x="674" y="407" font-size="8.6" fill="#334155">2. A1.4 边界：Eq. 12 不保证 D_ling/D_logic 必降</text>
  <text x="674" y="425" font-size="8.6" fill="#065f46">3. 图 5 单轮实测（Verifier 漂移向 Planner）：</text>
  <text x="682" y="441" font-size="8.5" font-weight="600" fill="#15803d">D_out 0.57→0.20 · D_leak 0.49→0.14</text>
  <text x="682" y="456" font-size="8.5" font-weight="600" fill="#15803d">D_ling 0.36→0.12 · D_logic 0.31→0.09</text>
  <text x="674" y="472" font-size="8.6" font-weight="700" fill="#0f766e">4. 释放 ŷᵢ,ₜ 更新 cₜ；Dᵢ(t) = ρDᵢ(t−1) + Êᵢ,ₜ</text>

  <!-- Legend & Scope Footer -->
  <rect x="18" y="500" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="35" y="509" font-size="8.9" fill="#334155">蓝框：确定性投影、能量评分与闭式目标</text>
  <rect x="268" y="500" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="285" y="509" font-size="8.9" fill="#334155">琥珀：黑盒智能体生成与约束修订</text>
  <rect x="498" y="500" width="12" height="10" rx="2" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="515" y="509" font-size="8.9" fill="#334155">绿框：复检确认后准入共享对话</text>
  <text x="18" y="525" font-size="8.8" fill="#64748b">范围边界：ATC 治理进入共享对话前的消息层；它不能替代外部工具网关权限（RBAC/沙箱）拦截已触发的副作用，也不证明输出在事实上正确或安全。</text>
</svg>
