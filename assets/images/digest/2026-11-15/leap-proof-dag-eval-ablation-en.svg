  <text x="569" y="454" font-size="9.4" font-weight="700" fill="#b45309">③ Domain Bottlenecks &amp; Replication Limits (Table 4, App. A)</text>
  <text x="569" y="469" font-size="8.5" fill="#78350f">• Geometry remains weak: Basic 16.7% (1/6) / Adv 12.5% (1/8); Adv Comb 25%</text>
