  <text x="561" y="307.5" font-size="10.5" font-weight="700" fill="#ffffff">机制消融、科研实证与关键边界 (§5.3, §6, App. A)</text>
  <rect x="560" y="324" width="366" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="569" y="340" font-size="9.4" font-weight="700" fill="#1e3a8a">① LLM Reviewer 消融（Putnam A5，Fig. 3）</text>
  <text x="569" y="355" font-size="8.6" fill="#1e293b">有审查：2 轮 rollout 证毕 (122m) ｜ 去审查：8 轮后仍全部失败</text>
  <text x="569" y="369" font-size="8.4" fill="#475569">原因：Lean 接受“先展开再折叠回同义母目标”的合法但零简化草图</text>
  <rect x="560" y="382" width="366" height="50" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="569" y="398" font-size="9.4" font-weight="700" fill="#065f46">② 科研级形式化案例（§6，均为已证或已解前提子集）</text>
  <text x="569" y="413" font-size="8.6" fill="#1e293b">• Knuth 偶阶 Cayley 图哈密顿分解 Color-2 环图子问题：&gt;5,000 行 Lean 4</text>
  <text x="569" y="426" font-size="8.6" fill="#334155">• Erdős 457（重建已知证明）+ AlphaProof Nexus 已解全部 9 题（非全集）</text>
  <rect x="560" y="438" width="366" height="52" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="569" y="454" font-size="9.4" font-weight="700" fill="#b45309">③ 明确短板与跨模型复现边界（Table 4, App. A）</text>
  <text x="569" y="469" font-size="8.5" fill="#78350f">• 几何仍极弱：Basic 16.7% (1/6) · Adv 12.5% (1/8)；进阶组合仅 25% (2/8)</text>
  <text x="569" y="483" font-size="8.5" fill="#334155">• Opus 4.5 (90.0%) 与 Gemini 3.5 Flash (86.6%) 仅测 Basic 单次运行，缺方差</text>
  <text x="24" y="523" font-size="9.4" fill="#64748b">边界总结：主成绩建立在迭代工具链、LeanSearch 与多步编译修订之上；基础模型在 Lean 几何推理与搜索调度策略上仍存明显局限</text>
