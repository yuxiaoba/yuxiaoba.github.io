<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Lato', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">LEAP Shared AND–OR Proof DAG &amp; Dual-Gate Verification Workflow</text>
  <text x="24" y="53" font-size="10.2" font-weight="400" fill="#475569">Grounded in arXiv:2606.03303v3 (§2, Fig. 1–2, App. D): direct formalization fast path, blueprint fallback, acyclicity guard &amp; lemma reuse</text>
  <line x1="24" y1="63" x2="936" y2="63" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="73" width="276" height="419" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="73" width="276" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="24" y="93" width="276" height="8" fill="#1e3a8a"/>
  <text x="35" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff">1. Persistent AND–OR Proof DAG</text>
  <rect x="34" y="110" width="256" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="44" y="128" font-size="10.2" font-weight="700" fill="#1e3a8a">Input Theorem (Root OR₀) → State Reader</text>
  <text x="44" y="145" font-size="9.1" fill="#334155">Retrieves open goal, dependencies &amp; known lemmas</text>
  <text x="44" y="160" font-size="9.0" fill="#475569">Expands open subgoals via DFS with backtracking</text>
  <rect x="34" y="176" width="256" height="192" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="193" font-size="9.6" font-weight="700" fill="#0f172a">DAG Topology: Reuse + Anticipatory Lemmas</text>
  <line x1="146" y1="226" x2="104" y2="250" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <line x1="170" y1="226" x2="202" y2="250" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="90" y1="270" x2="68" y2="299" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="108" y1="270" x2="138" y2="299" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="194" y1="270" x2="152" y2="299" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="210" y1="270" x2="212" y2="299" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="221" y1="267" x2="256" y2="299" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-amber)"/>
  <rect x="115" y="203" width="88" height="23" rx="11.5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="159" y="218" font-size="9.2" font-weight="700" fill="#1e3a8a" text-anchor="middle">OR₀ (Theorem)</text>
  <rect x="70" y="250" width="56" height="20" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.1"/>
  <text x="98" y="263.5" font-size="8.6" font-weight="700" fill="#475569" text-anchor="middle">AND₁</text>
  <rect x="176" y="250" width="60" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="206" y="263.5" font-size="8.6" font-weight="700" fill="#1d4ed8" text-anchor="middle">AND₂</text>
  <circle cx="62" cy="313" r="13.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="62" y="316.5" font-size="8.8" font-weight="700" fill="#475569" text-anchor="middle">L₁</text>
  <circle cx="144" cy="313" r="14.5" fill="#d1fae5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="144" y="316.5" font-size="9.0" font-weight="700" fill="#065f46" text-anchor="middle">L₂ ✓</text>
  <circle cx="212" cy="313" r="13.5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="212" y="316.5" font-size="8.8" font-weight="700" fill="#1e3a8a" text-anchor="middle">L₃</text>
  <circle cx="262" cy="313" r="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="262" y="316.5" font-size="8.2" font-weight="700" fill="#92400e" text-anchor="middle">L_aux</text>
  <text x="136" y="342" font-size="8.5" font-weight="700" fill="#0f766e" text-anchor="middle">Shared lemma reuse</text>
  <text x="256" y="342" font-size="8.3" fill="#b45309" text-anchor="middle">Prospective</text>
  <text x="44" y="360" font-size="8.3" fill="#475569">Solid: required subgoals; Dashed: optional aux lemmas</text>
  <rect x="34" y="376" width="256" height="106" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="44" y="394" font-size="9.8" font-weight="700" fill="#1e3a8a">Graph Semantics &amp; State Writer Guard</text>
  <text x="44" y="412" font-size="8.8" fill="#1e293b">• OR node = theorem/lemma (any valid AND proves it)</text>
  <text x="44" y="429" font-size="8.8" fill="#1e293b">• AND node = decomposition (requires ALL child ORs)</text>
  <text x="44" y="446" font-size="8.8" fill="#0f766e" font-weight="600">✓ ACCEPT: commits only if DAG stays acyclic</text>
  <text x="44" y="463" font-size="8.8" fill="#b45309">✗ REJECT: blocks cycles / trivial splits &amp; backtracks</text>
  <rect x="320" y="73" width="288" height="419" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="320" y="73" width="288" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="320" y="93" width="288" height="8" fill="#1d4ed8"/>
  <text x="331" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff">2. Direct Formalization (Fast Path)</text>
  <line x1="300" y1="136" x2="318" y2="136" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="334" y="110" width="260" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="344" y="128" font-size="10.0" font-weight="700" fill="#1e3a8a">① NL Prover → Informal Proof</text>
  <text x="344" y="145" font-size="9.0" fill="#334155">Drafts natural-language proof using DAG context</text>
  <text x="344" y="160" font-size="9.0" fill="#475569">Builds reasoning scaffold before code synthesis</text>
  <line x1="464" y1="168" x2="464" y2="185" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="334" y="187" width="260" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="344" y="205" font-size="10.0" font-weight="700" fill="#1e3a8a">② Formal Prover → Candidate Lean Proof</text>
  <text x="344" y="222" font-size="9.0" fill="#334155">Translates argument into sorry-free Lean 4 code</text>
  <text x="344" y="237" font-size="9.0" fill="#475569">Queries LeanSearch for Mathlib4 lemma retrieval</text>
  <line x1="464" y1="245" x2="464" y2="262" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="334" y="264" width="260" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="464" y="285" font-size="10.4" font-weight="700" fill="#ffffff" text-anchor="middle">③ Lean Compiler Verifier</text>
  <text x="464" y="302" font-size="9.0" fill="#cbd5e1" text-anchor="middle">Strict syntax, type &amp; kernel verification</text>
  <rect x="334" y="330" width="122" height="58" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="395" y="349" font-size="9.8" font-weight="700" fill="#0f766e" text-anchor="middle">PROVED ✓</text>
  <text x="395" y="365" font-size="8.7" fill="#065f46" text-anchor="middle">Marks OR node proved</text>
  <text x="395" y="379" font-size="8.4" fill="#334155" text-anchor="middle">Propagates up to parent</text>
  <line x1="410" y1="314" x2="398" y2="328" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>
  <path d="M 334 359 L 302 359" fill="none" stroke="#0f766e" stroke-width="1.7" marker-end="url(#arr-teal)"/>
  <rect x="470" y="330" width="124" height="58" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="532" y="349" font-size="9.8" font-weight="700" fill="#b45309" text-anchor="middle">FAILED → Reviser</text>
  <text x="532" y="365" font-size="8.6" fill="#78350f" text-anchor="middle">Compiler err + LeanSearch</text>
  <text x="532" y="379" font-size="8.4" fill="#334155" text-anchor="middle">Iterative rewrite (e.g. ≤20)</text>
  <line x1="518" y1="314" x2="530" y2="328" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <path d="M 594 359 L 601 359 L 601 216 L 596 216" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
  <rect x="334" y="400" width="260" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="344" y="418" font-size="9.6" font-weight="700" fill="#0f172a">When Direct Proving Escalates (§5.1, Table 5)</text>
  <text x="344" y="435" font-size="8.7" fill="#334155">• General LLMs exploit feedback loops:</text>
  <text x="344" y="451" font-size="8.7" fill="#1d4ed8" font-weight="600">  Gemini-3.1-Pro: 20.0% (Pass@128) → 36.6% (Iter.1)</text>
  <text x="344" y="467" font-size="8.7" fill="#475569">• Specialized Goedel-V2-32B: 10.0% → 6.6% (no gain)</text>
  <rect x="628" y="73" width="308" height="419" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="628" y="73" width="308" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="628" y="93" width="308" height="8" fill="#1e3a8a"/>
  <text x="639" y="91.5" font-size="10.8" font-weight="700" fill="#ffffff">3. Blueprint Decomposition &amp; Dual Gate</text>
  <path d="M 594 374 L 617 374 L 617 136 L 626 136" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="640" y="110" width="284" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="650" y="128" font-size="10.0" font-weight="700" fill="#1e3a8a">① Blueprint Gen. → Informal Blueprint</text>
  <text x="650" y="145" font-size="9.0" fill="#334155">Plans supporting subgoals + prospective auxiliary lemmas</text>
  <text x="650" y="160" font-size="9.0" fill="#475569">Sees existing DAG lemmas to promote convergence</text>
  <line x1="782" y1="168" x2="782" y2="184" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="640" y="186" width="284" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="650" y="204" font-size="10.0" font-weight="700" fill="#1e3a8a">② Sketch Gen. → Formal Lean Sketch</text>
  <text x="650" y="221" font-size="9.0" fill="#334155">Main parent theorem body MUST be sorry-free!</text>
  <text x="650" y="236" font-size="9.0" fill="#b45309" font-weight="600">sorry allowed ONLY inside newly proposed lemma stubs</text>
  <line x1="708" y1="244" x2="708" y2="262" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="856" y1="244" x2="856" y2="262" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="640" y="264" width="136" height="76" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="708" y="283" font-size="9.6" font-weight="700" fill="#ffffff" text-anchor="middle">Lean Checker</text>
  <text x="708" y="300" font-size="8.6" fill="#cbd5e1" text-anchor="middle">Checks type safety &amp;</text>
  <text x="708" y="315" font-size="8.6" fill="#cbd5e1" text-anchor="middle">strict sorry placement</text>
  <text x="708" y="331" font-size="8.3" fill="#93c5fd" text-anchor="middle">Blind to triviality</text>
  <rect x="788" y="264" width="136" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="856" y="283" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">LLM Reviewer</text>
  <text x="856" y="300" font-size="8.6" fill="#1e293b" text-anchor="middle">Checks if lemmas are</text>
  <text x="856" y="315" font-size="8.6" fill="#1e293b" text-anchor="middle">simpler &amp; relevant</text>
  <text x="856" y="331" font-size="8.3" fill="#1d4ed8" font-weight="600" text-anchor="middle">Prunes tautological splits</text>
  <rect x="640" y="358" width="284" height="58" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="650" y="376" font-size="9.6" font-weight="700" fill="#b45309">Either Fails (FAILED) → Reviser / Backtrack</text>
  <text x="650" y="393" font-size="8.7" fill="#334155">• Revises sketch via Lean errors + LeanSearch / review</text>
  <text x="650" y="408" font-size="8.7" fill="#475569">• Abandons weak branches and tries alternative plans</text>
  <rect x="640" y="426" width="284" height="56" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="650" y="444" font-size="9.6" font-weight="700" fill="#0f766e">Both Pass → State Writer (Acyclicity Check)</text>
  <text x="650" y="461" font-size="8.7" fill="#065f46">• If graph remains acyclic, commits AND + child OR nodes</text>
  <text x="650" y="475" font-size="8.6" fill="#334155">• Recurses on new child OR subgoals until root closes</text>
  <line x1="708" y1="340" x2="708" y2="356" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <line x1="856" y1="340" x2="856" y2="356" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr-amber)"/>
  <path d="M 640 454 L 617 454 L 617 502 L 162 502 L 162 494" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#arr-teal)"/>
  <text x="24" y="523" font-size="9.4" fill="#64748b">Trust boundary: Lean kernel verifies logical soundness only against the formalized statement; pending sorry lemmas are never complete proofs</text>
</svg>