<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ClawMMU 权限继承格、跨检查点撤销与能力模式边界图" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Lato', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Outer v3-blue canvas -->
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="34" font-size="16.5" font-weight="700" fill="#0f172a">ClawMMU 权限继承格、抗回滚撤销与能力模式规则</text>
  <text x="22" y="52" font-size="10" fill="#475569">arXiv:2610.28093v2（§2–§3, 附录 A–B）· 「信息可流入高权上下文，但权限永不自我抬升」+ 检查点外单调计数</text>
  <line x1="22" y1="61" x2="938" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- LEFT PANEL: Authority Lattice & Compartment Isolation (x=20..470, y=70..464) -->
  <rect x="20" y="70" width="450" height="394" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="20" y="70" width="450" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="90" width="450" height="8" fill="#1e3a8a"/>
  <text x="32" y="88.5" font-size="10.5" font-weight="700" fill="#ffffff">1 · 权限层级格、单调继承与隔离舱组装（§2 与附录 A）</text>

  <!-- Authority Stack (x=32..232) -->
  <rect x="32" y="109" width="200" height="56" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.1"/>
  <rect x="40" y="116" width="70" height="18" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="75" y="128.5" text-anchor="middle" font-size="9.0" font-weight="700" fill="#166534">Policy</text>
  <text x="116" y="129" font-size="9.3" font-weight="700" fill="#14532d">最高授权层级</text>
  <text x="40" y="151" font-size="8.9" fill="#334155">用户直接指令 / 显式授权批复</text>

  <rect x="32" y="177" width="200" height="62" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <rect x="40" y="184" width="76" height="18" rx="4" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="78" y="196.5" text-anchor="middle" font-size="9.0" font-weight="700" fill="#0369a1">中间权限级</text>
  <text x="122" y="197" font-size="9.2" font-weight="700" fill="#0c4a6e">受限信任输入</text>
  <text x="40" y="218" font-size="8.8" fill="#334155">用户偏好（如常用航司）</text>
  <text x="40" y="232" font-size="8.8" fill="#334155">同事编写的规则与指令文件</text>

  <rect x="32" y="251" width="200" height="71" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="40" y="258" width="70" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="75" y="270.5" text-anchor="middle" font-size="9.0" font-weight="700" fill="#b91c1c">Evidence</text>
  <text x="116" y="271" font-size="9.3" font-weight="700" fill="#991b1b">最低（只读不可驱动）</text>
  <text x="40" y="292" font-size="8.8" fill="#334155">网页抓取 / 工具输出 / 外部文本</text>
  <text x="40" y="309" font-size="8.9" font-weight="700" fill="#991b1b">所有 LLM 模型写入文本均属此级！</text>

  <!-- Inheritance Rule Box (x=246..458) -->
  <rect x="246" y="109" width="212" height="213" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="256" y="128" font-size="10.0" font-weight="700" fill="#1e3a8a">低水位单调继承规则（derive）</text>

  <rect x="256" y="137" width="192" height="38" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="352" y="153" text-anchor="middle" font-size="9.2" font-weight="700" fill="#1d4ed8">auth(D) = min(输入, 模型)</text>
  <text x="352" y="168" text-anchor="middle" font-size="8.6" fill="#475569">模型自身按最低权 Evidence 计入</text>

  <text x="256" y="193" font-size="8.9" fill="#0f172a">• scope(D) = ∩ inputs（作用域交集）</text>
  <text x="256" y="211" font-size="8.9" fill="#0f172a">• origins(D) = ∪ 源页 + 当前计数</text>
  <text x="256" y="229" font-size="8.9" fill="#0f172a">• owner(D) = 执行派生的主体</text>

  <rect x="256" y="243" width="192" height="68" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="264" y="260" font-size="9.0" font-weight="700" fill="#92400e">示例：Policy 提示 + 发票 Evidence</text>
  <text x="264" y="278" font-size="8.8" fill="#334155">经模型摘要写入 → 权限仍为 Evidence</text>
  <text x="264" y="297" font-size="8.9" font-weight="700" fill="#b45309">仅所有者直接或预设批准可提权</text>

  <!-- Compartment Assembly Sub-box (x=32..458, y=334..454) -->
  <rect x="32" y="334" width="426" height="120" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="42" y="352" font-size="9.8" font-weight="700" fill="#0f172a">默认拒绝隔离舱与 Assembly 能力令牌（附录 A）</text>

  <rect x="42" y="364" width="175" height="78" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="129.5" y="382" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1e3a8a">隔离舱 A</text>
  <text x="129.5" y="401" text-anchor="middle" font-size="9.0" fill="#334155">(owner₁, scope₁)</text>
  <text x="129.5" y="422" text-anchor="middle" font-size="8.7" fill="#475569">私有记忆默认互不可见</text>

  <line x1="217" y1="403" x2="273" y2="403" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="221" y="383" width="48" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="245" y="400" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">不可伪造</text>
  <text x="245" y="414" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">组装令牌</text>

  <rect x="273" y="364" width="175" height="78" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="360.5" y="382" text-anchor="middle" font-size="9.4" font-weight="700" fill="#1e3a8a">隔离舱 B</text>
  <text x="360.5" y="401" text-anchor="middle" font-size="9.0" fill="#334155">(owner₂, scope₂)</text>
  <text x="360.5" y="422" text-anchor="middle" font-size="8.7" fill="#b91c1c" font-weight="600">允许共读，但绝不提升权限</text>

  <!-- RIGHT PANEL: Rollback-Safe Revocation & Capability Schemas (x=490..940, y=70..464) -->
  <rect x="490" y="70" width="450" height="394" rx="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="490" y="70" width="450" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="490" y="90" width="450" height="8" fill="#1d4ed8"/>
  <text x="502" y="88.5" font-size="10.5" font-weight="700" fill="#ffffff">2 · 检查点外撤销计数与工具能力模式规则（附录 A–B）</text>

  <!-- Top Left of Right Panel: Checkpoint Snapshot -->
  <rect x="502" y="109" width="206" height="186" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="510" y="116" width="152" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="586" y="128.5" text-anchor="middle" font-size="8.8" font-weight="700" fill="#92400e">检查点内部快照（可被回滚）</text>

  <rect x="512" y="142" width="186" height="54" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="160" font-size="9.1" font-weight="700" fill="#0f172a">t₀：派生发票摘要页 S</text>
  <text x="520" y="179" font-size="8.8" fill="#334155">描述符抄录：origins=[inv@cnt:0]</text>

  <rect x="512" y="206" width="186" height="78" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="224" font-size="9.1" font-weight="700" fill="#b45309">t₂：恢复 t₀ 旧检查点快照</text>
  <text x="520" y="243" font-size="8.7" fill="#334155">• 旧快照中 S 仍写 inv@cnt:0</text>
  <text x="520" y="261" font-size="8.7" fill="#334155">• 缓存与向量索引副本亦未删除</text>
  <text x="520" y="276" font-size="8.4" fill="#92400e">若只信快照则发生复活漏洞</text>

  <!-- Top Right of Right Panel: Out-of-Checkpoint Live Table & Check -->
  <rect x="722" y="109" width="206" height="186" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="730" y="116" width="184" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="822" y="128.5" text-anchor="middle" font-size="8.8" font-weight="700" fill="#b91c1c">检查点外实时表（单调不回滚）</text>

  <rect x="732" y="142" width="186" height="54" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="740" y="160" font-size="9.1" font-weight="700" fill="#991b1b">t₁：所有者发现伪造并撤销</text>
  <text x="740" y="179" font-size="8.8" fill="#334155">实时计数递增：inv.cnt 0 → 1</text>

  <rect x="732" y="206" width="186" height="78" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="740" y="224" font-size="9.1" font-weight="700" fill="#991b1b">reload / authorize 实时核验：</text>
  <text x="740" y="243" font-size="8.8" font-weight="700" fill="#dc2626">记录(0) &lt; 实时(1) → 判失效！</text>
  <text x="740" y="261" font-size="8.6" fill="#334155">• 摘要 S 强制重走 map 降级</text>
  <text x="740" y="276" font-size="8.6" fill="#475569">• 无关记忆页仍维持有效可用</text>

  <!-- Arrow between Snapshot and Check -->
  <line x1="708" y1="245" x2="720" y2="245" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Bottom Section of Right Panel: Capability Schema & Standing Perms -->
  <rect x="502" y="306" width="426" height="148" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="514" y="325" font-size="9.8" font-weight="700" fill="#1e3a8a">工具能力模式三分类与预授权防污染规则（附录 B）</text>

  <!-- 3 Schema Tier Cards -->
  <rect x="514" y="335" width="130" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="579" y="352" text-anchor="middle" font-size="9.3" font-weight="700" fill="#1d4ed8">checked（受检）</text>
  <text x="579" y="368" text-anchor="middle" font-size="8.5" fill="#1e293b">须溯源至够权限源</text>
  <text x="579" y="382" text-anchor="middle" font-size="8.5" fill="#1e293b">且所有祖先均未撤销</text>

  <rect x="653" y="335" width="130" height="56" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="718" y="352" text-anchor="middle" font-size="9.3" font-weight="700" fill="#92400e">safe（安全透传）</text>
  <text x="718" y="368" text-anchor="middle" font-size="8.5" fill="#334155">主残余风险：</text>
  <text x="718" y="382" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b45309">须防人工误标放行！</text>

  <rect x="792" y="335" width="130" height="56" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="857" y="352" text-anchor="middle" font-size="9.3" font-weight="700" fill="#991b1b">uncovered（未覆盖）</text>
  <text x="857" y="368" text-anchor="middle" font-size="8.5" fill="#334155">Harness 默认拒签</text>
  <text x="857" y="382" text-anchor="middle" font-size="8.5" fill="#7f1d1d">（Fail-Closed）</text>

  <!-- Callout Bar -->
  <rect x="514" y="400" width="408" height="45" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="418" font-size="8.9" fill="#0f172a">• 模型臆造或无来源参数值一律判最低权 Evidence，无法通过 checked 核验</text>
  <text x="522" y="435" font-size="8.9" fill="#0f172a">• 预授权（如月付房租）：仅在上下文零不可信文本时生效，否则须当次审批</text>

  <!-- Bottom Non-Goals & Status Footer -->
  <rect x="20" y="474" width="920" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="32" y="494" font-size="9.3" font-weight="700" fill="#0f172a">设计定位与显式非目标（§1, §3, §5）：ClawMMU 尚属机制与愿景提案（尚未实现，AgentDojo/InjecAgent 攻击率与延迟尚待测量）；</text>
  <text x="32" y="513" font-size="9.1" fill="#475569">保证受检工具参数来源完整性，但不保证模型选对行动、不保证派生内容语义正确，亦不阻止模型对有权读取的机密外泄。</text>
</svg>
