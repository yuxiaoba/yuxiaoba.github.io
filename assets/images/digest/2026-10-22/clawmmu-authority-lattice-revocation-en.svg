<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ClawMMU: authority inheritance lattice, rollback-safe revocation, and capability schema rules" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Lato', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Outer v3-blue canvas -->
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="22" y="34" font-size="16.5" font-weight="700" fill="#0f172a">ClawMMU: Authority Lattice, Rollback-Safe Revocation &amp; Schema Rules</text>
  <text x="22" y="52" font-size="10" fill="#475569">arXiv:2610.28093v2 (§2–§3, App. A–B) · "Information may rise in authority, but authority never lifts itself" + off-checkpoint counters</text>
  <line x1="22" y1="61" x2="938" y2="61" stroke="#cbd5e1" stroke-width="1"/>

  <!-- LEFT PANEL: Authority Lattice & Compartment Isolation -->
  <rect x="20" y="70" width="450" height="394" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="20" y="70" width="450" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="90" width="450" height="8" fill="#1e3a8a"/>
  <text x="32" y="88.5" font-size="10.2" font-weight="700" fill="#ffffff">1 · Authority Lattice, Monotone Inheritance &amp; Compartments (§2, App. A)</text>

  <!-- Authority Stack -->
  <rect x="32" y="109" width="200" height="56" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.1"/>
  <rect x="40" y="116" width="64" height="18" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.8"/>
  <text x="72" y="128.5" text-anchor="middle" font-size="8.9" font-weight="700" fill="#166534">Policy</text>
  <text x="110" y="129" font-size="9.2" font-weight="700" fill="#14532d">Highest Authority</text>
  <text x="40" y="151" font-size="8.7" fill="#334155">Direct user messages / approvals</text>

  <rect x="32" y="177" width="200" height="62" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <rect x="40" y="184" width="76" height="18" rx="4" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="78" y="196.5" text-anchor="middle" font-size="8.8" font-weight="700" fill="#0369a1">Intermediate</text>
  <text x="122" y="197" font-size="9.0" font-weight="700" fill="#0c4a6e">Scoped Trust</text>
  <text x="40" y="218" font-size="8.6" fill="#334155">User preferences (e.g., airline)</text>
  <text x="40" y="232" font-size="8.6" fill="#334155">Teammate instruction files</text>

  <rect x="32" y="251" width="200" height="71" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="40" y="258" width="68" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="74" y="270.5" text-anchor="middle" font-size="8.9" font-weight="700" fill="#b91c1c">Evidence</text>
  <text x="114" y="271" font-size="9.0" font-weight="700" fill="#991b1b">Lowest (Read-Only)</text>
  <text x="40" y="292" font-size="8.6" fill="#334155">Web pages / tool outputs</text>
  <text x="40" y="309" font-size="8.7" font-weight="700" fill="#991b1b">Plus ALL LLM-written memory!</text>

  <!-- Inheritance Rule Box -->
  <rect x="246" y="109" width="212" height="213" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="256" y="128" font-size="9.8" font-weight="700" fill="#1e3a8a">Inheritance Rule (Low-Water-Mark)</text>

  <rect x="256" y="137" width="192" height="38" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="352" y="153" text-anchor="middle" font-size="9.0" font-weight="700" fill="#1d4ed8">auth(D) = min(inputs, Model)</text>
  <text x="352" y="168" text-anchor="middle" font-size="8.4" fill="#475569">Model itself counts as Evidence</text>

  <text x="256" y="193" font-size="8.7" fill="#0f172a">• scope(D) = ∩ inputs.scope</text>
  <text x="256" y="211" font-size="8.7" fill="#0f172a">• origins(D) = ∪ inputs + rev. cnts</text>
  <text x="256" y="229" font-size="8.7" fill="#0f172a">• owner(D) = deriving principal</text>

  <rect x="256" y="243" width="192" height="68" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="264" y="260" font-size="8.8" font-weight="700" fill="#92400e">Ex: Policy + Evidence invoice</text>
  <text x="264" y="278" font-size="8.6" fill="#334155">Model summary → stays Evidence</text>
  <text x="264" y="297" font-size="8.7" font-weight="700" fill="#b45309">Only owner approval promotes</text>

  <!-- Compartment Assembly Sub-box -->
  <rect x="32" y="334" width="426" height="120" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="42" y="352" font-size="9.6" font-weight="700" fill="#0f172a">Deny-Default Compartments &amp; Assembly Capability (App. A)</text>

  <rect x="42" y="364" width="175" height="78" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="129.5" y="382" text-anchor="middle" font-size="9.2" font-weight="700" fill="#1e3a8a">Compartment A</text>
  <text x="129.5" y="401" text-anchor="middle" font-size="8.8" fill="#334155">(owner₁, scope₁)</text>
  <text x="129.5" y="422" text-anchor="middle" font-size="8.5" fill="#475569">Private notes isolated</text>

  <line x1="217" y1="403" x2="273" y2="403" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="221" y="383" width="48" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="245" y="400" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">Owner</text>
  <text x="245" y="414" text-anchor="middle" font-size="8.3" font-weight="700" fill="#1d4ed8">Token</text>

  <rect x="273" y="364" width="175" height="78" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="360.5" y="382" text-anchor="middle" font-size="9.2" font-weight="700" fill="#1e3a8a">Compartment B</text>
  <text x="360.5" y="401" text-anchor="middle" font-size="8.8" fill="#334155">(owner₂, scope₂)</text>
  <text x="360.5" y="422" text-anchor="middle" font-size="8.5" fill="#b91c1c" font-weight="600">Co-read ≠ promote authority</text>

  <!-- RIGHT PANEL: Rollback-Safe Revocation & Capability Schemas -->
  <rect x="490" y="70" width="450" height="394" rx="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="490" y="70" width="450" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="490" y="90" width="450" height="8" fill="#1d4ed8"/>
  <text x="502" y="88.5" font-size="10.2" font-weight="700" fill="#ffffff">2 · Rollback-Safe Revocation &amp; Tool Schema Rules (App. A–B)</text>

  <!-- Checkpoint Snapshot -->
  <rect x="502" y="109" width="206" height="186" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="510" y="116" width="172" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="596" y="128.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#92400e">Inside Checkpoint (Rollbackable)</text>

  <rect x="512" y="142" width="186" height="54" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="160" font-size="8.9" font-weight="700" fill="#0f172a">t₀: Derive summary S</text>
  <text x="520" y="179" font-size="8.6" fill="#334155">Descriptor stores [inv@cnt:0]</text>

  <rect x="512" y="206" width="186" height="78" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="224" font-size="8.9" font-weight="700" fill="#b45309">t₂: Restore t₀ checkpoint</text>
  <text x="520" y="243" font-size="8.5" fill="#334155">• Snapshot still holds inv@cnt:0</text>
  <text x="520" y="261" font-size="8.5" fill="#334155">• Stale cache/index copies remain</text>
  <text x="520" y="276" font-size="8.2" fill="#92400e">Trusting snapshot causes replay bug</text>

  <!-- Live Off-Checkpoint Table & Check -->
  <rect x="722" y="109" width="206" height="186" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="730" y="116" width="182" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="821" y="128.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b91c1c">Off-Ckpt Table (Monotone)</text>

  <rect x="732" y="142" width="186" height="54" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="740" y="160" font-size="8.9" font-weight="700" fill="#991b1b">t₁: Owner revokes invoice</text>
  <text x="740" y="179" font-size="8.6" fill="#334155">Live counter: inv.cnt 0 → 1</text>

  <rect x="732" y="206" width="186" height="78" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="740" y="224" font-size="8.9" font-weight="700" fill="#991b1b">reload / authorize check:</text>
  <text x="740" y="243" font-size="8.6" font-weight="700" fill="#dc2626">rec (0) &lt; live (1) → INVALID!</text>
  <text x="740" y="261" font-size="8.4" fill="#334155">• Summary S forced to re-map</text>
  <text x="740" y="276" font-size="8.4" fill="#475569">• Unrelated pages remain valid</text>

  <line x1="708" y1="245" x2="720" y2="245" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Bottom Section of Right Panel: Capability Schema & Standing Perms -->
  <rect x="502" y="306" width="426" height="148" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="514" y="325" font-size="9.6" font-weight="700" fill="#1e3a8a">Reviewed Capability Schema &amp; Standing Permissions (App. B)</text>

  <rect x="514" y="335" width="130" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="579" y="352" text-anchor="middle" font-size="9.1" font-weight="700" fill="#1d4ed8">checked</text>
  <text x="579" y="368" text-anchor="middle" font-size="8.3" fill="#1e293b">Must trace to req. auth</text>
  <text x="579" y="382" text-anchor="middle" font-size="8.3" fill="#1e293b">&amp; unrevoked origins</text>

  <rect x="653" y="335" width="130" height="56" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="718" y="352" text-anchor="middle" font-size="9.1" font-weight="700" fill="#92400e">safe</text>
  <text x="718" y="368" text-anchor="middle" font-size="8.3" fill="#334155">Main residual risk:</text>
  <text x="718" y="382" text-anchor="middle" font-size="8.3" font-weight="700" fill="#b45309">wrong safe marking!</text>

  <rect x="792" y="335" width="130" height="56" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="857" y="352" text-anchor="middle" font-size="9.1" font-weight="700" fill="#991b1b">uncovered</text>
  <text x="857" y="368" text-anchor="middle" font-size="8.3" fill="#334155">Harness refuses call</text>
  <text x="857" y="382" text-anchor="middle" font-size="8.3" fill="#7f1d1d">(fail-closed)</text>

  <rect x="514" y="400" width="408" height="45" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="522" y="418" font-size="8.7" fill="#0f172a">• Untraceable or model-invented values default to Evidence and fail checked args</text>
  <text x="522" y="435" font-size="8.7" fill="#0f172a">• Standing permission (e.g. rent): auto-applies ONLY with zero untrusted context</text>

  <!-- Bottom Non-Goals & Status Footer -->
  <rect x="20" y="474" width="920" height="50" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="32" y="494" font-size="9.0" font-weight="700" fill="#0f172a">Design Status &amp; Non-Goals (§1, §3, §5): ClawMMU is an unimplemented vision proposal (AgentDojo/InjecAgent attack &amp; latency tests pending);</text>
  <text x="32" y="513" font-size="8.9" fill="#475569">enforces argument provenance integrity, without guaranteeing right action choices, accurate derived summaries, or secrecy of readable data.</text>
</svg>
