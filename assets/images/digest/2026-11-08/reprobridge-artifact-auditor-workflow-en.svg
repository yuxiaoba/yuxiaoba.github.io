<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ReproBridge four-component artifact handoff contract and post-hoc execution-integrity audit workflow" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Lato', 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.0" font-weight="700" fill="#0f172a">ReproBridge Four-Component Handoff Contract &amp; Execution-Integrity Audit</text>
  <text x="24" y="52" font-size="9.7" fill="#475569">arXiv:2611.08452v1 (§2–§4, Figs. 3–4, App. B–C) · Preserves decisions to shrink systematic shift |D| and audits provenance against shortcuts</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="20" y="70" width="920" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="30" y="78" width="76" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="68" y="90" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Error Model</text>
  <text x="114" y="90.5" font-size="9.3" font-weight="700" fill="#1e3a8a">Y = μ + D + ε · Repeats shrink ε variance; preserved setup cuts shift |D|</text>
  <text x="30" y="109" font-size="8.4" fill="#475569">Paper overrides conflicting code · 5 human runs set two-sided I_j^(0.95) (1% floor active on 197 tasks)</text>

  <line x1="484" y1="76" x2="484" y2="112" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="496" y="78" width="84" height="17" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="538" y="90" text-anchor="middle" font-size="8.6" font-weight="700" fill="#0369a1">Bench Funnel</text>
  <text x="588" y="90.5" font-size="9.1" font-weight="700" fill="#0f172a">742 Spotlights → 241 w/ code → 50 sampled → 36 papers (14 excl.)</text>
  <text x="496" y="109" font-size="8.4" fill="#334155">1,463 curated: 701 stable + 328 variable = 1,029 eval tasks (631 full / 398 eval-only; 434 excl.)</text>

  <rect x="20" y="128" width="288" height="296" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="128" width="288" height="26" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="146" width="288" height="8" fill="#1e3a8a"/>
  <text x="32" y="145" font-size="10.2" font-weight="700" fill="#ffffff">1 · Construction (Opus 5 · Refs Withheld)</text>

  <rect x="30" y="162" width="268" height="63" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="169" width="58" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="67" y="180.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">Specify</text>
  <text x="104" y="180.5" font-size="9.4" font-weight="700" fill="#1e3a8a">Intake + Planner</text>
  <text x="38" y="198" font-size="8.3" fill="#334155">• Map inputs &amp; pinned commit; freeze specs pre-run</text>
  <text x="38" y="213" font-size="8.3" fill="#475569">• Follow paper on conflicts; draft launchers &amp; plan</text>

  <rect x="30" y="233" width="268" height="63" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="38" y="240" width="58" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="67" y="251.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">Execute</text>
  <text x="104" y="251.5" font-size="9.4" font-weight="700" fill="#1e3a8a">Builder + Reproducer</text>
  <text x="38" y="269" font-size="8.3" fill="#334155">• Lock env &amp; data scripts; link values to output files</text>
  <text x="38" y="284" font-size="8.3" fill="#475569">• Isolate diagnostic vs scored runs; log failures</text>

  <rect x="30" y="304" width="268" height="63" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="311" width="58" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="67" y="322.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">Preserve</text>
  <text x="104" y="322.5" font-size="9.4" font-weight="700" fill="#1e3a8a">Distiller + Packager</text>
  <text x="38" y="340" font-size="8.3" fill="#334155">• Synthesize 12-sec guide &amp; change log (7 entries)</text>
  <text x="38" y="355" font-size="8.3" fill="#475569">• Clean-shell verify.sh real run before handoff</text>

  <rect x="30" y="376" width="268" height="38" rx="6" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="38" y="391.5" font-size="8.6" font-weight="700" fill="#1e3a8a">Independent Reviewer (Separate-Context Gate)</text>
  <text x="38" y="406" font-size="8.0" fill="#334155">Inspects plans, runs &amp; handoff; cannot self-approve fixes</text>

  <line x1="308" y1="276" x2="326" y2="276" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="328" y="128" width="278" height="296" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="328" y="128" width="278" height="26" rx="8" fill="#1d4ed8"/>
  <rect x="328" y="146" width="278" height="8" fill="#1d4ed8"/>
  <text x="340" y="145" font-size="10.2" font-weight="700" fill="#ffffff">2 · 4-Part RRA Contract (7 Root Entries)</text>

  <rect x="338" y="162" width="258" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="346" y="177" font-size="9.0" font-weight="700" fill="#1e3a8a">1) Refined Code src/ (Ablation loss: -5.2 pp)</text>
  <text x="346" y="193" font-size="8.1" fill="#334155">Fixes loader/edge defects; adds missing collectors</text>
  <text x="346" y="209" font-size="7.9" fill="#475569">Ex: TinyImageNet ImageFolder fix; POET-X tail batch</text>

  <rect x="338" y="226" width="258" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="346" y="241" font-size="9.0" font-weight="700" fill="#1e3a8a">2) Env Setup Dockerfile + setup/ (-4.5 pp)</text>
  <text x="346" y="257" font-size="8.1" fill="#334155">Exact construction pins, data SHA &amp; source builds</text>
  <text x="346" y="273" font-size="7.9" fill="#475569">Ex: SCIQL 161 pins separate GPU JAX &amp; CPU Torch</text>

  <rect x="338" y="290" width="258" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="305" font-size="9.0" font-weight="700" fill="#0f172a">3) Launchers experiments/ + verify.sh (-3.1 pp)</text>
  <text x="346" y="321" font-size="8.1" fill="#334155">482 scripts: bind config→metric; isolate smoke runs</text>
  <text x="346" y="337" font-size="7.9" fill="#475569">Ex: SCIQL --min-episodes 1000 blocks empty exit-0</text>

  <rect x="338" y="354" width="258" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="369" font-size="9.0" font-weight="700" fill="#0f172a">4) Guide &amp; Log (12-sec, 932 entries · -3.8 pp)</text>
  <text x="346" y="385" font-size="8.0" fill="#334155">Guideline &amp; change_log.md: source, rationale, sensitivity</text>
  <text x="346" y="401" font-size="7.9" fill="#475569">Ex: HELIX rev 9760b347 batch 8 &amp; LR 5.75e-4</text>

  <line x1="606" y1="276" x2="624" y2="276" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="626" y="128" width="314" height="296" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="626" y="128" width="314" height="26" rx="8" fill="#1e3a8a"/>
  <rect x="626" y="146" width="314" height="8" fill="#1e3a8a"/>
  <text x="638" y="145" font-size="10.2" font-weight="700" fill="#ffffff">3 · Fresh Reproducer &amp; Integrity Audit</text>

  <rect x="636" y="162" width="294" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="644" y="177" font-size="9.1" font-weight="700" fill="#1e3a8a">Fresh Downstream Session (24h · 8×H100-80GB)</text>
  <text x="644" y="193" font-size="8.2" fill="#334155">Paper + assigned repo only (5 refs &amp; chat hidden)</text>
  <text x="644" y="209" font-size="8.2" fill="#475569">Shipped score files banned; logs exec ID &amp; outputs</text>

  <line x1="783" y1="224" x2="783" y2="238" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>

  <rect x="636" y="240" width="294" height="124" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="644" y="247" width="84" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="686" y="258.5" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b45309">Post-Hoc Audit</text>
  <text x="734" y="258.5" font-size="8.8" font-weight="700" fill="#92400e">Codex Primary / Claude Check</text>
  <text x="644" y="277" font-size="8.1" fill="#0f172a">• Screening: ledger timestamps &amp; script/output SHA hashes</text>
  <text x="644" y="293" font-size="8.1" fill="#0f172a">• Finder → Refuter → Panel: localized evidence challenge</text>
  <text x="644" y="309" font-size="8.0" fill="#334155">• 5 violation classes: copy / substitute instrument / edit</text>
  <text x="652" y="323" font-size="8.0" fill="#334155">  operand / outcome selection / wrong stat (uncertain pass)</text>
  <rect x="644" y="331" width="278" height="25" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="650" y="347" font-size="7.8" font-weight="600" fill="#991b1b">Catches: WBMM 32.5s→206s post-exit; backdated FAIL→PASS</text>

  <line x1="783" y1="364" x2="783" y2="376" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <rect x="636" y="378" width="294" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="644" y="393" font-size="8.5" font-weight="700" fill="#166534">Pass Rule = In Two-Sided I_j^(0.95) AND Audit Valid</text>
  <text x="644" y="407" font-size="7.9" fill="#14532d">Strict two-sided check: overshooting target still fails</text>

  <rect x="20" y="434" width="920" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="30" y="443" width="144" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="102" y="455.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d4ed8">818-Outcome Human Check</text>
  <text x="182" y="455.5" font-size="9.0" font-weight="700" fill="#0f172a">Two-person review (8 papers × 409 tasks): 39 invalid (33 Raw + 6 RRA) vs. 779 valid (4 FPs = 0.5%)</text>
  <text x="30" y="476" font-size="8.5" fill="#334155">• Codex (gpt-5.6-sol): 88.6% precision (31/35) · 79.5% recall (misses 8/39 = 20.5%) · Raw 26TP/3FP/7FN · RRA 5TP/1FP/1FN</text>
  <text x="30" y="494" font-size="8.5" fill="#475569">• Claude (Opus 5): 85.7% precision (24/28) · 61.5% recall (misses 15/39 = 38.5%) · Raw 20TP/4FP/13FN · RRA 4TP/0FP/2FN</text>

  <text x="20" y="524" font-size="8.4" fill="#64748b">Boundary: Separate Aligner static check logged 238 paper-code contradictions (669 tasks); passing interval + audit does not prove scientific validity.</text>
</svg>