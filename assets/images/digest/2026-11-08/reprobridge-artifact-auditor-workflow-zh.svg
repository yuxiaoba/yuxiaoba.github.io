<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ReproBridge 四件套交接制品与独立执行完整性审计流程" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Lato', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="33" font-size="16.4" font-weight="700" fill="#0f172a">ReproBridge 四件套交接制品（RRA）与事后执行完整性审计流程</text>
  <text x="24" y="52" font-size="9.9" fill="#475569">arXiv:2611.08452v1（§2–§4, Fig. 3–4, App. B–C）· 将复现决策固化为标准契约以压缩系统偏移 |D|，并用证据链拦截伪复现</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="20" y="70" width="920" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="30" y="78" width="66" height="17" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="63" y="90" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d4ed8">误差模型</text>
  <text x="104" y="90.5" font-size="9.7" font-weight="700" fill="#1e3a8a">Y = μ + D + ε · 重复运行仅降 ε 方差，固化过程才压缩系统偏移 |D|</text>
  <text x="30" y="109" font-size="8.6" fill="#475569">论文优先于冲突代码 · 5 人独立参考定义双侧区间 I_j^(0.95)（含 1% 容差下限，197 项触发）</text>

  <line x1="484" y1="76" x2="484" y2="112" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="496" y="78" width="76" height="17" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="534" y="90" text-anchor="middle" font-size="8.8" font-weight="700" fill="#0369a1">基准筛选漏斗</text>
  <text x="580" y="90.5" font-size="9.4" font-weight="700" fill="#0f172a">742 Spotlights → 241 有代码 → 50 抽样 → 36 篇测试（排除 14）</text>
  <text x="496" y="109" font-size="8.6" fill="#334155">1,463 项任务：701 稳定 + 328 波动 = 1,029 项下游（631 全流程 / 398 仅评测；余 434 排除）</text>

  <rect x="20" y="128" width="288" height="296" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="128" width="288" height="26" rx="8" fill="#1e3a8a"/>
  <rect x="20" y="146" width="288" height="8" fill="#1e3a8a"/>
  <text x="32" y="145" font-size="10.4" font-weight="700" fill="#ffffff">1 · 三阶段构建（Opus 5 · 隔离参考分数）</text>

  <rect x="30" y="162" width="268" height="63" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="169" width="60" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="68" y="180.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Specify</text>
  <text x="106" y="180.5" font-size="9.5" font-weight="700" fill="#1e3a8a">Intake + Planner</text>
  <text x="38" y="198" font-size="8.5" fill="#334155">• 映射输入与固定 commit，执行前冻结任务规约</text>
  <text x="38" y="213" font-size="8.5" fill="#475569">• 纸码冲突依论文并记歧义，草拟实验启动器</text>

  <rect x="30" y="233" width="268" height="63" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="38" y="240" width="60" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="68" y="251.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Execute</text>
  <text x="106" y="251.5" font-size="9.5" font-weight="700" fill="#1e3a8a">Builder + Reproducer</text>
  <text x="38" y="269" font-size="8.5" fill="#334155">• 锁定依赖与数据脚本；数值必须对应真实输出文件</text>
  <text x="38" y="284" font-size="8.5" fill="#475569">• 严格区分诊断跑与记分复现，保留阻塞原因</text>

  <rect x="30" y="304" width="268" height="63" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="311" width="60" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="68" y="322.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1d4ed8">Preserve</text>
  <text x="106" y="322.5" font-size="9.5" font-weight="700" fill="#1e3a8a">Distiller + Packager</text>
  <text x="38" y="340" font-size="8.5" fill="#334155">• 从证据生成 12 节指南与变更日志，组装 7 项目录</text>
  <text x="38" y="355" font-size="8.5" fill="#475569">• 纯净 shell 跑 verify.sh 实测提取路线后交付</text>

  <rect x="30" y="376" width="268" height="38" rx="6" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1"/>
  <text x="38" y="391.5" font-size="8.7" font-weight="700" fill="#1e3a8a">Independent Reviewer（跨检查点独立上下文复核）</text>
  <text x="38" y="406" font-size="8.2" fill="#334155">核查计划/运行记录/最终交付包；禁止同上下文自修自批</text>

  <line x1="308" y1="276" x2="326" y2="276" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="328" y="128" width="278" height="296" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="328" y="128" width="278" height="26" rx="8" fill="#1d4ed8"/>
  <rect x="328" y="146" width="278" height="8" fill="#1d4ed8"/>
  <text x="340" y="145" font-size="10.4" font-weight="700" fill="#ffffff">2 · 四件套标准制品 RRA（7 项顶层布局）</text>

  <rect x="338" y="162" width="258" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="346" y="177" font-size="9.2" font-weight="700" fill="#1e3a8a">① 修订代码 src/（消融掉分最多 -5.2 pp）</text>
  <text x="346" y="193" font-size="8.3" fill="#334155">修复数据加载与边界 bug，补齐缺失评测/采集脚本</text>
  <text x="346" y="209" font-size="8.1" fill="#475569">例：TinyImageNet 标签目录修正；POET-X 尾批 collate</text>

  <rect x="338" y="226" width="258" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="346" y="241" font-size="9.2" font-weight="700" fill="#1e3a8a">② 环境配置 Dockerfile + setup/（-4.5 pp）</text>
  <text x="346" y="257" font-size="8.3" fill="#334155">锁死构建期实测依赖版本、数据 SHA 与源码编译路线</text>
  <text x="346" y="273" font-size="8.1" fill="#475569">例：SCIQL 161 针脚隔离 GPU JAX 与 CPU PyTorch</text>

  <rect x="338" y="290" width="258" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="305" font-size="9.2" font-weight="700" fill="#0f172a">③ 启动器 experiments/ + verify.sh（-3.1 pp）</text>
  <text x="346" y="321" font-size="8.3" fill="#334155">共 482 份脚本：绑定配置、输出采集，隔离 smoke 与记分</text>
  <text x="346" y="337" font-size="8.1" fill="#475569">例：SCIQL --min-episodes 1000 拦截空缓冲退出 0</text>

  <rect x="338" y="354" width="258" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="346" y="369" font-size="9.2" font-weight="700" fill="#0f172a">④ 12 节指南与变更日志（932 条歧义 · -3.8 pp）</text>
  <text x="346" y="385" font-size="8.3" fill="#334155">12 节指南与 6 节变更记录：依据、敏感度与受影响任务</text>
  <text x="346" y="401" font-size="8.1" fill="#475569">例：HELIX 追溯提交 9760b347 恢复 batch 8 / LR 5.75e-4</text>

  <line x1="606" y1="276" x2="624" y2="276" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="626" y="128" width="314" height="296" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="626" y="128" width="314" height="26" rx="8" fill="#1e3a8a"/>
  <rect x="626" y="146" width="314" height="8" fill="#1e3a8a"/>
  <text x="638" y="145" font-size="10.4" font-weight="700" fill="#ffffff">3 · 全新会话复现与独立事后审计</text>

  <rect x="636" y="162" width="294" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="644" y="177" font-size="9.3" font-weight="700" fill="#1e3a8a">全新下游会话（24h 限时 · 8×H100-80GB）</text>
  <text x="644" y="193" font-size="8.4" fill="#334155">仅获论文与 RRA（屏蔽参考值、对比仓库与构造对话）</text>
  <text x="644" y="209" font-size="8.4" fill="#475569">禁止直接提交附带分数文件；记录 exec ID/脚本与输出</text>

  <line x1="783" y1="224" x2="783" y2="238" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>

  <rect x="636" y="240" width="294" height="124" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <rect x="644" y="247" width="84" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="686" y="258.5" text-anchor="middle" font-size="8.4" font-weight="700" fill="#b45309">事后独立审计</text>
  <text x="734" y="258.5" font-size="9.0" font-weight="700" fill="#92400e">Codex 主审 / Claude 对比（无反馈）</text>
  <text x="644" y="277" font-size="8.3" fill="#0f172a">• 机械筛查：账本时间戳执行先序、脚本与输出哈希校验</text>
  <text x="644" y="293" font-size="8.3" fill="#0f172a">• Finder → Refuter → Panel：定位违例并校验可反驳性</text>
  <text x="644" y="309" font-size="8.2" fill="#334155">• 5 类否决：未测抄数 / 替换测量器 / 改操作数 / 按结果</text>
  <text x="652" y="323" font-size="8.2" fill="#334155">  择优挑选 / 算错统计量（存疑不否决）</text>
  <rect x="644" y="331" width="278" height="25" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="650" y="347" font-size="8.0" font-weight="600" fill="#991b1b">实抓案例：WBMM 32.5s 后改 206s；Weak-Strong 篡改日志时间</text>

  <line x1="783" y1="364" x2="783" y2="376" stroke="#15803d" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <rect x="636" y="378" width="294" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="644" y="393" font-size="8.7" font-weight="700" fill="#166534">成功判准 = 落入双侧区间 I_j^(0.95) 且未被主审计否决</text>
  <text x="644" y="407" font-size="8.1" fill="#14532d">双向严格校验：即便“高于”论文分数若越界仍判不兼容</text>

  <rect x="20" y="434" width="920" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="30" y="443" width="142" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="101" y="455.5" text-anchor="middle" font-size="8.7" font-weight="700" fill="#1d4ed8">8 篇 818 项人工双盲校验</text>
  <text x="180" y="455.5" font-size="9.2" font-weight="700" fill="#0f172a">人工确认 39 项违规（Raw 33 + RRA 6）与 779 项合规（两审计器各有 4/779 = 0.5% 误报）</text>
  <text x="30" y="476" font-size="8.7" fill="#334155">• Codex（主审 gpt-5.6-sol）：精准率 88.6%（31/35）· 召回率 79.5%（漏检 8/39 = 20.5%）· Raw 26TP/3FP/7FN · RRA 5TP/1FP/1FN</text>
  <text x="30" y="494" font-size="8.7" fill="#475569">• Claude（对比 Opus 5）：精准率 85.7%（24/28）· 召回率 61.5%（漏检 15/39 = 38.5%）· Raw 20TP/4FP/13FN · RRA 4TP/0FP/2FN</text>

  <text x="20" y="524" font-size="8.6" fill="#64748b">边界提示：独立 Aligner 静态审计另录得 238 条纸码矛盾（触及 669 项任务）；数值兼容与审计通过不代表科学结论绝对无误，制品亦可能固化原始误设。</text>
</svg>