<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Mobile AI Factory two-stage architecture: device feasibility pruning, LLM proposals, and deterministic rollback/escalation gates" style="background:#ffffff;font-family:'Lato', 'Noto Sans', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">Mobile AI Factory: Two-Stage Architecture &amp; Control Split</text>
  <text x="24" y="53" font-size="10.4" fill="#475569">arXiv:2611.13509v1 (§4 &amp; Fig. 4) · Device-Profile Feasibility Pruning + LLM Proposals + Deterministic Rollback/Escalation Gates</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="20" y="72" width="320" height="422" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="72" width="320" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="92" width="320" height="8" fill="#1e3a8a"/>
  <text x="32" y="90.5" font-size="10.8" font-weight="700" fill="#ffffff">Stage 1 · One-Time Setup (Per-Task Pruning &amp; Firewalls)</text>

  <rect x="30" y="109" width="300" height="104" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="116" width="76" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="76" y="128.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Once/Phone</text>
  <text x="122" y="129" font-size="11.0" font-weight="700" fill="#0f172a">Measured Phone Profile + Task Spec</text>
  <text x="38" y="152" font-size="9.5" fill="#334155">• 26 variants × 2 engines × CPU/GPU (364 runs/4 phones)</text>
  <text x="38" y="172" font-size="9.5" fill="#334155">• Measured prefill/decode tok/s, peak RAM, J/token</text>
  <text x="38" y="192" font-size="9.5" fill="#475569">• Human spec: sources, metric, verifier, budgets</text>

  <line x1="180" y1="213" x2="180" y2="230" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="232" width="300" height="108" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="38" y="239" width="76" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="76" y="251.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Deterministic</text>
  <text x="122" y="252" font-size="11.0" font-weight="700" fill="#1e3a8a">Feasibility Filter &amp; 5 Disk-Size Tiers</text>
  <text x="38" y="275" font-size="9.5" fill="#1e293b">• Compute request latency from profile &amp; task lengths</text>
  <text x="38" y="295" font-size="9.5" fill="#1e293b">• Drop budget misses &amp; crashes (up to 88% on hard)</text>
  <text x="38" y="315" font-size="9.4" fill="#334155">• Keep fastest-decode runtime/backend; 300M/750M/1.5G/2.5G</text>

  <line x1="180" y1="340" x2="180" y2="357" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="359" width="300" height="123" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="38" y="366" width="76" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="76" y="378.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">4 Firewalls</text>
  <text x="122" y="379" font-size="11.0" font-weight="700" fill="#1e3a8a">Task Brief, Frozen Eval &amp; Adaptive Goal</text>
  <text x="38" y="402" font-size="9.4" fill="#1e293b">• Freeze ≤1,000 held-out rows; 4-point exact-match firewall</text>
  <text x="38" y="424" font-size="9.4" fill="#1e293b">• Smallest/largest base models tag Easy/Medium/Hard</text>
  <text x="38" y="446" font-size="9.4" fill="#334155">• Goal = Teacher 5-shot score clamped to [0.80, 0.99]</text>
  <text x="38" y="468" font-size="9.3" font-weight="600" fill="#1d4ed8">Tier 1 (≤300MB) → ... → Tier 5 (&gt;2.5GB)</text>

  <path d="M 330 415 L 348 415 L 348 292 L 362 292" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="364" y="72" width="576" height="422" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="364" y="72" width="576" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="364" y="92" width="576" height="8" fill="#1d4ed8"/>
  <text x="376" y="90.5" font-size="10.8" font-weight="700" fill="#ffffff">Stage 2 · Small-to-Large Tiered Search Loop (Proposal vs. Verdict)</text>

  <rect x="376" y="109" width="336" height="104" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <rect x="384" y="116" width="84" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="426" y="128.5" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b45309">Orchestrator</text>
  <text x="476" y="129" font-size="10.8" font-weight="700" fill="#92400e">Claude Sonnet 5 (median $0.064 / step)</text>
  <text x="384" y="152" font-size="9.4" fill="#334155">• Reads aggregate metrics (E/M/H, failure types) + run memory</text>
  <text x="384" y="172" font-size="9.4" fill="#334155">• Proposes 1 change: tier pick, hyperparams, mine, or synthesis</text>
  <text x="384" y="192" font-size="9.4" fill="#475569">• May request goal raise (≥ +0.005, cap 0.99) once goal met</text>

  <rect x="724" y="109" width="204" height="104" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="732" y="116" width="60" height="18" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="0.8"/>
  <text x="762" y="128.5" text-anchor="middle" font-size="9.4" font-weight="700" fill="#0f766e">Teacher</text>
  <text x="732" y="150" font-size="10.4" font-weight="700" fill="#065f46">Qwen3.6-35B-A3B (vLLM)</text>
  <text x="732" y="172" font-size="9.2" fill="#334155">• Writes 25–600 rows/failure class</text>
  <text x="732" y="192" font-size="9.2" fill="#334155">• Filtered by verifier + firewall</text>

  <line x1="712" y1="160" x2="722" y2="160" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="544" y1="213" x2="544" y2="233" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <line x1="826" y1="213" x2="826" y2="233" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <rect x="376" y="235" width="552" height="114" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="384" y="242" width="84" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="426" y="254.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Deterministic</text>
  <text x="476" y="255" font-size="11.0" font-weight="700" fill="#1e3a8a">Base-Restart LoRA &amp; Post-Quant Target-Engine Scoring (§4.3.3)</text>
  <text x="384" y="278" font-size="9.5" fill="#0f172a">1. Retrain LoRA from base model (answer-token loss; exact rollback)</text>
  <text x="384" y="297" font-size="9.5" fill="#0f172a">2. Merge &amp; export deployable format: Q4_K_M / Q8_0 or MNN HQQ-32</text>
  <text x="384" y="316" font-size="9.5" fill="#0f172a">3. Score in target engine; report score + parseable % (no raw rows)</text>
  <text x="384" y="335" font-size="9.5" font-weight="600" fill="#1d4ed8">4. Accounting rule: failed eval = missing, never 0 (avoids +0.85)</text>

  <line x1="652" y1="349" x2="652" y2="365" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="376" y="367" width="552" height="115" rx="7" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="386" y="384" font-size="10.2" font-weight="700" fill="#1e3a8a">Deterministic Control Gates (88% of TOPv2 proposals regressed &amp; rolled back)</text>

  <rect x="384" y="392" width="168" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="392" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">Rollback Gate</text>
  <text x="392" y="426" font-size="8.7" fill="#334155">• Score regression discarded</text>
  <text x="392" y="443" font-size="8.7" fill="#334155">• Restores best; blocks repeats</text>
  <text x="392" y="460" font-size="8.7" fill="#475569">• Rejects held-out row quotes</text>

  <rect x="559" y="392" width="168" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="567" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">Tier Escalation</text>
  <text x="567" y="426" font-size="8.7" fill="#334155">• ≤ +0.02 gain in last 15 evals</text>
  <text x="567" y="443" font-size="8.7" fill="#334155">• Or 30 tier evals (w/ rollbacks)</text>
  <text x="567" y="460" font-size="8.7" fill="#475569">• Carries curated data upward</text>

  <rect x="734" y="392" width="186" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="742" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">Watchdog &amp; Output</text>
  <text x="742" y="426" font-size="8.6" fill="#334155">• Halts on 3 empty synth rounds</text>
  <text x="742" y="443" font-size="8.6" fill="#334155">• Halts on ≥25% / 1,000-row drop</text>
  <text x="742" y="460" font-size="8.6" fill="#475569">• SQLite ckpts; cheapest hit out</text>

  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="511" font-size="9.2" fill="#334155">Blue: Deterministic code</text>
  <rect x="172" y="502" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="189" y="511" font-size="9.2" fill="#334155">Amber: Orchestrator LLM</text>
  <rect x="332" y="502" width="12" height="10" rx="2" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="349" y="511" font-size="9.2" fill="#334155">Teal: Teacher synthesis</text>
  <text x="20" y="527" font-size="9.1" fill="#64748b">Note: Phone profiles use cool starts (≤28°C/32°C), fixed 256+256 prompt/output &amp; idle state; scorers &amp; verifiers remain human-authored.</text>
</svg>