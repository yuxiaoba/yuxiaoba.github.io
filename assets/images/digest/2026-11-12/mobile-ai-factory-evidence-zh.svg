  <text x="32" y="89.5" font-size="11.0" font-weight="700" fill="#1e3a8a">A. 规格表为什么会失效：后端倒挂与 4-bit 精度差（§3）</text>

  <text x="32" y="118" font-size="9.7" font-weight="700" fill="#0f172a">1. 同模型同引擎 GPU/CPU 反转（Qwen3-0.6B llama.cpp prefill）：</text>
  <text x="42" y="135" font-size="9.4" fill="#1d4ed8">OnePlus 15 GPU 快 5.4×；Galaxy S23 慢 1.7×；OnePlus 8 Pro 慢 7.4×</text>
  <text x="32" y="158" font-size="9.7" font-weight="700" fill="#0f172a">2. 41/76 失败不可从规格预见（共 364 组，288 组完成）：</text>
  <text x="42" y="175" font-size="9.4" fill="#334155">20 组 MNN FP16 GPU 崩溃 · 10 组换页 · 8 组 OpenCL 缺失 · 3 组加载失败</text>
  <text x="32" y="198" font-size="9.7" font-weight="700" fill="#0f172a">3. 磁盘大小低估内存：S23 GPU 运行期占文件大小中位 2.8×（最高 8.1×）</text>
  <text x="32" y="222" font-size="9.7" font-weight="700" fill="#0f172a">4. 同权重 4-bit 精度差（CLINC150 SmolLM2-360M 微调）：</text>
  <text x="42" y="239" font-size="9.4" fill="#1d4ed8">llama.cpp Q4_K_M 0.767 vs MNN 默认 0.659 vs MNN HQQ-32 0.747</text>
