<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Mobile AI Factory 两阶段架构：设备可行性剪枝、LLM 提案与确定性回滚升级闸门" style="background:#ffffff;font-family:'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="948" height="528" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">Mobile AI Factory 两阶段架构与控制分工</text>
  <text x="24" y="53" font-size="10.4" fill="#475569">arXiv:2611.13509v1（§4 与 Fig. 4）· 实测可行性优先剪枝 + LLM 探索提案 + 确定性回滚/升级/看门狗控制</text>
  <line x1="24" y1="62" x2="936" y2="62" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="20" y="72" width="320" height="422" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="20" y="72" width="320" height="28" rx="9" fill="#1e3a8a"/>
  <rect x="20" y="92" width="320" height="8" fill="#1e3a8a"/>
  <text x="32" y="90.5" font-size="10.8" font-weight="700" fill="#ffffff">阶段一 · 一次性 Setup（按任务与目标手机剪枝并冻结）</text>

  <rect x="30" y="109" width="300" height="104" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="38" y="116" width="76" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="76" y="128.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">离线一次</text>
  <text x="122" y="129" font-size="11.0" font-weight="700" fill="#0f172a">手机实测 Profile + 任务规格</text>
  <text x="38" y="152" font-size="9.5" fill="#334155">• 26 变体 × 2 引擎 × CPU/GPU（4 手机 364 组）</text>
  <text x="38" y="172" font-size="9.5" fill="#334155">• 实测 prefill/decode、峰值内存、单 token 能耗</text>
  <text x="38" y="192" font-size="9.5" fill="#475569">• 开发者提供：数据源、评测指标、输出 verifier、预算</text>

  <line x1="180" y1="213" x2="180" y2="230" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="232" width="300" height="108" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="38" y="239" width="76" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="76" y="251.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">确定性</text>
  <text x="122" y="252" font-size="11.0" font-weight="700" fill="#1e3a8a">设备可行性过滤与 5 级磁盘分桶</text>
  <text x="38" y="275" font-size="9.5" fill="#1e293b">• 按实测吞吐与任务提示/输出长度折算请求延迟</text>
  <text x="38" y="295" font-size="9.5" fill="#1e293b">• 剔除超预算与崩溃/OOM/驱动缺口（硬约束剪 88%）</text>
  <text x="38" y="315" font-size="9.4" fill="#334155">• 每变体留最快引擎+后端；分桶 ≤300M/750M/1.5G/2.5G</text>

  <line x1="180" y1="340" x2="180" y2="357" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="30" y="359" width="300" height="123" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="38" y="366" width="76" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="76" y="378.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">4 重防泄漏</text>
  <text x="122" y="379" font-size="11.0" font-weight="700" fill="#1e3a8a">任务简报、冻结评测集与自适应目标</text>
  <text x="38" y="402" font-size="9.4" fill="#1e293b">• 冻结 ≤1,000 条评测集；4 节点归一化精确去重防火墙</text>
  <text x="38" y="424" font-size="9.4" fill="#1e293b">• 未微调最小/最大基座标注 Easy / Medium / Hard 难度</text>
  <text x="38" y="446" font-size="9.4" fill="#334155">• 目标 = Teacher 5-shot 分数，限幅 [0.80, 0.99]</text>
  <text x="38" y="468" font-size="9.3" font-weight="600" fill="#1d4ed8">Tier 1 (≤300MB) → ... → Tier 5 (&gt;2.5GB)</text>

  <path d="M 330 415 L 348 415 L 348 292 L 362 292" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <rect x="364" y="72" width="576" height="422" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="364" y="72" width="576" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="364" y="92" width="576" height="8" fill="#1d4ed8"/>
  <text x="376" y="90.5" font-size="10.8" font-weight="700" fill="#ffffff">阶段二 · 从小到大分桶搜索循环（LLM 提案 vs 确定性裁决）</text>

  <rect x="376" y="109" width="336" height="104" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <rect x="384" y="116" width="84" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="426" y="128.5" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b45309">LLM 编排器</text>
  <text x="476" y="129" font-size="10.8" font-weight="700" fill="#92400e">Claude Sonnet 5（中位 $0.064 / 步）</text>
  <text x="384" y="152" font-size="9.4" fill="#334155">• 读取摘要报告（总分、E/M/H 分布、错因统计）与搜索记忆</text>
  <text x="384" y="172" font-size="9.4" fill="#334155">• 仅提议一项变更：桶内选型 / 调超参 / 挖数据 / 定向合成</text>
  <text x="384" y="192" font-size="9.4" fill="#475569">• 达标后可请求抬高目标（≥ +0.005，上限 0.99）</text>

  <rect x="724" y="109" width="204" height="104" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="732" y="116" width="60" height="18" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="0.8"/>
  <text x="762" y="128.5" text-anchor="middle" font-size="9.4" font-weight="700" fill="#0f766e">本地教师</text>
  <text x="732" y="150" font-size="10.4" font-weight="700" fill="#065f46">Qwen3.6-35B-A3B（vLLM）</text>
  <text x="732" y="172" font-size="9.2" fill="#334155">• 按错因类别生成 25–600 条样本</text>
  <text x="732" y="192" font-size="9.2" fill="#334155">• 经程序化 verifier 与防火墙过滤</text>

  <line x1="712" y1="160" x2="722" y2="160" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <line x1="544" y1="213" x2="544" y2="233" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <line x1="826" y1="213" x2="826" y2="233" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-teal)"/>

  <rect x="376" y="235" width="552" height="114" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="384" y="242" width="84" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="426" y="254.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">确定性</text>
  <text x="476" y="255" font-size="11.0" font-weight="700" fill="#1e3a8a">执行训练与目标引擎量化后评测（§4.3.3）</text>
  <text x="384" y="278" font-size="9.5" fill="#0f172a">1. 每轮从基座模型重训 LoRA（仅答案 token 计 loss，可精确回滚）</text>
  <text x="384" y="297" font-size="9.5" fill="#0f172a">2. 合并权重导出目标格式：llama.cpp Q4_K_M/Q8_0 或 MNN HQQ-32</text>
  <text x="384" y="316" font-size="9.5" fill="#0f172a">3. 在目标引擎实测冻结集；输出总分与可解析率（不暴露原始行）</text>
  <text x="384" y="335" font-size="9.5" font-weight="600" fill="#1d4ed8">4. 会计纪律：评估失败记为缺失（missing）而非 0（防虚构 +0.85）</text>

  <line x1="652" y1="349" x2="652" y2="365" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <rect x="376" y="367" width="552" height="115" rx="7" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="386" y="384" font-size="10.2" font-weight="700" fill="#1e3a8a">确定性安全闸门（TOPv2 中 88% 提案被回滚，控权不交给 LLM）</text>

  <rect x="384" y="392" width="168" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="392" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">回滚闸门（Rollback）</text>
  <text x="392" y="426" font-size="8.7" fill="#334155">• 任一变更降分立即丢弃</text>
  <text x="392" y="443" font-size="8.7" fill="#334155">• 恢复最佳状态，禁重提同败</text>
  <text x="392" y="460" font-size="8.7" fill="#475569">• 拒绝引用冻结行的决策</text>

  <rect x="559" y="392" width="168" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="567" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">分桶升级（Escalation）</text>
  <text x="567" y="426" font-size="8.7" fill="#334155">• 连续 15 轮提升 ≤ 0.02</text>
  <text x="567" y="443" font-size="8.7" fill="#334155">• 或单桶满 30 轮未达标</text>
  <text x="567" y="460" font-size="8.7" fill="#475569">• 保留累计数据升入下一桶</text>

  <rect x="734" y="392" width="186" height="82" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="742" y="408" font-size="9.8" font-weight="700" fill="#1d4ed8">看门狗与输出（Watchdog）</text>
  <text x="742" y="426" font-size="8.6" fill="#334155">• 连续 3 轮零新增合成触发熔断</text>
  <text x="742" y="443" font-size="8.6" fill="#334155">• 单步骤缩 ≥25% 或 ≥1,000 行止损</text>
  <text x="742" y="460" font-size="8.6" fill="#475569">• SQLite 断点续跑；返最省达标桶</text>

  <rect x="20" y="502" width="12" height="10" rx="2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="37" y="511" font-size="9.2" fill="#334155">蓝框：确定性代码控制</text>
  <rect x="172" y="502" width="12" height="10" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="189" y="511" font-size="9.2" fill="#334155">琥珀：Orchestrator LLM</text>
  <rect x="332" y="502" width="12" height="10" rx="2" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
  <text x="349" y="511" font-size="9.2" fill="#334155">青框：Teacher 数据合成</text>
  <text x="20" y="527" font-size="9.1" fill="#64748b">注：手机 Profile 测于冷启动（≤28°C/32°C）、256+256 固定长度与空闲状态；Task Scorer 与数据 Verifier 仍需人工提供。</text>
</svg>