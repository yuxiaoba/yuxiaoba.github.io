  <text x="32" y="118" font-size="9.7" font-weight="700" fill="#0f172a">1. Same model/engine GPU-vs-CPU inversion (Qwen3-0.6B llama.cpp prefill):</text>
  <text x="42" y="135" font-size="9.4" fill="#1d4ed8">OnePlus 15 GPU 5.4× faster · Galaxy S23 1.7× slower · OnePlus 8 Pro 7.4× slower</text>
  <text x="32" y="158" font-size="9.7" font-weight="700" fill="#0f172a">2. 41/76 failures invisible on specs (364 attempted, 288 completed):</text>
  <text x="42" y="175" font-size="9.4" fill="#334155">20 MNN FP16 GPU crashes · 10 swapped · 8 OpenCL gaps · 3 load failures</text>
  <text x="32" y="198" font-size="9.7" font-weight="700" fill="#0f172a">3. Disk size underestimates RAM: S23 GPU holds 2.8× median (8.1× max)</text>
  <text x="32" y="222" font-size="9.7" font-weight="700" fill="#0f172a">4. Same weights 4-bit gap (CLINC150 fine-tuned SmolLM2-360M):</text>
  <text x="42" y="239" font-size="9.4" fill="#1d4ed8">llama.cpp Q4_K_M 0.767 vs MNN default 0.659 vs MNN HQQ-32 0.747</text>
