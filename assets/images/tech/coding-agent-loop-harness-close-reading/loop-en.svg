<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Agent loop: input, decisions and execution</title><rect width="1080" height="520" fill="#f5f8fc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3478b9" stroke-width="1.5"/></marker></defs><g font-family="Arial,Noto Sans CJK SC,sans-serif" fill="#18344d"><text x="40" y="48" font-size="25" font-weight="bold">Agent loop: input, decisions and execution</text><rect x="40" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="122" font-size="20" font-weight="bold">1 Input and constraints</text><text x="58" y="153" font-size="16" fill="#526c82">Task, steering and budget</text><text x="58" y="178" font-size="16" fill="#526c82">Queued does not mean applied</text><rect x="390" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="122" font-size="20" font-weight="bold">2 Assemble model input</text><text x="408" y="153" font-size="16" fill="#526c82">History, tools and policy</text><text x="408" y="178" font-size="16" fill="#526c82">Compaction and projection</text><rect x="740" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="122" font-size="20" font-weight="bold">3 LLM decision</text><text x="758" y="153" font-size="16" fill="#526c82">Answer or tool calls</text><text x="758" y="178" font-size="16" fill="#526c82">Output can fail or truncate</text><rect x="40" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="312" font-size="20" font-weight="bold">6 Validate and stop</text><text x="58" y="343" font-size="16" fill="#526c82">Pending input and stop hooks</text><text x="58" y="368" font-size="16" fill="#526c82">Loop exit is not task success</text><rect x="390" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="312" font-size="20" font-weight="bold">5 Results and state</text><text x="408" y="343" font-size="16" fill="#526c82">Effects, tool results and log</text><text x="408" y="368" font-size="16" fill="#526c82">Execution vs commit order</text><rect x="740" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="312" font-size="20" font-weight="bold">4 Gate and execute</text><text x="758" y="343" font-size="16" fill="#526c82">Validation, approval, concurrency</text><text x="758" y="368" font-size="16" fill="#526c82">Run tools; handle cancellation</text><path d="M340 150H385" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M690 150H735" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M890 210V275" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M740 340H695" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M390 340H345" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M190 280V240H540V215" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="455" font-size="18">Continuation rebuilds a request from updated state; it is not blind action replay.</text><text x="40" y="485" font-size="15" fill="#526c82">Conceptual responsibilities, not an identical call graph for all six frameworks.</text></g></svg>