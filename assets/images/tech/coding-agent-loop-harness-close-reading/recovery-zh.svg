<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>最难恢复的窗口：动作完成，结果尚未记录</title><rect width="1080" height="520" fill="#f5f8fc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3478b9" stroke-width="1.5"/></marker></defs><g font-family="Arial,Noto Sans CJK SC,sans-serif" fill="#18344d"><text x="40" y="48" font-size="25" font-weight="bold">最难恢复的窗口：动作完成，结果尚未记录</text><rect x="40" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="127" font-size="20" font-weight="bold">提出工具调用</text><text x="58" y="158" font-size="16" fill="#526c82">call ID + 参数</text><rect x="390" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="127" font-size="20" font-weight="bold">外部效果已发生</text><text x="408" y="158" font-size="16" fill="#526c82">文件、服务或远端状态改变</text><rect x="740" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="127" font-size="20" font-weight="bold">记录工具结果</text><text x="758" y="158" font-size="16" fill="#526c82">提交日志并返回模型</text><path d="M340 145H385" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M690 145H735" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M715 80V230" stroke="#9b6335" stroke-width="2" stroke-dasharray="7 5"/><text x="535" y="255" font-size="19" fill="#81542e">此处断线：失败的是观测，还是动作？</text><rect x="40" y="290" width="470" height="155" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="322" font-size="20" font-weight="bold">恢复前先检查</text><text x="58" y="353" font-size="16" fill="#526c82">已有结果是否可查询？</text><text x="58" y="378" font-size="16" fill="#526c82">能否用幂等键去重？</text><text x="58" y="403" font-size="16" fill="#526c82">未知效果是否需要人工确认？</text><rect x="570" y="290" width="470" height="155" rx="12" fill="white" stroke="#afc4d8"/><text x="588" y="322" font-size="20" font-weight="bold">安全的恢复结论</text><text x="588" y="353" font-size="16" fill="#526c82">复用已确认结果 / 有依据地重试</text><text x="588" y="378" font-size="16" fill="#526c82">或明确保留“效果未知”状态</text><text x="588" y="403" font-size="16" fill="#526c82">日志完整并不等于外部事务原子性</text><path d="M510 365H565" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="490" font-size="15" fill="#526c82">分析示例，不是任一框架已证明发生的事故或已通过的测试。</text></g></svg>