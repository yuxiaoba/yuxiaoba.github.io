<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Agent Loop：输入、决策与执行闭环</title><rect width="1080" height="520" fill="#f5f8fc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3478b9" stroke-width="1.5"/></marker></defs><g font-family="Arial,Noto Sans CJK SC,sans-serif" fill="#18344d"><text x="40" y="48" font-size="25" font-weight="bold">Agent Loop：输入、决策与执行闭环</text><rect x="40" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="122" font-size="20" font-weight="bold">1 输入与约束</text><text x="58" y="153" font-size="16" fill="#526c82">任务、追加指令、预算</text><text x="58" y="178" font-size="16" fill="#526c82">进入队列，不等于已生效</text><rect x="390" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="122" font-size="20" font-weight="bold">2 构造模型输入</text><text x="408" y="153" font-size="16" fill="#526c82">会话历史、工具、策略</text><text x="408" y="178" font-size="16" fill="#526c82">压缩与消息投影</text><rect x="740" y="90" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="122" font-size="20" font-weight="bold">3 LLM 决策</text><text x="758" y="153" font-size="16" fill="#526c82">生成回答或工具调用</text><text x="758" y="178" font-size="16" fill="#526c82">输出可能截断或失败</text><rect x="40" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="312" font-size="20" font-weight="bold">6 验收与停止</text><text x="58" y="343" font-size="16" fill="#526c82">检查待处理输入和停止钩子</text><text x="58" y="368" font-size="16" fill="#526c82">结束循环 ≠ 任务成功</text><rect x="390" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="312" font-size="20" font-weight="bold">5 结果与状态</text><text x="408" y="343" font-size="16" fill="#526c82">真实效果、工具结果、日志</text><text x="408" y="368" font-size="16" fill="#526c82">区分执行顺序与提交顺序</text><rect x="740" y="280" width="300" height="120" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="312" font-size="20" font-weight="bold">4 门禁与执行</text><text x="758" y="343" font-size="16" fill="#526c82">参数校验、权限、并发控制</text><text x="758" y="368" font-size="16" fill="#526c82">调用工具并处理取消</text><path d="M340 150H385" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M690 150H735" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M890 210V275" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M740 340H695" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M390 340H345" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M190 280V240H540V215" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="455" font-size="18">继续执行时，用新状态重新构造请求；不要直接重复上一次动作。</text><text x="40" y="485" font-size="15" fill="#526c82">概念图：用于比较职责，不代表六个框架拥有相同的调用顺序。</text></g></svg>