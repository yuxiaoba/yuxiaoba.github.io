<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>The ambiguous window: effect completed, result not recorded</title><rect width="1080" height="520" fill="#f5f8fc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3478b9" stroke-width="1.5"/></marker></defs><g font-family="Arial,Noto Sans CJK SC,sans-serif" fill="#18344d"><text x="40" y="48" font-size="25" font-weight="bold">The ambiguous window: effect completed, result not recorded</text><rect x="40" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="127" font-size="20" font-weight="bold">Propose tool call</text><text x="58" y="158" font-size="16" fill="#526c82">Call ID + arguments</text><rect x="390" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="408" y="127" font-size="20" font-weight="bold">External effect completes</text><text x="408" y="158" font-size="16" fill="#526c82">File, service or remote state changes</text><rect x="740" y="95" width="300" height="105" rx="12" fill="white" stroke="#afc4d8"/><text x="758" y="127" font-size="20" font-weight="bold">Record tool result</text><text x="758" y="158" font-size="16" fill="#526c82">Commit log and return to model</text><path d="M340 145H385" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M690 145H735" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M715 80V230" stroke="#9b6335" stroke-width="2" stroke-dasharray="7 5"/><text x="535" y="255" font-size="19" fill="#81542e">Disconnect: did the action fail, or only its observation?</text><rect x="40" y="290" width="470" height="155" rx="12" fill="white" stroke="#afc4d8"/><text x="58" y="322" font-size="20" font-weight="bold">Before recovery</text><text x="58" y="353" font-size="16" fill="#526c82">Can the committed outcome be queried?</text><text x="58" y="378" font-size="16" fill="#526c82">Can an idempotency key deduplicate it?</text><text x="58" y="403" font-size="16" fill="#526c82">Does an unknown effect need human review?</text><rect x="570" y="290" width="470" height="155" rx="12" fill="white" stroke="#afc4d8"/><text x="588" y="322" font-size="20" font-weight="bold">A defensible recovery outcome</text><text x="588" y="353" font-size="16" fill="#526c82">Reuse a result, or justify a retry</text><text x="588" y="378" font-size="16" fill="#526c82">Otherwise preserve an unknown-effect state</text><text x="588" y="403" font-size="16" fill="#526c82">A complete log is not an external transaction</text><path d="M510 365H565" stroke="#3478b9" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="490" font-size="15" fill="#526c82">Analytical example, not a reported incident or a test passed by a particular framework.</text></g></svg>