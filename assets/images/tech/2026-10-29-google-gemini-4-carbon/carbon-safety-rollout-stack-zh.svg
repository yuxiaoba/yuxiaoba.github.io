  <text x="36" y="467" font-size="11.2" font-weight="700" fill="#92400e" text-anchor="start">生产部署边界提示（AgentOps 工程视角）：</text>
  <text x="36" y="487" font-size="10.4" font-weight="400" fill="#78350f" text-anchor="start">模型侧低捷径率与 0.0% 基准注入率不能替代工具最小权限、沙箱隔离、外部状态对账与人类审批；正式定价后需重算长程循环费用。</text>
