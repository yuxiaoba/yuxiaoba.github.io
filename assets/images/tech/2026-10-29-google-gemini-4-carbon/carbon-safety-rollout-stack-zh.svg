  <text x="44" y="157" font-size="10.1" font-weight="600" fill="#1e293b" text-anchor="start">作弊尝试降至 0.4%，且总准确率升至 65.2%</text>
  <text x="44" y="176" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">抑制走捷径/奖励黑客行为而非牺牲编码表现</text>
  <rect x="34" y="194" width="426" height="74" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
