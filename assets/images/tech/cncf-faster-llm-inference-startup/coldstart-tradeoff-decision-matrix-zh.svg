<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="36" font-size="18.5" font-weight="700" fill="#0f172a">冷启动机制选型、K8s/CRI/OCI 演进层与已知禁用边界</text>
  <text x="24" y="56" font-size="11.2" fill="#475569">按需跨越的生命周期事件选择引擎路径，同时核对底层接口进度与正文点名的不可组合限制</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Band 1: 4 Scenario Columns (y=76..256, h=180) -->
  <!-- Col 1: x=24 w=221 -->
  <rect x="24" y="76" width="221" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="76" width="221" height="36" rx="8" fill="#1e3a8a"/>
  <rect x="24" y="102" width="221" height="10" fill="#1e3a8a"/>
  <text x="34" y="99" font-size="11.5" font-weight="700" fill="#ffffff">场景 A · 同机引擎重启</text>
  <text x="34" y="130" font-size="10.5" font-weight="700" fill="#1d4ed8">vLLM preload · SGLang daemon</text>
  <text x="34" y="150" font-size="10" fill="#334155">机制：CUDA IPC 共享 GPU 权重</text>
  <text x="34" y="168" font-size="10" fill="#166534">收益：跳过读取与张量转换</text>
  <line x1="34" y1="178" x2="235" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="196" font-size="9.6" fill="#475569">• CUDA IPC 仅限单节点本地使用</text>
  <text x="34" y="213" font-size="9.6" fill="#475569">• zero-copy 要求 daemon 长存活</text>
  <text x="34" y="230" font-size="9.6" fill="#475569">• 新引擎仍重建通信与 Graph</text>
  <text x="34" y="247" font-size="9.6" fill="#64748b">• 不匹配时回退常规加载路径</text>

  <!-- Col 2: x=254 w=221 -->
  <rect x="254" y="76" width="221" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="254" y="76" width="221" height="36" rx="8" fill="#1e3a8a"/>
  <rect x="254" y="102" width="221" height="10" fill="#1e3a8a"/>
  <text x="264" y="99" font-size="11.5" font-weight="700" fill="#ffffff">场景 B · 同卡空闲/切换复用</text>
  <text x="264" y="130" font-size="10.5" font-weight="700" fill="#1d4ed8">vLLM sleep · SGLang · FMA</text>
  <text x="264" y="150" font-size="10" fill="#334155">机制：进程保活，释放恢复显存</text>
  <text x="264" y="168" font-size="10" fill="#166534">收益：保住进程与已导入模块</text>
  <line x1="264" y1="178" x2="465" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="264" y="196" font-size="9.6" fill="#475569">• FMA 热路径需匹配已分配 GPU</text>
  <text x="264" y="213" font-size="9.6" fill="#475569">• 或经预导入 Python 的 launcher</text>
  <text x="264" y="230" font-size="9.6" fill="#475569">• 恢复开销受 CPU 备份策略影响</text>
  <text x="264" y="247" font-size="9.6" fill="#b45309">• zero-copy 与 sleep 存在冲突</text>

  <!-- Col 3: x=484 w=221 -->
  <rect x="484" y="76" width="221" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="484" y="76" width="221" height="36" rx="8" fill="#1e3a8a"/>
  <rect x="484" y="102" width="221" height="10" fill="#1e3a8a"/>
  <text x="494" y="99" font-size="11.5" font-weight="700" fill="#ffffff">场景 C · 副本扩容快照恢复</text>
  <text x="494" y="130" font-size="10.2" font-weight="700" fill="#1d4ed8">vLLM/SGLang · Snapshot · GKE</text>
  <text x="494" y="150" font-size="10" fill="#334155">机制：CRIU+CUDA 或 gVisor 恢复</text>
  <text x="494" y="168" font-size="10" fill="#166534">收益：跳过初始化、编译与图捕获</text>
  <line x1="494" y1="178" x2="695" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="494" y="196" font-size="9.6" fill="#475569">• 多限同机同环境、单卡 TP=1</text>
  <text x="494" y="213" font-size="9.6" fill="#475569">• 捕获前清空 KV，恢复重载模型</text>
  <text x="494" y="230" font-size="9.6" fill="#475569">• Snapshot 依赖共享 PVC（非对象）</text>
  <text x="494" y="247" font-size="9.6" fill="#64748b">• 恢复后须通过首生成结果核对</text>

  <!-- Col 4: x=714 w=222 -->
  <rect x="714" y="76" width="222" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="714" y="76" width="222" height="36" rx="8" fill="#1e3a8a"/>
  <rect x="714" y="102" width="222" height="10" fill="#1e3a8a"/>
  <text x="724" y="99" font-size="11.5" font-weight="700" fill="#ffffff">场景 D · 跨节点权重分发</text>
  <text x="724" y="130" font-size="10.5" font-weight="700" fill="#1d4ed8">llm-d ModelExpress (NIXL)</text>
  <text x="724" y="150" font-size="10" fill="#334155">机制：种子副本经 RDMA 传权重</text>
  <text x="724" y="168" font-size="10" fill="#166534">收益：降低共享存储拉取争抢</text>
  <line x1="724" y1="178" x2="926" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="724" y="196" font-size="9.6" fill="#475569">• 需兼容的 NIXL / RDMA 网络</text>
  <text x="724" y="213" font-size="9.6" fill="#475569">• 仅改权重分发，接收端仍冷初始化</text>
  <text x="724" y="230" font-size="9.6" fill="#475569">• 需配合编译缓存减少后续耗时</text>
  <text x="724" y="247" font-size="9.6" fill="#64748b">• 不能替代快照或热池语义</text>

  <!-- Band 2: Platform & Runtime Standardization Stack (y=268..396, h=128) -->
  <rect x="24" y="268" width="912" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="36" y="288" font-size="11.5" font-weight="700" fill="#1e3a8a">平台与运行时标准化栈（CNCF 2026-11-06 现状核对：上层编排、CRI 接口与镜像打包各自处于不同成熟阶段）</text>

  <rect x="36" y="298" width="216" height="88" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <rect x="44" y="306" width="112" height="18" rx="4" fill="#dcfce7"/>
  <text x="100" y="319" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">KEP-2008 Beta (v1.30)</text>
  <text x="44" y="340" font-size="10.5" font-weight="700" fill="#0f172a">Kubernetes API (KEPs)</text>
  <text x="44" y="357" font-size="9.5" fill="#334155">KEP-5823 Pod：v1.38 alpha 目标</text>
  <text x="44" y="374" font-size="9.2" fill="#64748b">不含设备/跨节点；KEP-6274 开放</text>

  <rect x="260" y="298" width="216" height="88" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <rect x="268" y="306" width="128" height="18" rx="4" fill="#dbeafe"/>
  <text x="332" y="319" font-size="9.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">CRI 接口已合入 (07-22)</text>
  <text x="268" y="340" font-size="10.5" font-weight="700" fill="#0f172a">CRI 运行时边界 (#140366)</text>
  <text x="268" y="357" font-size="9.5" fill="#334155">定义 CheckpointPod / RestorePod</text>
  <text x="268" y="374" font-size="9.3" fill="#64748b">K8s(#140186)/containerd 开放；CRI-O 草稿</text>

  <rect x="484" y="298" width="216" height="88" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <rect x="492" y="306" width="120" height="18" rx="4" fill="#fef3c7"/>
  <text x="552" y="319" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">开放 RFC 与钩子提案</text>
  <text x="492" y="340" font-size="10.5" font-weight="700" fill="#0f172a">引擎-编排器协作契约</text>
  <text x="492" y="357" font-size="9.5" fill="#334155">vLLM #60422 · SGLang #44523</text>
  <text x="492" y="374" font-size="9.3" fill="#64748b">Snapshot #411 探讨文件/HTTP/Unix 信号</text>

  <rect x="708" y="298" width="216" height="88" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.1"/>
  <rect x="716" y="306" width="118" height="18" rx="4" fill="#fef3c7"/>
  <text x="775" y="319" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">OCI #962 仍未定稿</text>
  <text x="716" y="340" font-size="10.5" font-weight="700" fill="#0f172a">OCI 打包与分发边界</text>
  <text x="716" y="357" font-size="9.4" fill="#334155">Podman/checkpointctl/ctr 各自封装</text>
  <text x="716" y="374" font-size="9.3" fill="#64748b">上传仓库不代表跨驱动/GPU 可恢复</text>

  <!-- Band 3: Explicit Incompatibilities & Traps (y=406..502, h=96) -->
  <rect x="24" y="406" width="912" height="96" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="36" y="426" font-size="11.2" font-weight="700" fill="#991b1b">正文重点警示的四类“不可推演/禁用”兼容边界（独立功能存在 != 组合可投产）</text>

  <rect x="36" y="434" width="216" height="58" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="45" y="451" font-size="10.2" font-weight="700" fill="#991b1b">1. Dynamo v1.4.0 明确禁用</text>
  <text x="45" y="467" font-size="9.5" fill="#334155">GMS（外部显存）+ Snapshot</text>
  <text x="45" y="482" font-size="9.5" fill="#7f1d1d">版本文档标为禁用且不支持生产</text>

  <rect x="260" y="434" width="216" height="58" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="269" y="451" font-size="10.2" font-weight="700" fill="#991b1b">2. vLLM preload × sleep 冲突</text>
  <text x="269" y="467" font-size="9.5" fill="#334155">zero-copy 映射 daemon 显存</text>
  <text x="269" y="482" font-size="9.5" fill="#7f1d1d">与 sleep 权重卸载存在组合限制</text>

  <rect x="484" y="434" width="216" height="58" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="493" y="451" font-size="10.2" font-weight="700" fill="#991b1b">3. 版本强耦合的接入脚本</text>
  <text x="493" y="467" font-size="9.5" fill="#334155">Snapshot 的 vLLM 集成指南</text>
  <text x="493" y="482" font-size="9.5" fill="#7f1d1d">仅在 v0.27.1 验证（v0.28 不适用）</text>

  <rect x="708" y="434" width="216" height="58" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="717" y="451" font-size="10.2" font-weight="700" fill="#991b1b">4. 快照格式与进度不可混用</text>
  <text x="717" y="467" font-size="9.5" fill="#334155">GKE(gVisor) 非 CRIU 格式</text>
  <text x="717" y="482" font-size="9.5" fill="#7f1d1d">SGLang 初始化快照仍为开放 RFC</text>

  <!-- Footer -->
  <text x="24" y="522" font-size="10" fill="#64748b">阅读整理配图 · 依据 Baofa Fan / CNCF 综述与上游文档状态整理（非原文配图，不含未实测耗时对比）</text>
</svg>
