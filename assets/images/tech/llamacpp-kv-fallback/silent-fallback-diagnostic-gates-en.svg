<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" style="background:#ffffff;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a">Numerical Confounding Risk &amp; Four-Layer Silent-Fallback Gates</text>
  <text x="24" y="58" font-size="11.2" fill="#475569">Synthesized from Issue #28455 comments (@sinanezhadian, @JohannesGaessler), suggested fixes, and operational safeguards</text>
  <line x1="24" y1="70" x2="936" y2="70" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Row Left: Confounded Perplexity Table -->
  <rect x="24" y="82" width="446" height="164" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="24" y="82" width="446" height="28" rx="8" fill="#fef3c7"/>
  <rect x="24" y="100" width="446" height="10" fill="#fef3c7"/>
  <text x="36" y="101" font-size="11.2" font-weight="700" fill="#92400e">Second-Order Hazard: Confounded KV-Quant Perplexity Rankings</text>

  <rect x="36" y="118" width="204" height="84" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="46" y="136" font-size="10.2" font-weight="700" fill="#15803d">Types Kept on CUDA GPU</text>
  <text x="46" y="155" font-size="10" fill="#14532d">• q4_0 / q8_0 / f16 / bf16</text>
  <text x="46" y="173" font-size="9.8" fill="#166534">Executed via CUDA FlashAttention</text>
  <text x="46" y="191" font-size="9.8" fill="#166534">Follows CUDA accumulation order</text>

  <rect x="254" y="118" width="204" height="84" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="264" y="136" font-size="10.2" font-weight="700" fill="#be123c">Types Routed Silently to CPU</text>
  <text x="264" y="155" font-size="10" fill="#881337">• q4_1 / q5_0 / q5_1 / mixed K-V</text>
  <text x="264" y="173" font-size="9.8" fill="#9f1239">Default build executes CPU FA</text>
  <text x="264" y="191" font-size="9.8" fill="#9f1239">Different accumulation and logits</text>

  <text x="36" y="221" font-size="10" font-weight="700" fill="#78350f">Effect: Evaluators attribute a CPU-vs-CUDA backend swap to quantization loss,</text>
  <text x="36" y="238" font-size="10" fill="#92400e">while llama-bench labels both paths fa=1—misrepresenting numerical config too.</text>

  <line x1="472" y1="164" x2="494" y2="164" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Top Row Right: Controlled Experiment & Scale Context -->
  <rect x="498" y="82" width="438" height="164" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="498" y="82" width="438" height="28" rx="8" fill="#dbeafe"/>
  <rect x="498" y="100" width="438" height="10" fill="#dbeafe"/>
  <text x="510" y="101" font-size="11.2" font-weight="700" fill="#1e3a8a">Zero-Confound Control &amp; Scale Context (Comment #1)</text>

  <text x="510" y="128" font-size="10.2" font-weight="700" fill="#1d4ed8">• Controlled pair in #28455 (fixed model, RTX 4080, q5_1/q5_1):</text>
  <text x="522" y="146" font-size="9.6" fill="#1e293b">Default (197.15 t/s CPU) vs ALL_QUANTS=ON (1509.70 t/s CUDA)</text>
  <text x="510" y="165" font-size="9.8" font-weight="600" fill="#b45309">• Unexecuted check: llama-perplexity delta was proposed, not run in thread</text>

  <line x1="510" y1="178" x2="924" y2="178" stroke="#bfdbfe" stroke-width="1"/>

  <text x="510" y="198" font-size="10.2" font-weight="700" fill="#0f172a">• External scale warning (arXiv:2605.19537 across 5 engines):</text>
  <text x="522" y="216" font-size="9.6" fill="#334155">Fixed weights/hardware/decoding still shifted scores up to 16.6 pts</text>
  <text x="522" y="234" font-size="9.6" fill="#475569">(Cross-engine motivation to measure; not a prediction for llama.cpp PPL)</text>

  <!-- Section Divider Banner -->
  <rect x="24" y="256" width="912" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="36" y="272" font-size="11" font-weight="700" fill="#1e3a8a">Four-Layer Engineering Gates: Build Contract, Loud Runtime Warnings, Honest Tables, and Telemetry/CI</text>

  <!-- 4 Gate Cards (y=288..438, h=150, w=219 each) -->
  <rect x="24" y="288" width="219" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="36" y="298" width="136" height="20" rx="5" fill="#1d4ed8"/>
  <text x="104" y="312" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1. Build Contract Gate</text>
  <text x="36" y="336" font-size="10.5" font-weight="700" fill="#0f172a">Align Flags &amp; Defaults</text>
  <text x="36" y="357" font-size="9.8" fill="#334155">• Enable ALL_QUANTS=ON when</text>
  <text x="36" y="375" font-size="9.8" fill="#334155">  serving q5_x / q4_1 / mixed</text>
  <text x="36" y="393" font-size="9.8" fill="#334155">• Balance compile size vs</text>
  <text x="36" y="411" font-size="9.8" fill="#475569">  rejecting uncompiled -ctk/-ctv</text>

  <rect x="255" y="288" width="219" height="150" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="267" y="298" width="136" height="20" rx="5" fill="#b45309"/>
  <text x="335" y="312" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2. Loud Fallback Gate</text>
  <text x="267" y="336" font-size="10.5" font-weight="700" fill="#0f172a">Block Silent CPU Routing</text>
  <text x="267" y="357" font-size="9.8" fill="#334155">• Warn whenever FA with -ngl</text>
  <text x="267" y="375" font-size="9.8" fill="#334155">  lands on CPU backend</text>
  <text x="267" y="393" font-size="9.8" fill="#334155">• Log missing KV type kernel</text>
  <text x="267" y="411" font-size="9.8" fill="#475569">• Fail-fast mode for prod</text>

  <rect x="486" y="288" width="219" height="150" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.1"/>
  <rect x="498" y="298" width="136" height="20" rx="5" fill="#be123c"/>
  <text x="566" y="312" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3. Honest Eval Output</text>
  <text x="498" y="336" font-size="10.5" font-weight="700" fill="#0f172a">Stop Mislabeling fa=1</text>
  <text x="498" y="357" font-size="9.8" fill="#334155">• Print off-GPU warning inside</text>
  <text x="498" y="375" font-size="9.8" fill="#334155">  llama-bench results table</text>
  <text x="498" y="393" font-size="9.8" fill="#334155">• Do not bury under --verbose</text>
  <text x="498" y="411" font-size="9.8" fill="#475569">• Verify GPU op placement pre-PPL</text>

  <rect x="717" y="288" width="219" height="150" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.1"/>
  <rect x="729" y="298" width="136" height="20" rx="5" fill="#15803d"/>
  <text x="797" y="312" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4. Telemetry &amp; CI Gate</text>
  <text x="729" y="336" font-size="10.5" font-weight="700" fill="#0f172a">Detect &amp; Smoke-Test</text>
  <text x="729" y="357" font-size="9.8" fill="#334155">• Pair TTFT + GPU% + W + CPU%</text>
  <text x="729" y="375" font-size="9.8" fill="#334155">• Flag 0% GPU + saturated CPU</text>
  <text x="729" y="393" font-size="9.8" fill="#334155">• Run CI pp512 + device check</text>
  <text x="729" y="411" font-size="9.8" fill="#475569">  per shipped K/V flag pair</text>

  <!-- Bottom Lifecycle & Boundary Bar -->
  <rect x="24" y="448" width="912" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="34" y="456" width="128" height="20" rx="5" fill="#1e3a8a"/>
  <text x="98" y="470" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Lifecycle &amp; Scope</text>
  <text x="172" y="470" font-size="10" font-weight="700" fill="#0f172a">Issue #28455 closed 2026-09-06: maintainer confirmed "This is a known issue" while banning author under AI policy.</text>
  <text x="34" y="491" font-size="9.8" fill="#475569">Gates 1–3 reflect suggestions in #28455 and Comment #1; Gate 4 (telemetry correlation &amp; CI matrix check) is assistant operational synthesis.</text>

  <text x="24" y="519" font-size="10" fill="#64748b">Assistant diagram (not an original figure) · Based on Issue #28455 thread (@sinanezhadian, @JohannesGaessler) &amp; arXiv:2605.19537 citation scope</text>
</svg>
