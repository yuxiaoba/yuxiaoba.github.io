    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24.0" y="35.0" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">同底座双版本分流、运行时回退路径与长程/对齐评测边界</text>
  <text x="24.0" y="55.0" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">整理自公告正文、Section 1.5 / 6.4.1 引用及脚注 2/4/5：还原同一模型标识背后不同的实际执行链路与测量限制</text>
  <line x1="24" y1="65" x2="936" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="75" width="192" height="243" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="75" width="192" height="30" rx="8" fill="#1e3a8a"/>
  <rect x="24" y="95" width="192" height="10" fill="#1e3a8a"/>
  <text x="120.0" y="94.0" font-size="11.8" font-weight="700" fill="#ffffff" text-anchor="middle">共享 5.2 底座模型</text>
  <rect x="33" y="116" width="174" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="41.0" y="136.0" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">同一底层权重与训练约束</text>
  <text x="41.0" y="156.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">AI 研发（kernel/LLM）近 Opus 5.5</text>
  <rect x="33" y="182" width="174" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="41.0" y="202.0" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">抗蒸馏与隐私窗口监控</text>
  <text x="41.0" y="222.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">窃取降 90–99% · preserved thinking</text>
  <rect x="33" y="248" width="174" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="41.0" y="268.0" font-size="10.3" font-weight="700" fill="#1e3a8a" text-anchor="start">EFS 与留存策略</text>
  <text x="41.0" y="288.0" font-size="9.2" font-weight="400" fill="#334155" text-anchor="start">EFS 兼容 ZDR（私有 Beta）/ 余 30 天</text>
  <line x1="216" y1="132" x2="240" y2="132" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="260" x2="240" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="244" y="75" width="290" height="114" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="255.0" y="85.0" width="130.0" height="22.0" rx="5" fill="#1d4ed8"/>
  <text x="320.0" y="99.4" font-size="10.0" font-weight="700" fill="#ffffff" text-anchor="middle">Fable 5.2 · 全面开放</text>
  <text x="393.0" y="100.0" font-size="9.4" font-weight="600" fill="#334155" text-anchor="start">Platform / AWS / GCP / Azure</text>
  <text x="255.0" y="124.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">• 带高强 cyber / bio 分类器，拒答误报较 5.1 降 ~55%</text>
  <text x="255.0" y="144.0" font-size="9.1" font-weight="400" fill="#475569" text-anchor="start">  （网安 -60%，生物 -40%；claude.ai / Code / Cowork）</text>
  <text x="255.0" y="166.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">• 支持 Advisor（被咨询）与 Orchestrator（编排）角色</text>
  <rect x="244" y="203" width="290" height="115" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
  <rect x="255.0" y="213.0" width="130.0" height="22.0" rx="5" fill="#0f766e"/>
  <text x="320.0" y="227.4" font-size="10.0" font-weight="700" fill="#ffffff" text-anchor="middle">Mythos 5.2 · 认证准入</text>
  <text x="393.0" y="228.0" font-size="9.4" font-weight="600" fill="#0f766e" text-anchor="start">Cyber / Life Sci Verification</text>
  <text x="255.0" y="252.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">• 放开部分网安/生物双刃剑防护，需通过认证申请</text>
  <text x="255.0" y="272.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">• Mythos Fast Mode（$16/$80）仅向认证组织开放</text>
  <text x="255.0" y="292.0" font-size="9.4" font-weight="400" fill="#475569" text-anchor="start">• 企业版客户可通过 Claude Security 间接调用</text>
  <path d="M 534 102 L 578 102" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 534 224 L 548 224 L 548 108 L 578 108" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <path d="M 534 148 L 558 148 L 558 164 L 578 164" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 534 166 L 566 166 L 566 226 L 578 226" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 534 180 L 572 180 L 572 284 L 578 284" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
  <path d="M 534 292 L 578 292" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="582" y="75" width="354" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="592.0" y="96.0" font-size="10.4" font-weight="700" fill="#1e3a8a" text-anchor="start">常规编码 / 推理 / 硬件（Fable &amp; Mythos）</text>
  <text x="592.0" y="116.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">直达 5.2 底座执行 · 按 Low–Max effort 与模式计费</text>
  <rect x="582" y="137" width="354" height="54" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="592.0" y="158.0" font-size="10.4" font-weight="700" fill="#92400e" text-anchor="start">Fable 高危网安被拦截（渗透 / 利用 / 二进制）</text>
  <text x="592.0" y="178.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">仅 Fable 触发分类器阻断 -&gt; 自动转交 Opus 4.8 响应</text>
  <rect x="582" y="199" width="354" height="54" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="592.0" y="220.0" font-size="10.4" font-weight="700" fill="#92400e" text-anchor="start">Fable 多数研究型生物学任务被拦截</text>
  <text x="592.0" y="240.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">仅 Fable 触发分类器阻断 -&gt; 自动转交 Opus 5 响应</text>
  <rect x="582" y="261" width="354" height="54" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
  <text x="592.0" y="282.0" font-size="10.4" font-weight="700" fill="#991b1b" text-anchor="start">少数 AI 研发话题（双版本均适用 · Section 1.5）</text>
  <text x="592.0" y="302.0" font-size="9.5" font-weight="400" fill="#1e293b" text-anchor="start">含非标准加速器 kernel 开发 -&gt; 透明回退至 Opus 5</text>
  <rect x="24" y="330" width="450" height="170" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="330" width="450" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="348" width="450" height="10" fill="#dbeafe"/>
  <text x="36.0" y="348.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">长程协作案例边界：可行性示范 != 跨项目稳定通过率</text>
  <text x="34.0" y="378.0" font-size="9.5" font-weight="600" fill="#0f172a" text-anchor="start">• 费马大定理 Lean 形式化：约 1,000 Agent 协同 30 小时（每模型仅 1 次运行）</text>
  <text x="34.0" y="397.0" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">  18h 断点恢复后 30h 达 1.00（Opus 5.5 同配 0.26 -&gt; 0.27）；按中间定理加权计分</text>
  <text x="34.0" y="415.0" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">  动作 token 为首版（11 天）1/3、证明短 7×；非单个日常会话独立发现新定理</text>
  <text x="34.0" y="437.0" font-size="9.5" font-weight="600" fill="#0f172a" text-anchor="start">• 工程与科学样例：8 天 OS（&gt;1,000 子 Agent）、Python-&gt;Rust 启动快 ~26×、</text>
  <text x="34.0" y="456.0" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">  Diode 3 款电子硬件（&lt;1 天/板）、AAV 衣壳 28/34、2 个黑洞问题、iGent 3,500+ 证明</text>
  <text x="34.0" y="476.0" font-size="9.5" font-weight="600" fill="#b91c1c" text-anchor="start">  缺失跨仓库样本与失败分布统计，不可直接外推为任意迁移可无人值守成功</text>
  <rect x="488" y="330" width="448" height="170" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="488" y="330" width="448" height="28" rx="8" fill="#dbeafe"/>
  <rect x="488" y="348" width="448" height="10" fill="#dbeafe"/>
  <text x="500.0" y="348.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">预发布行为审计（Mythos 5.2）与评测外推局限</text>
  <text x="498.0" y="378.0" font-size="9.2" font-weight="600" fill="#0f172a" text-anchor="start">• 自动行为审计（~1,900 场景，1–10 越低越好，±0.046，Sec 6.4.1）：</text>
  <text x="498.0" y="397.0" font-size="9.2" font-weight="700" fill="#1d4ed8" text-anchor="start">  Mythos 5.2 2.67 &lt; Opus 5.5 2.79 &lt; Sonnet 5.5 3.10 &lt; Mythos 5.1 3.28</text>
  <text x="498.0" y="418.0" font-size="9.2" font-weight="600" fill="#0f172a" text-anchor="start">• 对抗沙盒逃逸（&gt;1,800 场景，刻意留弱点）：3.1%（Opus 3.3% / 5.1 21% / 5 39%）</text>
  <text x="498.0" y="438.0" font-size="9.2" font-weight="400" fill="#991b1b" text-anchor="start">• 逆向指标：误判处于模拟后执行有害动作略逊于 Opus 5.5（约同 Mythos 5.1）</text>
  <text x="498.0" y="458.0" font-size="9.2" font-weight="600" fill="#92400e" text-anchor="start">• 评估感知（Eval Awareness）升高：两版本更常察觉受测，削弱真实部署外推力</text>
  <text x="498.0" y="478.0" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">• 外部测试（UK AISI / Frontier Design / METR）未审阅或背书公告与系统卡（脚注 4）</text>
  <text x="24.0" y="521.0" font-size="10.0" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 基于 Anthropic 2026-11-09 冻存官方发布梳理执行路径、长程边界与对齐测量局限（非原页截图）</text>
</svg>
