  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24.0" y="35.0" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">Shared-Base Release Split, Runtime Fallbacks &amp; Audit Boundaries</text>
  <text x="24.0" y="55.0" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">From launch prose, Section 1.5/6.4.1 refs &amp; Footnotes 2/4/5: tracking actual execution paths and evaluation caveats</text>
  <line x1="24" y1="65" x2="936" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="75" width="192" height="243" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
