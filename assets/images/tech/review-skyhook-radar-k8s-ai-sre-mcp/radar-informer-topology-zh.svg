<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC','PingFang SC','Lato','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a">Radar 架构：Informer 本地状态图、事件去重与人机同源输出</text>
  <text x="24" y="58" font-size="11.5" font-weight="400" fill="#475569">单二进制 Go 服务通过 client-go Informer 维护实时关系图与变更时间线，UI 与 MCP 读取同一份结构化集群状态</text>
  <line x1="24" y1="69" x2="936" y2="69" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 1: Cluster Watch -->
  <rect x="24" y="80" width="216" height="332" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="80" width="216" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="100" width="216" height="10" fill="#dbeafe"/>
  <text x="36" y="100" font-size="12" font-weight="700" fill="#1e3a8a">1 · 集群监听与凭证入口</text>

  <rect x="34" y="120" width="196" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="140" font-size="11.5" font-weight="700" fill="#1d4ed8">Kubernetes API Server</text>
  <text x="44" y="160" font-size="10.5" fill="#334155">本地复用 ~/.kube/config 凭据</text>
  <text x="44" y="177" font-size="10.5" fill="#334155">集群内 Helm 部署按用户 RBAC</text>
  <text x="44" y="194" font-size="10" fill="#64748b">无需在集群内安装 Agent 或 CRD</text>

  <rect x="34" y="214" width="196" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="234" font-size="11.5" font-weight="700" fill="#1d4ed8">Shared Informers 持续监听</text>
  <text x="44" y="254" font-size="10.5" fill="#334155">Workloads / Services / Endpoints</text>
  <text x="44" y="271" font-size="10.5" fill="#334155">Ingress / Gateway / Helm 发布</text>
  <text x="44" y="288" font-size="10.5" fill="#334155">Argo CD / Flux 及自动发现 CRD</text>
  <text x="44" y="304" font-size="10" fill="#64748b">Watch 增量同步替代反复轮询</text>

  <rect x="34" y="322" width="196" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="342" font-size="11.5" font-weight="700" fill="#1d4ed8">可选扩展遥测数据源</text>
  <text x="44" y="362" font-size="10.5" fill="#334155">Prometheus 指标与 Hubble/Istio</text>
  <text x="44" y="379" font-size="10.5" fill="#334155">RabbitMQ/NATS/Vault 单 Pod 采证</text>
  <text x="44" y="394" font-size="10" fill="#64748b">显式触发，不伪装成全局健康判定</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="242" y1="162" x2="265" y2="162" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="242" y1="263" x2="265" y2="263" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="242" y1="361" x2="265" y2="361" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 2: Radar Local Core -->
  <rect x="268" y="80" width="386" height="332" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="268" y="80" width="386" height="30" rx="8" fill="#1d4ed8"/>
  <rect x="268" y="100" width="386" height="10" fill="#1d4ed8"/>
  <text x="280" y="100" font-size="12" font-weight="700" fill="#ffffff">2 · Radar 本地状态图与时间线内核（internal/k8s）</text>

  <rect x="280" y="120" width="362" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="128" width="128" height="20" rx="5" fill="#1d4ed8"/>
  <text x="354" y="142" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">拓扑与归属关联图</text>
  <text x="426" y="142" font-size="11" font-weight="600" fill="#1e3a8a">从内存 cache 实时解析关系</text>
  <text x="290" y="166" font-size="10.5" fill="#0f172a">串联 OwnerReference 与标签选择器：Deploy → RS → Pod</text>
  <text x="290" y="185" font-size="10.5" fill="#334155">同时关联 Service → EndpointSlice、配置卷与 GitOps 漂移边</text>

  <rect x="280" y="216" width="362" height="88" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="224" width="128" height="20" rx="5" fill="#1d4ed8"/>
  <text x="354" y="238" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">事件去重与 Issues 排队</text>
  <text x="426" y="238" font-size="11" font-weight="600" fill="#1e3a8a">折叠反复刷屏的 Warning 风暴</text>
  <text x="290" y="262" font-size="10.5" fill="#0f172a">把 CrashLoop、镜像拉取失败、悬空引用与卡住发布按严重度排序</text>
  <text x="290" y="281" font-size="10.5" fill="#334155">直接暴露健康判定与疑似关联资源，避免从零遍历全命名空间</text>

  <rect x="280" y="314" width="362" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="322" width="128" height="20" rx="5" fill="#1d4ed8"/>
  <text x="354" y="336" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">去噪 Diff 与持久化时间线</text>
  <text x="426" y="336" font-size="11" font-weight="600" fill="#1e3a8a">精准回答“故障前改了什么”</text>
  <text x="290" y="360" font-size="10.5" fill="#0f172a">剔除 managedFields、resourceVersion 与 last-applied 服务端噪声</text>
  <text x="290" y="379" font-size="10.5" fill="#334155">支持 memory / sqlite / postgres 落盘，突破 K8s 原生约 1h 事件 TTL</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="656" y1="176" x2="679" y2="176" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="656" y1="316" x2="679" y2="316" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3: Dual Shared Outputs -->
  <rect x="682" y="80" width="254" height="332" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="682" y="80" width="254" height="30" rx="8" fill="#dbeafe"/>
  <rect x="682" y="100" width="254" height="10" fill="#dbeafe"/>
  <text x="694" y="100" font-size="12" font-weight="700" fill="#1e3a8a">3 · 人机同源输出（端口 9280）</text>

  <rect x="692" y="120" width="234" height="114" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="702" y="140" font-size="11.5" font-weight="700" fill="#1d4ed8">Web UI（SSE 实时推送）</text>
  <text x="702" y="160" font-size="10.5" fill="#334155">ELK.js 自动布局资源与流量拓扑</text>
  <text x="702" y="178" font-size="10.5" fill="#334155">时间线 Diff 抽屉 + 资源横向对比</text>
  <text x="702" y="196" font-size="10.5" fill="#334155">内置 44 项集群安全/可靠性审计</text>
  <text x="702" y="216" font-size="10" fill="#b45309">注：--mcp-read-only 不关闭 UI 写操作</text>

  <rect x="692" y="244" width="234" height="156" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <text x="702" y="264" font-size="11.5" font-weight="700" fill="#166534">MCP Server（两类端点边界）</text>
  <text x="702" y="284" font-size="10.5" font-weight="600" fill="#0f172a">/mcp-readonly（仅只读工具）：</text>
  <text x="702" y="302" font-size="10.2" fill="#334155">issues · get_neighborhood · get_events</text>
  <text x="702" y="319" font-size="10.2" fill="#334155">get_changes · get_pod_logs · diagnose</text>
  <text x="702" y="336" font-size="10" fill="#64748b">（剔除全部写工具与集群内探针 Pod）</text>
  <text x="702" y="358" font-size="10.5" font-weight="600" fill="#991b1b">/mcp（默认同时开启）：</text>
  <text x="702" y="376" font-size="10.2" fill="#7f1d1d">另含 patch / apply / scale / exec_pod</text>
  <text x="702" y="392" font-size="10" fill="#7f1d1d">需 --mcp-read-only 才彻底返回 404</text>

  <!-- Bottom Security / Egress Strip -->
  <rect x="24" y="424" width="912" height="78" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="36" y="433" width="166" height="20" rx="5" fill="#b45309"/>
  <text x="119" y="447" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">隐私、脱敏与模型外发边界</text>
  <text x="214" y="447" font-size="11.2" font-weight="600" fill="#78350f">本地二进制不向 Skyhook 上传集群数据；Secret 读取强制省略 .data 与 .stringData</text>
  <text x="36" y="471" font-size="10.5" fill="#92400e">1) 环境变量、Helm Values 与日志按已知模式脱敏，但正则无法保证拦截所有密钥，且 opt-in exec_pod 返回原始输出</text>
  <text x="36" y="490" font-size="10.5" fill="#92400e">2) 连接远端 LLM Agent 时，Agent 经 MCP 读取的所有上下文仍发往其模型厂商；/mcp-readonly 也不自动禁用本地 shell 或其他 MCP</text>

  <text x="24" y="522" font-size="10.2" fill="#64748b">阅读整理配图 · 基于 skyhook-io/radar README 与 docs/mcp.md 架构说明绘制（非原文配图）</text>
</svg>
