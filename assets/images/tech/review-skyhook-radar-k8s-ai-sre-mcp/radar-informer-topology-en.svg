<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC','PingFang SC','Lato','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a">Radar Architecture: Informer State Cache, Dedup Timeline &amp; Dual UI/MCP Output</text>
  <text x="24" y="58" font-size="11.5" font-weight="400" fill="#475569">Single Go binary maintains one live client-go informer cache so engineers (UI) and AI agents (MCP) read identical topology and diffs</text>
  <line x1="24" y1="69" x2="936" y2="69" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 1: Cluster Watch -->
  <rect x="24" y="80" width="216" height="332" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="80" width="216" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="100" width="216" height="10" fill="#dbeafe"/>
  <text x="36" y="100" font-size="12" font-weight="700" fill="#1e3a8a">1 · Cluster Watch &amp; Auth</text>

  <rect x="34" y="120" width="196" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="140" font-size="11.5" font-weight="700" fill="#1d4ed8">Kubernetes API Server</text>
  <text x="44" y="160" font-size="10.2" fill="#334155">Uses local ~/.kube/config</text>
  <text x="44" y="177" font-size="10.2" fill="#334155">Or per-user RBAC in-cluster</text>
  <text x="44" y="194" font-size="9.8" fill="#64748b">Zero cluster agents or CRDs</text>

  <rect x="34" y="214" width="196" height="98" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="234" font-size="11.5" font-weight="700" fill="#1d4ed8">client-go Shared Informers</text>
  <text x="44" y="254" font-size="10.2" fill="#334155">Workloads, Services, Endpoints</text>
  <text x="44" y="271" font-size="10.2" fill="#334155">Ingress, Gateway, Helm releases</text>
  <text x="44" y="288" font-size="10.2" fill="#334155">Argo CD / Flux &amp; discovered CRDs</text>
  <text x="44" y="304" font-size="9.8" fill="#64748b">Streaming Watch beats ad-hoc gets</text>

  <rect x="34" y="322" width="196" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="342" font-size="11.5" font-weight="700" fill="#1d4ed8">Optional Telemetry Sources</text>
  <text x="44" y="362" font-size="10.2" fill="#334155">Prometheus, Hubble/Istio/Beyla</text>
  <text x="44" y="379" font-size="10.2" fill="#334155">Local RabbitMQ/NATS/Vault Pod</text>
  <text x="44" y="394" font-size="9.8" fill="#64748b">Explicit capture; single-Pod scope</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="242" y1="162" x2="265" y2="162" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="242" y1="263" x2="265" y2="263" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="242" y1="361" x2="265" y2="361" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 2: Radar Local Core -->
  <rect x="268" y="80" width="386" height="332" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="268" y="80" width="386" height="30" rx="8" fill="#1d4ed8"/>
  <rect x="268" y="100" width="386" height="10" fill="#1d4ed8"/>
  <text x="280" y="100" font-size="12" font-weight="700" fill="#ffffff">2 · Radar In-Memory Cache &amp; Graph Core (internal/k8s)</text>

  <rect x="280" y="120" width="362" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="128" width="140" height="20" rx="5" fill="#1d4ed8"/>
  <text x="360" y="142" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Topology &amp; Ownership</text>
  <text x="440" y="142" font-size="11" font-weight="600" fill="#1e3a8a">In-memory relationship graph</text>
  <text x="290" y="166" font-size="10.2" fill="#0f172a">Resolves OwnerReferences &amp; selectors: Deploy -&gt; RS -&gt; Pod</text>
  <text x="290" y="185" font-size="10.2" fill="#334155">Links Service -&gt; EndpointSlice, ConfigMaps &amp; GitOps drift edges</text>

  <rect x="280" y="216" width="362" height="88" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="224" width="140" height="20" rx="5" fill="#1d4ed8"/>
  <text x="360" y="238" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Dedup &amp; Ranked Issues</text>
  <text x="440" y="238" font-size="11" font-weight="600" fill="#1e3a8a">Collapses noisy Warning storms</text>
  <text x="290" y="262" font-size="10.2" fill="#0f172a">Folds CrashLoops, ImagePull failures, dangling refs &amp; stuck rollouts</text>
  <text x="290" y="281" font-size="10.2" fill="#334155">Outputs severity-ranked health status instead of raw event dumps</text>

  <rect x="280" y="314" width="362" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="290" y="322" width="140" height="20" rx="5" fill="#1d4ed8"/>
  <text x="360" y="336" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stripped Diff &amp; Timeline</text>
  <text x="440" y="336" font-size="11" font-weight="600" fill="#1e3a8a">Tracks what changed &amp; when</text>
  <text x="290" y="360" font-size="10.2" fill="#0f172a">Strips managedFields, resourceVersion &amp; last-applied server noise</text>
  <text x="290" y="379" font-size="10.2" fill="#334155">Persists in memory (default), sqlite, or postgres past K8s 1h TTL</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="656" y1="176" x2="679" y2="176" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="656" y1="316" x2="679" y2="316" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3: Dual Shared Outputs -->
  <rect x="682" y="80" width="254" height="332" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="682" y="80" width="254" height="30" rx="8" fill="#dbeafe"/>
  <rect x="682" y="100" width="254" height="10" fill="#dbeafe"/>
  <text x="694" y="100" font-size="12" font-weight="700" fill="#1e3a8a">3 · Shared Surfaces (Port 9280)</text>

  <rect x="692" y="120" width="234" height="114" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="702" y="140" font-size="11.5" font-weight="700" fill="#1d4ed8">Web UI (Live SSE Updates)</text>
  <text x="702" y="160" font-size="10.2" fill="#334155">ELK.js topology &amp; Traffic graphs</text>
  <text x="702" y="178" font-size="10.2" fill="#334155">Timeline diff drawer &amp; Compare</text>
  <text x="702" y="196" font-size="10.2" fill="#334155">44 Cluster Audit posture checks</text>
  <text x="702" y="216" font-size="9.8" fill="#b45309">Note: --mcp-read-only keeps UI writes</text>

  <rect x="692" y="244" width="234" height="156" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <text x="702" y="264" font-size="11.5" font-weight="700" fill="#166534">MCP Server (/mcp-readonly vs /mcp)</text>
  <text x="702" y="284" font-size="10.2" font-weight="600" fill="#0f172a">/mcp-readonly (read tools only):</text>
  <text x="702" y="302" font-size="10" fill="#334155">issues · get_neighborhood · get_events</text>
  <text x="702" y="319" font-size="10" fill="#334155">get_changes · get_pod_logs · diagnose</text>
  <text x="702" y="336" font-size="9.8" fill="#64748b">(Omits write tools &amp; probe Pods)</text>
  <text x="702" y="358" font-size="10.2" font-weight="600" fill="#991b1b">/mcp (also enabled by default):</text>
  <text x="702" y="376" font-size="10" fill="#7f1d1d">Adds patch, apply, scale &amp; exec_pod</text>
  <text x="702" y="392" font-size="9.8" fill="#7f1d1d">Set --mcp-read-only to return 404</text>

  <!-- Bottom Security / Egress Strip -->
  <rect x="24" y="424" width="912" height="78" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="36" y="433" width="184" height="20" rx="5" fill="#b45309"/>
  <text x="128" y="447" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Secrets &amp; Egress Boundaries</text>
  <text x="232" y="447" font-size="11.2" font-weight="600" fill="#78350f">Local binary uploads nothing to Skyhook; Secret reads never expose .data or .stringData</text>
  <text x="36" y="471" font-size="10.2" fill="#92400e">1) Env vars, Helm values &amp; logs scrub known secret patterns (incomplete by nature); opt-in exec_pod returns raw output</text>
  <text x="36" y="490" font-size="10.2" fill="#92400e">2) Connected remote LLM agents still transmit MCP payloads to their model provider; /mcp-readonly does not block agent shell/other MCPs</text>

  <text x="24" y="522" font-size="10.2" fill="#64748b">Assistant diagram synthesized from skyhook-io/radar README and docs/mcp.md (not an original figure)</text>
</svg>
