<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Lato', sans-serif;">
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="24" y="35" font-size="18" font-weight="700" fill="#0f172a">9 属性多样性指纹、24 小时找回阶梯与 Auto-Apply 门控机制</text>
  <text x="24" y="54" font-size="11" fill="#475569">把官方文档中的字段清单、时间窗规则、截断属性与 Cost-first 估算预算映射到具体事故盲区与护栏动作</text>
  <line x1="24" y1="64" x2="936" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top-Left Panel: Diversity Sampling -->
  <rect x="24" y="74" width="480" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="74" width="480" height="24" rx="8" fill="#dbeafe"/>
  <rect x="24" y="90" width="480" height="8" fill="#dbeafe"/>
  <text x="36" y="90" font-size="11.2" font-weight="700" fill="#1e3a8a">Diversity Sampling：9 个固定指纹属性与 15 分钟窗口配额</text>

  <rect x="34" y="106" width="234" height="162" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="123" font-size="10.5" font-weight="700" fill="#1d4ed8">仅扫描 Server / Consumer Span</text>
  <text x="44" y="142" font-size="9.5" fill="#1e293b">1. service.name · k8s.cluster.name</text>
  <text x="44" y="159" font-size="9.5" fill="#1e293b">2. k8s.namespace.name</text>
  <text x="44" y="176" font-size="9.5" fill="#1e293b">3. db.system.name · db.collection.name</text>
  <text x="44" y="193" font-size="9.5" fill="#1e293b">4. http.route · http.response.status_code</text>
  <text x="44" y="210" font-size="9.5" fill="#1e293b">5. rpc.method · rpc.grpc.status_code</text>
  <line x1="44" y1="222" x2="258" y2="222" stroke="#bfdbfe" stroke-width="1"/>
  <text x="44" y="240" font-size="9.2" fill="#475569">不区分 tenant / model / tool 等自定义字段</text>
  <text x="44" y="256" font-size="9.2" fill="#475569">纯客户端或内部 span 不单独建指纹</text>

  <rect x="276" y="106" width="218" height="162" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="286" y="123" font-size="10.5" font-weight="700" fill="#b45309">15 分钟窗口行为与盲区</text>
  <text x="286" y="142" font-size="9.6" fill="#78350f">• 配额：每指纹每 15 分钟至少 1 条</text>
  <text x="286" y="159" font-size="9.6" fill="#78350f">• 窗内第 2..N 条同指纹不再由其采样</text>
  <line x1="286" y1="171" x2="484" y2="171" stroke="#fde68a" stroke-width="1"/>
  <text x="286" y="189" font-size="9.5" font-weight="600" fill="#92400e">盲区① 无法刻画长尾分布</text>
  <text x="286" y="205" font-size="9.2" fill="#78350f">1 条样本不能推算 p95/p99 或偶发率</text>
  <text x="286" y="226" font-size="9.5" font-weight="600" fill="#92400e">盲区② 同指纹内故障掩蔽</text>
  <text x="286" y="242" font-size="9.2" fill="#78350f">同路由同 500 状态码若含两类内部故障</text>
  <text x="286" y="258" font-size="9.2" fill="#78350f">窗内先到者占位后，后者可能丢失</text>

  <!-- Top-Right Panel: 24h Dropped Trace Recovery -->
  <rect x="518" y="74" width="418" height="204" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="518" y="74" width="418" height="24" rx="8" fill="#dbeafe"/>
  <rect x="518" y="90" width="418" height="8" fill="#dbeafe"/>
  <text x="530" y="90" font-size="11.2" font-weight="700" fill="#1e3a8a">24 小时丢弃 Trace 找回机制与属性标记</text>

  <rect x="528" y="106" width="398" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="538" y="124" font-size="10.2" font-weight="700" fill="#0f172a">阶段 1（0–24h，全租户自动生效）· 仅支持按 Trace ID 精确查询</text>
  <text x="538" y="141" font-size="9.5" fill="#475569">前提：日志、Exemplar 或工单必须保留 trace_id；过 24 小时未查则永久销毁</text>

  <rect x="528" y="158" width="398" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="538" y="175" font-size="10.2" font-weight="700" fill="#1d4ed8">阶段 2（首次命中即转存 Tempo）· 为每个 Span 注入恢复标记</text>
  <text x="538" y="193" font-size="9.4" fill="#1e293b">• grafana.adaptivetraces.restored = true（区分原始采样与事后恢复）</text>
  <text x="538" y="210" font-size="9.4" fill="#1e293b">• 超大 Trace 另附 truncated=true 及 truncated_percentage（文档示例 93.93%）</text>

  <rect x="528" y="226" width="398" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="538" y="243" font-size="10.2" font-weight="700" fill="#991b1b">搜索限制：恢复后 TraceQL 检索仅“尽力提供”，无条件扫错仍须靠摄入采样</text>
  <text x="538" y="259" font-size="9.3" fill="#7f1d1d">若多轮 Agent 调用链过长发生大比例截断，下游工具或报错 Span 仍可能残缺</text>

  <!-- Bottom-Left Panel: Auto-Apply Gate -->
  <rect x="24" y="288" width="448" height="188" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="288" width="448" height="24" rx="8" fill="#1e3a8a"/>
  <rect x="24" y="304" width="448" height="8" fill="#1e3a8a"/>
  <text x="36" y="304" font-size="11.2" font-weight="700" fill="#ffffff">Adaptive Metrics Auto-Apply：门控模式与规则优先级</text>

  <rect x="34" y="320" width="208" height="92" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="338" font-size="10.3" font-weight="700" fill="#1d4ed8">unbounded（Coverage-first）</text>
  <text x="44" y="356" font-size="9.4" fill="#1e293b">• 省略 gate/policy 时的默认值</text>
  <text x="44" y="373" font-size="9.4" fill="#334155">• 自动应用全部建议，含新增序列</text>
  <text x="44" y="390" font-size="9.4" fill="#334155">• 新看板/查询需要细分时自动放行</text>
  <text x="44" y="405" font-size="9.1" fill="#475569">优先适配观测需求，不限制序列增长</text>

  <rect x="252" y="320" width="210" height="92" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="262" y="338" font-size="10.3" font-weight="700" fill="#166534">no-increase（Cost-first）</text>
  <text x="262" y="356" font-size="9.4" fill="#1e293b">• 先执行预计降低序列数的建议</text>
  <text x="262" y="373" font-size="9.4" fill="#334155">• 将省出的额度作当轮增额预算</text>
  <text x="262" y="390" font-size="9.4" fill="#334155">• 超预算的扩增建议保留待手动审</text>
  <text x="262" y="405" font-size="9.1" fill="#166534">须显式配置，不能靠默认选项触发</text>

  <rect x="34" y="420" width="428" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="44" y="438" font-size="9.7" font-weight="700" fill="#92400e">重要警示：Cost-first 依据“上轮分析估算值”，不会在变更前后实时比对活跃序列数</text>
  <text x="44" y="456" font-size="9.3" fill="#78350f">且 Auto-Apply 可替换/删除精确匹配聚合规则（不动前后缀/Drop 规则）—务必先设 Exemptions</text>

  <!-- Bottom-Right Panel: SRE & Agent Guardrails -->
  <rect x="486" y="288" width="450" height="188" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="486" y="288" width="450" height="24" rx="8" fill="#1e3a8a"/>
  <rect x="486" y="304" width="450" height="8" fill="#1e3a8a"/>
  <text x="498" y="304" font-size="11.2" font-weight="700" fill="#ffffff">面向异常检测与 Agent 诊断的工程护栏清单</text>

  <rect x="496" y="320" width="430" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="340" font-size="9.8" fill="#0f172a">1. Volumetric 按字节目标每 ~15s 调率：勿拿采样后 Trace 计数当请求量或基线</text>

  <rect x="496" y="357" width="430" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="377" font-size="9.8" fill="#0f172a">2. 记录采样策略版本号与变更时间戳：防止异常检测把采样调整误判为负载突增</text>

  <rect x="496" y="394" width="430" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="414" font-size="9.8" fill="#0f172a">3. 日志与报错结构化打点 trace_id：激活 24h 找回通道，并用标准故障集回测截断</text>

  <rect x="496" y="431" width="430" height="35" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="506" y="447" font-size="9.6" font-weight="600" fill="#1e3a8a">4. 将低频审计/SLO 维度与精确规则先纳入 Metric 豁免；把待上线的 Replay</text>
  <text x="506" y="460" font-size="9.3" fill="#1e40af">   与已可用的 24h ID 查询、在线 TraceQL 检索明确区分并计入 MTTR 预算</text>

  <!-- Bottom Banner -->
  <rect x="24" y="482" width="912" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="36" y="500" font-size="10.2" font-weight="600" fill="#1e3a8a">证据口径提醒：“信息密度提升约 25%”与“减少 90% 体积”均缺完整工作负载与度量定义，上线验收须以自建故障回归集实测为准</text>

  <text x="24" y="527" font-size="10" fill="#64748b">阅读整理配图（非原图）· 细化 Diversity 9 属性、Dropped Trace 属性、Auto-Apply 门控源码字段及助手推导的诊断盲区防护</text>
</svg>
