<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Lato','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a">PagerDuty SRE Agent: First-Pass AI Incident Triage Architecture</text>
  <text x="24" y="57" font-size="11" fill="#475569">From PagerDuty Engineering (2026-07-21): correlate quality &amp; infra signals via Connectors &amp; Skills before gated edits</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Signal Correlation -->
  <rect x="24" y="78" width="282" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="34" y="86" width="124" height="20" rx="5" fill="#b45309"/>
  <text x="96" y="100" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">LLM-Judge Signal</text>
  <text x="166" y="100" font-size="11" font-weight="600" fill="#78350f">Arize Breach</text>
  <text x="34" y="121" font-size="10.2" fill="#92400e">"Might be broken" (small-sample noise)</text>
  <text x="34" y="137" font-size="10" fill="#78350f">Case: Insights Agent tool-selection drop</text>

  <text x="314" y="116" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">+</text>

  <rect x="322" y="78" width="274" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="332" y="86" width="118" height="20" rx="5" fill="#1d4ed8"/>
  <text x="391" y="100" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">Infra / Upstream</text>
  <text x="458" y="100" font-size="11" font-weight="600" fill="#1e3a8a">Traditional APM</text>
  <text x="332" y="121" font-size="10.2" fill="#1e40af">Verify if upstream outage caused AI errors</text>
  <text x="332" y="137" font-size="10" fill="#1e3a8a">Separate AI drift from service failure</text>

  <line x1="598" y1="112" x2="619" y2="112" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="622" y="78" width="314" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="632" y="86" width="118" height="20" rx="5" fill="#1e3a8a"/>
  <text x="691" y="100" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">PagerDuty Hub</text>
  <text x="758" y="100" font-size="11" font-weight="700" fill="#0f172a">Triggers SRE Agent</text>
  <text x="632" y="121" font-size="10.2" fill="#1e3a8a">Classify: escalate / pre-approved fix / ticket</text>
  <text x="632" y="137" font-size="10" fill="#1e40af">Avoid 2 a.m. wake-ups for non-urgent drift</text>

  <line x1="779" y1="146" x2="779" y2="153" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="166" y1="153" x2="779" y2="153" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="166" y1="153" x2="166" y2="162" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Three Execution Stages -->
  <!-- Column 1 -->
  <rect x="24" y="164" width="284" height="218" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="164" width="284" height="32" rx="8" fill="#dbeafe"/>
  <rect x="24" y="186" width="284" height="10" fill="#dbeafe"/>
  <text x="36" y="185" font-size="12" font-weight="700" fill="#1e3a8a">1. Connector Evidence Gathering</text>

  <rect x="34" y="206" width="264" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="225" font-size="11.5" font-weight="700" fill="#1d4ed8">Arize Observability Connector</text>
  <text x="44" y="244" font-size="10.2" fill="#334155">Check whether monitor recovered live</text>
  <text x="44" y="261" font-size="10.2" fill="#334155">Filter traces: LLM, tool, retrieval, output</text>
  <text x="44" y="278" font-size="10" fill="#475569">Read judge eval explanations &amp; scores</text>

  <rect x="34" y="296" width="264" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="315" font-size="11.5" font-weight="700" fill="#1d4ed8">GitHub Code &amp; Docs Connector</text>
  <text x="44" y="335" font-size="10.2" fill="#334155">Inspect recent commits &amp; config diffs</text>
  <text x="44" y="355" font-size="10.2" fill="#334155">Locate system prompts &amp; tool schemas</text>

  <line x1="310" y1="273" x2="334" y2="273" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 2 -->
  <rect x="337" y="164" width="284" height="218" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="337" y="164" width="284" height="32" rx="8" fill="#dbeafe"/>
  <rect x="337" y="186" width="284" height="10" fill="#dbeafe"/>
  <text x="349" y="185" font-size="12" font-weight="700" fill="#1e3a8a">2. Runbook-Encoded Skill Triage</text>

  <rect x="347" y="206" width="264" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="357" y="225" font-size="11.5" font-weight="700" fill="#1d4ed8">create-pagerduty-skill Runbook</text>
  <text x="357" y="244" font-size="10.2" fill="#334155">4-step SOP: status → filter traces</text>
  <text x="357" y="261" font-size="10.2" fill="#334155">→ cluster eval explanations → diffs</text>
  <text x="357" y="278" font-size="10" fill="#475569">Encodes human triage playbooks directly</text>

  <rect x="347" y="296" width="264" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="357" y="315" font-size="11.5" font-weight="700" fill="#1e3a8a">Insights Agent Triage Rundown</text>
  <text x="357" y="335" font-size="10.2" fill="#0f172a">Finds genuine, minor tool-selection drop</text>
  <text x="357" y="355" font-size="10.2" fill="#1e40af">Recommends closing + ranked follow-ups</text>

  <line x1="623" y1="273" x2="647" y2="273" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3 -->
  <rect x="650" y="164" width="286" height="218" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="650" y="164" width="286" height="32" rx="8" fill="#dbeafe"/>
  <rect x="650" y="186" width="286" height="10" fill="#dbeafe"/>
  <text x="662" y="185" font-size="12" font-weight="700" fill="#1e3a8a">3. Scoped Suggestions &amp; Replay Gate</text>

  <rect x="660" y="206" width="266" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="225" font-size="11.5" font-weight="700" fill="#1d4ed8">Custom Code-Suggestion Skill</text>
  <text x="670" y="244" font-size="10.2" fill="#334155">Confines edits inside team boundaries</text>
  <text x="670" y="261" font-size="10.2" fill="#334155">Proposes system-prompt adjustments</text>
  <text x="670" y="278" font-size="10" fill="#475569">Extra engineering data point, not live</text>

  <rect x="660" y="296" width="266" height="76" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="670" y="315" font-size="11.5" font-weight="700" fill="#166534">Replay &amp; Regression Gate</text>
  <text x="670" y="335" font-size="10.2" fill="#14532d">Replay against failing traces + regress test</text>
  <text x="670" y="355" font-size="10.2" fill="#14532d">Feeds improvement strategy post-review</text>

  <!-- Row 3: Boundary & Feedback -->
  <rect x="24" y="398" width="912" height="96" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="36" y="408" width="152" height="22" rx="5" fill="#1e3a8a"/>
  <text x="112" y="423" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Loop &amp; Scope Boundary</text>
  <text x="198" y="423" font-size="11.5" font-weight="700" fill="#0f172a">Triage learnings refine skills &amp; evals, while current scope stays First-Pass Assisted Triage</text>
  <text x="36" y="450" font-size="10.5" fill="#334155">1) Control split: read-only Connectors + SOP Skills stay separate from scoped Code-Suggestion Skill; prompt edits require trace replay.</text>
  <text x="36" y="472" font-size="10.5" fill="#475569">2) Evidence limit: demonstrates internal Insights Agent &amp; demo clips without controlled studies, MTTR deltas, or precision benchmarks.</text>

  <text x="24" y="516" font-size="10.2" fill="#64748b">Assistant diagram (not an original figure) synthesized from PagerDuty Engineering (2026-07-21), "How the SRE Agent Triages AI Incidents"</text>
</svg>
