<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="37" font-size="18" font-weight="700" fill="#0f172a">OpenRouter 双层模型路由与跨轮状态控制管线</text>
  <text x="24" y="56" font-size="11" fill="#475569">依据 Brian Thomas (2026-11-06) 官方架构：先裁剪合规候选池并联合决策模型与推理强度，再交由底层 Provider Router 落地服务</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Stage 1 -->
  <rect x="24" y="78" width="210" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="78" width="210" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="98" width="210" height="10" fill="#dbeafe"/>
  <text x="34" y="97" font-size="11.5" font-weight="700" fill="#1e3a8a">1 · 治理与候选池过滤</text>
  <text x="34" y="126" font-size="10.5" font-weight="600" fill="#0f172a">600+ 全目录模型进入候补</text>
  <text x="34" y="144" font-size="10" fill="#475569">按以下硬性策略缩窄子集：</text>
  <text x="34" y="164" font-size="10" fill="#334155">• Guardrails 与 ZDR 零留存</text>
  <text x="34" y="181" font-size="10" fill="#334155">• 模型能力 / 提供商限制 / BYOK</text>
  <text x="34" y="198" font-size="10" fill="#334155">• allowed / excluded_models</text>
  <text x="34" y="215" font-size="10" fill="#334155">• cost_tier (low 至 max)</text>
  <rect x="32" y="228" width="194" height="22" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="129" y="243" font-size="9.8" font-weight="600" fill="#991b1b" text-anchor="middle">交集为空直接 404，不越权回退</text>

  <line x1="236" y1="168" x2="250" y2="168" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="252" y="78" width="218" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="252" y="78" width="218" height="30" rx="8" fill="#dbeafe"/>
  <rect x="252" y="98" width="218" height="10" fill="#dbeafe"/>
  <text x="262" y="97" font-size="11.5" font-weight="700" fill="#1e3a8a">2 · 快速决策模型（单次调用）</text>
  <text x="262" y="126" font-size="10.5" font-weight="600" fill="#0f172a">单次前向评估 11 项请求特征</text>
  <text x="262" y="144" font-size="10" font-weight="600" fill="#1d4ed8">路由步骤 p90：1.96s → 0.65s</text>
  <text x="262" y="164" font-size="10" fill="#334155">• 任务类型与任务切换概率</text>
  <text x="262" y="181" font-size="10" fill="#334155">• 难度(1-5) / 精度 / 速度偏好</text>
  <text x="262" y="198" font-size="10" fill="#334155">• 视觉输入与代码库集成需求</text>
  <text x="262" y="215" font-size="10" fill="#334155">• 大模型收益 / 多思考 / 降本空间</text>
  <rect x="260" y="228" width="202" height="22" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="361" y="243" font-size="9.8" font-weight="600" fill="#1e3a8a" text-anchor="middle">面板可见分析项，内部权重未公开</text>

  <line x1="472" y1="168" x2="486" y2="168" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="488" y="78" width="228" height="180" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="488" y="78" width="228" height="30" rx="8" fill="#1d4ed8"/>
  <rect x="488" y="98" width="228" height="10" fill="#1d4ed8"/>
  <text x="498" y="97" font-size="11.5" font-weight="700" fill="#ffffff">3 · 有状态策略：模型 + 推理强度</text>
  <text x="498" y="126" font-size="10" font-weight="600" fill="#0f172a">权衡 11 特征、实时价格、基准与缓存</text>
  <rect x="496" y="135" width="212" height="44" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="504" y="152" font-size="10" font-weight="700" fill="#166534">优先调 reasoning effort（护缓存）</text>
  <text x="504" y="169" font-size="9.8" fill="#14532d">Beta 期近九成 Agent 轮次保留原模型</text>
  <rect x="496" y="184" width="212" height="39" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="504" y="200" font-size="10" font-weight="700" fill="#92400e">预期收益 &gt; 缓存重建损失才切换</text>
  <text x="504" y="216" font-size="9.8" fill="#78350f">连续报错/测试失败 → 提高切换概率</text>
  <rect x="496" y="228" width="212" height="22" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="602" y="243" font-size="9.8" font-weight="600" fill="#1e3a8a" text-anchor="middle">Auto Code 进高阶编码池并严惩失败</text>

  <line x1="718" y1="168" x2="732" y2="168" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="734" y="78" width="202" height="180" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="734" y="78" width="202" height="30" rx="8" fill="#dbeafe"/>
  <rect x="734" y="98" width="202" height="10" fill="#dbeafe"/>
  <text x="744" y="97" font-size="11.5" font-weight="700" fill="#1e3a8a">4 · 底层提供商路由（Serving）</text>
  <text x="744" y="126" font-size="10.5" font-weight="600" fill="#0f172a">分离“谁来推理”与“哪里服务”</text>
  <text x="744" y="145" font-size="10" fill="#334155">评估各端点正常率、TTFT、</text>
  <text x="744" y="161" font-size="10" fill="#334155">吞吐、价格与提示缓存位置</text>
  <text x="744" y="181" font-size="10" fill="#334155">• 默认开启缓存粘性亲和</text>
  <text x="744" y="198" font-size="10" fill="#334155">• allow_fallbacks 管故障切换</text>
  <text x="744" y="215" font-size="10" fill="#334155">• provider.order 优先于粘性</text>
  <rect x="742" y="228" width="186" height="22" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="835" y="243" font-size="9.8" font-weight="600" fill="#92400e" text-anchor="middle">跨提供商故障切换会丢失缓存</text>

  <!-- Stage 5 Carryover Feedback Loop -->
  <line x1="835" y1="258" x2="835" y2="274" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="602" y1="276" x2="602" y2="260" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="24" y="276" width="912" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="36" y="286" width="188" height="22" rx="5" fill="#1d4ed8"/>
  <text x="130" y="301" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5 · 跨轮状态回传与可观测闭环</text>
  <text x="234" y="301" font-size="11" font-weight="700" fill="#1e3a8a">将“当前模型是否陷入挣扎（连续报错 / 改后测试未过）”与“各节点缓存状态”带入下一轮决策</text>
  <text x="36" y="325" font-size="10.2" fill="#334155">• API 响应通过 model 字段写明实际服务模型；按所选模型标准价格计费（路由器本身不加价）</text>
  <text x="36" y="343" font-size="10.2" fill="#1e40af">• Chatroom 展示 Routing insights，模型页公开难度分布；API 头 X-OpenRouter-Metadata: enabled 可回传候选与回退明细</text>

  <!-- Bottom Row: 3 Router Channels -->
  <rect x="24" y="366" width="294" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="36" y="378" width="136" height="22" rx="5" fill="#dbeafe"/>
  <text x="104" y="393" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">openrouter/auto</text>
  <text x="182" y="393" font-size="11.5" font-weight="700" fill="#0f172a">通用旗舰路由器</text>
  <text x="36" y="420" font-size="10.2" fill="#334155">面向混合任务与通用 Agent，默认高性价比层级；</text>
  <text x="36" y="438" font-size="10.2" fill="#334155">回调价格至数月前区间，扩大高性能模型覆盖</text>
  <text x="36" y="460" font-size="10" fill="#475569">• 保留旧版极低价漂移行为：</text>
  <text x="36" y="478" font-size="10" font-weight="600" fill="#1d4ed8">在 auto-router 插件设置 cost_tier: "low"</text>

  <rect x="333" y="366" width="294" height="134" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="345" y="378" width="160" height="22" rx="5" fill="#1d4ed8"/>
  <text x="425" y="393" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">openrouter/auto-code</text>
  <text x="515" y="393" font-size="11.5" font-weight="700" fill="#0f172a">编码 Harness 专用</text>
  <text x="345" y="420" font-size="10.2" fill="#334155">共用同一决策引擎，起始进入更高编码模型层级；</text>
  <text x="345" y="438" font-size="10.2" fill="#334155">更重响应速度、通过率与单任务解决成本</text>
  <text x="345" y="460" font-size="10" fill="#475569">• 对可明确判定失败的工作更严厉惩罚并加速改道</text>
  <text x="345" y="478" font-size="10" font-weight="600" fill="#1d4ed8">• 使用专用编码层级（区别于通用 cost_tier）</text>

  <rect x="642" y="366" width="294" height="134" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="654" y="378" width="160" height="22" rx="5" fill="#e0f2fe"/>
  <text x="734" y="393" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">openrouter/auto-beta</text>
  <text x="824" y="393" font-size="11.5" font-weight="700" fill="#0f172a">预发布验证通道</text>
  <text x="654" y="420" font-size="10.2" fill="#334155">新策略优先发布至 auto-beta，经生产检验后</text>
  <text x="654" y="438" font-size="10.2" fill="#334155">合入 openrouter/auto（曾联同 jev-router 实测）</text>
  <text x="654" y="460" font-size="10" fill="#475569">• 测试全程遵循零数据留存（ZDR）约束</text>
  <text x="654" y="478" font-size="10" font-weight="600" fill="#0369a1">• 插件配置须使用 id: "auto-beta-router"</text>

  <text x="24" y="521" font-size="10" fill="#64748b">阅读整理配图（非原文配图）· 依据 OpenRouter (2026-11-06) 官方博文与路由文档整理；未公开的决策模型参数与打分权重未作推演补全</text>
</svg>
