<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="37" font-size="18" font-weight="700" fill="#0f172a">Pareto 权衡坐标、状态切换经济学与公开证据边界</text>
  <text x="24" y="56" font-size="11" fill="#475569">对照 OpenRouter 公告披露口径、缺失的五项基准原始热力图，以及同日失败预测论文（arXiv:2611.08285）的评测要求</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top-Left Card: Pareto Conceptual Curve -->
  <rect x="24" y="78" width="444" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="34" y="88" width="154" height="20" rx="5" fill="#1d4ed8"/>
  <text x="111" y="102" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">成本–质量 Pareto 权衡示意</text>
  <text x="196" y="102" font-size="10.5" font-weight="700" fill="#0f172a">为何路由器并非全曲线最优</text>

  <!-- Chart axes -->
  <line x1="84" y1="244" x2="434" y2="244" stroke="#64748b" stroke-width="1.2"/>
  <line x1="84" y1="244" x2="84" y2="118" stroke="#64748b" stroke-width="1.2"/>
  <text x="74" y="128" font-size="9.5" fill="#475569" text-anchor="end">高质量</text>
  <text x="74" y="242" font-size="9.5" fill="#475569" text-anchor="end">低</text>
  <text x="58" y="185" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">任务通过率</text>
  <text x="259" y="261" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">单任务总成本（含前缀重建与重试消耗）→</text>

  <!-- Single-model frontier -->
  <path d="M 108 224 Q 160 184 212 168 T 388 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="108" cy="224" r="4.5" fill="#64748b"/>
  <text x="116" y="233" font-size="9.5" fill="#475569">低价单模型</text>

  <circle cx="212" cy="168" r="4.5" fill="#64748b"/>
  <text x="202" y="164" font-size="9.5" fill="#475569" text-anchor="end">中档单模型</text>

  <circle cx="388" cy="134" r="5" fill="#0f172a"/>
  <text x="378" y="126" font-size="9.8" font-weight="700" fill="#0f172a" text-anchor="end">最佳前沿单模型（如 Opus 5.5）</text>

  <!-- Routers -->
  <circle cx="126" cy="206" r="4.5" fill="#d97706"/>
  <text x="135" y="210" font-size="9.5" font-weight="600" fill="#92400e">旧版 Auto（低价漂移）</text>

  <circle cx="198" cy="184" r="5" fill="#2563eb"/>
  <text x="207" y="188" font-size="9.8" font-weight="700" fill="#1d4ed8">新版 Auto（默认档；可选 low）</text>

  <circle cx="246" cy="144" r="5.5" fill="#1d4ed8" stroke="#bfdbfe" stroke-width="2"/>
  <text x="256" y="149" font-size="9.6" font-weight="700" fill="#1e3a8a">Auto Code（近 Opus 5.5 / 降本 74%*）</text>

  <text x="434" y="278" font-size="9.5" fill="#64748b" text-anchor="end">注：示意坐标非原始散点；固定负载下已验证的单模型仍可能更优</text>

  <!-- Bottom-Left Card: Cache vs Effort Switch Trade-off -->
  <rect x="24" y="302" width="444" height="198" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="324" font-size="12" font-weight="700" fill="#0f172a">多轮状态权衡：先调推理强度 vs. 切换模型</text>

  <rect x="36" y="336" width="420" height="72" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.1"/>
  <text x="48" y="354" font-size="10.5" font-weight="700" fill="#166534">路径 A · 留驻当前模型并微调 reasoning effort（Beta 期 ~90% 轮次）</text>
  <text x="48" y="373" font-size="10" fill="#14532d">• 保留上游 KV 前缀缓存（避免全量缓存写/重算与首字延迟脉冲），工具格式连续</text>
  <text x="48" y="391" font-size="10" fill="#166534">• 边界提醒：更高 effort 并非单调收益，高档推理费用亦可能陡增</text>

  <rect x="36" y="416" width="420" height="72" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="48" y="434" font-size="10.5" font-weight="700" fill="#92400e">路径 B · 切换新模型或发生跨提供商故障回退（付出状态重建代价）</text>
  <text x="48" y="453" font-size="10" fill="#78350f">• 主动切换：仅当连续报错或改后测试持续失败、预期收益超越缓存重建才触发</text>
  <text x="48" y="471" font-size="10" fill="#92400e">• 隐蔽失效：allow_fallbacks: true 跨提供商兜底保活时，同样会丢失热缓存</text>

  <!-- Top-Right Card: Disclosed Evidence vs Missing Data -->
  <rect x="484" y="78" width="452" height="254" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="498" y="100" font-size="12" font-weight="700" fill="#0f172a">公开指标口径与冻存快照缺失边界（2026-11-06）</text>

  <rect x="496" y="112" width="428" height="64" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="506" y="130" font-size="10.2" font-weight="700" fill="#1e3a8a">已核对原文范围 · 路由延迟与 Beta 汇总观测</text>
  <text x="506" y="148" font-size="9.8" fill="#1e40af">• 路由步骤 p90 1.96s → 0.65s（3× 仅指路由决策，非整段 Agent 任务提速 3 倍）</text>
  <text x="506" y="165" font-size="9.8" fill="#1e40af">• 相比旧路由：无效工具调用降 4×、截断响应减半（无任务级原始样本/置信区间）</text>

  <rect x="496" y="184" width="428" height="84" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="506" y="202" font-size="10.2" font-weight="700" fill="#92400e">缺失热力图原件 · 五项基准声明需留白核验</text>
  <text x="506" y="220" font-size="9.8" fill="#78350f">• 正文称 5 项基准上 Auto Code 成绩比肩 Claude Opus 5.5 且任务费用低 74%</text>
  <text x="506" y="237" font-size="9.8" fill="#78350f">• HTML alt 写出基准名：Deep SWE, SWE-Atlas QA, Terminal Bench 4.0, τ³-bench, MMMU Pro</text>
  <text x="506" y="254" font-size="9.8" fill="#92400e">• 冻存快照仅保留 official.png 面板图，缺失热力图逐项得分、任务数与 Opus 5.5 档位口径</text>

  <rect x="496" y="276" width="428" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="506" y="294" font-size="10" font-weight="700" fill="#334155">未公开实现 · 11 特征策略权重、决策小模型架构与训练配方未披露</text>
  <text x="506" y="310" font-size="9.5" fill="#475569">Router Index（质量 60% / 速度 20% / 成本 20%）及聊天占比截图均随配置与流量变动</text>

  <!-- Bottom-Right Card: Failure Prediction Paper Cross-Check -->
  <rect x="484" y="342" width="452" height="158" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="498" y="364" font-size="12" font-weight="700" fill="#0f172a">同日失败预测论文（arXiv:2611.08285）的方法论对照</text>
  <text x="498" y="384" font-size="10" fill="#334155">• Shi &amp; Assunção 分析 SWE-bench Verified 3,492 条轨迹：总 AUROC 易被“难题识别”主导</text>
  <text x="498" y="402" font-size="10" fill="#334155">• 522 题重复试验中，事后 Oracle 比最佳单模型高 +10 pp，但按半程选模型仅增 +0.09 pp</text>
  <text x="498" y="420" font-size="10" fill="#334155">• 同模型自身运行方差占 42%（不可将“事后挑赢家”等同于在线路由增益）</text>

  <rect x="496" y="434" width="428" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="506" y="453" font-size="10.2" font-weight="700" fill="#1e3a8a">AgentOps 路由验收标准（注：OpenRouter 生产策略非该论文被测预测器）</text>
  <text x="506" y="472" font-size="9.8" fill="#1e40af">在等尝试预算与未见任务上对照“原模型重试 vs. 升 effort vs. 换模型”，核验端到端耗时与总账单</text>

  <text x="24" y="521" font-size="10" fill="#64748b">阅读整理配图（非原文配图）· 区分 OpenRouter 原文实测、HTML alt 披露与冻存缺失项，并结合 arXiv:2611.08285 标定路由评测边界</text>
</svg>
