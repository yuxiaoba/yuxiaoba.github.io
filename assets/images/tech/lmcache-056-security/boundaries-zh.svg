<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3676b8"/></marker></defs><rect width="900" height="600" fill="white"/><g font-family="Noto Sans CJK SC,Noto Serif CJK SC,Arial,sans-serif" fill="#212529"><text x="30" y="42" font-size="25" font-weight="600">LMCache：分别检查数据面和管理面</text><rect x="30" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="150.0" y="173" text-anchor="middle" font-size="24">工作进程</text><text x="150.0" y="207" text-anchor="middle" font-size="17" fill="#526779">数据面</text><rect x="330" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="450.0" y="173" text-anchor="middle" font-size="24">IPC 描述符</text><text x="450.0" y="207" text-anchor="middle" font-size="17" fill="#526779">数据格式与解码</text><rect x="630" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="750.0" y="173" text-anchor="middle" font-size="24">MP 服务</text><text x="750.0" y="207" text-anchor="middle" font-size="17" fill="#526779">缓存与资源生命周期</text><rect x="30" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="150.0" y="408" text-anchor="middle" font-size="24">运维客户端</text><text x="150.0" y="442" text-anchor="middle" font-size="17" fill="#526779">管理面</text><rect x="330" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="450.0" y="408" text-anchor="middle" font-size="24">管理 HTTP</text><text x="450.0" y="442" text-anchor="middle" font-size="17" fill="#526779">默认绑定 localhost</text><rect x="630" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="750.0" y="408" text-anchor="middle" font-size="24">管理动作</text><text x="750.0" y="442" text-anchor="middle" font-size="17" fill="#526779">脚本入口默认关闭</text><path d="M270 182 L325 182" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 182 L625 182" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M270 417 L325 417" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 417 L625 417" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="95" font-size="18" fill="#596775">输入可信度、网络可达性与身份验证是不同问题</text><text x="30" y="300" font-size="18" fill="#596775">生命周期：创建 → 使用 → 超时／退出 → 清理</text><text x="30" y="555" font-size="18" fill="#596775">阅读整理 · 边界示意，不是完整实现架构</text></g></svg>