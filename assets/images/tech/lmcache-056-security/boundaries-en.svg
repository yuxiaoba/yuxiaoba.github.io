<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3676b8"/></marker></defs><rect width="900" height="600" fill="white"/><g font-family="Noto Sans CJK SC,Noto Serif CJK SC,Arial,sans-serif" fill="#212529"><text x="30" y="42" font-size="25" font-weight="600">LMCache: inspect data and management separately</text><rect x="30" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="150.0" y="173" text-anchor="middle" font-size="24">Worker process</text><text x="150.0" y="207" text-anchor="middle" font-size="17" fill="#526779">Data plane</text><rect x="330" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="450.0" y="173" text-anchor="middle" font-size="24">IPC descriptor</text><text x="450.0" y="207" text-anchor="middle" font-size="17" fill="#526779">Format and decoding</text><rect x="630" y="130" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="750.0" y="173" text-anchor="middle" font-size="24">MP service</text><text x="750.0" y="207" text-anchor="middle" font-size="17" fill="#526779">Cache and resource lifetime</text><rect x="30" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="150.0" y="408" text-anchor="middle" font-size="24">Operator client</text><text x="150.0" y="442" text-anchor="middle" font-size="17" fill="#526779">Management plane</text><rect x="330" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="450.0" y="408" text-anchor="middle" font-size="24">Admin HTTP</text><text x="450.0" y="442" text-anchor="middle" font-size="17" fill="#526779">localhost by default</text><rect x="630" y="365" width="240" height="105" rx="10" fill="#edf4fc" stroke="#b8cfe5"/><text x="750.0" y="408" text-anchor="middle" font-size="24">Admin actions</text><text x="750.0" y="442" text-anchor="middle" font-size="17" fill="#526779">Script endpoint disabled by default</text><path d="M270 182 L325 182" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 182 L625 182" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M270 417 L325 417" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 417 L625 417" fill="none" stroke="#3676b8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="95" font-size="18" fill="#596775">Input trust, network reachability, and authentication differ</text><text x="30" y="300" font-size="18" fill="#596775">Lifecycle: create → use → timeout / exit → cleanup</text><text x="30" y="555" font-size="18" fill="#596775">Editorial diagram · boundaries, not the complete implementation</text></g></svg>