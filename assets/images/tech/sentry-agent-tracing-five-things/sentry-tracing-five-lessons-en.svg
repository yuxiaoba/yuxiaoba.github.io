<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" style="background:#ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="37" font-size="18" font-weight="700" fill="#0f172a">Five Workflows with Sentry Agent Tracing: Telemetry Spine, Recipes &amp; Boundaries</text>
  <text x="24" y="57" font-size="11" fill="#475569">Synthesizing the X article &amp; 4 Sentry Cookbooks: shared span capture feeding evals, daily triage, cost attribution &amp; alerts</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Shared Telemetry Spine -->
  <rect x="24" y="76" width="420" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="34" y="84" width="128" height="20" rx="5" fill="#1d4ed8"/>
  <text x="98" y="98" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Path A · Sentry SDK</text>
  <text x="170" y="98" font-size="10.8" font-weight="700" fill="#1e3a8a">@sentry/nextjs v11+ / Vercel AI SDK</text>
  <text x="34" y="121" font-size="9.8" fill="#1e40af">tracesSampleRate &gt; 0 + setConversationId() + functionId</text>

  <text x="456" y="109" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">OR</text>

  <rect x="468" y="76" width="468" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <rect x="478" y="84" width="144" height="20" rx="5" fill="#0369a1"/>
  <text x="550" y="98" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Workflow 5 · Existing OTel</text>
  <text x="630" y="98" font-size="10.8" font-weight="700" fill="#0c4a6e">Keep @vercel/otel + Add OTLP Export</text>
  <text x="478" y="121" font-size="9.8" fill="#075985">enableOpenTelemetrySetup: false + openTelemetryIntegration() + OTLP</text>

  <!-- Bus Connectors -->
  <line x1="234" y1="134" x2="234" y2="143" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="702" y1="134" x2="702" y2="143" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="133" y1="143" x2="826" y2="143" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="133" y1="143" x2="133" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="364" y1="143" x2="364" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="143" x2="595" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="826" y1="143" x2="826" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: 4 Workflow Cards (w=219, x=24, 255, 486, 717) -->
  <!-- Card 1 -->
  <rect x="24" y="154" width="219" height="222" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="154" width="219" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="174" width="219" height="10" fill="#dbeafe"/>
  <text x="34" y="174" font-size="11" font-weight="700" fill="#1e3a8a">1. Conversations to Evals</text>
  <text x="34" y="202" font-size="10" font-weight="700" fill="#1d4ed8">CLI ≥ 0.44 Extract-Map-Load</text>
  <text x="34" y="221" font-size="9.6" fill="#334155">• list --period 30d --limit 1000</text>
  <text x="34" y="238" font-size="9.6" fill="#334155">• Drop nulls/test-; sort tokens</text>
  <text x="34" y="255" font-size="9.6" fill="#334155">• Passthrough scores real reply</text>
  <text x="34" y="272" font-size="9.6" fill="#334155">• Code checks + subjective judge</text>
  <text x="34" y="289" font-size="9.6" fill="#334155">• Load: Braintrust/Langfuse/etc.</text>
  <rect x="34" y="302" width="199" height="64" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="42" y="319" font-size="9.6" font-weight="700" fill="#92400e">Pitfall: lastOutput ≠ ground truth</text>
  <text x="42" y="336" font-size="9.4" fill="#78350f">Never sum invoke_agent spans</text>
  <text x="42" y="352" font-size="9.4" fill="#78350f">(avoids 2x token &amp; cost totals)</text>

  <!-- Card 2 -->
  <rect x="255" y="154" width="219" height="222" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="255" y="154" width="219" height="30" rx="8" fill="#dbeafe"/>
  <rect x="255" y="174" width="219" height="10" fill="#dbeafe"/>
  <text x="265" y="174" font-size="11" font-weight="700" fill="#1e3a8a">2. Daily Automated Triage</text>
  <text x="265" y="202" font-size="10" font-weight="700" fill="#1d4ed8">Claude Routine + Sentry MCP</text>
  <text x="265" y="221" font-size="9.6" fill="#334155">• Pull 24h stats (400–800 runs)</text>
  <text x="265" y="238" font-size="9.6" fill="#334155">• Sample dozen: error + clean</text>
  <text x="265" y="255" font-size="9.6" fill="#334155">• Catch bad args, hangs, loops</text>
  <text x="265" y="272" font-size="9.6" fill="#334155">• Dedup Linear before filing</text>
  <text x="265" y="289" font-size="9.6" fill="#334155">• Ex: Seer 83/400 retry errors</text>
  <rect x="265" y="302" width="199" height="64" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="273" y="319" font-size="9.6" font-weight="700" fill="#92400e">Why inspect "clean" runs:</text>
  <text x="273" y="336" font-size="9.4" fill="#78350f">0 tool errors can still yield wrong</text>
  <text x="273" y="352" font-size="9.4" fill="#78350f">verdicts or hide 21% retry loops</text>

  <!-- Card 3 -->
  <rect x="486" y="154" width="219" height="222" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="486" y="154" width="219" height="30" rx="8" fill="#dbeafe"/>
  <rect x="486" y="174" width="219" height="10" fill="#dbeafe"/>
  <text x="496" y="174" font-size="11" font-weight="700" fill="#1e3a8a">3. Per-Call Cost Attribution</text>
  <text x="496" y="202" font-size="10" font-weight="700" fill="#1d4ed8">Next.js + AI SDK Token Pricing</text>
  <text x="496" y="221" font-size="9.6" fill="#334155">• Split by model, run &amp; turn</text>
  <text x="496" y="238" font-size="9.6" fill="#334155">• Input, cached, output &amp; reason</text>
  <text x="496" y="255" font-size="9.6" fill="#334155">• Jump to slow tools &amp; retries</text>
  <text x="496" y="272" font-size="9.6" fill="#334155">• Trace example 10x cost spikes</text>
  <text x="496" y="289" font-size="9.6" fill="#334155">• No manual USD math in app</text>
  <rect x="496" y="302" width="199" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="504" y="319" font-size="9.6" font-weight="700" fill="#1e3a8a">Scope: diagnostic estimate</text>
  <text x="504" y="336" font-size="9.4" fill="#1e40af">Not an exact provider invoice</text>
  <text x="504" y="352" font-size="9.4" fill="#1e40af">(sampling &amp; missing usage apply)</text>

  <!-- Card 4 -->
  <rect x="717" y="154" width="219" height="222" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="717" y="154" width="219" height="30" rx="8" fill="#dbeafe"/>
  <rect x="717" y="174" width="219" height="10" fill="#dbeafe"/>
  <text x="727" y="174" font-size="11" font-weight="700" fill="#1e3a8a">4. Spend Board &amp; Alerts</text>
  <text x="727" y="202" font-size="10" font-weight="700" fill="#1d4ed8">CLI "LLM Spend per User"</text>
  <text x="727" y="221" font-size="9.6" fill="#334155">• 8 widgets: cost, user, model</text>
  <text x="727" y="238" font-size="9.6" fill="#334155">• Alert 1: hourly static cap</text>
  <text x="727" y="255" font-size="9.6" fill="#334155">• Alert 2: hourly anomaly spike</text>
  <text x="727" y="272" font-size="9.6" fill="#334155">• Filter op.type:ai_client only</text>
  <text x="727" y="289" font-size="9.6" fill="#334155">• Triage spikes via trace links</text>
  <rect x="727" y="302" width="199" height="64" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="735" y="319" font-size="9.6" font-weight="700" fill="#991b1b">Ambiguity: spikes mix causes</text>
  <text x="735" y="336" font-size="9.4" fill="#7f1d1d">Cannot separate traffic growth,</text>
  <text x="735" y="352" font-size="9.4" fill="#7f1d1d">model swaps, cache drops, loops</text>

  <!-- Row 3: Evidence & Validation Boundaries -->
  <rect x="24" y="388" width="912" height="108" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="36" y="398" width="154" height="22" rx="5" fill="#1e3a8a"/>
  <text x="113" y="413" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">Evidence &amp; Practice Scope</text>
  <text x="200" y="413" font-size="11.2" font-weight="700" fill="#0f172a">Qualitative Practitioner Workflows &amp; Cookbooks — No Controlled Comparative Benchmarks</text>
  <text x="36" y="439" font-size="10" fill="#334155">1) Missing empirical metrics: zero reported triage precision/recall, MTTR reduction, SDK overhead, or cross-vendor benchmarks.</text>
  <text x="36" y="460" font-size="10" fill="#334155">2) Example vs. case scope: ms/$ snippets &amp; Seer 83/400 retries are recipe examples/local samples; Search Assistant is qualitative.</text>
  <text x="36" y="481" font-size="10" fill="#1e40af">3) Operational rule: correlated traces ≠ causal proof and LLM judges ≠ truth; anchor checks to DB state, tool effects &amp; human audit.</text>

  <!-- Footer -->
  <text x="24" y="518" font-size="10" fill="#64748b">Assistant diagram (not an original figure) mapping all 5 Sentry Agent Tracing workflows, shared span spine &amp; evidence boundaries</text>
</svg>
