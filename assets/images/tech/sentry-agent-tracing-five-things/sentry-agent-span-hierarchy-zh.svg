<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" style="background:#ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="37" font-size="18" font-weight="700" fill="#0f172a">Sentry Agent Tracing：多轮会话、Span 层次与全栈排障链路</text>
  <text x="24" y="57" font-size="11" fill="#475569">依据 Agent Tracing 概念文档与 Search Query Assistant 排障实录：用 conversation.id 聚合跨请求轮次，用分布式 Trace 定位静默工具与后端瓶颈</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Contrast Row -->
  <rect x="24" y="78" width="446" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="34" y="86" width="124" height="20" rx="5" fill="#b45309"/>
  <text x="96" y="100" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">传统 LLM 监控</text>
  <text x="166" y="100" font-size="11" font-weight="700" fill="#78350f">平铺单次请求列表（Prompt / Token / 延迟）</text>
  <text x="34" y="122" font-size="10.2" fill="#92400e">盲区：难察觉无报错空返回、工具死循环、交接丢参或底层慢查询</text>

  <rect x="490" y="78" width="446" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="500" y="86" width="132" height="20" rx="5" fill="#1d4ed8"/>
  <text x="566" y="100" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Agent Tracing 层次</text>
  <text x="640" y="100" font-size="11" font-weight="700" fill="#1e3a8a">跨请求会话 + 请求内树状 Span 瀑布流</text>
  <text x="500" y="122" font-size="10.2" fill="#1e40af">在同一 Trace 内串联模型、工具、Handoff 与 HTTP/DB 后端调用</text>

  <!-- Main Left Container: Conversation & Span Waterfall -->
  <rect x="24" y="146" width="604" height="268" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="146" width="604" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="166" width="604" height="10" fill="#dbeafe"/>
  <text x="36" y="166" font-size="11.5" font-weight="700" fill="#1e3a8a">同一会话 gen_ai.conversation.id（例：useChat 会话 ID）聚合多轮请求 Trace</text>

  <!-- Trace 1 -->
  <rect x="36" y="184" width="580" height="144" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="201" font-size="10.8" font-weight="700" fill="#1e3a8a">请求 Trace #1 · gen_ai.invoke_agent（functionId: "chat-agent" 聚合子 Span 指标）</text>

  <!-- Waterfall rows inside Trace 1 -->
  <rect x="54" y="212" width="150" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="129" y="227" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen_ai.chat (ai_client)</text>
  <text x="212" y="227" font-size="10.2" fill="#334155">模型推理（文档示意：sonnet-5 · 340 tokens · $0.002 · 800ms）</text>

  <rect x="72" y="241" width="162" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="153" y="256" font-size="10" font-weight="700" fill="#0c4a6e" text-anchor="middle">gen_ai.execute_tool</text>
  <text x="242" y="256" font-size="10.2" fill="#334155">工具入参/出参（例：read_file 42ms；查无报错却返回空结果）</text>

  <rect x="96" y="270" width="146" height="22" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="169" y="285" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">http.client / db.query</text>
  <text x="250" y="285" font-size="10.2" fill="#334155">嵌套后端子 Span（文档示例：订阅校验占总耗时 75%）</text>

  <rect x="72" y="299" width="162" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="153" y="314" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Agent Handoff Span</text>
  <text x="242" y="314" font-size="10.2" fill="#78350f">Triage → Billing 交接上下文核对（防丢失订单号等参数）</text>

  <!-- Trace 2 -->
  <rect x="36" y="336" width="580" height="68" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="354" font-size="10.8" font-weight="700" fill="#1e3a8a">请求 Trace #2 · 同一个 gen_ai.conversation.id（第 2 轮对话，独立分布式 Trace）</text>
  <text x="46" y="375" font-size="10.2" fill="#334155">• Explore → Agents 拼接多轮完整 Transcript 与工具轨迹，并支持一键跳转每轮后端瀑布流</text>
  <text x="46" y="393" font-size="10" fill="#475569">• 语义边界：同一会话可跨越多个 Trace；直接累加父级 invoke_agent 与子级 Span 会重复计算</text>

  <!-- Right Top Card: Search Query Assistant Case -->
  <rect x="642" y="146" width="294" height="144" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="642" y="146" width="294" height="30" rx="8" fill="#1e3a8a"/>
  <rect x="642" y="166" width="294" height="10" fill="#1e3a8a"/>
  <text x="654" y="166" font-size="11.2" font-weight="700" fill="#ffffff">内部案例：Search Query Assistant</text>
  <text x="654" y="194" font-size="10.2" font-weight="700" fill="#1d4ed8">症状：自定义数值条件查询返回 0 条结果</text>
  <text x="654" y="213" font-size="10" fill="#334155">排查：AI Conversation 视图跳转后端 API Trace</text>
  <text x="654" y="232" font-size="10" fill="#0f172a">根因：工具返回字段拼入系统提示时写成裸名</text>
  <text x="654" y="250" font-size="9.6" font-weight="700" fill="#1e40af">bug__predictions_count → tags[..., number]</text>
  <text x="654" y="272" font-size="10" fill="#166534">闭环：本地 eval 先上报 Sentry 验证再部署线上</text>

  <!-- Right Bottom Card: Privacy & Sampling Gate -->
  <rect x="642" y="300" width="294" height="114" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="654" y="320" font-size="11" font-weight="700" fill="#92400e">采集、采样与隐私门控（直接影响覆盖率）</text>
  <text x="654" y="341" font-size="10" fill="#78350f">• JS SDK v11+ 开 tracing 默认录输入/输出</text>
  <text x="654" y="360" font-size="10" fill="#78350f">• 敏感路由可关 recordInputs / Outputs</text>
  <text x="654" y="379" font-size="10" fill="#78350f">• 关采集、低采样或脱敏会令导出含 null 缺口</text>
  <text x="654" y="398" font-size="9.6" fill="#92400e">（核心通用文档另提示敏感数据按需开启记录）</text>

  <!-- Bottom Principle Banner -->
  <rect x="24" y="424" width="912" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="36" y="446" font-size="11.5" font-weight="700" fill="#166534">从记录到排障的工程原则：Span 负责保留可追踪现场，不自动替你定义正确性</text>
  <text x="36" y="467" font-size="10.2" fill="#14532d">① 文档中的 340 tokens / $0.002 / 800ms / 42ms / 75% 均为教学示意，不构成受控性能基准；② 本地 eval 与生产共享同一套对话视图</text>
  <text x="36" y="486" font-size="10.2" fill="#14532d">③ 只有将轨迹接入下游导出评测、成功样本分诊、单调用归因、支出告警与 OTel 复用五条工作流，AgentOps 才真正闭环</text>

  <!-- Footer -->
  <text x="24" y="518" font-size="10" fill="#64748b">阅读整理配图（非原图）· 依据 Sentry Agent Tracing 概念文档、Search Query Assistant 排障博文（2026-09-11）与 Cookbook 整理</text>
</svg>
