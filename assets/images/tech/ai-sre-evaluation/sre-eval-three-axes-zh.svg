<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">AI SRE 评测三维拆解：把诊断、引证与操作责任分开</text>
  <text x="24" y="58" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">基于 One2N 博文《What changed in how we evaluate AI SRE agents》：从 OpenSRE -1 分误诊拆出三道独立防线</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="24" y="78" width="446" height="68" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
  <rect x="34" y="85" width="130" height="20" rx="5" fill="#b91c1c"/>
  <text x="99" y="99" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="middle">OpenSRE PoC · -1</text>
  <text x="172" y="99" font-size="11.2" font-weight="700" fill="#7f1d1d" text-anchor="start">kubectl 缩容至 0 副本，却误报 Helm 回滚</text>
  <text x="34" y="120" font-size="10.3" font-weight="400" fill="#991b1b" text-anchor="start">单一负分掩盖三种不同缺陷：定位对象错 / 因果编造 / 缺证据</text>
  <text x="34" y="136" font-size="9.8" font-weight="400" fill="#7f1d1d" text-anchor="start">修复路径完全不同：扩工具覆盖、改因果推理与强制引证不能互替</text>

  <rect x="490" y="78" width="446" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="500" y="85" width="136" height="20" rx="5" fill="#b45309"/>
  <text x="568" y="99" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="middle">编码器壳层 · 盲区</text>
  <text x="644" y="99" font-size="11.2" font-weight="700" fill="#78350f" text-anchor="start">“直接用 Claude 排查”在答案之外缺系统</text>
  <text x="500" y="120" font-size="10.3" font-weight="400" fill="#92400e" text-anchor="start">缺共享架构与 Runbook；复用个人凭据致审计混淆与越权风险</text>
  <text x="500" y="136" font-size="9.8" font-weight="400" fill="#78350f" text-anchor="start">输出难读 Bash 脚本：高压下值班者要么不敢运行，要么盲目执行</text>

  <rect x="24" y="158" width="292" height="276" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="158" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="178" width="292" height="10" fill="#dbeafe"/>
  <text x="36" y="178" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">轴 1 · 诊断准确性（SREGym 三分法）</text>

  <rect x="34" y="196" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="216" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">故障定位（3 项二元题）</text>
  <text x="42" y="236" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">精准指明故障源组件与命名空间</text>
  <text x="42" y="254" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">不把下游报错或无关噪声当成根因</text>

  <rect x="34" y="276" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="296" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">故障刻画（3 项二元题）</text>
  <text x="42" y="316" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">还原真实失效机理与触发变更</text>
  <text x="42" y="334" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">拒收“副本归零却编成 Helm 回滚”</text>

  <rect x="34" y="356" width="272" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="376" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">范围精度与 7/9 通过线</text>
  <text x="42" y="396" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">界定受影响副本与关联服务（3 题）</text>
  <text x="42" y="414" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">9 题至少过 7 题：任一维度全错即失败</text>

  <rect x="334" y="158" width="292" height="276" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="334" y="158" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="334" y="178" width="292" height="10" fill="#dbeafe"/>
  <text x="346" y="178" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">轴 2 · 证据引证与审计可追查</text>

  <rect x="344" y="196" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="216" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">假设正反证据链</text>
  <text x="352" y="236" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">每条假设附对应日志、指标或 Trace</text>
  <text x="352" y="254" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">同时列明支持与否决各假设的依据</text>

  <rect x="344" y="276" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="296" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">全链路落盘与共享视图</text>
  <text x="352" y="316" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">告警→查询→工具→结论写入观测后端</text>
  <text x="352" y="334" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">共享已排除假设，接班者无需重头猜</text>

  <rect x="344" y="356" width="272" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="376" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">独立身份与结构化意图</text>
  <text x="352" y="396" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">独立 Agent 身份，不借用值班者凭据</text>
  <text x="352" y="414" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">可读摘要替代冗长原始 CoT 推理链</text>

  <rect x="644" y="158" width="292" height="276" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="644" y="158" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="644" y="178" width="292" height="10" fill="#dbeafe"/>
  <text x="656" y="178" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">轴 3 · 操作责任与爆炸半径护栏</text>

  <rect x="654" y="196" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="662" y="216" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">最小权限与干跑验证</text>
  <text x="662" y="236" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">默认只读与短期凭据；按服务设审批</text>
  <text x="662" y="254" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">补救方案带预检、干跑、判据与回滚</text>

  <rect x="654" y="276" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="662" y="296" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">动作限额与环路熔断</text>
  <text x="662" y="316" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">单次动作限 1 个 Deployment 或 1 个 AZ</text>
  <text x="662" y="334" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">速率限制并阻断反复重启死循环</text>

  <rect x="654" y="356" width="272" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="662" y="376" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">风险评分、脱敏与升级</text>
  <text x="662" y="396" font-size="10.3" font-weight="400" fill="#334155" text-anchor="start">动作附风险分；入模前清除 PII 与密钥</text>
  <text x="662" y="414" font-size="10.3" font-weight="400" fill="#0f172a" text-anchor="start">无把握或越权时移交完整进度给人类</text>

  <rect x="24" y="446" width="912" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="36" y="468" font-size="11.3" font-weight="700" fill="#1e3a8a" text-anchor="start">核心分水岭：编码壳层只给单名工程师“一个答案”，AI SRE 平台交付“不待呼醒、团队共享、可审计且受限的调查”</text>
  <text x="36" y="488" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">范围说明：SREGym 7/9 为原文引述的外部基准标准；One2N 原文未发布跨产品评分表或可归因的 MTTR 对照实验</text>

  <text x="24" y="520" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 基于 One2N《What changed in how we evaluate AI SRE agents》（Biswa Prakash Mishra, 2026-11-02，非原文配图）</text>
</svg>
