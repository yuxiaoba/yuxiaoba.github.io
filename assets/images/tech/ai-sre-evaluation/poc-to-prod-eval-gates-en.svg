<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">From PoC Pitfalls to Production Gates: Triggers, Judges &amp; Replay Bounds</text>
  <text x="24" y="58" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">Combining One2N's expanded matrix, deterministic policy checks, SREGym 3x3 scoring &amp; testbed boundaries</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="24" y="78" width="128" height="106" rx="8" fill="#1e3a8a"/>
  <text x="88" y="124" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Triggers &amp;</text>
  <text x="88" y="144" font-size="12" font-weight="600" fill="#bfdbfe" text-anchor="middle">Context Gate</text>

  <rect x="164" y="78" width="248" height="106" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="176" y="100" font-size="11.3" font-weight="700" fill="#92400e" text-anchor="start">1. Reactive (Manual)</text>
  <text x="176" y="124" font-size="10.1" font-weight="400" fill="#78350f" text-anchor="start">Engineer paged -&gt; pastes alert</text>
  <text x="176" y="144" font-size="10.1" font-weight="400" fill="#78350f" text-anchor="start">Loses onset-to-triage interval</text>
  <text x="176" y="164" font-size="9.7" font-weight="400" fill="#b45309" text-anchor="start">Relies on laptop notes &amp; steering</text>

  <rect x="426" y="78" width="248" height="106" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="438" y="100" font-size="11.3" font-weight="700" fill="#1e3a8a" text-anchor="start">2. Proactive (On Alert)</text>
  <text x="438" y="124" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Auto-starts when alert fires</text>
  <text x="438" y="144" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Pre-queries logs &amp; change feeds</text>
  <text x="438" y="164" font-size="9.7" font-weight="400" fill="#1d4ed8" text-anchor="start">Uses shared org map &amp; runbooks</text>

  <rect x="688" y="78" width="248" height="106" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <text x="700" y="100" font-size="11.3" font-weight="700" fill="#166534" text-anchor="start">3. Preventative (Pre-Alert)</text>
  <text x="700" y="124" font-size="10.1" font-weight="400" fill="#14532d" text-anchor="start">Starts before any alert triggers</text>
  <text x="700" y="144" font-size="10.1" font-weight="400" fill="#14532d" text-anchor="start">Watches error budget &amp; deploys</text>
  <text x="700" y="164" font-size="9.7" font-weight="400" fill="#15803d" text-anchor="start">Caveat: MTTR needs timestamp proof</text>

  <rect x="24" y="196" width="912" height="144" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="36" y="216" font-size="11.6" font-weight="700" fill="#1e3a8a" text-anchor="start">Two-Layer Scoring Gate: Hard Deterministic Invariants First, Semantic Rubric Judge Second</text>

  <rect x="36" y="226" width="430" height="104" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="46" y="234" width="188" height="20" rx="5" fill="#1d4ed8"/>
  <text x="140" y="248" font-size="10.6" font-weight="700" fill="#ffffff" text-anchor="middle">Deterministic Gates (Hard)</text>
  <text x="46" y="272" font-size="10.2" font-weight="400" fill="#1e293b" text-anchor="start">• Citation check: cited pods, metrics &amp; deploys exist</text>
  <text x="46" y="292" font-size="10.2" font-weight="400" fill="#1e293b" text-anchor="start">• Policy gate: read-only, agent ID &amp; blast-radius cap</text>
  <text x="46" y="312" font-size="10.2" font-weight="400" fill="#1e293b" text-anchor="start">• Safety: dry run + rollback; 0 PII/secret leaks</text>

  <line x1="468" y1="278" x2="490" y2="278" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="494" y="226" width="430" height="104" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <rect x="504" y="234" width="196" height="20" rx="5" fill="#334155"/>
  <text x="602" y="248" font-size="10.6" font-weight="700" fill="#ffffff" text-anchor="middle">Semantic Judge (SREGym 9-Q)</text>
  <text x="504" y="272" font-size="10.2" font-weight="400" fill="#1e293b" text-anchor="start">• 9 yes/no Qs: localization, mechanism &amp; scope (3 each)</text>
  <text x="504" y="292" font-size="10.2" font-weight="400" fill="#1e293b" text-anchor="start">• 7/9 pass rule: prevents passing if 1 axis scores 0/3</text>
  <text x="504" y="312" font-size="10.2" font-weight="400" fill="#475569" text-anchor="start">• Caveat: judge agreement != ground-truth accuracy</text>

  <rect x="24" y="352" width="292" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="24" y="352" width="292" height="28" rx="8" fill="#e2e8f0"/>
  <rect x="24" y="370" width="292" height="10" fill="#e2e8f0"/>
  <text x="38" y="371" font-size="11.3" font-weight="700" fill="#1e293b" text-anchor="start">Tier 1 · Single-Fault PoC</text>
  <text x="38" y="398" font-size="10.1" font-weight="400" fill="#334155" text-anchor="start">Ex: manual kubectl scale=0 test</text>
  <text x="38" y="420" font-size="10.1" font-weight="400" fill="#334155" text-anchor="start">Catches: ungrounded hallucinations</text>
  <text x="38" y="442" font-size="10.1" font-weight="400" fill="#475569" text-anchor="start">Limit: quiet env flatters agents</text>
  <rect x="38" y="458" width="264" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="170" y="475" font-size="10.1" font-weight="700" fill="#991b1b" text-anchor="middle">Not sufficient for prod sign-off</text>

  <line x1="316" y1="425" x2="332" y2="425" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="334" y="352" width="292" height="146" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="334" y="352" width="292" height="28" rx="8" fill="#dbeafe"/>
  <rect x="334" y="370" width="292" height="10" fill="#dbeafe"/>
  <text x="348" y="371" font-size="11.3" font-weight="700" fill="#1e3a8a" text-anchor="start">Tier 2 · Noisy Replay &amp; SREGym</text>
  <text x="348" y="398" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Multi-layer faults + ambient noise</text>
  <text x="348" y="420" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Tests: noise filtering &amp; 3x3 rubric</text>
  <text x="348" y="442" font-size="10.1" font-weight="400" fill="#475569" text-anchor="start">Limit: replay misses live steering</text>
  <rect x="348" y="458" width="264" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="480" y="475" font-size="10.1" font-weight="700" fill="#1e3a8a" text-anchor="middle">Validates RCA &amp; citation rigor</text>

  <line x1="626" y1="425" x2="642" y2="425" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="644" y="352" width="292" height="146" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <rect x="644" y="352" width="292" height="28" rx="8" fill="#dcfce7"/>
  <rect x="644" y="370" width="292" height="10" fill="#dcfce7"/>
  <text x="658" y="371" font-size="11.3" font-weight="700" fill="#166534" text-anchor="start">Tier 3 · Read-Only Shadow Pilot</text>
  <text x="658" y="398" font-size="10.1" font-weight="400" fill="#14532d" text-anchor="start">Live alerts; read-only + dry-run gate</text>
  <text x="658" y="420" font-size="10.1" font-weight="400" fill="#14532d" text-anchor="start">Tests: agent ID, handoff &amp; caps</text>
  <text x="658" y="442" font-size="10.1" font-weight="400" fill="#475569" text-anchor="start">Limit: needs baseline for MTTR</text>
  <rect x="658" y="458" width="264" height="26" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="0.9"/>
  <text x="790" y="475" font-size="10.1" font-weight="700" fill="#166534" text-anchor="middle">Proves safe ops &amp; blast bounds</text>

  <text x="24" y="520" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">Assistant diagram synthesizing One2N's updated matrix, SREGym 3x3 rubric &amp; replay boundaries (not an original figure; zero unmeasured claims)</text>
</svg>
