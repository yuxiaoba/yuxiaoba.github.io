  <rect x="286" y="224" width="388" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="300" y="242" font-size="10.6" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU Pod Cross-Boundary Round Trip (Core Lab Risk)</text>
  <text x="300" y="260" font-size="9.3" font-weight="400" fill="#0f172a" text-anchor="start">1) Pod hits API → 2) API calls worker HAMi webhook via Konnectivity</text>
  <text x="300" y="277" font-size="9.3" font-weight="400" fill="#0f172a" text-anchor="start">3) Sets schedulerName: Hami-scheduler → 4) Binds slice &amp; locks node</text>
  <text x="300" y="294" font-size="9.1" font-weight="600" fill="#b45309" text-anchor="start">If tunnel fails: webhook unreachable → silent fallback to kube-scheduler</text>

  <!-- Right Tunnels (tenant-b) -->
  <line x1="708" y1="218" x2="708" y2="308" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="718" y="254" font-size="9.4" font-weight="700" fill="#1d4ed8" text-anchor="start">Konnectivity</text>
  <text x="718" y="269" font-size="9.1" font-weight="600" fill="#1e40af" text-anchor="start">Webhook tunnel</text>

  <line x1="828" y1="310" x2="828" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="838" y="256" font-size="9.4" font-weight="600" fill="#334155" text-anchor="start">kubeadm join</text>
  <text x="838" y="271" font-size="9.1" font-weight="400" fill="#64748b" text-anchor="start">kubelet up</text>

