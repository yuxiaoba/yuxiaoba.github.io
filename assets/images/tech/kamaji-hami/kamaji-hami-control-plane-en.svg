  <rect x="204" y="140" width="150" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="279" y="157" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">kube-scheduler</text>
