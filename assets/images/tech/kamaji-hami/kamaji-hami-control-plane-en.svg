  <text x="388" y="170" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">• kamaji-etcd: split keys, 1 store</text>
  <text x="388" y="188" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">• MetalLB: 172.18.255.200-250</text>

