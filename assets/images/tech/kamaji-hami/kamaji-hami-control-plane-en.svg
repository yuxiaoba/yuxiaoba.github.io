  <rect x="24" y="89" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="90" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Management Cluster (Single kind host: cert-manager v1.21.2 · MetalLB v0.16.1 · Kamaji Controller)</text>

  <!-- tenant-a Control Plane -->
  <rect x="36" y="107" width="328" height="99" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
