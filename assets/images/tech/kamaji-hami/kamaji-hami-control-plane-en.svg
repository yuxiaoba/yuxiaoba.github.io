  <text x="24" y="54" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Based on CNCF blog (2026-10-23): shared management cluster hosts tenant-a / b control planes; GPU pods route back via reverse tunnel</text>
  <line x1="24" y1="64" x2="936" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Band 1: Management Cluster -->
  <rect x="24" y="73" width="912" height="143" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
