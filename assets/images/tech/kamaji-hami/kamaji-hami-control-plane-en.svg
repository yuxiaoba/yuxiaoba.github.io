  <!-- Left Tunnels (tenant-a) -->
  <line x1="56" y1="310" x2="56" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="66" y="256" font-size="9.4" font-weight="600" fill="#334155" text-anchor="start">kubeadm join</text>
  <text x="66" y="271" font-size="9.1" font-weight="400" fill="#64748b" text-anchor="start">kubelet up</text>

  <line x1="170" y1="218" x2="170" y2="308" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
