<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" style="background:#ffffff;">
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="35" font-size="17.5" font-weight="700" fill="#0f172a" text-anchor="start">Simulated Lab vs. Physical GPU Fidelity Boundaries &amp; Validation Gate</text>
  <text x="24" y="54" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Separating the CNCF lab's passing control-path tests from mock lifecycle workarounds and unproven CUDA runtime guarantees</text>
  <line x1="24" y1="64" x2="936" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Section 1 Header -->
  <rect x="24" y="73" width="912" height="24" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="36" y="89" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">1 · Evidence Scope of the Eight Lab Tests (TC-03/05/06/07/08 Detailed in Post; TC-01/02/04 Counted in Total)</text>

  <!-- 4 Top Cards (w=219, gap=12) -->
  <!-- Card 1 -->
  <rect x="24" y="103" width="219" height="162" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="36" y="112" width="136" height="19" rx="5" fill="#1d4ed8"/>
  <text x="104" y="125" font-size="9.6" font-weight="700" fill="#ffffff" text-anchor="middle">TC-03 / 05 · Packing</text>
  <text x="36" y="148" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">3 Pods Co-Scheduled on 1 Card</text>
  <text x="36" y="167" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">Each: 20,000 MB + 30% compute</text>
  <text x="36" y="185" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">Total: 60,000 MB / 90% used</text>
  <text x="36" y="203" font-size="9.2" font-weight="600" fill="#1e40af" text-anchor="start">schedulerName: Hami-scheduler</text>
  <line x1="36" y1="215" x2="231" y2="215" stroke="#bfdbfe" stroke-width="1"/>
  <text x="36" y="234" font-size="9.3" font-weight="600" fill="#b45309" text-anchor="start">Caveat: manual unlock in loop</text>
  <text x="36" y="252" font-size="9.0" font-weight="400" fill="#78350f" text-anchor="start">Else next pod stalls up to 5 min</text>

  <!-- Card 2 -->
  <rect x="255" y="103" width="219" height="162" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <rect x="267" y="112" width="136" height="19" rx="5" fill="#15803d"/>
  <text x="335" y="125" font-size="9.6" font-weight="700" fill="#ffffff" text-anchor="middle">TC-06 / 07 · Rejections</text>
  <text x="267" y="148" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Isolated Per-Axis Denials</text>
  <text x="267" y="167" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">4th 30% pod → 120/100 cores</text>
  <text x="267" y="184" font-size="9.2" font-weight="700" fill="#166534" text-anchor="start">Pending: CardInsufficientCore</text>
  <text x="267" y="202" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">90,000 MB + 10% (cores fit)</text>
  <line x1="267" y1="215" x2="462" y2="215" stroke="#bbf7d0" stroke-width="1"/>
  <text x="267" y="234" font-size="9.1" font-weight="700" fill="#166534" text-anchor="start">Pending: CardInsufficientMemory</text>
  <text x="267" y="252" font-size="8.9" font-weight="400" fill="#14532d" text-anchor="start">Proves separate quota accounting</text>

  <!-- Card 3 -->
  <rect x="486" y="103" width="219" height="162" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="498" y="112" width="136" height="19" rx="5" fill="#1d4ed8"/>
  <text x="566" y="125" font-size="9.6" font-weight="700" fill="#ffffff" text-anchor="middle">TC-08 · API Visibility</text>
  <text x="498" y="148" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Disjoint Tenant API Views</text>
  <text x="498" y="167" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">tenant-a: 81,920 MB / 100c</text>
  <text x="498" y="185" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">tenant-b: 49,152 MB / 200c</text>
  <text x="498" y="203" font-size="9.3" font-weight="400" fill="#1e40af" text-anchor="start">Each sees own worker &amp; pods only</text>
  <line x1="498" y1="215" x2="693" y2="215" stroke="#bfdbfe" stroke-width="1"/>
  <text x="498" y="234" font-size="9.3" font-weight="600" fill="#334155" text-anchor="start">Confirms API view separation</text>
  <text x="498" y="252" font-size="9.0" font-weight="400" fill="#64748b" text-anchor="start">No RBAC escape or CNI attack test</text>

  <!-- Card 4 -->
  <rect x="717" y="103" width="219" height="162" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
  <rect x="729" y="112" width="138" height="19" rx="5" fill="#b91c1c"/>
  <text x="798" y="125" font-size="9.6" font-weight="700" fill="#ffffff" text-anchor="middle">Hardware Gap · Unproven</text>
  <text x="729" y="148" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Running != Runtime Isolation</text>
  <text x="729" y="167" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">Containers run busybox sleep</text>
  <text x="729" y="185" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">No NVIDIA driver, no CUDA code</text>
  <text x="729" y="203" font-size="9.3" font-weight="400" fill="#991b1b" text-anchor="start">HAMi-core caps not exercised</text>
  <line x1="729" y1="215" x2="924" y2="215" stroke="#fecaca" stroke-width="1"/>
  <text x="729" y="234" font-size="9.3" font-weight="700" fill="#991b1b" text-anchor="start">Zero throughput / noisy-neighbor</text>
  <text x="729" y="252" font-size="9.0" font-weight="400" fill="#7f1d1d" text-anchor="start">data or same-GPU cross-tenant test</text>

  <!-- Section 2: Fidelity Table -->
  <rect x="24" y="275" width="912" height="192" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="275" width="912" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="24" y="293" width="912" height="10" fill="#1e3a8a"/>
  <text x="36" y="293" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Platform Layer</text>
  <text x="218" y="293" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Mock Lab Path (CNCF Oct 23 Post)</text>
  <text x="556" y="293" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Real-GPU Hardware &amp; Lifecycle Checks Required</text>

  <!-- Row 1 -->
  <line x1="24" y1="343" x2="936" y2="343" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="327" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">1. Device Registration</text>
  <text x="218" y="327" font-size="9.4" font-weight="400" fill="#92400e" text-anchor="start">Omit gpu=on; manually patch 10/20 slots &amp; node annotations</text>
  <text x="556" y="327" font-size="9.4" font-weight="400" fill="#166534" text-anchor="start">Real device plugin discovers NVML GPUs, memory &amp; health</text>

  <!-- Row 2 -->
  <line x1="24" y1="383" x2="936" y2="383" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="367" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">2. Bind Lock Lifecycle</text>
  <text x="218" y="367" font-size="9.4" font-weight="400" fill="#92400e" text-anchor="start">Mock skips Allocate; manual bind-phase &amp; mutex.lock- clear</text>
  <text x="556" y="367" font-size="9.4" font-weight="400" fill="#166534" text-anchor="start">Verify automatic lock release, exit cleanup &amp; burst scheduling</text>

  <!-- Row 3 -->
  <line x1="24" y1="423" x2="936" y2="423" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="407" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">3. Runtime Enforcement</text>
  <text x="218" y="407" font-size="9.4" font-weight="400" fill="#991b1b" text-anchor="start">busybox sleep; zero CUDA memory or SM slicing enforcement</text>
  <text x="556" y="407" font-size="9.4" font-weight="400" fill="#166534" text-anchor="start">Stress HAMi-core VRAM caps, OOM &amp; noisy-neighbor latency</text>

  <!-- Row 4 -->
  <text x="36" y="447" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">4. Workers &amp; Mgmt Domain</text>
  <text x="218" y="447" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">Unofficial kindest/node join; shared kind &amp; kamaji-etcd</text>
  <text x="556" y="447" font-size="9.4" font-weight="400" fill="#166534" text-anchor="start">Supported kubeadm / CAPI workers; etcd HA, sizing &amp; upgrades</text>

  <!-- Vertical Table Rules -->
  <line x1="206" y1="303" x2="206" y2="467" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="544" y1="303" x2="544" y2="467" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom Banner -->
  <rect x="24" y="476" width="912" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="36" y="494" font-size="9.9" font-weight="600" fill="#1e3a8a" text-anchor="start">Takeaway: Mock shifts tunnel &amp; quota wiring checks left before GPU purchase; real deployment must test driver enforcement &amp; lifecycle</text>

  <text x="24" y="522" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">Assistant diagram (not an original figure) · Summarizing CNCF blog (2026-10-23) test observations and simulation fidelity boundaries</text>
</svg>
