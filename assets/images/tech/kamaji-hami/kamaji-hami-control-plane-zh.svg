<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" style="background:#ffffff;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="35" font-size="17.5" font-weight="700" fill="#0f172a" text-anchor="start">Kamaji + HAMi 跨域控制链路：托管控制面、Konnectivity 隧道与模拟绑定分歧</text>
  <text x="24" y="54" font-size="11" font-weight="400" fill="#475569" text-anchor="start">依据 CNCF 博文 (2026-10-23) 拆解：共享管理集群托管 tenant-a / b 控制面，GPU Pod 经反向隧道完成准入与分片绑定</text>
  <line x1="24" y1="64" x2="936" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Band 1: Management Cluster -->
  <rect x="24" y="73" width="912" height="143" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="73" width="912" height="26" rx="8" fill="#dbeafe"/>
  <rect x="24" y="89" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="90" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">管理集群 Management Cluster（单台 kind 宿主：cert-manager v1.21.2 · MetalLB v0.16.1 · Kamaji Controller）</text>

  <!-- tenant-a Control Plane -->
  <rect x="36" y="107" width="328" height="99" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="46" y="114" width="150" height="20" rx="5" fill="#1d4ed8"/>
  <text x="121" y="128" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">tenant-a 控制面 (4/4)</text>
  <text x="206" y="128" font-size="9.6" font-weight="600" fill="#1e40af" text-anchor="start">MetalLB VIP :6443</text>

  <rect x="46" y="140" width="148" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="120" y="157" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">kube-apiserver</text>
  <rect x="204" y="140" width="150" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="279" y="157" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">kube-scheduler</text>
  <rect x="46" y="172" width="148" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="120" y="189" font-size="9.6" font-weight="600" fill="#0f172a" text-anchor="middle">controller-manager</text>
  <rect x="204" y="172" width="150" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="279" y="189" font-size="9.4" font-weight="700" fill="#1e3a8a" text-anchor="middle">konnectivity-server :8132</text>

  <!-- Shared Management Components -->
  <rect x="376" y="107" width="208" height="99" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <rect x="386" y="114" width="188" height="20" rx="5" fill="#475569"/>
  <text x="480" y="128" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">共享基础设施（非隔离域）</text>
  <text x="388" y="152" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">• Kamaji：Pod 形式托管租户 API</text>
  <text x="388" y="170" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">• kamaji-etcd：数据分键但共享存储</text>
  <text x="388" y="188" font-size="9.3" font-weight="400" fill="#475569" text-anchor="start">• MetalLB：172.18.255.200-250</text>

  <!-- tenant-b Control Plane -->
  <rect x="596" y="107" width="328" height="99" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="606" y="114" width="150" height="20" rx="5" fill="#1d4ed8"/>
  <text x="681" y="128" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">tenant-b 控制面 (4/4)</text>
  <text x="766" y="128" font-size="9.6" font-weight="600" fill="#1e40af" text-anchor="start">MetalLB VIP :6443</text>

  <rect x="606" y="140" width="148" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="680" y="157" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">kube-apiserver</text>
  <rect x="764" y="140" width="150" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="839" y="157" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">kube-scheduler</text>
  <rect x="606" y="172" width="148" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="680" y="189" font-size="9.6" font-weight="600" fill="#0f172a" text-anchor="middle">controller-manager</text>
  <rect x="764" y="172" width="150" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="839" y="189" font-size="9.4" font-weight="700" fill="#1e3a8a" text-anchor="middle">konnectivity-server :8132</text>

  <!-- Band 2: Cross-boundary Tunnels & Round-Trip Callout -->
  <!-- Left Tunnels (tenant-a) -->
  <line x1="56" y1="310" x2="56" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="66" y="256" font-size="9.5" font-weight="600" fill="#334155" text-anchor="start">kubeadm 加入</text>
  <text x="66" y="271" font-size="9.2" font-weight="400" fill="#64748b" text-anchor="start">kubelet 注册</text>

  <line x1="170" y1="218" x2="170" y2="308" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="180" y="254" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Konnectivity</text>
  <text x="180" y="269" font-size="9.2" font-weight="600" fill="#1e40af" text-anchor="start">Webhook 隧道</text>

  <!-- Center Sequence Card -->
  <rect x="286" y="224" width="388" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="300" y="242" font-size="10.8" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU Pod 跨域准入与调度往返（实验核心验证链路）</text>
  <text x="300" y="260" font-size="9.5" font-weight="400" fill="#0f172a" text-anchor="start">① 提交 Pod 至托管 API → ② API 经 Konnectivity 调 worker 侧 HAMi Webhook</text>
  <text x="300" y="277" font-size="9.5" font-weight="400" fill="#0f172a" text-anchor="start">③ 改写 schedulerName: Hami-scheduler → ④ 匹配显存/算力注解并加节点锁</text>
  <text x="300" y="294" font-size="9.3" font-weight="600" fill="#b45309" text-anchor="start">若虚线隧道断开：Webhook 不可达，Pod 静默回退默认 kube-scheduler</text>

  <!-- Right Tunnels (tenant-b) -->
  <line x1="708" y1="218" x2="708" y2="308" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="718" y="254" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Konnectivity</text>
  <text x="718" y="269" font-size="9.2" font-weight="600" fill="#1e40af" text-anchor="start">Webhook 隧道</text>

  <line x1="828" y1="310" x2="828" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="838" y="256" font-size="9.5" font-weight="600" fill="#334155" text-anchor="start">kubeadm 加入</text>
  <text x="838" y="271" font-size="9.2" font-weight="400" fill="#64748b" text-anchor="start">kubelet 注册</text>

  <!-- Band 3: Separate Tenant Workers -->
  <!-- tenant-a-worker -->
  <rect x="24" y="312" width="448" height="152" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="312" width="448" height="26" rx="8" fill="#dbeafe"/>
  <rect x="24" y="328" width="448" height="10" fill="#dbeafe"/>
  <text x="36" y="329" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">tenant-a-worker（独立容器 · Calico v3.31.2 · 无 gpu=on 标签）</text>

  <rect x="34" y="346" width="208" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="44" y="365" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="start">HAMi 组件 (kube-system)</text>
  <text x="44" y="383" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">webhook · hami-scheduler · mock 插件</text>

  <rect x="250" y="346" width="212" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="260" y="365" font-size="10" font-weight="700" fill="#92400e" text-anchor="start">Mock 锁生命周期差异（陷阱 2）</text>
  <text x="260" y="383" font-size="9.2" font-weight="400" fill="#78350f" text-anchor="start">无 Allocate 回调，需手清 mutex.lock</text>

  <rect x="34" y="402" width="428" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="42" y="409" width="166" height="18" rx="4" fill="#1d4ed8"/>
  <text x="125" y="422" font-size="9.4" font-weight="700" fill="#ffffff" text-anchor="middle">模拟 A100 80 GB (GPU-MOCK-0)</text>
  <text x="216" y="422" font-size="9.4" font-weight="600" fill="#334155" text-anchor="start">81,920 MB · 100 算力单位 · 10 槽位</text>

  <rect x="42" y="432" width="96" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="90" y="444" font-size="8.8" font-weight="600" fill="#166534" text-anchor="middle">pod-1: 20G+30%</text>
  <rect x="145" y="432" width="96" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="193" y="444" font-size="8.8" font-weight="600" fill="#166534" text-anchor="middle">pod-2: 20G+30%</text>
  <rect x="248" y="432" width="96" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="296" y="444" font-size="8.8" font-weight="600" fill="#166534" text-anchor="middle">pod-3: 20G+30%</text>
  <rect x="351" y="432" width="103" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.9"/>
  <text x="402" y="444" font-size="8.8" font-weight="700" fill="#991b1b" text-anchor="middle">pod-4: Pending 拒批</text>

  <!-- tenant-b-worker -->
  <rect x="488" y="312" width="448" height="152" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="488" y="312" width="448" height="26" rx="8" fill="#dbeafe"/>
  <rect x="488" y="328" width="448" height="10" fill="#dbeafe"/>
  <text x="500" y="329" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">tenant-b-worker（独立容器 · 独立 API · 独立节点与 Pod 网段）</text>

  <rect x="498" y="346" width="208" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="508" y="365" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="start">HAMi + konnectivity-agent</text>
  <text x="508" y="383" font-size="9.3" font-weight="400" fill="#334155" text-anchor="start">仅连 tenant-b，无跨租户节点共享</text>

  <rect x="714" y="346" width="212" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="724" y="365" font-size="10" font-weight="700" fill="#166534" text-anchor="start">TC-08 API 可见性隔离检查</text>
  <text x="724" y="383" font-size="9.2" font-weight="400" fill="#14532d" text-anchor="start">仅见本节点与 49,152 MB / 200 算力</text>

  <rect x="498" y="402" width="428" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="506" y="409" width="202" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="607" y="425" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">GPU-MOCK-B0 · 模拟 L4 24 GB</text>
  <text x="607" y="441" font-size="9.1" font-weight="400" fill="#334155" text-anchor="middle">24,576 MB · 100 算力 · 10 槽位</text>
  <rect x="716" y="409" width="202" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="817" y="425" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">GPU-MOCK-B1 · 模拟 L4 24 GB</text>
  <text x="817" y="441" font-size="9.1" font-weight="400" fill="#334155" text-anchor="middle">24,576 MB · 100 算力 · 10 槽位</text>

  <!-- Bottom Banner -->
  <rect x="24" y="474" width="912" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="36" y="493" font-size="10.2" font-weight="600" fill="#1e3a8a" text-anchor="start">拓扑边界：Kamaji 隔离租户控制面与 worker 归属；实验未令两租户争抢同一物理卡，且共享管理集群与 kamaji-etcd 仍属共同故障域</text>

  <text x="24" y="521" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图（非原图）· 基于 CNCF 博文 (2026-10-23) 实操命令、Pod 注解日志与 Kamaji / HAMi 组件交互绘制</text>
</svg>
