<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC','PingFang SC','Lato','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#0f172a">系统数据面双轨：FarArray RDMA 与 Pallas TPU 稀疏内核</text>
  <text x="24" y="56" font-size="11.5" fill="#475569">据 Google Antigravity 博客整理：通过绕开内核协议栈与 HBM 中间张量，突破图计算带宽与内存墙</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Track 1: FarArray -->
  <rect x="24" y="78" width="912" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="78" width="912" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="96" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="97" font-size="12" font-weight="700" fill="#1e3a8a">轨 1 · FarArray 分布式图计算（1.14T 唯一边，64 目标节点共 148 GB 固定 DRAM）</text>

  <!-- 1A Baseline -->
  <rect x="45" y="114" width="198" height="156" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="55" y="134" font-size="10.8" font-weight="700" fill="#92400e">对比基线：TCP KV 与 Shuffle</text>
  <text x="55" y="158" font-size="9.8" fill="#78350f">每顶点附带 KV 元数据与哈希桶</text>
  <text x="55" y="180" font-size="9.8" fill="#78350f">内核网络中断 + RPC 序列化开销</text>
  <text x="55" y="202" font-size="9.8" fill="#78350f">远端服务端 CPU 达 100% 饱和</text>
  <text x="55" y="224" font-size="9.8" font-weight="700" fill="#b45309">Shuffle 内存：4.0 TB (ClueWeb)</text>
  <text x="55" y="246" font-size="9.8" fill="#78350f">1.14T 边基线 &gt;1 TiB / &gt;20 TB</text>

  <rect x="244" y="181" width="24" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="256" y="195" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">vs</text>

  <!-- 1B Pruning -->
  <rect x="269" y="114" width="198" height="156" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="279" y="134" font-size="10.8" font-weight="700" fill="#1d4ed8">1. Worker 本地早期剪枝</text>
  <text x="279" y="158" font-size="9.8" fill="#334155">对称 PGAS 或 Worker/Server</text>
  <text x="279" y="180" font-size="9.8" fill="#334155">线程本地 LCA 早期退出判定</text>
  <text x="279" y="202" font-size="9.8" font-weight="700" fill="#1e3a8a">本地过滤 97%–99.9% 冗余边</text>
  <text x="279" y="224" font-size="9.8" fill="#334155">仅余关键跨节点边发起 RDMA</text>
  <text x="279" y="246" font-size="9.8" fill="#475569">SmartNIC / io_uring / SHM</text>

  <line x1="469" y1="192" x2="490" y2="192" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 1C RDMA NIC -->
  <rect x="493" y="114" width="198" height="156" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="503" y="134" font-size="10.8" font-weight="700" fill="#1d4ed8">2. 用户态批处理门铃与 NIC</text>
  <text x="503" y="158" font-size="9.8" fill="#334155">应用线程直写 PCIe MMIO 门铃</text>
  <text x="503" y="180" font-size="9.8" fill="#334155">批量 WQE 绕开操作系统内核</text>
  <text x="503" y="202" font-size="9.8" fill="#334155">SmartNIC 执行单边 DMA 读写</text>
  <text x="503" y="224" font-size="9.8" font-weight="700" fill="#1e3a8a">PCIe AtomicOps 64位 CAS</text>
  <text x="503" y="246" font-size="9.8" fill="#475569">微秒级；最大读尖刺降 89%</text>

  <line x1="693" y1="192" x2="714" y2="192" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 1D Remote Pinned DRAM -->
  <rect x="717" y="114" width="198" height="156" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <text x="727" y="134" font-size="10.8" font-weight="700" fill="#166534">3. 远端固定 DRAM 与实测</text>
  <text x="727" y="158" font-size="9.8" fill="#14532d">平坦全局地址空间，零远端中断</text>
  <text x="727" y="180" font-size="9.8" fill="#14532d">目标节点应用 CPU 保持空闲</text>
  <text x="727" y="202" font-size="9.8" font-weight="700" fill="#166534">CC 快 40–180× · 内存少 6–22×</text>
  <text x="727" y="224" font-size="9.8" fill="#14532d">较 Shuffle 少 &gt;100× (28.5 GB)</text>
  <text x="727" y="246" font-size="9.8" fill="#14532d">PPR 快 11.3–26.5× · 100% 一致</text>

  <!-- Track 2: Pallas TPU -->
  <rect x="24" y="292" width="912" height="206" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="292" width="912" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="310" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="311" font-size="12" font-weight="700" fill="#1e3a8a">轨 2 · Pallas TPU v6e 稀疏图内核（20.97M 边临时 HBM 111.5 MiB vs. 原生 JAX 20.2 GiB）</text>

  <!-- 2A Baseline -->
  <rect x="45" y="328" width="198" height="158" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="55" y="348" font-size="10.8" font-weight="700" fill="#92400e">对比基线：原生 JAX SpMM</text>
  <text x="55" y="372" font-size="9.8" fill="#78350f">TPU MXU 面向稠密连续矩阵乘法</text>
  <text x="55" y="394" font-size="9.8" fill="#78350f">稀疏 Y = A @ X 需不规则 Gather</text>
  <text x="55" y="416" font-size="9.8" font-weight="700" fill="#b45309">HBM 物化 O(|E|×D) 中间张量</text>
  <text x="55" y="438" font-size="9.8" fill="#78350f">随边数线性涨至 20.2 GiB (20M)</text>
  <text x="55" y="460" font-size="9.8" fill="#78350f">单颗 TPU v6e 芯片 HBM 耗尽</text>

  <rect x="244" y="397" width="24" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="256" y="411" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">vs</text>

  <!-- 2B SMEM + VMEM -->
  <rect x="269" y="328" width="198" height="158" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="279" y="348" font-size="10.8" font-weight="700" fill="#1d4ed8">1. SMEM 流式读取 COO 块</text>
  <text x="279" y="372" font-size="9.8" fill="#334155">免去主机侧 CSR 格式重排转换</text>
  <text x="279" y="394" font-size="9.8" font-weight="700" fill="#1e3a8a">4,096 边/块流式通过 SMEM</text>
  <text x="279" y="416" font-size="9.8" fill="#334155">不向 HBM 写出边级中间特征</text>
  <text x="279" y="438" font-size="9.8" fill="#334155">XLA VMEM 作用域 16→122 MiB</text>
  <text x="279" y="460" font-size="9.8" fill="#475569">节点特征与累加器常驻片上</text>

  <line x1="469" y1="407" x2="490" y2="407" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2C VREG + VJP -->
  <rect x="493" y="328" width="198" height="158" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="503" y="348" font-size="10.8" font-weight="700" fill="#1d4ed8">2. 3D VREG 与零残差反向</text>
  <text x="503" y="372" font-size="9.8" fill="#334155">特征重排为 (8,128) 3D VREG</text>
  <text x="503" y="394" font-size="9.8" fill="#334155">4 路循环展开 + 寄存器前递</text>
  <text x="503" y="416" font-size="9.8" fill="#334155">规避重目标节点 VMEM 停顿</text>
  <text x="503" y="438" font-size="9.8" font-weight="700" fill="#1e3a8a">custom_vjp 保存零浮点激活</text>
  <text x="503" y="460" font-size="9.8" fill="#475569">仅留整数索引并互换 row/col</text>

  <line x1="693" y1="407" x2="714" y2="407" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2D TPU Results -->
  <rect x="717" y="328" width="198" height="158" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <text x="727" y="348" font-size="10.8" font-weight="700" fill="#166534">3. TPU v6e 实测结果</text>
  <text x="727" y="372" font-size="9.8" font-weight="700" fill="#166534">临时 HBM 恒定 111.5 MiB</text>
  <text x="727" y="394" font-size="9.8" fill="#14532d">20.97M 边降幅达 185.8×</text>
  <text x="727" y="416" font-size="9.8" fill="#14532d">GIN/GCN 前向快 10.5×–14.7×</text>
  <text x="727" y="438" font-size="9.8" fill="#14532d">反向 / 端到端快 8×–12×</text>
  <text x="727" y="460" font-size="9.8" fill="#14532d">与原生 JAX 保持浮点数值等价</text>

  <text x="24" y="519" font-size="10.5" fill="#64748b">阅读整理配图（非原文配图）：依据 Google Antigravity 博客描述的 FarArray 与 Pallas TPU 内核机制整理</text>
</svg>
