<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Observability Failures, Language Gradient &amp; Miss-Rate Boundary</text>
  <text x="24" y="58" font-size="11.3" font-weight="400" fill="#475569" text-anchor="start">Why equating a ~30% miss rate with pure root-cause misdiagnosis conflates four distinct engineering fractures</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="80" width="460" height="328" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="80" width="460" height="32" rx="8" fill="#dbeafe"/>
  <rect x="24" y="100" width="460" height="12" fill="#dbeafe"/>
  <text x="36" y="101" font-size="12.2" font-weight="700" fill="#1e3a8a" text-anchor="start">Paper Failure Mode Breakdown (11 Models, n=100, Fig. 6)</text>
  <rect x="36" y="122" width="436" height="64" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="44" y="140" font-size="11.3" font-weight="700" fill="#1d4ed8" text-anchor="start">1. Bad Context Handling · 38%</text>
  <rect x="314" y="131" width="146" height="10" rx="4" fill="#e2e8f0"/>
  <rect x="314" y="131" width="138.7" height="10" rx="4" fill="#1d4ed8"/>
  <text x="44" y="158" font-size="10.1" font-weight="600" fill="#1e293b" text-anchor="start">Ignored truncation 15% · Unfiltered logs 14% · Single source 6% · No log query ~3%</text>
  <text x="44" y="175" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Case: DeepSeek V3.2 pulled 16,515 chars unfiltered, ignored truncation</text>
  <rect x="36" y="192" width="436" height="64" rx="6" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="44" y="210" font-size="11.3" font-weight="700" fill="#7c3aed" text-anchor="start">2. Insufficient Verification · 28%</text>
  <rect x="314" y="201" width="146" height="10" rx="4" fill="#e2e8f0"/>
  <rect x="314" y="201" width="102.2" height="10" rx="4" fill="#7c3aed"/>
  <text x="44" y="228" font-size="10.1" font-weight="600" fill="#1e293b" text-anchor="start">Open-loop edits without test runs 16% · Turn exhaustion 12%</text>
  <text x="44" y="245" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Case: 86% of Grok 4 trajectories ended with code edits and zero tests</text>
  <rect x="36" y="262" width="436" height="64" rx="6" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="44" y="280" font-size="11.3" font-weight="700" fill="#0f766e" text-anchor="start">3. Infrastructure Failure · 18%</text>
  <rect x="314" y="271" width="146" height="10" rx="4" fill="#e2e8f0"/>
  <rect x="314" y="271" width="65.7" height="10" rx="4" fill="#0f766e"/>
  <text x="44" y="298" font-size="10.1" font-weight="600" fill="#1e293b" text-anchor="start">Excessive tool errors 15%(Fig 6)/16%(text) · MCP server errors ~3%</text>
  <text x="44" y="315" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Case: Grok 4 &gt;1/3 str_replace fail; DeepSeek V3.2 ~50% view_file arg errs</text>
  <rect x="36" y="332" width="436" height="64" rx="6" fill="#fffbeb" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="44" y="350" font-size="11.3" font-weight="700" fill="#b45309" text-anchor="start">4. Execution Failure · 16%</text>
  <rect x="314" y="341" width="146" height="10" rx="4" fill="#e2e8f0"/>
  <rect x="314" y="341" width="58.4" height="10" rx="4" fill="#b45309"/>
  <text x="44" y="368" font-size="10.1" font-weight="600" fill="#1e293b" text-anchor="start">Import errors 6% · Compilation errors 6% · Syntax errors 4%</text>
  <text x="44" y="385" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Case: Kimi K2 &amp; Gemini 3 Pro hit ModuleNotFoundError importing missing libs</text>
  <rect x="500" y="80" width="436" height="328" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="500" y="80" width="436" height="32" rx="8" fill="#dbeafe"/>
  <rect x="500" y="100" width="436" height="12" fill="#dbeafe"/>
  <text x="512" y="101" font-size="12.2" font-weight="700" fill="#1e3a8a" text-anchor="start">Language Gradient &amp; Rubric vs. Pass@1 Gap</text>
  <text x="514" y="136" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Python (n=25)</text>
  <rect x="632" y="126" width="240" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="126" width="187.2" height="12" rx="4" fill="#1d4ed8"/>
  <text x="880" y="136" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">27.3%</text>
  <text x="514" y="151" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">Permissive runtime aids self-correction</text>
  <text x="514" y="171" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Go (n=30)</text>
  <rect x="632" y="161" width="240" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="161" width="139.9" height="12" rx="4" fill="#2563eb"/>
  <text x="880" y="171" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">20.4%</text>
  <text x="514" y="186" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">Explicit errors + compile check (op-geth)</text>
  <text x="514" y="206" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">C++ (n=10)</text>
  <rect x="632" y="196" width="240" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="196" width="137.1" height="12" rx="4" fill="#3b82f6"/>
  <text x="880" y="206" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">20.0%</text>
  <text x="514" y="221" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">Embedded C++; headers &amp; build reasoning</text>
  <text x="514" y="241" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">TypeScript (n=25)</text>
  <rect x="632" y="231" width="240" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="231" width="83.0" height="12" rx="4" fill="#64748b"/>
  <text x="880" y="241" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">12.1%</text>
  <text x="514" y="256" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">strictNullChecks &amp; module resolution friction</text>
  <text x="514" y="276" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="start">Java (n=10)</text>
  <rect x="632" y="266" width="240" height="12" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="266" width="68.6" height="12" rx="4" fill="#94a3b8"/>
  <text x="880" y="276" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">10.0%</text>
  <text x="514" y="291" font-size="9.6" font-weight="400" fill="#475569" text-anchor="start">Spring WebFlux reactive flows (-17.3 pp)</text>
  <rect x="512" y="302" width="412" height="96" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="520" y="320" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">Rubric vs. Pass@1 Split (Paper Fig. 7 &amp; op-geth #553)</text>
  <text x="520" y="340" font-size="9.9" font-weight="400" fill="#1e293b" text-anchor="start">• Fig. 7: 6 models score ~70% rubric (Kimi K2.5 80.9% Func), yet 18-32% Pass@1</text>
  <text x="520" y="359" font-size="9.9" font-weight="400" fill="#1e293b" text-anchor="start">• op-geth #553 Inspect: Opus 4.6 (7/13) &amp; DeepSeek-V3.2 (10/13) wrote helpers</text>
  <text x="520" y="378" font-size="9.9" font-weight="600" fill="#b91c1c" text-anchor="start">  yet missed wiring legacypool.go validation -&gt; 0/583 unit tests passed</text>
  <rect x="24" y="420" width="912" height="82" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
  <rect x="36" y="431" width="186" height="22" rx="5" fill="#b91c1c"/>
  <text x="129.0" y="446.0" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Boundary · The 30.2% Misses</text>
  <text x="234" y="446" font-size="10.8" font-weight="700" fill="#7f1d1d" text-anchor="start">Opus 5.5 Max&#x27;s ~30.2% miss rate on Terminus-2 CANNOT be decomposed into evidence / diagnosis / patch buckets from the page</text>
  <text x="36" y="472" font-size="10.1" font-weight="400" fill="#7f1d1d" text-anchor="start">1. The page discloses no per-task failure histogram for Opus 5.5 (&#x27;No rubric data available&#x27;); 2. In the paper&#x27;s 11-model Inspect cohort, context +</text>
  <text x="36" y="490" font-size="10.1" font-weight="400" fill="#7f1d1d" text-anchor="start">   verification account for 66% of failures—so attributing misses on Terminus-2 requires full tool trajectories and F2P/P2P logs, not score subtraction.</text>
  <text x="24" y="522" font-size="10.3" font-weight="400" fill="#64748b" text-anchor="start">Assistant diagram grounded in arXiv:2601.08806v3 (Figs. 6-7, Table 4) &amp; Mercor observability-swe grading payload (not an original figure)</text>
</svg>
