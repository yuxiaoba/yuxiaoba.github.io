  <text x="24.0" y="56.0" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">依据 Anthropic 官方发布页及 6 组内嵌 CSV 数据：区分单价降幅、token 收缩与非单调 effort 拐点</text>
