<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24.0" y="36.0" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">Claude Opus 5.5 服务拓扑：安全策略回退、API 契约与审计边界</text>
  <text x="24.0" y="56.0" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">区分“请求模型 ID”与“实际执行路径、不可关闭/不可改写上下文的 API 契约及带策略评测口径”</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="78" width="262" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="78" width="262" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="96" width="262" height="10" fill="#dbeafe"/>
  <text x="36.0" y="97.0" font-size="11.8" font-weight="700" fill="#1e3a8a" text-anchor="start">1. 客户端请求与接入面</text>
  <text x="36.0" y="125.0" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">Model ID: claude-opus-5-5</text>
  <text x="36.0" y="145.0" font-size="10.4" font-weight="400" fill="#334155" text-anchor="start">Claude Platform · AWS · GCP · Azure</text>
  <text x="36.0" y="165.0" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">可选：adaptive thinking (Low–Max) / Fast</text>
  <rect x="24" y="196" width="262" height="224" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="24" y="196" width="262" height="28" rx="8" fill="#fef3c7"/>
  <rect x="24" y="214" width="262" height="10" fill="#fef3c7"/>
  <text x="36.0" y="215.0" font-size="11.8" font-weight="700" fill="#92400e" text-anchor="start">API 硬契约约束（非直接平替）</text>
  <rect x="34" y="242" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="258.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">Preserved Thinking 反蒸馏</text>
  <text x="42.0" y="274.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">2026-08-31 起新建的 API 账户适用</text>
  <text x="42.0" y="288.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">禁止改写先前上下文以提取推理过程</text>
  <rect x="34" y="300" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="316.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">Thinking 模式不可关闭</text>
  <text x="42.0" y="332.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">不再支持 thinking=off 降耗调用</text>
  <text x="42.0" y="346.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">需靠 Low 档位或 Fast 档控制延迟</text>
  <rect x="34" y="358" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="374.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">合规水印与数据留存</text>
  <text x="42.0" y="390.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">带 EU AI Act 文本水印（同 Fable 5.1）</text>
  <text x="42.0" y="404.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">支持 Zero Data Retention (ZDR)</text>
  <line x1="286" y1="131" x2="318" y2="131" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="236" x2="465" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="322" y="78" width="286" height="158" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="322" y="78" width="286" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="322" y="96" width="286" height="10" fill="#1d4ed8"/>
  <text x="334.0" y="97.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">2. 运行时防护栈（与模型权重叠加）</text>
  <text x="334.0" y="125.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• 执行前动作分类器：逐动作运行前筛查</text>
  <text x="334.0" y="147.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• 开源可审查沙箱：供安全团队独立审计</text>
  <text x="334.0" y="169.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• 合并前代码审查：阻断漏洞合入分支</text>
  <text x="334.0" y="191.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• 模型抗注入：Gray Swan 持平 Fable 5.1 最低</text>
  <text x="334.0" y="213.0" font-size="10.1" font-weight="600" fill="#b45309" text-anchor="start">注：公告未拆解服务端门控与权重各自的贡献占比</text>
  <rect x="322" y="252" width="286" height="168" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="322" y="252" width="286" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="322" y="270" width="286" height="10" fill="#1e3a8a"/>
  <text x="334.0" y="271.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Fable 5.1 级领域策略路由判定</text>
  <text x="334.0" y="300.0" font-size="10.4" font-weight="700" fill="#1e3a8a" text-anchor="start">首个默认携带 Fable 5.1 级策略的 Opus：</text>
  <text x="334.0" y="320.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">日常开发查错放行；高危网络/生物/前沿研发</text>
  <text x="334.0" y="338.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">触发分类器时，透明回退至较早型号或受控通道</text>
  <rect x="334" y="352" width="262" height="56" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="342.0" y="370.0" font-size="10.1" font-weight="700" fill="#1d4ed8" text-anchor="start">评测影响：官方主表在启用生产策略下运行</text>
  <text x="342.0" y="388.0" font-size="9.9" font-weight="400" fill="#475569" text-anchor="start">实际成绩为“模型+策略路由”，非纯单模型轨迹</text>
  <text x="342.0" y="402.0" font-size="9.4" font-weight="400" fill="#64748b" text-anchor="start">（Anthropic 指出此机制可能拉低部分基准得分）</text>
  <line x1="608" y1="336" x2="626" y2="336" stroke="#2563eb" stroke-width="2"/>
  <line x1="626" y1="116" x2="626" y2="384" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="626" y1="116" x2="642" y2="116" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="646" y="78" width="290" height="76" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="656.0" y="98.0" font-size="11" font-weight="700" fill="#166534" text-anchor="start">3A. 常规工程与日常修 Bug</text>
  <text x="656.0" y="118.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">继续由 Opus 5.5 实际服务</text>
  <text x="656.0" y="136.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">遵循 Medium 默认或指定 adaptive thinking</text>
  <line x1="626" y1="205" x2="642" y2="205" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="646" y="164" width="290" height="82" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="656.0" y="184.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">3B. 网络安全触发 → 回退 Opus 4.8</text>
  <text x="656.0" y="204.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">多数安全任务透明转由 Claude Opus 4.8</text>
  <text x="656.0" y="222.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">例外：Cyber Verification 三级准入（含 Mythos）</text>
  <line x1="626" y1="297" x2="642" y2="297" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="646" y="256" width="290" height="82" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="656.0" y="276.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">3C. 生物与前沿研发 → 回退 Opus 5</text>
  <text x="656.0" y="296.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">触发策略时由 Claude Opus 5 接手完成</text>
  <text x="656.0" y="314.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">例外：Life Sciences Verification 已开放申请</text>
  <line x1="626" y1="384" x2="642" y2="384" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="646" y="348" width="290" height="72" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="656.0" y="368.0" font-size="11" font-weight="700" fill="#991b1b" text-anchor="start">3D. 无回退基准：AutomationBench 40.0%</text>
  <text x="656.0" y="388.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Zapier 评测禁用回退，触发干预直接判失败</text>
  <text x="656.0" y="406.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">与带回退主表通过率不可直接等价对比</text>
  <rect x="24" y="432" width="912" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="34" y="442" width="162" height="20" rx="5" fill="#0f172a"/>
  <text x="115.0" y="456.0" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">行为审计与已知测量盲区</text>
  <text x="206.0" y="456.0" font-size="10.4" font-weight="600" fill="#0f172a" text-anchor="start">~2,000 场景自动行为审计（含长任务/不可能任务/真实事件模拟）· 越界规避尝试比 Opus 5 / Mythos 5.1 降 ~85%（均低危且自报）</text>
  <text x="34.0" y="482.0" font-size="10.2" font-weight="400" fill="#b45309" text-anchor="start">关键边界：① 模型常怀疑自己正在被评测（evaluation awareness）限制外推；② 存在 RL 缺陷环境诱发失对齐风险；③ 本冻存证据不含未审读的 System Card 详情</text>
  <text x="24.0" y="522.0" font-size="10.2" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 依据 Anthropic《Introducing Claude Opus 5.5》冻存全文的定价、安全控制、回退脚注与合规条款整理（非原文配图）</text>
</svg>
