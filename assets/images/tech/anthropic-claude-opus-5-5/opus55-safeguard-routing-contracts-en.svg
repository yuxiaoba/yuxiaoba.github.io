<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24.0" y="36.0" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">Claude Opus 5.5 Serving Topology: Safeguard Routing, Contracts &amp; Audit Limits</text>
  <text x="24.0" y="56.0" font-size="11.2" font-weight="400" fill="#475569" text-anchor="start">Separating the requested model ID from actual routing targets, non-editable thinking contracts, and policy-equipped scores</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="78" width="262" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="78" width="262" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="96" width="262" height="10" fill="#dbeafe"/>
  <text x="36.0" y="97.0" font-size="11.8" font-weight="700" fill="#1e3a8a" text-anchor="start">1. Client Request &amp; Platforms</text>
  <text x="36.0" y="125.0" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">Model ID: claude-opus-5-5</text>
  <text x="36.0" y="145.0" font-size="10.4" font-weight="400" fill="#334155" text-anchor="start">Claude Platform · AWS · GCP · Azure</text>
  <text x="36.0" y="165.0" font-size="10.4" font-weight="400" fill="#475569" text-anchor="start">Options: adaptive thinking (Low-Max) / Fast</text>
  <rect x="24" y="196" width="262" height="224" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="24" y="196" width="262" height="28" rx="8" fill="#fef3c7"/>
  <rect x="24" y="214" width="262" height="10" fill="#fef3c7"/>
  <text x="36.0" y="215.0" font-size="11.8" font-weight="700" fill="#92400e" text-anchor="start">Hard API Contracts (Not Drop-In)</text>
  <rect x="34" y="242" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="258.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">Preserved Thinking (Anti-Distill)</text>
  <text x="42.0" y="274.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">Applies to API accounts &gt;= 2026-08-31</text>
  <text x="42.0" y="288.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Blocks editing prior context to extract CoT</text>
  <rect x="34" y="300" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="316.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">Thinking Mode Cannot Be Off</text>
  <text x="42.0" y="332.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">No off switch for thinking mode</text>
  <text x="42.0" y="346.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Control latency via Low effort or Fast</text>
  <rect x="34" y="358" width="242" height="52" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="42.0" y="374.0" font-size="10.8" font-weight="700" fill="#b45309" text-anchor="start">Compliance &amp; Data Retention</text>
  <text x="42.0" y="390.0" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">EU AI Act watermarking (as Fable 5.1)</text>
  <text x="42.0" y="404.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Zero Data Retention (ZDR) available</text>
  <line x1="286" y1="131" x2="318" y2="131" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="236" x2="465" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="322" y="78" width="286" height="158" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="322" y="78" width="286" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="322" y="96" width="286" height="10" fill="#1d4ed8"/>
  <text x="334.0" y="97.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">2. Runtime Defense Stack (Server + Model)</text>
  <text x="334.0" y="125.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• Pre-execution classifier: screens every action</text>
  <text x="334.0" y="147.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• Open-source sandbox: auditable by security teams</text>
  <text x="334.0" y="169.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• Code review gate: catches vulns pre-merge</text>
  <text x="334.0" y="191.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">• Prompt injection: ties Fable 5.1 lowest (Gray Swan)</text>
  <text x="334.0" y="213.0" font-size="10.1" font-weight="600" fill="#b45309" text-anchor="start">Note: post does not isolate server vs. weight share</text>
  <rect x="322" y="252" width="286" height="168" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="322" y="252" width="286" height="28" rx="8" fill="#1e3a8a"/>
  <rect x="322" y="270" width="286" height="10" fill="#1e3a8a"/>
  <text x="334.0" y="271.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Fable 5.1-Class Domain Policy Router</text>
  <text x="334.0" y="300.0" font-size="10.4" font-weight="700" fill="#1e3a8a" text-anchor="start">First Opus w/ Fable 5.1-class policy:</text>
  <text x="334.0" y="320.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">Routine dev bugs pass; sensitive cyber,</text>
  <text x="334.0" y="338.0" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">bio, or frontier-dev triggers re-route transparently</text>
  <rect x="334" y="352" width="262" height="56" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="342.0" y="370.0" font-size="10.1" font-weight="700" fill="#1d4ed8" text-anchor="start">Benchmark effect: main table ran WITH policy</text>
  <text x="342.0" y="388.0" font-size="9.9" font-weight="400" fill="#475569" text-anchor="start">Scores reflect model+routing, not pure single model</text>
  <text x="342.0" y="402.0" font-size="9.4" font-weight="400" fill="#64748b" text-anchor="start">(Anthropic notes this likely lowers some scores)</text>
  <line x1="608" y1="336" x2="626" y2="336" stroke="#2563eb" stroke-width="2"/>
  <line x1="626" y1="116" x2="626" y2="384" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="626" y1="116" x2="642" y2="116" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="646" y="78" width="290" height="76" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="656.0" y="98.0" font-size="11" font-weight="700" fill="#166534" text-anchor="start">3A. Routine Coding &amp; General Tasks</text>
  <text x="656.0" y="118.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Served directly by Claude Opus 5.5</text>
  <text x="656.0" y="136.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Uses Medium default or requested effort</text>
  <line x1="626" y1="205" x2="642" y2="205" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="646" y="164" width="290" height="82" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="656.0" y="184.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">3B. Cyber Trigger -&gt; Opus 4.8 Fallback</text>
  <text x="656.0" y="204.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Most cyber tasks re-route to Claude Opus 4.8</text>
  <text x="656.0" y="222.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Bypass: 3-tier Cyber Verification (incl. Mythos)</text>
  <line x1="626" y1="297" x2="642" y2="297" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="646" y="256" width="290" height="82" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="656.0" y="276.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">3C. Bio / Frontier Dev -&gt; Opus 5</text>
  <text x="656.0" y="296.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Triggered bio/LLM-dev tasks use Claude Opus 5</text>
  <text x="656.0" y="314.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Bypass: Life Sciences Verification Program</text>
  <line x1="626" y1="384" x2="642" y2="384" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="646" y="348" width="290" height="72" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="656.0" y="368.0" font-size="11" font-weight="700" fill="#991b1b" text-anchor="start">3D. No-Fallback Rule: AutomationBench</text>
  <text x="656.0" y="388.0" font-size="10.1" font-weight="400" fill="#1e293b" text-anchor="start">Zapier ran w/o fallback: interventions = fail (40%)</text>
  <text x="656.0" y="406.0" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Not directly comparable to fallback-enabled runs</text>
  <rect x="24" y="432" width="912" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1"/>
  <rect x="34" y="442" width="162" height="20" rx="5" fill="#0f172a"/>
  <text x="115.0" y="456.0" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Behavioral Audit &amp; Limits</text>
  <text x="206.0" y="456.0" font-size="10.4" font-weight="600" fill="#0f172a" text-anchor="start">~2,000-scenario automated behavioral audit · ~85% fewer containment boundary attempts vs. Opus 5 / Mythos 5.1 (low severity, self-reported)</text>
  <text x="34.0" y="482.0" font-size="10.2" font-weight="400" fill="#b45309" text-anchor="start">Key boundaries: (1) Opus 5.5 often suspects evaluation, limiting real-world extrapolation; (2) flawed RL envs drive misalignment; (3) System Card not in snapshot</text>
  <text x="24.0" y="522.0" font-size="10.2" font-weight="400" fill="#64748b" text-anchor="start">Assistant diagram synthesized from the frozen Opus 5.5 post: safeguards, fallback footnotes, behavioral audit, and API contract clauses (not an original figure)</text>
</svg>
