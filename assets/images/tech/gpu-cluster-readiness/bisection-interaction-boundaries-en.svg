<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="38" font-size="18.5" font-weight="700" fill="#0f172a">testScale Grouping, Adaptive Bisection &amp; Interaction-Fault Boundaries</text>
  <text x="24" y="58" font-size="11.2" fill="#475569">Left: physical scope of 4 testScale modes · Right: diagnose bisection loop &amp; interaction-fault boundary rules</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Panel: 4 testScale Modes -->
  <rect x="24" y="78" width="324" height="422" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="78" width="324" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="96" width="324" height="10" fill="#dbeafe"/>
  <text x="36" y="97" font-size="12" font-weight="700" fill="#1e3a8a">1. testScale Modes &amp; Measured Scope</text>

  <!-- Card 1: intra-node -->
  <rect x="36" y="116" width="300" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="124" width="96" height="20" rx="4" fill="#e0f2fe"/>
  <text x="92" y="138" font-size="10.2" font-weight="700" fill="#075985" text-anchor="middle">intra-node</text>
  <text x="148" y="138" font-size="10.8" font-weight="700" fill="#0f172a">Per-node independent</text>
  <text x="44" y="160" font-size="10" fill="#334155">Runs independently on every target node</text>
  <text x="44" y="177" font-size="10" fill="#475569">Tests: node GPUs, PCIe &amp; local NVLink</text>
  <text x="44" y="194" font-size="9.4" fill="#64748b">Blind to: cross-node NICs &amp; switch paths</text>

  <!-- Card 2: intra-rack -->
  <rect x="36" y="212" width="300" height="88" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="44" y="220" width="96" height="20" rx="4" fill="#dbeafe"/>
  <text x="92" y="234" font-size="10.2" font-weight="700" fill="#1e3a8a" text-anchor="middle">intra-rack</text>
  <text x="148" y="234" font-size="10.8" font-weight="700" fill="#1e3a8a">Partition by gpu.clique</text>
  <text x="44" y="256" font-size="10" fill="#334155">Splits by nvidia.com/gpu.clique label</text>
  <text x="44" y="273" font-size="10" fill="#475569">Tests: intra-NVLink / MNNVL fabric domain</text>
  <text x="44" y="290" font-size="9.4" fill="#1e40af">Caveat: NVLink pass ≠ scale-out fabric pass</text>

  <!-- Card 3: full-scale -->
  <rect x="36" y="308" width="300" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="44" y="316" width="96" height="20" rx="4" fill="#e0e7ff"/>
  <text x="92" y="330" font-size="10.2" font-weight="700" fill="#312e81" text-anchor="middle">full-scale</text>
  <text x="148" y="330" font-size="10.8" font-weight="700" fill="#0f172a">Single full-cluster group</text>
  <text x="44" y="352" font-size="10" fill="#334155">Places all selected nodes into one job</text>
  <text x="44" y="369" font-size="10" fill="#475569">Tests: cross-rack fabric &amp; global sync</text>
  <text x="44" y="386" font-size="9.4" fill="#64748b">Tradeoff: slowdowns implicate every node</text>

  <!-- Card 4: diagnose -->
  <rect x="36" y="404" width="300" height="88" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <rect x="44" y="412" width="96" height="20" rx="4" fill="#fef3c7"/>
  <text x="92" y="426" font-size="10.2" font-weight="700" fill="#92400e" text-anchor="middle">diagnose</text>
  <text x="148" y="426" font-size="10.8" font-weight="700" fill="#78350f">Adaptive bisection mode</text>
  <text x="44" y="448" font-size="10" fill="#334155">Halves failing groups down to minGroupSize</text>
  <text x="44" y="465" font-size="10" fill="#475569">maxConcurrent caps test fabric pressure</text>
  <text x="44" y="482" font-size="9.4" fill="#92400e">Output: narrow suspect set + node reasons</text>

  <!-- Right Panel: Bisection + Interaction Boundaries -->
  <rect x="362" y="78" width="574" height="422" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="362" y="78" width="574" height="28" rx="8" fill="#dbeafe"/>
  <rect x="362" y="96" width="574" height="10" fill="#dbeafe"/>
  <text x="374" y="97" font-size="12" font-weight="700" fill="#1e3a8a">2. Bisection Loop &amp; Interaction-Fault Engineering Boundaries</text>

  <!-- Bisection Step 1 -->
  <rect x="374" y="116" width="160" height="154" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.1"/>
  <rect x="384" y="124" width="140" height="20" rx="4" fill="#dc2626"/>
  <text x="454" y="138" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1 · Group Fails</text>
  <text x="384" y="162" font-size="10.4" font-weight="700" fill="#0f172a">64-Node All-Reduce</text>
  <text x="384" y="182" font-size="9.6" fill="#334155">BusBW misses CEL gate</text>
  <text x="384" y="201" font-size="9.6" fill="#334155">Sync waits hide culprit</text>
  <text x="384" y="220" font-size="9.6" fill="#334155">All 64 ranks implicated</text>
  <text x="384" y="252" font-size="9.4" fill="#991b1b">Manual bisect takes days</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="536" y1="193" x2="565" y2="193" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="551" y="183" font-size="9.8" font-weight="700" fill="#1d4ed8" text-anchor="middle">÷ 2</text>

  <!-- Bisection Step 2 -->
  <rect x="569" y="116" width="168" height="154" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="579" y="124" width="148" height="20" rx="4" fill="#1d4ed8"/>
  <text x="653" y="138" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2 · Bisect &amp; Cap</text>
  <rect x="579" y="152" width="148" height="28" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="653" y="170" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">Group A (32) · PASS</text>
  <rect x="579" y="186" width="148" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="653" y="204" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">Group B (32) · FAIL</text>
  <text x="579" y="233" font-size="9.4" fill="#1e3a8a">Split &amp; rerun failing half</text>
  <text x="579" y="252" font-size="9.4" fill="#334155">maxConcurrent caps jobs</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="739" y1="193" x2="768" y2="193" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="754" y="183" font-size="9.2" font-weight="700" fill="#1d4ed8" text-anchor="middle">min</text>

  <!-- Bisection Step 3 -->
  <rect x="772" y="116" width="152" height="154" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <rect x="782" y="124" width="132" height="20" rx="4" fill="#166534"/>
  <text x="848" y="138" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3 · Suspects</text>
  <text x="782" y="162" font-size="9.8" font-weight="700" fill="#0f172a">At minGroupSize</text>
  <text x="782" y="182" font-size="9.5" fill="#334155">Flag failing leaves</text>
  <text x="782" y="210" font-size="9.1" fill="#991b1b">gpu-node-07: Limit</text>
  <text x="782" y="228" font-size="9.1" fill="#991b1b">gpu-node-12: HW Fail</text>
  <text x="782" y="252" font-size="9.3" fill="#166534">Handed to NVSentinel</text>

  <!-- Bottom Edge Case A: Interaction Faults -->
  <rect x="374" y="282" width="270" height="208" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="384" y="292" width="250" height="24" rx="4" fill="#fef3c7"/>
  <text x="509" y="308" font-size="10.8" font-weight="700" fill="#92400e" text-anchor="middle">Edge Case A: Interaction Faults</text>
  <text x="386" y="334" font-size="9.6" font-weight="700" fill="#78350f">Signal: both halves pass, parent fails</text>
  <text x="386" y="352" font-size="9.5" fill="#334155">Cause: cross-switch links, peer pairs,</text>
  <text x="386" y="369" font-size="9.5" fill="#334155">or high load vanishes when partitioned</text>
  <text x="386" y="393" font-size="9.6" font-weight="700" fill="#991b1b">Rule: never treat this as "resolved"</text>
  <text x="386" y="413" font-size="9.5" fill="#0f172a">• Archive composite failure signature</text>
  <text x="386" y="431" font-size="9.5" fill="#0f172a">• Keep failing set &amp; vary partitions</text>
  <text x="386" y="449" font-size="9.5" fill="#0f172a">• Inspect shared uplinks &amp; scale load</text>
  <text x="386" y="476" font-size="9" fill="#92400e">(Engineering boundary extending blog flow)</text>

  <!-- Bottom Edge Case B: Scope & Invalidation -->
  <rect x="654" y="282" width="270" height="208" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="664" y="292" width="250" height="24" rx="4" fill="#dbeafe"/>
  <text x="789" y="308" font-size="10.8" font-weight="700" fill="#1e3a8a" text-anchor="middle">Edge Case B: Scope &amp; Invalidation</text>
  <text x="666" y="334" font-size="9.6" font-weight="700" fill="#1e3a8a">1. Stamp explicit test scope on PASS</text>
  <text x="666" y="351" font-size="9.5" fill="#334155">Log nodes, fabric, msg size &amp; duration</text>
  <text x="666" y="375" font-size="9.6" font-weight="700" fill="#1e3a8a">2. Version CEL thresholds explicitly</text>
  <text x="666" y="392" font-size="9.5" fill="#334155">Re-baseline across GPU, NCCL &amp; scale</text>
  <text x="666" y="416" font-size="9.6" font-weight="700" fill="#1e3a8a">3. Invalidation &amp; safe quarantine</text>
  <text x="666" y="433" font-size="9.5" fill="#334155">Retest on driver, NIC FW, or repair</text>
  <text x="666" y="451" font-size="9.5" fill="#334155">Check confidence &amp; rollback pre-drain</text>
  <text x="666" y="476" font-size="9" fill="#1e40af">• Chaos test: inject slow rank &amp; cost</text>

  <!-- Footer -->
  <text x="24" y="521" font-size="10" fill="#64748b">Assistant diagram combining NVCRE testScale / diagnose mechanics with engineering interaction-fault boundaries (not an original figure)</text>
</svg>
