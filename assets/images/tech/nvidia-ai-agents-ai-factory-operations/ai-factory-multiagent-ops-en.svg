<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Lato','Noto Sans CJK SC',sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header -->
  <text x="24" y="36" font-size="18" font-weight="700" fill="#0f172a">NVIDIA AI Factory Operations Agent: Control-Plane &amp; Cross-Layer Topology</text>
  <text x="24" y="56" font-size="11" fill="#475569">From NVIDIA Tech Blog (2026-11-04): Helm-deployed control plane routing 6 domain agents across DGX telemetry</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Interfaces, Helm Control Plane, Isolated Inference -->
  <rect x="24" y="76" width="232" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.1"/>
  <rect x="34" y="84" width="122" height="20" rx="5" fill="#1d4ed8"/>
  <text x="95" y="98" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">Entry &amp; Audit UI</text>
  <text x="34" y="121" font-size="10.5" font-weight="600" fill="#1e3a8a">Built-in Web Chat UI</text>
  <text x="34" y="138" font-size="9.8" fill="#334155">Natural language · switch tasks</text>
  <text x="34" y="154" font-size="9.8" fill="#475569">Live charts + coding-agent API</text>

  <line x1="258" y1="120" x2="278" y2="120" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="282" y="76" width="372" height="88" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="292" y="84" width="180" height="20" rx="5" fill="#1e3a8a"/>
  <text x="382" y="98" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">K8s Control Plane (Helm)</text>
  <text x="482" y="98" font-size="10.5" font-weight="700" fill="#0f172a">NemoClaw Blueprint</text>
  <text x="292" y="121" font-size="10.2" fill="#0f172a">OpenClaw gateway + NemoClaw domain routing</text>
  <text x="292" y="138" font-size="10" fill="#1e3a8a">OpenShell runtime + focused MCP tool servers</text>
  <text x="292" y="154" font-size="9.8" fill="#1e40af">Tracks every action &amp; tool trace for auditability</text>

  <line x1="656" y1="120" x2="676" y2="120" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="680" y="76" width="256" height="88" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.1"/>
  <rect x="690" y="84" width="152" height="20" rx="5" fill="#166534"/>
  <text x="766" y="98" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">Compute Isolation</text>
  <text x="690" y="121" font-size="10.5" font-weight="600" fill="#14532d">Local: NVIDIA Nemotron</text>
  <text x="690" y="138" font-size="9.8" fill="#166534">Large scale: dedicated GPU plane</text>
  <text x="690" y="154" font-size="9.8" fill="#334155">Smaller: RTX PRO / DGX Spark</text>

  <!-- Routing connector down to Domain Agents -->
  <line x1="468" y1="164" x2="468" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row 2: Six Specialist Sub-Agents + Cross-Cutting MCP -->
  <rect x="24" y="184" width="912" height="182" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="184" width="912" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="202" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="202" font-size="11.5" font-weight="700" fill="#1e3a8a">Domain-Specific Sub-Agents (Clear Boundaries; OpenClaw Plugins &amp; Focused MCP Tools; Advisory Output Only)</text>

  <!-- Agent Row A -->
  <rect x="36" y="220" width="288" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="46" y="238" font-size="10.8" font-weight="700" fill="#1e3a8a">Job Recovery Agent</text>
  <text x="46" y="257" font-size="9.5" fill="#334155">Detects job/goodput drops; 4-layer RCA advice</text>

  <rect x="336" y="220" width="288" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="346" y="238" font-size="10.8" font-weight="700" fill="#1e3a8a">Hardware Agent</text>
  <text x="346" y="257" font-size="9.5" fill="#334155">Triages PCIe, ECC, GPU, NVMe &amp; thermal faults</text>

  <rect x="636" y="220" width="288" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="646" y="238" font-size="10.8" font-weight="700" fill="#1e3a8a">Observability Agent</text>
  <text x="646" y="257" font-size="9.5" fill="#334155">Queries Prometheus &amp; Loki; builds live UI charts</text>

  <!-- Agent Row B -->
  <rect x="36" y="280" width="288" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="46" y="298" font-size="10.8" font-weight="700" fill="#1e3a8a">Research Agent</text>
  <text x="46" y="317" font-size="9.5" fill="#334155">Searches Mission Control, SuperPOD &amp; runbooks</text>

  <rect x="336" y="280" width="288" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="346" y="298" font-size="10.8" font-weight="700" fill="#1e3a8a">Kubernetes Agent</text>
  <text x="346" y="317" font-size="9.5" fill="#334155">Read-only pods, services, GPUs &amp; scheduling</text>

  <rect x="636" y="280" width="288" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="646" y="298" font-size="10.8" font-weight="700" fill="#1e3a8a">Cluster Management Agent</text>
  <text x="646" y="317" font-size="9.5" fill="#334155">Diagnostic MCP to Base Command Manager APIs</text>

  <!-- Cross-cutting MCP strip -->
  <rect x="36" y="338" width="888" height="20" rx="4" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
  <text x="46" y="352" font-size="9.8" font-weight="600" fill="#0369a1">Cross-Cutting MCP &amp; Adapters: Web Search · Code Execution · Grafana Dashboards · Custom Site Schedulers / APIs</text>

  <!-- Telemetry Connectors between Row 2 & Row 3 -->
  <line x1="143" y1="386" x2="143" y2="369" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="368" y1="386" x2="368" y2="369" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="593" y1="386" x2="593" y2="369" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="817" y1="386" x2="817" y2="369" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row 3: Production DGX SuperPOD Telemetry Plane -->
  <rect x="24" y="388" width="912" height="108" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="36" y="407" font-size="11" font-weight="700" fill="#0f172a">Production AI Factory (DGX H100 / B200 / GB300): Telemetry Export Only — Zero Training GPU Contention</text>

  <rect x="36" y="417" width="214" height="69" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="436" font-size="10.5" font-weight="700" fill="#1e3a8a">Compute &amp; Hardware</text>
  <text x="46" y="454" font-size="9.6" fill="#334155">GPU issues · ECC errors</text>
  <text x="46" y="472" font-size="9.6" fill="#475569">PCIe · NVMe · thermals</text>

  <rect x="261" y="417" width="214" height="69" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="271" y="436" font-size="10.5" font-weight="700" fill="#1e3a8a">Network &amp; Application</text>
  <text x="271" y="454" font-size="9.6" fill="#334155">Cross-layer network signals</text>
  <text x="271" y="472" font-size="9.6" fill="#475569">Job drops &amp; goodput</text>

  <rect x="486" y="417" width="214" height="69" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="496" y="436" font-size="10.5" font-weight="700" fill="#1e3a8a">Scheduler &amp; Cluster</text>
  <text x="496" y="454" font-size="9.6" fill="#334155">K8s pods &amp; GPU state</text>
  <text x="496" y="472" font-size="9.6" fill="#475569">Base Command Manager</text>

  <rect x="711" y="417" width="213" height="69" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="721" y="436" font-size="10.5" font-weight="700" fill="#92400e">Observability &amp; Docs</text>
  <text x="721" y="454" font-size="9.6" fill="#78350f">Prometheus + Grafana Loki</text>
  <text x="721" y="472" font-size="9.6" fill="#92400e">Mission Control &amp; runbooks</text>

  <!-- Footer -->
  <text x="24" y="518" font-size="10" fill="#64748b">Assistant diagram (not an original figure) · Based on Kavya G Y &amp; Rohan Adwankar (2026-11-04); experimental OSS; no MTTR/RCA benchmarks</text>
</svg>
