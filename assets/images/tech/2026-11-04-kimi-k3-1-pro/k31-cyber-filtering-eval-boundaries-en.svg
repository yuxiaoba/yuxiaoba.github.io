  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="36" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">Two-Stage Cyber Filtering Ablation &amp; Benchmark Evaluation Conditions</text>
  <text x="24" y="56" font-size="11.0" font-weight="400" fill="#475569" text-anchor="start">Top: xdev-bench-hard removal vs. general-coding transfer · Bottom: 6 footnote overrides beyond max / temp 1.0 / top-p 0.95</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="76" width="912" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
