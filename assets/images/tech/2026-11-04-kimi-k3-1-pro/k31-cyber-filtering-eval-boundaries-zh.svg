<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="36" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">双阶段安全数据过滤消融与基准评测条件约束矩阵</text>
  <text x="24" y="56" font-size="11.0" font-weight="400" fill="#475569" text-anchor="start">左/上：xdev-bench-hard 对照干预与能力迁移 · 下：默认设定（max / temp 1.0 / top-p 0.95）之外的六类脚注例外</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="76" width="912" height="214" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="76" width="912" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="94" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="95" font-size="11.6" font-weight="700" fill="#1e3a8a" text-anchor="start">网络安全训练干预与 xdev-bench-hard（pass@3）实测对比：移除安全数据无法阻断通用编码迁移</text>
  <rect x="36" y="114" width="212" height="72" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="134" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">阶段 1 · Mid-Training 语料</text>
  <text x="46" y="154" font-size="10" font-weight="400" fill="#1e293b" text-anchor="start">识别并剔除嵌入的漏洞利用内容</text>
  <text x="46" y="172" font-size="10" font-weight="400" fill="#475569" text-anchor="start">保留通用软件工程与代码语料</text>
  <rect x="260" y="114" width="212" height="72" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="270" y="134" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">阶段 2 · RL 环境混合</text>
  <text x="270" y="154" font-size="10" font-weight="400" fill="#1e293b" text-anchor="start">从训练环境组合中剔除安全任务</text>
  <text x="270" y="172" font-size="10" font-weight="400" fill="#475569" text-anchor="start">保留长程调试与通用代理训练</text>
  <rect x="36" y="196" width="436" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="215" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="start">xdev-bench-hard 沙箱验证设置（KimiCode harness）</text>
  <text x="46" y="234" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">• 题目来源：Linux 内核 / Node.js / JavaScriptCore / Exim / VirGL（开启缓解）</text>
  <text x="46" y="251" font-size="9.8" font-weight="400" fill="#334155" text-anchor="start">• 输入与判据：易受攻击源码 + 简短提示 + 二进制 → 独立沙箱提权 ACE 取密钥</text>
  <text x="46" y="268" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">• 采样口径：随机子集 pass@3，无硬超时与输出 token 上限（未公开完整数据集规模）</text>
  <rect x="488" y="114" width="436" height="164" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="134" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">xdev-bench-hard 通过率对照（pass@3 %）</text>
  <text x="500" y="159" font-size="9.9" font-weight="600" fill="#1e293b" text-anchor="start">Kimi K3（前代基准）</text>
  <rect x="500" y="164" width="240" height="11" rx="3" fill="#e2e8f0"/>
  <rect x="500" y="164" width="79.9" height="11" rx="3" fill="#94a3b8"/>
  <text x="748" y="173" font-size="9.8" font-weight="700" fill="#0f172a" text-anchor="start">33.3%</text>
  <text x="500" y="193" font-size="9.9" font-weight="600" fill="#1e293b" text-anchor="start">K3.1 Pro 最终版（双阶段已过滤）</text>
  <rect x="500" y="198" width="240" height="11" rx="3" fill="#e2e8f0"/>
  <rect x="500" y="198" width="194.4" height="11" rx="3" fill="#1d4ed8"/>
  <text x="748" y="207" font-size="9.8" font-weight="700" fill="#0f172a" text-anchor="start">81.0% (+47.7 pp 迁移)</text>
  <text x="500" y="227" font-size="9.9" font-weight="600" fill="#1e293b" text-anchor="start">K3.1 Pro 未过滤检查点（内部对照）</text>
  <rect x="500" y="232" width="240" height="11" rx="3" fill="#e2e8f0"/>
  <rect x="500" y="232" width="217.2" height="11" rx="3" fill="#f59e0b"/>
  <text x="748" y="241" font-size="9.8" font-weight="700" fill="#0f172a" text-anchor="start">90.5% (-9.5 pp 过滤降幅)</text>
  <text x="500" y="266" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">外部对比（落后 &gt;3 月闭源前沿）：ExploitBench 74.7 (GPT-6 100) · ExploitGym 20.7 (42.4)</text>
  <rect x="24" y="300" width="912" height="202" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="300" width="912" height="28" rx="8" fill="#dbeafe"/>
  <rect x="24" y="318" width="912" height="10" fill="#dbeafe"/>
  <text x="36" y="319" font-size="11.6" font-weight="700" fill="#1e3a8a" text-anchor="start">基准评测协议与六大脚注例外（默认：max reasoning effort · temperature=1.0 · top-p=0.95）</text>
  <rect x="36" y="338" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="46" y="358" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">1. 执行 Harness 不统一</text>
  <text x="46" y="377" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">编程类与 OfficeQA 用 Claude-Code；</text>
  <text x="46" y="394" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">ALE/xdev 用 KimiCode；GPT 用 Codex</text>
  <rect x="336" y="338" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="346" y="358" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">2. 采样与上下文重写</text>
  <text x="346" y="377" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">BrowseComp 改 top-p=1.0、200K</text>
  <text x="346" y="394" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">压缩、500 步强答；MCP 限 100 轮</text>
  <rect x="636" y="338" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="646" y="358" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">3. 子集抽样与裁判替换</text>
  <text x="646" y="377" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">BenchCAD 抽 1,000/17,900；</text>
  <text x="646" y="394" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">PostTrainBench 用 H20 换裁判</text>
  <rect x="36" y="416" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="46" y="436" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">4. 多源最大值与回退</text>
  <text x="46" y="455" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">TB4 表混用博客/榜单最大值；</text>
  <text x="46" y="472" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">闭源脚注注有 fallback 与护栏</text>
  <rect x="336" y="416" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="346" y="436" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">5. 联网作弊判零处理</text>
  <text x="346" y="455" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">ALE 与纯图 PDF OfficeQA 中</text>
  <text x="346" y="472" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">查网偷取答案轨迹全部强制判 0</text>
  <rect x="636" y="416" width="288" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="646" y="436" font-size="10.8" font-weight="700" fill="#1d4ed8" text-anchor="start">6. 变体与压力口径边界</text>
  <text x="646" y="455" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">Highspeed 2–3× 缺质效对照表；</text>
  <text x="646" y="472" font-size="9.8" font-weight="400" fill="#475569" text-anchor="start">Hallu Bench 属高压测试非日常值</text>
  <text x="24" y="522" font-size="10.2" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图（非原文配图）· 综合原文 Cyber 模块与 Coding / Agentic / Reasoning / Cyber 四组脚注整理</text>
</svg>
