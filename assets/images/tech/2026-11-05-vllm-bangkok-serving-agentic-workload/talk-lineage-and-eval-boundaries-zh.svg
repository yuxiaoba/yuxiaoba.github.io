  <path d="M 86 396 C 122 404, 174 434, 238 460" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="90" cy="397" r="4" fill="#1d4ed8"/>
  <circle cx="152" cy="422" r="4" fill="#1d4ed8"/>
  <circle cx="234" cy="458" r="4" fill="#1d4ed8"/>
  <line x1="156" y1="420" x2="206" y2="394" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="166" y="388" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="start">推向右上前沿</text>

  <text x="272" y="398" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="start">左上 · 批量最经济</text>
  <text x="272" y="414" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">高每卡吞吐，适异步后台</text>
  <text x="272" y="436" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="start">右下 · 单用户最快</text>
  <text x="272" y="452" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">低并发 + SpecDec 降延迟</text>
  <text x="272" y="474" font-size="9" font-weight="400" fill="#64748b" text-anchor="start">含 GB200/GB300/MI355X</text>

  <!-- Right Panel: Checklist -->
  <rect x="462" y="350" width="474" height="148" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="476" y="370" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">上线前核查四项（系 vLLM Bangkok 建议，非演讲原表）</text>
  <text x="476" y="395" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">① 先量真实流量：输入输出比、每会话轮次与实际驻留命中率</text>
  <text x="476" y="419" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">② 固定前缀顺序：系统提示与工具定义前置，剔除变化时间戳</text>
  <text x="476" y="443" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">③ 明确选型点位：离线代理追每卡吞吐，交互任务盯 P90 速率</text>
  <text x="476" y="467" font-size="9.8" font-weight="400" fill="#1e293b" text-anchor="start">④ 跨节点才拆 P/D：单机可满足时避免过早引入 Mooncake/NIXL</text>
  <text x="476" y="487" font-size="9.2" font-weight="400" fill="#64748b" text-anchor="start">对照：不能拿未调优的 system-prompt-only 基线直接推算线上收益</text>

  <text x="24" y="522" font-size="10.2" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 核对自 vLLM Bangkok 总结、vLLM Blog (2026-05 / 09 / 10)、Inferact TPU 与 Q4 Roadmap（非原文配图）</text>
