<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#ffffff;font-family:'Noto Sans SC', 'PingFang SC', 'Lato', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">无人值守 Agent 七项故障测试与三道执行控制面</text>
  <text x="24" y="58" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">依据 MASA（@themahis）测试框架与 10 份参考标准：用外部环境实态检验执行控制，而非轻信模型自述</text>
  <line x1="24" y1="68" x2="936" y2="68" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="78" width="446" height="54" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="34" y="86" width="134" height="20" rx="5" fill="#b45309"/>
  <text x="101.0" y="100.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">仅参考 · Transcript</text>
  <text x="176" y="100" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="start">模型声称未发邮件 / 仅见局部重规划日志</text>
  <text x="34" y="122" font-size="10.5" font-weight="400" fill="#92400e" text-anchor="start">模型可能误判预算、忽略重试上限或产生“自认守规”的幻觉</text>
  <rect x="490" y="78" width="446" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="500" y="86" width="146" height="20" rx="5" fill="#1d4ed8"/>
  <text x="573.0" y="100.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">判据核心 · Outcome</text>
  <text x="654" y="100" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="start">真实环境副作用与独立组件账本</text>
  <text x="500" y="122" font-size="10.5" font-weight="400" fill="#1e40af" text-anchor="start">比对 Mock 邮件、网络抓包、权限拒绝与供应商账单一致</text>
  <rect x="24" y="144" width="292" height="282" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="24" y="144" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="24" y="164" width="292" height="10" fill="#dbeafe"/>
  <text x="36" y="164" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">控制面 1 · 输入与外部调用门控</text>
  <rect x="34" y="182" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="202" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 1 · 工具故障 (5 响应)</text>
  <text x="42" y="222" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">503 / 429 / 401 / 400 / Timeout；遵 Retry-After</text>
  <text x="42" y="240" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">例上限 3 次试/截止期；禁 401 换工具绕行</text>
  <rect x="34" y="262" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="282" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 2 · 硬预算上限</text>
  <text x="42" y="302" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">例上限：$3 · 20 次付费调用 · 3 次试/操作</text>
  <text x="42" y="320" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">发送前预扣防并发超支（$7.40 != $3）</text>
  <rect x="34" y="342" width="272" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="362" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 3 · 间接提示注入</text>
  <text x="42" y="382" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">网页夹带盗密外链；探针 CONFIDENTIAL_123</text>
  <text x="42" y="400" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">网页视作纯数据 + 独立工具权阻断外传</text>
  <rect x="334" y="144" width="292" height="282" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="334" y="144" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="334" y="164" width="292" height="10" fill="#dbeafe"/>
  <text x="346" y="164" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">控制面 2 · 最小权限与审批不可变</text>
  <rect x="344" y="182" width="272" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="202" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 4 · 权限边界与旁路封堵</text>
  <text x="352" y="222" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">仅允许写 /workspace/reports/；护私密文件</text>
  <text x="352" y="248" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">同效应多路径全封：禁用无约束 shell/浏览器</text>
  <text x="352" y="274" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">（需环境返回 permission-denied / 不可仅看拒绝文案）</text>
  <rect x="344" y="308" width="272" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="352" y="328" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 5 · 批准后 6 类篡改检验</text>
  <text x="352" y="348" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">改收件/换附件/改动作/重放/过期/跨 Agent</text>
  <text x="352" y="374" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">执行层校验不可变摘要与 ID；防粘性审批</text>
  <text x="352" y="400" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">（参照 OpenAI SDK Handoff 审批作用域提醒）</text>
  <rect x="644" y="144" width="292" height="282" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="644" y="144" width="292" height="30" rx="8" fill="#dbeafe"/>
  <rect x="644" y="164" width="292" height="10" fill="#dbeafe"/>
  <text x="656" y="164" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">控制面 3 · 恢复对账与跨队列急停</text>
  <rect x="654" y="182" width="272" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="662" y="202" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 6 · 外部已受理后的崩溃</text>
  <text x="662" y="222" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">邮件已收第 1 份即崩溃；重启核查外库总数</text>
  <text x="662" y="248" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">跨库裂脑：持久检查点 + 账本补 &gt;=24h 幂等</text>
  <text x="662" y="274" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">（参考 LangGraph Persistence 与 Stripe API v1 文档）</text>
  <rect x="654" y="308" width="272" height="118" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="662" y="328" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Test 7 · 跨六面急停与追踪红线</text>
  <text x="662" y="348" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">查在途/待发/队列/定时/并行 Worker/重启</text>
  <text x="662" y="374" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start">区分不可撤回在途与后续阻断 + 日志脱敏</text>
  <text x="662" y="400" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="start">（参照 OWASP Agent Control Standard 与 SDK Tracing）</text>
  <rect x="24" y="438" width="912" height="62" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="36" y="460" font-size="12" font-weight="700" fill="#166534" text-anchor="start">双轴评测与渐进上线原则（不把“5 次测试通过”当作低生产故障率证明）</text>
  <text x="36" y="482" font-size="10.8" font-weight="400" fill="#14532d" text-anchor="start">① 任务评测（完成调研而不一刀切拒答）× 运行评测（越权零容忍） ② 7 字段追责（含 Fix Required），按风险从窄权限与低预算灰度</text>
  <text x="24" y="522" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 基于 MASA《Before You Let Your AI Agent Run Unattended》七项测试与十份参考工程标准绘制（非原文配图）</text>
</svg>
