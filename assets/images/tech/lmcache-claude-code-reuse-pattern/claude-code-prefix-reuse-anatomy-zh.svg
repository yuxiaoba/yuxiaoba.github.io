  <rect x="658" y="182" width="268" height="114" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="668" y="190" width="142" height="20" rx="5" fill="#1d4ed8"/>
  <text x="739" y="204" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">20K+ 超长静态前缀</text>
  <text x="668" y="226" font-size="9.6" font-weight="700" fill="#0f172a" text-anchor="start">未入对话已达 20,000+ token</text>
  <text x="668" y="245" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">• 完整 Git 历史与状态 + 18 项工具规范</text>
  <text x="668" y="264" font-size="9.4" font-weight="400" fill="#334155" text-anchor="start">• #46 回合仅追加三路 Explore 总结文本</text>
  <text x="668" y="283" font-size="9.2" font-weight="400" fill="#475569" text-anchor="start">• 全量 18 工具含 Edit/Write/Task 等</text>

  <rect x="658" y="304" width="268" height="126" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <rect x="668" y="312" width="136" height="20" rx="5" fill="#166534"/>
  <text x="736" y="326" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">执行阶段 (#73–#92)</text>
  <text x="812" y="326" font-size="9.6" font-weight="700" fill="#166534" text-anchor="start">97.83% 重叠</text>
  <text x="668" y="348" font-size="9.4" font-weight="400" fill="#14532d" text-anchor="start">• #73–#76 审阅/写计划并请用户批准</text>
  <text x="668" y="367" font-size="9.4" font-weight="400" fill="#14532d" text-anchor="start">• #77–#91 按 Markdown TODO 改码跑测</text>
  <text x="668" y="386" font-size="9.4" font-weight="400" fill="#14532d" text-anchor="start">• 累计输入 827,411 token（#92 收尾）</text>
  <text x="668" y="405" font-size="9.2" font-weight="600" fill="#166534" text-anchor="start">20K+ 大锚点每轮重送，推高后期重叠率</text>

  <!-- Bottom Banner -->
  <rect x="24" y="450" width="912" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="36" y="470" font-size="10.2" font-weight="700" fill="#1e3a8a" text-anchor="start">口径核算：4 阶段表累计 1,948,978 token（加权前缀重叠约 92.60%），但遗漏 #46 且正文中段出现辅助调用 #93</text>
  <text x="36" y="490" font-size="9.8" font-weight="400" fill="#1e40af" text-anchor="start">关键区分：92% 度量的是日志提示文本的结构性前缀重叠，并不等于推理服务端已实测 92% KV 缓存命中或 92% 算力消除</text>

  <text x="24" y="522" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">阅读整理配图 · 依据 Kobe &amp; Mengbing (LMCache Blog, 2025-12-23) 博文文本与原文架构图整理（非原文原图）</text>
