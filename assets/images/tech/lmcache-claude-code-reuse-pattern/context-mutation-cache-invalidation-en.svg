<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif" style="background:#ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="524" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="24" y="36" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="start">Context Mutations, Cache Invalidation &amp; Non-Prefix Reuse Limits</text>
  <text x="24" y="56" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Mapping Claude Code's trace to prefix-caching TTL pricing (5m vs 1h) and causal-attention non-prefix KV reuse limits</text>
  <line x1="24" y1="66" x2="936" y2="66" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Zone A: Left - Prefix Anatomy & Economics -->
  <rect x="24" y="76" width="446" height="114" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="36" y="96" font-size="10.8" font-weight="700" fill="#1e3a8a" text-anchor="start">A1 · Ideal Prefix-Hit Path (Anthropic cache_control / OpenAI &gt;1024)</text>
  <rect x="36" y="106" width="142" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="107" y="122" font-size="9.3" font-weight="700" fill="#1e3a8a" text-anchor="middle">Sys + Git (20K+)</text>
  <rect x="182" y="106" width="84" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="224" y="122" font-size="9.3" font-weight="700" fill="#1e3a8a" text-anchor="middle">18 Tool Specs</text>
  <rect x="270" y="106" width="96" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="318" y="122" font-size="9.3" font-weight="700" fill="#1e3a8a" text-anchor="middle">Plan &amp; History</text>
  <rect x="372" y="106" width="86" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="415" y="122" font-size="9.3" font-weight="700" fill="#92400e" text-anchor="middle">Δ New (8%)</text>
  <text x="36" y="150" font-size="9.0" font-weight="600" fill="#1e40af" text-anchor="start">Sonnet 4.5 est.: 2M raw $6.00 → 92% cached $1.152 ($4.85 / 81% saved)</text>
  <text x="36" y="170" font-size="8.9" font-weight="400" fill="#475569" text-anchor="start">Assumes 100% read hits on 1.84M overlap (0.1x) + 0.16M writes (1.25x 5m tier)</text>

  <!-- Zone A: Right - 4 Invalidation Triggers -->
  <rect x="482" y="76" width="454" height="114" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="494" y="96" font-size="10.8" font-weight="700" fill="#991b1b" text-anchor="start">A2 · Four Real-World Invalidation &amp; Miss Triggers</text>
  <text x="494" y="117" font-size="9.1" font-weight="400" fill="#1e293b" text-anchor="start">1) Prefix drift: updating git status in 20K+ header breaks token-0 hash</text>
  <text x="494" y="136" font-size="9.1" font-weight="400" fill="#1e293b" text-anchor="start">2) 5m TTL vs 13m run: Explore/approval waits expire 1.25x cache (vs 2x 1h)</text>
  <text x="494" y="155" font-size="9.1" font-weight="400" fill="#1e293b" text-anchor="start">3) Role root split: Explore/Plan system prompts fork Main prefix KV</text>
  <text x="494" y="174" font-size="9.1" font-weight="400" fill="#1e293b" text-anchor="start">4) Replica scatter: 3x Explore &amp; tool batches miss w/o sticky/LMCache pool</text>

  <!-- Zone B: Non-Prefix Limits (Blog Section 5) -->
  <rect x="24" y="200" width="446" height="174" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="36" y="210" width="142" height="20" rx="5" fill="#1d4ed8"/>
  <text x="107" y="224" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Non-Prefix 1 · Tools</text>
  <text x="186" y="224" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">Shared 10/18 Tool Subset Misses Prefix</text>

  <rect x="36" y="240" width="158" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="115" y="256" font-size="9.2" font-weight="600" fill="#1e3a8a" text-anchor="middle">Main Sys Prompt</text>
  <rect x="198" y="240" width="256" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="326" y="256" font-size="9.2" font-weight="600" fill="#1d4ed8" text-anchor="middle">Full 18 Tool Schemas (JSON)</text>

  <rect x="36" y="272" width="158" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="115" y="288" font-size="9.2" font-weight="700" fill="#991b1b" text-anchor="middle">Explore/Plan Sys (Differs)</text>
  <rect x="198" y="272" width="174" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="285" y="288" font-size="9.2" font-weight="600" fill="#92400e" text-anchor="middle">10/18 Subset (Misses KV)</text>

  <text x="36" y="318" font-size="9.0" font-weight="400" fill="#334155" text-anchor="start">• Prefix hashing needs exact token-0 match; role header breaks tail</text>
  <text x="36" y="338" font-size="9.0" font-weight="400" fill="#334155" text-anchor="start">• Fix: place shared base + canonical tools first, role text after</text>
  <text x="36" y="358" font-size="8.9" font-weight="400" fill="#64748b" text-anchor="start">(Otherwise identical tool specs cannot share KV across Main &amp; subagents)</text>

  <rect x="482" y="200" width="454" height="174" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="494" y="210" width="142" height="20" rx="5" fill="#1e3a8a"/>
  <text x="565" y="224" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Non-Prefix 2 · Files</text>
  <text x="644" y="224" font-size="10" font-weight="700" fill="#0f172a" text-anchor="start">Repeated File Reads Across Branches</text>

  <rect x="494" y="240" width="174" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="581" y="256" font-size="9.2" font-weight="600" fill="#1e3a8a" text-anchor="middle">Explore Path A History</text>
  <rect x="674" y="240" width="246" height="24" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="797" y="256" font-size="9.2" font-weight="700" fill="#166534" text-anchor="middle">Read: utils.py / json.py</text>

  <rect x="494" y="272" width="174" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="581" y="288" font-size="9.2" font-weight="700" fill="#991b1b" text-anchor="middle">Plan/Exec Path B History</text>
  <rect x="674" y="272" width="246" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="797" y="288" font-size="9.2" font-weight="700" fill="#92400e" text-anchor="middle">Same File (Cross-Attn Shifted)</text>

  <text x="494" y="318" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• Causal KV(file) depends on all prior tokens; cannot paste raw KV</text>
  <text x="494" y="338" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">• Frontier: CacheBlend selectively recomputes boundary tokens only</text>
  <text x="494" y="358" font-size="8.9" font-weight="400" fill="#64748b" text-anchor="start">(Cited as future direction in post; no CacheBlend speedup tested on this trace)</text>

  <!-- Zone C: 3 Engineering Guardrails -->
  <rect x="24" y="384" width="912" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="405" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">Three Engineering Design Rules for Agent Harnesses &amp; Prefix-Hash Serving</text>

  <rect x="34" y="416" width="290" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="44" y="434" font-size="10.2" font-weight="700" fill="#1d4ed8" text-anchor="start">1. Freeze Canonical Prefix Order</text>
  <text x="44" y="454" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">Put immutable rules &amp; sorted tools first;</text>
  <text x="44" y="472" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">keep mutable git diffs &amp; timestamps at tail</text>

  <rect x="335" y="416" width="290" height="76" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="345" y="434" font-size="10.2" font-weight="700" fill="#1d4ed8" text-anchor="start">2. Align TTL &amp; Cluster Pool</text>
  <text x="345" y="454" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">Evaluate 1h TTL when fan-outs or approvals</text>
  <text x="345" y="472" font-size="9.1" font-weight="400" fill="#334155" text-anchor="start">exceed 5m; use sticky or LMCache pools</text>

  <rect x="636" y="416" width="290" height="76" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="646" y="434" font-size="10.2" font-weight="700" fill="#166534" text-anchor="start">3. Audit Metered Usage, Not Overlap</text>
  <text x="646" y="454" font-size="9.1" font-weight="400" fill="#14532d" text-anchor="start">Track API cache_read vs cache_creation</text>
  <text x="646" y="472" font-size="9.1" font-weight="400" fill="#14532d" text-anchor="start">tokens &amp; TTFT rather than 92% text overlap</text>

  <text x="24" y="522" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Assistant diagram · Derived from LMCache post pricing rules, Section 5 non-prefix notes &amp; causal KV constraints (not an original chart)</text>
</svg>
